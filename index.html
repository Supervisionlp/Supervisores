/* ---- BorrarRutas ---- */
function BorrarRutas({ data, onSave, showToast }) {
  const { rutas } = data;
  const [supervisor, setSupervisor] = useState("");
  const [mes, setMes] = useState("");

  const mesesDisp = useMemo(() => {
    const set = new Set((rutas||[]).map((r) => r.fecha?.slice(0,7)).filter(Boolean));
    return [...set].sort().reverse();
  }, [rutas]);

  const borrar = async () => {
    if (!mes) return;
    const filtradas = (rutas||[]).filter((r) => {
      const mismoMes = r.fecha?.startsWith(mes);
      const mismoSup = !supervisor || r.supervisor === supervisor;
      return !(mismoMes && mismoSup);
    });
    const borradas = (rutas||[]).length - filtradas.length;
    await onSave({ ...data, rutas: filtradas });
    showToast(`${borradas} asignación(es) eliminadas.`);
    setMes(""); setSupervisor("");
  };

  const nombreMes = (ym) => {
    if (!ym) return "";
    const [y,m] = ym.split("-");
    return ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][parseInt(m)-1]+" "+y;
  };

  return (
    <div>
      <div className="field-grid">
        <label className="field">
          <span>Mes a borrar</span>
          <select className="input" value={mes} onChange={(e) => setMes(e.target.value)}>
            <option value="">— Elegí el mes —</option>
            {mesesDisp.map((m) => <option key={m} value={m}>{nombreMes(m)}</option>)}
          </select>
        </label>
        <label className="field">
          <span>Supervisor (opcional)</span>
          <select className="input" value={supervisor} onChange={(e) => setSupervisor(e.target.value)}>
            <option value="">Todos</option>
            <option value="Ernesto Aguero">Ernesto Aguero</option>
            <option value="Alexis Arzamendia">Alexis Arzamendia</option>
          </select>
        </label>
      </div>
      <button className="btn" style={{ borderColor:"var(--alert)", color:"var(--alert)" }}
        disabled={!mes} onClick={borrar}>
        Borrar rutas del mes
      </button>
    </div>
  );
}

/* ---- GrupoRuta ---- */
function GrupoRuta({ ruta, locales, data, onSave, showToast, tieneRecorrido }) {
  const [fechaEdit, setFechaEdit] = useState(ruta.fecha);
  const localesDeRuta = (ruta.localIds||[]).map(id => locales.find(l => l.id === id)).filter(Boolean);
  if (localesDeRuta.length === 0) return null;

  const guardarFecha = async (nuevaFecha) => {
    if (!nuevaFecha || nuevaFecha === ruta.fecha) return;
    // Si ya existe otra ruta del mismo supervisor con esa fecha, fusionar
    const rutaDestino = (data.rutas||[]).find(r => r.id !== ruta.id && r.supervisor === ruta.supervisor && r.fecha === nuevaFecha);
    let rutasAct;
    if (rutaDestino) {
      const idsUnicos = [...new Set([...(rutaDestino.localIds||[]), ...(ruta.localIds||[])])];
      rutasAct = (data.rutas||[])
        .filter(r => r.id !== ruta.id)
        .map(r => r.id === rutaDestino.id ? { ...r, localIds: idsUnicos } : r);
    } else {
      rutasAct = (data.rutas||[]).map(r => r.id === ruta.id ? { ...r, fecha: nuevaFecha } : r);
    }
    await onSave({ ...data, rutas: rutasAct });
    showToast("Fecha actualizada.");
  };

  return (
    <div style={{ marginBottom:10, border:"1px solid var(--line)", borderRadius:8, overflow:"hidden" }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 10px", background:"var(--paper-alt)", borderBottom:"1px solid var(--line)" }}>
        <span style={{ fontWeight:700, fontSize:13 }}>📅</span>
        <input type="date" value={fechaEdit}
          style={{ border:"none", background:"transparent", fontWeight:600, fontSize:13, cursor:"pointer", color:"var(--ink)", flex:1 }}
          onChange={(e) => setFechaEdit(e.target.value)}
          onBlur={(e) => guardarFecha(e.target.value)} />
        <span className="dim small">{localesDeRuta.length} local{localesDeRuta.length!==1?"es":""}</span>
      </div>
      {localesDeRuta.map(local => {
        const visitado = tieneRecorrido(local.nombre);
        const noCumpl = !visitado && ruta.fecha < todayISO();
        const eliminar = async (e) => {
          e.stopPropagation();
          if (visitado) return;
          const nuevosIds = ruta.localIds.filter(id => id !== local.id);
          const rutasAct = (data.rutas||[]).map(r => r.id === ruta.id ? { ...r, localIds: nuevosIds } : r).filter(r => r.localIds.length > 0);
          await onSave({ ...data, rutas: rutasAct });
          showToast("Local eliminado.");
        };
        return (
          <div key={local.id} style={{ display:"flex", alignItems:"center", gap:4, padding:"5px 10px", borderBottom:"1px solid var(--line)", background: visitado?"#f0faf5":noCumpl?"#fdf2f2":"#fff" }}>
            <span style={{ flex:1, fontSize:12.5, textDecoration:noCumpl?"line-through":"none", opacity:noCumpl?0.7:1 }}>{local.nombre}</span>
            {visitado
              ? <span style={{ fontSize:10, fontWeight:700, color:"var(--done)" }}>✓</span>
              : noCumpl
                ? <span style={{ fontSize:10, fontWeight:700, color:"var(--alert)" }}>✗</span>
                : <button onClick={eliminar} style={{ background:"none", border:"none", cursor:"pointer", color:"var(--alert)", fontWeight:700, fontSize:13, padding:"0 2px" }}>✕</button>
            }
          </div>
        );
      })}
    </div>
  );
}

/* ---- RutaForm ---- */
function RutaForm({ data, onSave, showToast }) {
  const { locales } = data;
  const [supervisor, setSupervisor] = useState("");
  const [fecha, setFecha] = useState(todayISO());
  const [search, setSearch] = useState("");
  const [nombresSelec, setNombresSelec] = useState([]);
  const [saving, setSaving] = useState(false);

  const mesActual = fecha ? fecha.slice(0,7) : todayISO().slice(0,7);

  // Locales de la zona del supervisor seleccionado
  const localesZona = useMemo(() => {
    if (!supervisor) return [];
    const zona = supervisor.includes("Ernesto") ? ZONA_SUP1 : ZONA_SUP2;
    return LOCALES_FIJOS.filter((n) => {
      const num = parseInt(n.split(" - ")[0].trim());
      return zona.includes(num);
    });
  }, [supervisor]);

  // Locales filtrados por búsqueda
  const localesFiltrados = useMemo(() => {
    if (!search) return localesZona;
    return localesZona.filter((n) => n.toLowerCase().includes(search.toLowerCase()));
  }, [localesZona, search]);

  // Separar en disponibles y seleccionados
  const disponibles = localesFiltrados.filter((n) => !nombresSelec.includes(n));
  const seleccionados = localesFiltrados.filter((n) => nombresSelec.includes(n));

  const toggleLocal = (nombre) => {
    setNombresSelec((prev) =>
      prev.includes(nombre) ? prev.filter((n) => n !== nombre) : [...prev, nombre]
    );
  };

  // Verificar si ya tiene recorrido en el mes
  const tieneRecorrido = (nombre) => {
    const localObj = locales.find((l) => l.nombre.toLowerCase() === nombre.toLowerCase());
    return localObj && data.visitas.some((v) => v.localId === localObj.id && v.fecha?.startsWith(mesActual));
  };

  // Verificar si ya está en ruta del mes
  const estaEnRuta = (nombre) => {
    const localObj = locales.find((l) => l.nombre.toLowerCase() === nombre.toLowerCase());
    return localObj && (data.rutas||[]).some((r) =>
      r.fecha?.startsWith(mesActual) && r.localIds?.includes(localObj.id)
    );
  };

  const guardar = async () => {
    if (!supervisor || !fecha || nombresSelec.length === 0) return;
    setSaving(true);
    try {
      let localesAct = [...data.locales];
      const idsResueltos = nombresSelec.map((nombre) => {
        let local = localesAct.find((l) => l.nombre.toLowerCase() === nombre.toLowerCase());
        if (!local) { local = { id: uid(), nombre }; localesAct.push(local); }
        return local.id;
      });
      // Si ya existe una ruta para ese supervisor y fecha, fusionar
      const rutaExistente = (data.rutas||[]).find(r => r.supervisor === supervisor && r.fecha === fecha);
      let rutasAct;
      if (rutaExistente) {
        const idsUnicos = [...new Set([...(rutaExistente.localIds||[]), ...idsResueltos])];
        rutasAct = (data.rutas||[]).map(r => r.id === rutaExistente.id ? { ...r, localIds: idsUnicos } : r);
      } else {
        const nueva = { id: uid(), supervisor, fecha, localIds: idsResueltos, creadaEn: todayISO() };
        rutasAct = [...(data.rutas||[]), nueva];
      }
      await onSave({ ...data, locales: localesAct, rutas: rutasAct });
      showToast(`${nombresSelec.length} locales asignados a ${supervisor.split(" ")[0]} para el ${fmt(fecha)}.`);
      setNombresSelec([]); setSearch("");
    } finally { setSaving(false); }
  };

  return (
    <div>
      <div className="field-grid">
        <label className="field">
          <span>Supervisor</span>
          <select className="input" value={supervisor} onChange={(e) => { setSupervisor(e.target.value); setNombresSelec([]); }}>
            <option value="">— Seleccioná —</option>
            <option value="Ernesto Aguero">Ernesto Aguero — Sup1</option>
            <option value="Alexis Arzamendia">Alexis Arzamendia — Sup2</option>
          </select>
        </label>
        <label className="field">
          <span>Fecha del recorrido</span>
          <input type="date" className="input" value={fecha} onChange={(e) => setFecha(e.target.value)} />
        </label>
      </div>

      {supervisor && (
        <>
          <input className="input" placeholder="Buscar local…" value={search} onChange={(e) => setSearch(e.target.value)} />

          <div className="ruta-dos-col">
            {/* Columna izquierda: todos los locales de la zona para seleccionar */}
            <div className="ruta-col">
              <div className="ruta-col-titulo">Locales de la zona ({localesFiltrados.length})</div>
              <div className="ruta-col-lista">
                {localesFiltrados.map((nombre) => {
                  const selec = nombresSelec.includes(nombre);
                  const visitado = tieneRecorrido(nombre);
                  const enRuta = estaEnRuta(nombre);
                  return (
                    <div key={nombre}
                      className={"ruta-local-item" + (selec ? " ya-selec" : "") + (visitado ? " visitado" : "")}
                      onClick={() => toggleLocal(nombre)}>
                      <span className="ruta-local-nombre">{nombre}</span>
                      {selec && <span className="ruta-tag-mini en-ruta">✓</span>}
                      {visitado && !selec && <span className="ruta-tag-mini visited">visitado</span>}
                      {enRuta && !selec && !visitado && <span className="ruta-tag-mini en-ruta">en ruta</span>}
                      <span className="ruta-add">{selec ? "✕" : "+"}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Columna derecha: agrupado por fecha con edición */}
            <div className="ruta-col">
              <div className="ruta-col-titulo" style={{ color: supervisor.includes("Ernesto") ? "var(--route)" : "var(--pending)" }}>
                {supervisor.includes("Ernesto") ? "Zona Ernesto" : "Zona Alexis"} — Este mes
              </div>
              <div className="ruta-col-lista">
                {(() => {
                  // Agrupar por ruta (fecha)
                  const rutasMes = (data.rutas||[]).filter(r => r.supervisor === supervisor && r.fecha?.startsWith(mesActual));
                  if (rutasMes.length === 0) return <div className="dim small" style={{ padding:8 }}>Sin locales asignados este mes</div>;

                  return rutasMes.sort((a,b) => a.fecha.localeCompare(b.fecha)).map(ruta => (
                    <GrupoRuta key={ruta.id} ruta={ruta} locales={locales} data={data} onSave={onSave} showToast={showToast} tieneRecorrido={tieneRecorrido} />
                  ));
                })()}
              </div>
            </div>
          </div>

          <button className="btn primary" style={{ marginTop:10 }}
            disabled={nombresSelec.length === 0 || saving}
            onClick={guardar}>
            {saving ? "Guardando…" : `Asignar ${nombresSelec.length} locales para el ${fmt(fecha)}`}
          </button>

          {supervisor && (() => {
            const zona = supervisor.includes("Ernesto") ? ZONA_SUP1 : ZONA_SUP2;
            const prioridadesSup = zona.map(num => {
              const local = locales.find(l => String(parseInt(l.nombre.split(" - ")[0])) === String(num));
              if (!local) return null;
              const inv = (data.inventarios||[]).find(i => i.numLocal === String(num));
              if (!inv) return null;
              const total = Object.values(inv.desviaciones||{}).reduce((a,b) => a+b, 0);
              if (total === 0) return null;
              const tareasPend = (data.tareas||[]).filter(t => t.localId === local.id && !t.hecha).length;
              const ultimaVisita = (data.visitas||[]).filter(v => v.localId === local.id && !v.borrador).sort((a,b) => (b.fecha||"").localeCompare(a.fecha||""))[0];
              return { local, total, tareasPend, fecha: inv.fecha, ultimaVisita: ultimaVisita?.fecha || "" };
            }).filter(Boolean).sort((a,b) => b.total - a.total);

            if (prioridadesSup.length === 0) return null;
            return (
              <div style={{ marginTop:16, background:"var(--paper)", borderRadius:10, padding:"12px 14px", border:"1px solid var(--line)" }}>
                <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>📋 Locales con mayor desvío — {supervisor.split(" ")[0]}</div>
                <table style={{ width:"100%", fontSize:12, borderCollapse:"collapse" }}>
                  <thead>
                    <tr style={{ borderBottom:"2px solid var(--line)" }}>
                      <th style={{ padding:"3px 6px", textAlign:"left" }}>Local</th>
                      <th style={{ padding:"3px 6px", textAlign:"center" }}>Desvíos</th>
                      <th style={{ padding:"3px 6px", textAlign:"center" }}>Tareas</th>
                      <th style={{ padding:"3px 6px", textAlign:"left" }}>Últ. inventario</th>
                      <th style={{ padding:"3px 6px", textAlign:"left" }}>Últ. visita</th>
                    </tr>
                  </thead>
                  <tbody>
                    {prioridadesSup.map(({ local, total, tareasPend, fecha, ultimaVisita }, i) => (
                      <tr key={i} style={{ borderBottom:"1px solid var(--line)" }}>
                        <td style={{ padding:"4px 6px", fontWeight:500 }}>{local.nombre}</td>
                        <td style={{ padding:"4px 6px", textAlign:"center" }}>
                          <span style={{ fontWeight:700, color: total>20?"var(--alert)":total>10?"var(--pending)":"var(--text)" }}>{total}</span>
                        </td>
                        <td style={{ padding:"4px 6px", textAlign:"center" }}>
                          {tareasPend > 0 ? <span style={{ color:"var(--alert)", fontWeight:700 }}>{tareasPend}</span> : <span className="dim">-</span>}
                        </td>
                        <td style={{ padding:"4px 6px" }} className="dim small">{fecha ? fmt(fecha) : "-"}</td>
                        <td style={{ padding:"4px 6px" }} className="dim small">{ultimaVisita ? fmt(ultimaVisita) : <span style={{color:"var(--alert)"}}>Sin visita</span>}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          })()}
        </>
      )}
    </div>
  );
}


/* ---- Mi Ruta ---- */
function MiRuta({ data, irARecorrido, onSave, showToast, supervisorFijo, sesion }) {
  const { locales, visitas, rutas } = data;
  const [supervisor, setSupervisor] = useState(supervisorFijo || "");
  const [localActivo, setLocalActivo] = useState(null);
  const [mostrarAdicional, setMostrarAdicional] = useState(false);

  const localName = (id) => locales.find((l) => l.id === id)?.nombre || id;

  const rutasDelSup = useMemo(() => {
    if (!supervisor) return [];
    return [...(rutas||[]).filter((r) => r.supervisor === supervisor)]
      .sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
  }, [rutas, supervisor]);

  const diasAgrupados = useMemo(() => {
    const map = {};
    rutasDelSup.forEach((r) => {
      if (!map[r.fecha]) map[r.fecha] = [];
      map[r.fecha].push(...r.localIds);
    });
    const hoy = todayISO();
    return Object.entries(map).sort(([a],[b]) => {
      if (a === hoy) return -1; if (b === hoy) return 1;
      return a < b ? -1 : 1;
    });
  }, [rutasDelSup]);

  const visitasPorLocal = useMemo(() => {
    if (!supervisor) return {};
    const map = {};
    visitas.filter((v) => v.supervisor === supervisor).forEach((v) => {
      if (!map[v.localId]) map[v.localId] = [];
      map[v.localId].push(v.fecha);
    });
    return map;
  }, [visitas, supervisor]);

  const totalLocales = diasAgrupados.reduce((acc, [, ids]) => acc + ids.length, 0);
  const visitados = diasAgrupados.reduce((acc, [, ids]) => {
    return acc + ids.filter((id) => !!(visitasPorLocal[id]?.length > 0)).length;
  }, 0);

  // Cuando hay encuesta abierta, mostrar solo la encuesta
  const enEncuesta = localActivo || mostrarAdicional;

  return (
    <div className="form-page">

      {/* Ayudantes capacitacion */}
      {!enEncuesta && <AyudantesCapacitacion data={data} onSave={onSave} showToast={showToast} soloLectura={true} sesion={sesion} modoRuta={true} />}

      {/* Header: título + botón local adicional arriba a la izquierda */}
      {!enEncuesta && (
        <div className="ruta-header">
          <h2 className="page-title" style={{ margin:0 }}>Mi ruta</h2>
          {supervisor && (
            <button className="btn" onClick={() => setMostrarAdicional(true)}>+ Local adicional</button>
          )}
        </div>
      )}

      {/* Si hay encuesta abierta, mostrar solo la encuesta con botón volver */}
      {enEncuesta ? (
        <div>
          <button className="btn ghost" style={{ marginBottom:12 }} onClick={() => { setLocalActivo(null); setMostrarAdicional(false); }}>
            ← Volver a mi ruta
          </button>
          <NuevoRecorrido
            data={data}
            onSave={onSave}
            localPrecargado={localActivo}
            esAdicional={mostrarAdicional}
            supervisorFijo={supervisorFijo}
            onDone={(m) => {
              showToast(m);
              setLocalActivo(null);
              setMostrarAdicional(false);
            }}
          />
        </div>
      ) : (
        <>
          {/* Selector de supervisor */}
          {!supervisorFijo && (
            <div className="panel">
              <div className="panel-title">Supervisor</div>
              <select className="input" value={supervisor} onChange={(e) => setSupervisor(e.target.value)}>
                <option value="">— Seleccioná tu nombre —</option>
                <option value="Ernesto Aguero">Ernesto Aguero — Sup1</option>
                <option value="Alexis Arzamendia">Alexis Arzamendia — Sup2</option>
              </select>
            </div>
          )}

          {supervisor && diasAgrupados.length === 0 && (
            <div className="empty-hero small"><p>No tenés locales asignados todavía.</p></div>
          )}

          {diasAgrupados.length > 0 && (
            <>
              <div className="panel" style={{ borderTop:"3px solid var(--route)" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
                  <div>
                    <div style={{ fontWeight:600 }}>{visitados} de {totalLocales} locales visitados</div>
                    <div className="dim small">{diasAgrupados.length} días asignados</div>
                  </div>
                  <div className="ruta-progress">
                    <div className="ruta-progress-bar" style={{ width:`${totalLocales > 0 ? (visitados/totalLocales)*100 : 0}%` }} />
                  </div>
                </div>
              </div>

              {diasAgrupados.map(([fecha, localIds]) => {
                const completadosHoy = localIds.filter((id) => !!(visitasPorLocal[id]?.length > 0)).length;
                const todoListo = completadosHoy === localIds.length;
                return (
                  <div key={fecha} className="dia-panel">
                    <div className="dia-header">
                      <div>
                        <div className="dia-fecha">{fmt(fecha)}</div>
                        <div className="dim small">{completadosHoy}/{localIds.length} completados</div>
                      </div>
                      {todoListo && <span className="badge" style={{ color:"var(--done)", borderColor:"var(--done)" }}>✓ Día completo</span>}
                    </div>
                    <div className="ruta-grid">
                      {localIds.map((id) => {
                        const visitado = !!(visitasPorLocal[id]?.length > 0);
                        const tieneBorrador = !visitado && !!localStorage.getItem("rec-draft-" + id);
                        const fechaPasada = fecha < todayISO();
                        const noCumplido = !visitado && !tieneBorrador && fechaPasada;
                        const estado = visitado ? "ok" : tieneBorrador ? "draft" : noCumplido ? "nocumplido" : "pendiente";
                        return (
                          <div key={id}
                            className={"ruta-card ruta-" + estado + (!visitado && !noCumplido ? " ruta-clickable" : "")}
                            onClick={!visitado && !noCumplido ? () => setLocalActivo(id) : undefined}>
                            <div className="ruta-estado">
                              {visitado ? "✓" : tieneBorrador ? "●" : noCumplido ? "✗" : "+"}
                            </div>
                            <div className="ruta-info">
                              <div className="ruta-nombre" style={{ textDecoration: noCumplido ? "line-through" : "none", opacity: noCumplido ? 0.6 : 1 }}>{localName(id)}</div>
                              {noCumplido && <div style={{ fontSize:10, color:"var(--alert)", fontWeight:600, marginTop:2 }}>No cumplido</div>}
                              {tieneBorrador && <div style={{ fontSize:10, color:"#F5A623", fontWeight:600, marginTop:2 }}>Borrador</div>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </>
      )}
    </div>
  );
}


/* ---- RutaMes (vista admin) ---- */
function RutaMes({ data, onSave, showToast }) {
  const { locales, visitas, rutas } = data;
  const [mesFiltro, setMesFiltro] = useState(() => todayISO().slice(0,7));
  const [visitaDetalle, setVisitaDetalle] = useState(null);
  const [editando, setEditando] = useState(false);

  const localName = (id) => locales.find((l) => l.id === id)?.nombre || id;

  const nombreMes = (ym) => {
    if (!ym) return "";
    const [y,m] = ym.split("-");
    return ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(m)-1]+" "+y;
  };

  const mesesDisponibles = useMemo(() => {
    const set = new Set([
      ...(rutas||[]).map((r) => r.fecha?.slice(0,7)),
      ...(visitas||[]).map((v) => v.fecha?.slice(0,7))
    ].filter(Boolean));
    return [...set].sort().reverse();
  }, [rutas, visitas]);

  // Agrupar rutas del mes por fecha; si no hay rutas, usar visitas como fallback
  const diasAgrupados = useMemo(() => {
    const rutasMes = (rutas||[]).filter((r) => r.fecha?.startsWith(mesFiltro));
    if (rutasMes.length > 0) {
      const map = {};
      rutasMes.forEach((r) => {
        if (!map[r.fecha]) map[r.fecha] = [];
        r.localIds.forEach((id) => map[r.fecha].push({ id, supervisor: r.supervisor }));
      });
      const hoy = todayISO();
      return Object.entries(map).sort(([a],[b]) => {
        if (a === hoy) return -1; if (b === hoy) return 1;
        return a < b ? 1 : -1;
      });
    }
    // Fallback: construir desde visitas del mes
    const visitasMes = (visitas||[]).filter((v) => v.fecha?.startsWith(mesFiltro));
    const map = {};
    visitasMes.forEach((v) => {
      if (!map[v.fecha]) map[v.fecha] = [];
      if (!map[v.fecha].find((i) => i.id === v.localId)) {
        map[v.fecha].push({ id: v.localId, supervisor: v.supervisor });
      }
    });
    const hoy = todayISO();
    return Object.entries(map).sort(([a],[b]) => {
      if (a === hoy) return -1; if (b === hoy) return 1;
      return a < b ? 1 : -1;
    });
  }, [rutas, visitas, mesFiltro]);

  // Visitas del mes indexadas por localId
  const visitasMes = useMemo(() => {
    const mes = (visitas||[]).filter((v) => v.fecha?.startsWith(mesFiltro));
    const map = {};
    mes.forEach((v) => {
      if (!map[v.localId]) map[v.localId] = [];
      map[v.localId].push(v);
    });
    return map;
  }, [visitas, mesFiltro]);

  const totalLocales = diasAgrupados.reduce((acc, [, items]) => acc + items.length, 0);
  const visitados = diasAgrupados.reduce((acc, [, items]) =>
    acc + items.filter(({ id }) => visitasMes[id]?.length > 0).length, 0);

  if (editando && visitaDetalle) {
    return (
      <div className="form-page">
        <button className="btn ghost" style={{ marginBottom:12 }} onClick={() => { setEditando(false); }}>
          ← Volver al detalle
        </button>
        <NuevoRecorrido
          data={data}
          onSave={onSave}
          localPrecargado={visitaDetalle.localId}
          supervisorFijo={visitaDetalle.supervisor}
          visitaEditar={visitaDetalle}
          onDone={(m) => { showToast(m); setEditando(false); setVisitaDetalle(null); }}
        />
      </div>
    );
  }

  if (visitaDetalle) {
    const v = visitaDetalle;
    const meta = ESTADOS[estadoVisita(v)];
    const comp = calcCompletitud(v, data.codigos, data.pruebasRealizadas);
    return (
      <div className="form-page">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, flexWrap:"wrap", gap:8 }}>
          <button className="btn ghost" onClick={() => setVisitaDetalle(null)}>← Volver</button>
          <button className="btn primary" onClick={() => setEditando(true)}>✏️ Editar visita</button>
        </div>
        <div className="panel" style={{ borderTop:`3px solid ${meta.color}` }}>
          <div style={{ fontWeight:700, fontSize:16, marginBottom:4 }}>{localName(v.localId)}</div>
          <div className="dim small">{v.supervisor} · {fmt(v.fecha)}{v.horaLlegada ? " · "+v.horaLlegada : ""}</div>
          <div style={{ marginTop:8 }}>
            <span className="badge" style={{ color:meta.color, borderColor:meta.color }}>{meta.label}</span>
          </div>
        </div>
        <div className="panel">
          <div style={{ marginBottom:10, padding:"8px 10px", borderRadius:8, background: comp.pct===100?"#f0faf5":comp.pct>=70?"#fffbea":"#fdf2f2", border:`1px solid ${comp.pct===100?"var(--done)":comp.pct>=70?"#b37700":"var(--alert)"}` }}>
            <div style={{ fontWeight:700, fontSize:12, marginBottom:4, color: comp.pct===100?"var(--done)":comp.pct>=70?"#b37700":"var(--alert)" }}>
              Completitud: {comp.completados}/{comp.total} ({comp.pct}%)
            </div>
            {comp.faltantes.length > 0 && comp.faltantes.map(f => (
              <div key={f.key} style={{ fontSize:11, color:"var(--alert)" }}>❌ {f.label}</div>
            ))}
          </div>
          {v.gpsLat && <div className="hist-line"><b>Ubicación:</b> <a href={`https://maps.google.com/?q=${v.gpsLat},${v.gpsLng}`} target="_blank" rel="noreferrer" style={{ color:"var(--route)" }}>📍 Ver en Google Maps</a></div>}
          <div className="hist-grid" style={{ marginTop:8 }}>
            {CHECK_FIELDS.map(([key,label]) => v[key] && (
              <div key={key} className="hist-check">
                <span className={"mini-badge "+(v[key]==="No"?"mini-no":"mini-si")}>{v[key]}</span>
                <span>{label}</span>
              </div>
            ))}
          </div>
          {v.regularizacionDesvios && <div className="hist-line"><b>Regularización desvíos:</b> {v.regularizacionDesvios==="todos"?"🟢 Todos regularizados":v.regularizacionDesvios==="parcialmente"?"🟡 Parcialmente":"🔴 No regularizados"}</div>}
          {v.capacitacion === "si" && <div className="hist-line"><b>Capacitación:</b> ✔ Sí{v.detalleCapacitacion ? ` — ${v.detalleCapacitacion}` : ""}</div>}
          {v.capacitacion === "no" && <div className="hist-line"><b>Capacitación:</b> ✖ No se realizó</div>}
          {v.desviosOperativos==="Si" && v.accionDesviosOperativos && <div className="hist-line"><b>Desvío operativo:</b> {v.accionDesviosOperativos}</div>}
          {v.estadoLocal && v.estadoLocal!=="sin_novedades" && <div className="hist-line"><b>Estado local:</b> {v.infraestructura||v.motivoEstado||""}</div>}
          {v.compromiso && <div className="hist-line"><b>Compromiso:</b> {v.compromiso}</div>}
          {v.observacionesGenerales && <div className="hist-line"><b>Hallazgo:</b> {v.observacionesGenerales}</div>}
          {v.evalAyudante && (
            <div className="hist-line">
              <b>Ayudante {v.ayudante}:</b> Atención {v.evalAyudante.atencion}, Orden {v.evalAyudante.orden}, Apoyo {v.evalAyudante.apoyo}
              {v.evalAyudante.comentario && ` — ${v.evalAyudante.comentario}`}
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="form-page">
      <h2 className="page-title">Ruta del mes</h2>

      <div className="mes-selector" style={{ marginBottom:16 }}>
        <div className="mes-pills">
          {mesesDisponibles.map((m) => (
            <button key={m} className={"mes-pill"+(mesFiltro===m?" active":"")} onClick={() => setMesFiltro(m)}>{nombreMes(m)}</button>
          ))}
        </div>
      </div>

      {diasAgrupados.length === 0 ? (
        <div className="empty-hero small"><p>No hay rutas asignadas en {nombreMes(mesFiltro)}.</p></div>
      ) : (
        <>
          <div className="panel" style={{ borderTop:"3px solid var(--route)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
              <div>
                <div style={{ fontWeight:600 }}>{visitados} de {totalLocales} locales visitados</div>
                <div className="dim small">{diasAgrupados.length} días asignados</div>
              </div>
              <div className="ruta-progress">
                <div className="ruta-progress-bar" style={{ width:`${totalLocales > 0 ? (visitados/totalLocales)*100 : 0}%` }} />
              </div>
            </div>
          </div>

          {diasAgrupados.map(([fecha, items]) => {
            const completadosHoy = items.filter(({ id }) => visitasMes[id]?.length > 0).length;
            const todoListo = completadosHoy === items.length;
            // Detectar supervisor(es) del día
            const sups = [...new Set(items.map(i => i.supervisor))];
            const supLabel = sups.map(s => s.split(" ")[0]).join(" / ");
            return (
              <div key={fecha} className="dia-panel">
                <div className="dia-header">
                  <div>
                    <div className="dia-fecha" style={{ display:"flex", alignItems:"center", gap:8 }}>
                      {fmt(fecha)}
                      <span className="dim small" style={{ fontWeight:500, fontSize:12 }}>· {supLabel}</span>
                    </div>
                    <div className="dim small">{completadosHoy}/{items.length} completados</div>
                  </div>
                  {todoListo && <span className="badge" style={{ color:"var(--done)", borderColor:"var(--done)" }}>✓ Día completo</span>}
                </div>
                <div className="ruta-grid">
                  {items.map(({ id, supervisor }) => {
                    const visita = visitasMes[id]?.[0];
                    const visitado = !!visita;
                    const fechaPasada = fecha < todayISO();
                    const noCumplido = !visitado && fechaPasada;
                    const estado = visitado ? "ok" : noCumplido ? "nocumplido" : "pendiente";
                    return (
                      <div key={id+supervisor}
                        className={"ruta-card ruta-"+estado+(visitado?" ruta-clickable":"")}
                        onClick={visitado ? () => setVisitaDetalle(visita) : undefined}>
                        <div className="ruta-estado">{visitado ? "✓" : noCumplido ? "✗" : "+"}</div>
                        <div className="ruta-info">
                          <div className="ruta-nombre" style={{ textDecoration:noCumplido?"line-through":"none", opacity:noCumplido?0.6:1 }}>
                            {localName(id)}
                          </div>
                          {noCumplido && <div style={{ fontSize:10, color:"var(--alert)", fontWeight:600, marginTop:2 }}>No cumplido</div>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}
