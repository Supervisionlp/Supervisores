              <thead>
                <tr style={{ background:"var(--paper-alt)", textAlign:"left" }}>
                  <th style={{ padding:"5px 6px", borderBottom:"1px solid var(--line)" }}>Cód.</th>
                  <th style={{ padding:"5px 6px", borderBottom:"1px solid var(--line)" }}>Descripción</th>
                  <th style={{ padding:"5px 6px", borderBottom:"1px solid var(--line)" }}>Ubic.</th>
                  <th style={{ padding:"5px 6px", borderBottom:"1px solid var(--line)" }}>F. Remate</th>
                  <th style={{ padding:"5px 6px", borderBottom:"1px solid var(--line)", display:"none" }}>Saldo</th>
                </tr>
              </thead>
              <tbody>
                {viejosDelLocal.map((a, i) => (
                  <tr key={i} style={{ borderBottom:"1px solid var(--line)" }}>
                    <td style={{ padding:"5px 6px", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums", fontWeight:600 }}>{a.codigo}</td>
                    <td style={{ padding:"5px 6px" }}>{String(a.descripcion||"").split(" ").slice(0,5).join(" ")}</td>
                    <td style={{ padding:"5px 6px" }} className="dim">{(() => { const p=(a.ubicacion||"").split(" - "); return p.length>=2 ? p[0]+" - "+p[1].split(" ")[0] : a.ubicacion||""; })()}</td>
                    <td style={{ padding:"5px 6px" }} className="dim">{a.fechaRemate ? fmt(a.fechaRemate) : ""}</td>
                    <td style={{ padding:"5px 6px", display:"none" }} className="mono">{parseInt(a.saldo||0).toLocaleString()}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {obsComerciales.length > 0 && (
          <div className="panel">
            <div className="panel-title">Observaciones comerciales</div>
            {obsComerciales.map((v) => (
              <div key={v.id} className="det-item">
                <span className="det-dot route"/>
                <div className="det-info">
                  <div>{v.observacionComercial}</div>
                  <div className="mono dim small">{fmt(v.fecha)} · {v.supervisor}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {tareasPend.length === 0 && quejas.length === 0 && infras.length === 0 && obsComerciales.length === 0 && (
          <div className="empty-hero small"><p>Sin pendientes ni observaciones registradas para este local.</p></div>
        )}

        {/* Info personal y evaluaciones del mes */}
        {(() => {
          const mesActual = todayISO().slice(0,7);
          const visitasMes = vsLocal.filter(v => v.fecha?.startsWith(mesActual) && !v.borrador);
          if (visitasMes.length === 0) return null;
          const ultimaV = visitasMes[0];
          const esAyudante = ultimaV.personal === "ayudante";
          const labelPersonal = (v) => v.personal === "ayudante" ? `Ayudante: ${v.ayudante || "Sin nombre"}` : "Encargado";
          const colorPersonal = (v) => v.personal === "ayudante" ? "#b37700" : "var(--done)";
          const labelEval = (val) => val === "bueno" ? "Bueno" : val === "amejorar" ? "A Mejorar" : val === "deficiente" ? "Deficiente" : val === "regular" ? "Regular" : "-";
          const colorEval = (val) => val === "bueno" ? "var(--done)" : val === "amejorar" || val === "regular" ? "#b37700" : val === "deficiente" ? "var(--alert)" : "var(--text-sec)";
          const visitasAyudantes = visitasMes.filter(v => v.personal === "ayudante" && v.evalAyudante);

          return (
            <>
              {/* Personal en última visita */}
              <div className="panel" style={{ borderLeft:`4px solid ${colorPersonal(ultimaV)}` }}>
                <div className="panel-title">Personal en última visita del mes</div>
                <div style={{ display:"flex", alignItems:"center", gap:10, fontSize:13 }}>
                  <span style={{ fontWeight:700, color:colorPersonal(ultimaV) }}>{esAyudante ? "👤 Ayudante" : "👔 Encargado"}</span>
                  <span>{labelPersonal(ultimaV)}</span>
                  <span className="dim small">· {fmt(ultimaV.fecha)}</span>
                </div>
                {/* Eval encargado */}
                {!esAyudante && (ultimaV.eval_atencion || ultimaV.eval_impulso || ultimaV.eval_actitud) && (
                  <div style={{ display:"flex", gap:12, marginTop:8, flexWrap:"wrap" }}>
                    {[["eval_atencion","Atención"],["eval_impulso","Impulso"],["eval_actitud","Actitud"]].map(([k,l]) => ultimaV[k] && (
                      <div key={k} style={{ fontSize:12 }}>
                        <span className="dim">{l}: </span>
                        <span style={{ fontWeight:700, color:colorEval(ultimaV[k]) }}>{labelEval(ultimaV[k])}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Evaluaciones de ayudantes del mes */}
              {visitasAyudantes.length > 0 && (
                <div className="panel">
                  <div className="panel-title">Evaluaciones de ayudantes — {["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(mesActual.split("-")[1])-1]}</div>
                  {visitasAyudantes.map((v,i) => {
                    const ea = v.evalAyudante;
                    const val = (x) => x==="bueno"?1:x==="amejorar"?0.5:x==="deficiente"?0:null;
                    const campos = [val(ea.atencion), val(ea.orden), val(ea.apoyo)].filter(x => x !== null);
                    const score = campos.length > 0 ? Math.round(campos.reduce((a,b)=>a+b,0)/campos.length*100) : null;
                    const colorS = score >= 85 ? "var(--done)" : score >= 70 ? "#b37700" : "var(--alert)";
                    const labelS = score >= 85 ? "Bueno" : score >= 70 ? "Regular" : "Crítico";
                    return (
                      <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 0", borderBottom:"1px solid var(--line)", fontSize:13 }}>
                        <div>
                          <span style={{ fontWeight:600 }}>{v.ayudante || "Sin nombre"}</span>
                          <span className="dim" style={{ marginLeft:8, fontSize:11 }}>{fmt(v.fecha)} · {(v.supervisor||"").split(" ")[0]}</span>
                        </div>
                        {score !== null && (
                          <span style={{ fontWeight:700, color:colorS, background:colorS==="var(--done)"?"#f0faf5":colorS==="#b37700"?"#fffbea":"#fdf2f2", padding:"2px 10px", borderRadius:10, fontSize:12 }}>
                            {labelS} ({score} pts)
                          </span>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          );
        })()}
      </div>
    );
  }

  return (
    <div className="form-page">
      <h2 className="page-title">Locales</h2>
      {locales.length === 0 ? (
        <div className="empty-hero small"><p>Los locales se crean automáticamente al hacer el primer recorrido.</p></div>
      ) : (
        <div className="table">
          <div className="table-head"><div>Local</div><div>Recorridos</div><div>Pendientes</div><div>Alertas</div></div>
          {[...locales].sort((a,b) => a.nombre.localeCompare(b.nombre)).map((l) => {
            const vs = visitas.filter((v) => v.localId === l.id);
            const p = tareas.filter((t) => t.localId === l.id && !t.hecha).length;
            const quejasPend = vs.filter((v) => v.quejasClientes === "Si" && !v.quejasResueltas).length;
            const infraPend = vs.filter((v) => v.problemaSeguridad === "Si" && !v.infraResuelta).length;
            const alertas = quejasPend + infraPend;
            return (
              <div className="table-row clickable" key={l.id} onClick={() => setSelLocal(l.id)}>
                <div>{l.nombre}</div>
                <div className="mono">{vs.length}</div>
                <div className="mono" style={p>0?{ color:"var(--pending)" }:undefined}>{p || "—"}</div>
                <div className="mono" style={alertas>0?{ color:"var(--alert)" }:undefined}>{alertas || "—"}</div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---- Historial ---- */
/* ---- PanelSupervisor ---- */
function PanelSupervisor({ data, onSave, showToast, supervisor }) {
  const { locales, visitas, tareas } = data;
  const precioCombustible = data.precioCombustible || 6860;
  const [vistaHistorial, setVistaHistorial] = useState(false);
  const [mesFiltro, setMesFiltro] = useState(() => todayISO().slice(0,7));
  const [checkedTareas, setCheckedTareas] = useState({});
  const [seccionAbierta, setSeccionAbierta] = useState(null);

  const toggle = (key) => setSeccionAbierta(prev => prev === key ? null : key);

  const localName = (id) => {
    const l = locales.find(l => l.id === id);
    if (!l) return id;
    const parts = l.nombre.split(" - ");
    return "Suc. " + parseInt(parts[0]) + (parts[1] ? " - " + parts.slice(1).join(" - ") : "");
  };

  const mesesDisponibles = useMemo(() => {
    const set = new Set(visitas.filter(v => v.supervisor === supervisor).map(v => v.fecha?.slice(0,7)).filter(Boolean));
    return [...set].sort().reverse();
  }, [visitas, supervisor]);

  const nombreMes = (ym) => {
    if (!ym) return "Todos";
    const [y,m] = ym.split("-");
    return ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(m)-1]+" "+y;
  };

  const visitasFiltradas = useMemo(() => {
    return visitas.filter(v => v.supervisor === supervisor && !v.borrador && (!mesFiltro || v.fecha?.startsWith(mesFiltro)));
  }, [visitas, supervisor, mesFiltro]);

  const ultimaVisitaPorLocal = useMemo(() => {
    const map = {};
    [...visitasFiltradas].sort((a,b) => a.fecha < b.fecha ? -1 : 1).forEach(v => { map[v.localId] = v; });
    return map;
  }, [visitasFiltradas]);

  const estadoLocales = useMemo(() => {
    const sinNov = [], seguimiento = [], intervencion = [];
    Object.values(ultimaVisitaPorLocal).forEach(v => {
      const e = v.estadoLocal || "sin_novedades";
      if (e === "intervencion") intervencion.push(v);
      else if (e === "seguimiento") seguimiento.push(v);
      else sinNov.push(v);
    });
    return { sinNov, seguimiento, intervencion };
  }, [ultimaVisitaPorLocal]);

  const ranking = useMemo(() => {
    return Object.entries(ultimaVisitaPorLocal)
      .map(([localId, v]) => ({ localId, score: calcScore(v, data.codigos, data.pruebasRealizadas) }))
      .filter(x => x.score !== null)
      .sort((a,b) => b.score - a.score);
  }, [ultimaVisitaPorLocal, data.codigos, data.pruebasRealizadas]);

  const calcDes = (campo) => {
    const resp = visitasFiltradas.filter(v => v[campo]);
    const b = resp.filter(v => v[campo]==="bueno").length;
    const r = resp.filter(v => v[campo]==="regular").length;
    const d = resp.filter(v => v[campo]==="deficiente").length;
    return resp.length > 0 ? { bueno:Math.round(b/resp.length*100), regular:Math.round(r/resp.length*100), deficiente:Math.round(d/resp.length*100) } : null;
  };

  const tareasSupPend = useMemo(() => {
    return (tareas||[]).filter(t => !t.hecha).filter(t => {
      const v = visitas.find(x => x.localId === t.localId && x.supervisor === supervisor);
      return !!v;
    });
  }, [tareas, visitas, supervisor]);

  const resolverTarea = async (t) => {
    const act = (data.tareas||[]).map(x => x.id === t.id ? { ...x, hecha: true } : x);
    await onSave({ ...data, tareas: act });
    showToast("Tarea resuelta.");
  };

  // Locales asignados en el mes desde rutas
  const localesAsignados = useMemo(() => {
    const rutasMes = (data.rutas||[]).filter(r => r.supervisor === supervisor && (!mesFiltro || r.fecha?.startsWith(mesFiltro)));
    const ids = new Set();
    rutasMes.forEach(r => (r.localIds||[]).forEach(id => ids.add(id)));
    return ids;
  }, [data.rutas, supervisor, mesFiltro]);

  const visitados = Object.keys(ultimaVisitaPorLocal).length;
  const asignados = localesAsignados.size || visitados;
  const noCumplidos = useMemo(() => {
    const hoy = todayISO();
    const rutasPasadas = (data.rutas||[]).filter(r => r.supervisor === supervisor && r.fecha < hoy && (!mesFiltro || r.fecha?.startsWith(mesFiltro)));
    let count = 0;
    rutasPasadas.forEach(r => {
      (r.localIds||[]).forEach(id => {
        if (!ultimaVisitaPorLocal[id]) count++;
      });
    });
    return count;
  }, [data.rutas, supervisor, mesFiltro, ultimaVisitaPorLocal]);

  // Pruebas técnicas — igual que admin, por localId de visitas del mes
  const pruebasSup = useMemo(() => {
    const visitasMes = visitas.filter(v => v.supervisor === supervisor && !v.borrador && (!mesFiltro || v.fecha?.startsWith(mesFiltro)));
    const localIds = new Set(visitasMes.map(v => v.localId));
    let total = 0, probados = 0;
    localIds.forEach(localId => {
      const cod = (data.codigos||[]).filter(c => c.localId === localId);
      const pr = (data.pruebasRealizadas||[]).filter(p => p.localId === localId && (!mesFiltro || (p.fechaProbado||"").startsWith(mesFiltro)));
      total += cod.length;
      probados += pr.length;
    });
    const pct = total > 0 ? Math.round((probados / total) * 100) : null;
    return { probados, total, pct, localIds };
  }, [data.codigos, data.pruebasRealizadas, visitas, supervisor, mesFiltro]);
  const scoreBg = (s) => s>=85?"#f0faf5":s>=70?"#fffbea":"#fdf2f2";

  const kmResumen = useMemo(() => {
    const porDia = {};
    visitas.filter(v => v.supervisor === supervisor && !v.borrador && (!mesFiltro || v.fecha?.startsWith(mesFiltro))).forEach(v => {
      const key = v.fecha;
      if (!porDia[key] || (v.kmRecorridos||0) > (porDia[key].kmNeto||0)) {
        porDia[key] = { kmNeto: v.kmRecorridos||0, kmBruto: v.kmBruto||0 };
      }
    });
    let kmNeto = 0, kmBruto = 0;
    Object.values(porDia).forEach(d => { kmNeto += d.kmNeto; kmBruto += d.kmBruto; });
    return {
      kmNeto: Math.round(kmNeto * 10) / 10,
      kmBruto: Math.round(kmBruto * 10) / 10,
      monto: Math.round(kmNeto * calcCostoKm(precioCombustible)),
    };
  }, [visitas, supervisor, mesFiltro, precioCombustible]);

  const [detalleDesempeno, setDetalleDesempeno] = useState(null);
  const [detalleKm, setDetalleKm] = useState(false);
  const [visitaAbierta, setVisitaAbierta] = useState(null);
  const [kpiActivo, setKpiActivo] = useState(null);

  // Desglose km por día
  const kmPorDia = useMemo(() => {
    const porDia = {};
    visitas.filter(v => v.supervisor === supervisor && !v.borrador && (!mesFiltro || v.fecha?.startsWith(mesFiltro))).forEach(v => {
      if (!porDia[v.fecha]) porDia[v.fecha] = { kmNeto:0, kmBruto:0, locales:[] };
      if ((v.kmRecorridos||0) > porDia[v.fecha].kmNeto) {
        porDia[v.fecha].kmNeto = v.kmRecorridos||0;
        porDia[v.fecha].kmBruto = v.kmBruto||0;
      }
      if (!porDia[v.fecha].locales.find(l => l.id === v.localId)) {
        porDia[v.fecha].locales.push({ id:v.localId, hora:v.horaLlegada||"" });
      }
    });
    return Object.entries(porDia).sort(([a],[b]) => b.localeCompare(a));
  }, [visitas, supervisor, mesFiltro]);
  const Seccion = ({ id, titulo, badge, resumen, children }) => (
    <div className="panel" style={{ marginBottom:10, padding:0, overflow:"hidden" }}>
      <button onClick={() => toggle(id)} style={{ all:"unset", display:"flex", justifyContent:"space-between", alignItems:"center", width:"100%", padding:"12px 14px", cursor:"pointer", borderBottom: seccionAbierta === id ? "1px solid var(--line)" : "none" }}>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontWeight:700, fontSize:13, display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
            {titulo}
            {badge && <span style={{ background:"var(--alert)", color:"#fff", borderRadius:10, fontSize:10, fontWeight:700, padding:"1px 6px" }}>{badge}</span>}
            {resumen && <span style={{ fontSize:11, color:"#6B7268", fontWeight:400 }}>{resumen}</span>}
          </div>
        </div>
        <span style={{ fontSize:12, color:"var(--route)", flexShrink:0, marginLeft:8 }}>{seccionAbierta === id?"▲":"▼"}</span>
      </button>
      {seccionAbierta === id && <div style={{ padding:"12px 14px" }}>{children}</div>}
    </div>
  );

  // Local card mobile
  const LocalCard = ({ v, color, bg, extra }) => (
    <div style={{ background:bg, borderRadius:8, padding:"8px 10px", marginBottom:6, borderLeft:`3px solid ${color}` }}>
      <div style={{ fontWeight:600, fontSize:13 }}>{localName(v.localId)}</div>
      <div style={{ fontSize:11, color:"#6B7268", marginTop:2 }}>{fmt(v.fecha)}{v.horaLlegada?" · "+v.horaLlegada:""}</div>
      {v.infraestructura && <div style={{ fontSize:11, marginTop:2 }}>{v.infraestructura}</div>}
      {extra}
    </div>
  );

  // ---- VISTA HISTORIAL ----
  if (vistaHistorial) {
    const visitasMes = [...visitasFiltradas].sort((a,b) => b.fecha.localeCompare(a.fecha));
    return (
      <div className="form-page">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, gap:8, flexWrap:"wrap" }}>
          <button className="btn ghost" onClick={() => setVistaHistorial(false)}>← Volver</button>
          <div className="mes-pills" style={{ flexWrap:"wrap" }}>
            <button className={"mes-pill"+(!mesFiltro?" active":"")} onClick={() => setMesFiltro("")}>Todos</button>
            {mesesDisponibles.map(m => (
              <button key={m} className={"mes-pill"+(mesFiltro===m?" active":"")} onClick={() => setMesFiltro(m)}>{nombreMes(m)}</button>
            ))}
          </div>
        </div>
        <h2 className="page-title">Historial — {supervisor.split(" ")[0]}</h2>
        <div style={{ fontSize:12, color:"#6B7268", marginBottom:10 }}>{visitasMes.length} visitas</div>
        {visitasMes.length === 0
          ? <div className="empty-hero small"><p>Sin visitas en este período.</p></div>
          : visitasMes.map((v,i) => {
              const est = v.estadoLocal || "sin_novedades";
              const estColor = est==="intervencion"?"var(--alert)":est==="seguimiento"?"#b37700":"var(--done)";
              const estLabel = est==="intervencion"?"🔴 Intervención":est==="seguimiento"?"🟡 Seguimiento":"🟢 Sin novedades";
              const abierto = visitaAbierta === v.id;
              return (
                <div key={i} className="panel" style={{ marginBottom:8, padding:0, overflow:"hidden", borderTop:`3px solid ${estColor}` }}>
                  <button onClick={() => setVisitaAbierta(abierto ? null : v.id)}
                    style={{ all:"unset", display:"flex", justifyContent:"space-between", alignItems:"center", width:"100%", padding:"12px 14px", cursor:"pointer", borderBottom: abierto?"1px solid var(--line)":"none" }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontWeight:700, fontSize:13 }}>{localName(v.localId)}</div>
                      <div style={{ fontSize:11, color:"#6B7268" }}>{fmt(v.fecha)}{v.horaLlegada?" · "+v.horaLlegada:""}</div>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0, marginLeft:8 }}>
                      <span style={{ fontSize:10, color:estColor, fontWeight:600 }}>{estLabel}</span>
                      <span style={{ fontSize:12, color:"var(--route)" }}>{abierto?"▲":"▼"}</span>
                    </div>
                  </button>
                  {abierto && (() => {
                    const comp = calcCompletitud(v, data.codigos, data.pruebasRealizadas);
                    const scoreVisita = calcScore(v, data.codigos, data.pruebasRealizadas);
                    return (
                      <div style={{ padding:"12px 14px" }}>
                        {scoreVisita !== null && <span style={{ fontWeight:800, fontSize:13, color:scoreColor(scoreVisita), background:scoreBg(scoreVisita), padding:"2px 10px", borderRadius:10, display:"inline-block", marginBottom:8 }}>{scoreVisita} pts</span>}
                        <div style={{ padding:"6px 8px", borderRadius:8, marginBottom:8, background:comp.pct===100?"#f0faf5":comp.pct>=70?"#fffbea":"#fdf2f2", border:`1px solid ${comp.pct===100?"var(--done)":comp.pct>=70?"#b37700":"var(--alert)"}` }}>
                          <div style={{ fontWeight:700, fontSize:11, color:comp.pct===100?"var(--done)":comp.pct>=70?"#b37700":"var(--alert)" }}>Completitud: {comp.completados}/{comp.total} ({comp.pct}%)</div>
                          {comp.faltantes.map(f => <div key={f.key} style={{ fontSize:10, color:"var(--alert)" }}>❌ {f.label}</div>)}
                        </div>
                        <div className="hist-grid" style={{ marginBottom:8 }}>
                          {CHECK_FIELDS.filter(([key]) => key !== "compromiso").map(([key,label]) => v[key] && (
                            <div key={key} className="hist-check">
                              <span className={"mini-badge "+(v[key]==="No"?"mini-no":"mini-si")}>{v[key]}</span>
                              <span>{label}</span>
                            </div>
                          ))}
                        </div>
                        {v.desviosOperativos==="Si" && v.accionDesviosOperativos && <div className="hist-line" style={{ fontSize:12, marginBottom:4 }}><b>Desvío:</b> {v.accionDesviosOperativos}</div>}
                        {v.estadoLocal && v.estadoLocal!=="sin_novedades" && <div className="hist-line" style={{ fontSize:12, marginBottom:4 }}><b>Estado:</b> {v.infraestructura||v.motivoEstado||""}</div>}
                        {v.compromiso && <div style={{ fontSize:12, marginBottom:4, padding:"6px 8px", borderRadius:6, background:"#f5f7f5", border:"1px solid var(--line)" }}><b>Plan de acción:</b> {v.compromiso}</div>}
                        {v.observacionesGenerales && <div className="hist-line" style={{ fontSize:12, color:"#6B7268" }}><b>Hallazgo:</b> {v.observacionesGenerales}</div>}
                      </div>
                    );
                  })()}
                </div>
              );
            })
        }
      </div>
    );
  }

  // ---- VISTA PANEL ----
  return (
    <div className="form-page">
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, flexWrap:"wrap", gap:8 }}>
        <div>
          <div style={{ fontFamily:"Space Grotesk,sans-serif", fontWeight:700, fontSize:16 }}>Panel — {supervisor.split(" ")[0]}</div>
          <div style={{ fontSize:11, color:"#6B7268" }}>{visitasFiltradas.length} visitas · {nombreMes(mesFiltro)}</div>
        </div>
        <button className="btn primary" style={{ fontSize:12, padding:"8px 12px" }} onClick={() => setVistaHistorial(true)}>📋 Historial</button>
      </div>

      {/* Selector de mes */}
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:12 }}>
        <button className={"mes-pill"+(!mesFiltro?" active":"")} onClick={() => setMesFiltro("")}>Todos</button>
        {mesesDisponibles.map(m => (
          <button key={m} className={"mes-pill"+(mesFiltro===m?" active":"")} onClick={() => setMesFiltro(m)}>{nombreMes(m)}</button>
        ))}
      </div>

      {/* KPIs rápidos — 4 columnas */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:6, marginBottom:12 }}>
        {/* Visitados */}
        <div onClick={() => setKpiActivo(kpiActivo==="visitados" ? null : "visitados")}
          style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"10px 6px", textAlign:"center", cursor:"pointer" }}>
          <div style={{ fontSize:8, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#6B7268", marginBottom:4 }}>VISITADOS</div>
          <div style={{ fontSize:17, fontWeight:800, color:"var(--route)", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{visitados}/{asignados}</div>
          <div style={{ fontSize:9, color:"var(--route)" }}>▼</div>
        </div>
        {/* No cumplido */}
        <div onClick={() => setKpiActivo(kpiActivo==="nocumplido" ? null : "nocumplido")}
          style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"10px 6px", textAlign:"center", cursor:"pointer" }}>
          <div style={{ fontSize:8, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#6B7268", marginBottom:4 }}>NO CUMPLIDO</div>
          <div style={{ fontSize:17, fontWeight:800, color: noCumplidos>0?"var(--alert)":"var(--done)", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{noCumplidos}</div>
          <div style={{ fontSize:9, color:"var(--route)" }}>▼</div>
        </div>
        {/* Tareas */}
        <div onClick={() => setKpiActivo(kpiActivo==="tareas" ? null : "tareas")}
          style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"10px 6px", textAlign:"center", cursor:"pointer" }}>
          <div style={{ fontSize:8, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#6B7268", marginBottom:4 }}>TAREAS</div>
          <div style={{ fontSize:17, fontWeight:800, color: tareasSupPend.length>0?"#b37700":"var(--done)", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{tareasSupPend.length}</div>
          <div style={{ fontSize:9, color:"var(--route)" }}>▼</div>
        </div>
        {/* Pruebas */}
        <div onClick={() => setKpiActivo(kpiActivo==="pruebas" ? null : "pruebas")}
          style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"10px 6px", textAlign:"center", cursor:"pointer" }}>
          <div style={{ fontSize:8, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#6B7268", marginBottom:4 }}>PRUEBAS</div>
          <div style={{ fontSize:17, fontWeight:800, color: pruebasSup.pct===100?"var(--done)":pruebasSup.pct>=70?"#b37700":"var(--alert)", fontFamily:"'Inter',sans-serif" }}>{pruebasSup.pct !== null ? pruebasSup.pct+"%" : "-"}</div>
          <div style={{ fontSize:9, color:"var(--route)" }}>▼</div>
        </div>
      </div>

      {/* Detalle KPIs */}
      {kpiActivo === "visitados" && (
        <div className="panel" style={{ marginBottom:12, padding:"10px 14px" }}>
          <div style={{ fontWeight:700, fontSize:12, marginBottom:8 }}>Locales visitados</div>
          {Object.entries(ultimaVisitaPorLocal).map(([localId, v],i) => (
            <div key={i} style={{ display:"flex", justifyContent:"space-between", padding:"4px 0", borderBottom:"1px solid var(--line)", fontSize:12 }}>
              <span style={{ fontWeight:500 }}>{localName(localId)}</span>
              <span className="dim">{fmt(v.fecha)}</span>
            </div>
          ))}
          {Object.keys(ultimaVisitaPorLocal).length === 0 && <div className="dim small">Sin visitas.</div>}
        </div>
      )}

      {kpiActivo === "nocumplido" && (
        <div className="panel" style={{ marginBottom:12, padding:"10px 14px" }}>
          <div style={{ fontWeight:700, fontSize:12, marginBottom:8, color:"var(--alert)" }}>Locales no cumplidos</div>
          {(() => {
            const hoy = todayISO();
            const items = [];
            (data.rutas||[]).filter(r => r.supervisor === supervisor && r.fecha < hoy && (!mesFiltro || r.fecha?.startsWith(mesFiltro))).forEach(r => {
              (r.localIds||[]).forEach(id => {
                if (!ultimaVisitaPorLocal[id]) items.push({ id, fecha: r.fecha });
              });
            });
            if (items.length === 0) return <div className="dim small">Sin locales incumplidos. ✅</div>;
            return items.map((item,i) => (
              <div key={i} style={{ display:"flex", justifyContent:"space-between", padding:"4px 0", borderBottom:"1px solid var(--line)", fontSize:12 }}>
                <span style={{ fontWeight:500 }}>{localName(item.id)}</span>
                <span style={{ color:"var(--alert)", fontSize:11 }}>Asignado {fmt(item.fecha)}</span>
              </div>
            ));
          })()}
        </div>
      )}

      {kpiActivo === "tareas" && (
        <div className="panel" style={{ marginBottom:12, padding:"10px 14px" }}>
          <div style={{ fontWeight:700, fontSize:12, marginBottom:8 }}>Tareas pendientes</div>
          {tareasSupPend.length === 0
            ? <div className="dim small">Sin tareas pendientes. ✅</div>
            : tareasSupPend.map((t,i) => {
                const local = locales.find(l => l.id === t.localId);
                const vencida = t.fecha && t.fecha < todayISO();
                return (
                  <div key={i} style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"7px 0", borderBottom:"1px solid var(--line)" }}>
                    <input type="checkbox" checked={!!checkedTareas[t.id]}
                      onChange={async (e) => {
                        if (e.target.checked) {
                          setCheckedTareas(prev => ({ ...prev, [t.id]: true }));
                          await resolverTarea(t);
                        }
                      }}
                      style={{ width:18, height:18, accentColor:"var(--done)", cursor:"pointer", flexShrink:0, marginTop:2 }} />
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:12, fontWeight:600 }}>{local ? "Suc. "+parseInt(local.nombre.split(" - ")[0])+" - "+local.nombre.split(" - ").slice(1).join(" - ") : t.localId}</div>
                      <div style={{ fontSize:11, color:"#6B7268", marginTop:2 }}>{t.texto}</div>
                    </div>
                    {vencida && <span style={{ fontSize:10, fontWeight:700, color:"var(--alert)", background:"#fdf2f2", padding:"2px 6px", borderRadius:10, whiteSpace:"nowrap", flexShrink:0 }}>VENCIDA</span>}
                  </div>
                );
              })
          }
        </div>
      )}



      {kpiActivo === "pruebas" && (
        <div className="panel" style={{ marginBottom:12, padding:"10px 14px" }}>
          <div style={{ fontWeight:700, fontSize:12, marginBottom:10 }}>Pruebas técnicas — {pruebasSup.probados}/{pruebasSup.total} ({pruebasSup.pct}%)</div>
          {(() => {
            const porLocal = {};
            pruebasSup.localIds.forEach(localId => {
              const cod = (data.codigos||[]).filter(c => c.localId === localId);
              const pr = (data.pruebasRealizadas||[]).filter(p => p.localId === localId && (!mesFiltro || (p.fechaProbado||"").startsWith(mesFiltro)));
              if (cod.length > 0) porLocal[localId] = { total: cod.length, probados: pr.length };
            });
            return Object.entries(porLocal).sort(([,a],[,b]) => (b.probados/b.total)-(a.probados/a.total)).map(([localId,{total,probados}],i) => {
              const pct = Math.round((probados/total)*100);
              const color = pct===100?"var(--done)":pct>=50?"#b37700":"var(--alert)";
              return (
                <div key={i} style={{ marginBottom:10 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:3 }}>
                    <span style={{ fontWeight:500 }}>{localName(localId)}</span>
                    <span style={{ fontWeight:700, color }}>{probados}/{total} ({pct}%)</span>
                  </div>
                  <div style={{ background:"var(--line)", borderRadius:4, height:6 }}>
                    <div style={{ width:pct+"%", height:6, background:color, borderRadius:4, transition:"width .4s" }} />
                  </div>
                </div>
              );
            });
          })()}
        </div>
      )}

      {/* KMs del mes */}
      <div style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"10px 14px", marginBottom:12, cursor:"pointer" }}
        onClick={() => setDetalleKm(!detalleKm)}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
          <div style={{ fontSize:9, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#6B7268" }}>KILOMETRAJE — {nombreMes(mesFiltro)}</div>
          <span style={{ fontSize:11, color:"var(--route)" }}>{detalleKm?"▲":"▼ ver por día"}</span>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
          <div>
            <div style={{ fontSize:9, fontWeight:700, color:"#6B7268", marginBottom:2 }}>KM TOTAL</div>
            <div style={{ fontSize:16, fontWeight:800, fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{kmResumen.kmBruto}</div>
          </div>
          <div>
            <div style={{ fontSize:9, fontWeight:700, color:"#6B7268", marginBottom:2 }}>KM NETO</div>
            <div style={{ fontSize:16, fontWeight:800, color:"var(--route)", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{kmResumen.kmNeto}</div>
          </div>
          <div>
            <div style={{ fontSize:9, fontWeight:700, color:"#6B7268", marginBottom:2 }}>COMBUSTIBLE</div>
            <div style={{ fontSize:13, fontWeight:800, color:"#F5A623", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{kmResumen.monto.toLocaleString()} Gs</div>
          </div>
        </div>
        {detalleKm && (
          <div style={{ marginTop:10, borderTop:"1px solid var(--line)", paddingTop:8 }}>
            {kmPorDia.map(([fecha, { kmNeto, locales }]) => (
              <div key={fecha} style={{ display:"flex", gap:8, alignItems:"flex-start", padding:"5px 0", borderBottom:"1px solid var(--line)" }}>
                <div style={{ minWidth:80, fontWeight:600, fontSize:12, flexShrink:0 }}>{fmt(fecha)}</div>
                <div style={{ flex:1, fontSize:11, color:"#6B7268" }}>
                  {locales.sort((a,b) => (a.hora||"").localeCompare(b.hora||"")).map(l => localName(l.id)).join(" → ")}
                </div>
                <div style={{ fontSize:12, fontWeight:700, color:"var(--route)", whiteSpace:"nowrap", flexShrink:0, fontFamily:"'Inter',sans-serif" }}>{kmNeto} km</div>
              </div>
            ))}
            <div style={{ display:"flex", justifyContent:"flex-end", paddingTop:6 }}>
              <span style={{ fontSize:12, fontWeight:700, fontFamily:"'Inter',sans-serif" }}>Total: {kmResumen.kmNeto} km</span>
            </div>
          </div>
        )}
      </div>

      <Seccion id="ranking" titulo="1. Ranking de Performance" resumen={`🟢 ${ranking.filter(x=>x.score>=85).length} · 🟡 ${ranking.filter(x=>x.score>=70&&x.score<85).length} · 🔴 ${ranking.filter(x=>x.score<70).length}`}>
        {ranking.length === 0
          ? <div className="dim small">Sin datos suficientes.</div>
          : (() => {
              const franjas = [
                { emoji:"🟢", label:"Excelente", rango:"85-100", list: ranking.filter(x=>x.score>=85), color:"var(--done)", bg:"#f0faf5" },
                { emoji:"🟡", label:"Seguimiento", rango:"70-84", list: ranking.filter(x=>x.score>=70&&x.score<85), color:"#b37700", bg:"#fffbea" },
                { emoji:"🔴", label:"Crítico", rango:"<70", list: ranking.filter(x=>x.score<70), color:"var(--alert)", bg:"#fdf2f2" },
              ];
              return (
                <>
                  {/* Resumen */}
                  <div style={{ display:"flex", gap:6, marginBottom:10, flexWrap:"wrap" }}>
                    {franjas.map(({ emoji, label, list, color, bg }) => (
                      <span key={label} style={{ fontSize:12, fontWeight:700, color, background:bg, padding:"4px 10px", borderRadius:20, border:`1px solid ${color}33` }}>
                        {emoji} {list.length} {label}
                      </span>
                    ))}
                  </div>
                  {/* Detalle por franja */}
                  {franjas.filter(f => f.list.length > 0).map(({ emoji, label, list, color, bg }) => (
                    <div key={label} style={{ marginBottom:10 }}>
                      <div style={{ fontWeight:700, fontSize:11, color, marginBottom:6, textTransform:"uppercase", letterSpacing:".04em" }}>{emoji} {label} ({list.length})</div>
                      {list.map((x,i) => (
                        <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", background:bg, borderRadius:8, padding:"7px 10px", marginBottom:5, borderLeft:`3px solid ${color}` }}>
                          <span style={{ fontWeight:600, fontSize:13 }}>{localName(x.localId)}</span>
                          <span style={{ fontWeight:800, fontSize:13, color }}>{x.score} pts</span>
                        </div>
                      ))}
                    </div>
                  ))}
                </>
              );
            })()
        }
      </Seccion>

      {/* 2. Desempeño */}
      <Seccion id="desempeno" titulo="2. Desempeño Observado" resumen={(() => { const ds = ["eval_atencion","eval_impulso","eval_actitud"].map(c => calcDes(c)).filter(Boolean); if (!ds.length) return ""; const avg = Math.round(ds.reduce((a,d)=>a+d.bueno,0)/ds.length); return `🟢 ${avg}% Bueno promedio`; })()}>
        {[
          { label:"Atención al cliente", campo:"eval_atencion" },
          { label:"Impulso y ventas", campo:"eval_impulso" },
          { label:"Actitud y compromiso", campo:"eval_actitud" },
        ].map(({ label, campo }) => {
          const d = calcDes(campo);
          const abierto = detalleDesempeno === campo;
          const labelVal = (val) => val==="bueno"?"🟢 Bueno":val==="regular"?"🟡 Regular":val==="deficiente"?"🔴 Deficiente":"-";
          const colorVal = (val) => val==="bueno"?"var(--done)":val==="regular"?"#b37700":"var(--alert)";
          return (
            <div key={campo} style={{ marginBottom:10 }}>
              <button style={{ all:"unset", width:"100%", cursor:"pointer" }} onClick={() => setDetalleDesempeno(abierto ? null : campo)}>
                <div style={{ fontSize:12, fontWeight:600, marginBottom:5, display:"flex", justifyContent:"space-between" }}>
                  <span>{label}</span>
                  <span style={{ fontSize:11, color:"var(--route)" }}>{abierto?"▲":"▼"}</span>
                </div>
                {d ? (
                  <div style={{ display:"flex", gap:6 }}>
                    <span style={{ flex:1, textAlign:"center", background:"#f0faf5", borderRadius:8, padding:"5px 0", fontSize:12, fontWeight:700, color:"var(--done)" }}>🟢 {d.bueno}%</span>
                    <span style={{ flex:1, textAlign:"center", background:"#fffbea", borderRadius:8, padding:"5px 0", fontSize:12, fontWeight:700, color:"#b37700" }}>🟡 {d.regular}%</span>
                    <span style={{ flex:1, textAlign:"center", background:"#fdf2f2", borderRadius:8, padding:"5px 0", fontSize:12, fontWeight:700, color:"var(--alert)" }}>🔴 {d.deficiente}%</span>
                  </div>
                ) : <div className="dim small">Sin datos.</div>}
              </button>
              {abierto && (
                <div style={{ marginTop:8, borderTop:"1px solid var(--line)", paddingTop:8 }}>
                  {visitasFiltradas.filter(v => v[campo]).sort((a,b) => b.fecha.localeCompare(a.fecha)).map((v,i) => (
                    <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"5px 0", borderBottom:"1px solid var(--line)", fontSize:12 }}>
                      <div>
                        <span style={{ fontWeight:600 }}>{localName(v.localId)}</span>
                        <span className="dim" style={{ marginLeft:6, fontSize:11 }}>{fmt(v.fecha)}</span>
                      </div>
                      <span style={{ fontWeight:700, color:colorVal(v[campo]) }}>{labelVal(v[campo])}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </Seccion>

      {/* 4. Tareas */}
      {/* 1. Estado infraestructura */}
      <Seccion id="estado" titulo="3. Estado de Infraestructura" badge={estadoLocales.intervencion.length > 0 ? estadoLocales.intervencion.length : null} resumen={`🟢 ${estadoLocales.sinNov.length} · 🟡 ${estadoLocales.seguimiento.length} · 🔴 ${estadoLocales.intervencion.length}`}>
        {[
          { label:"🟢 Sin novedades", list: estadoLocales.sinNov, color:"var(--done)", bg:"#f0faf5" },
          { label:"🟡 Requiere seguimiento", list: estadoLocales.seguimiento, color:"#b37700", bg:"#fffbea" },
          { label:"🔴 Requiere intervención", list: estadoLocales.intervencion, color:"var(--alert)", bg:"#fdf2f2" },
        ].map(({ label, list, color, bg }) => list.length > 0 && (
          <div key={label} style={{ marginBottom:10 }}>
            <div style={{ fontWeight:700, fontSize:11, color, marginBottom:6, textTransform:"uppercase", letterSpacing:".04em" }}>{label} ({list.length})</div>
            {list.map((v,i) => <LocalCard key={i} v={v} color={color} bg={bg} />)}
          </div>
        ))}
        {Object.keys(ultimaVisitaPorLocal).length === 0 && <div className="dim small">Sin visitas en este período.</div>}
      </Seccion>

      {/* 1. Ranking */}
    </div>
  );
}

function Historial({ data, supervisorFijo }) {
  const { locales, visitas } = data;
  const precioCombustible = data.precioCombustible || 6860;
  const [filtro, setFiltro] = useState("");
  const [mesFiltro, setMesFiltro] = useState(() => todayISO().slice(0,7));
  const [open, setOpen] = useState(null);
  const [openKm, setOpenKm] = useState(null);

  const mesesDisponibles = useMemo(() => {
    const set = new Set(visitas.map((v) => v.fecha?.slice(0,7)).filter(Boolean));
    return [...set].sort().reverse();
  }, [visitas]);

  const nombreMes = (ym) => {
    if (!ym) return "Todos";
    const [y,m] = ym.split("-");
    return ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(m)-1]+" "+y;
  };

  const localName = (id) => locales.find((l) => l.id === id)?.nombre || id;

  const filtradas = useMemo(() => {
    let list = [...visitas].sort((a,b) => (a.fecha < b.fecha ? 1 : -1));
    if (supervisorFijo) list = list.filter((v) => v.supervisor === supervisorFijo);
    if (mesFiltro) list = list.filter((v) => v.fecha?.startsWith(mesFiltro));
    if (!filtro.trim()) return list;
    const f = filtro.toLowerCase();
    return list.filter((v) => localName(v.localId).toLowerCase().includes(f) || (v.supervisor||"").toLowerCase().includes(f));
  }, [visitas, filtro, mesFiltro, locales, supervisorFijo]);

  // Resumen de km y monto por supervisor del mes
  const resumenKm = useMemo(() => {
    const map = {};
    const porSupDia = {};
    // Ordenar por fecha+hora para tomar el ÚLTIMO recorrido del día (el más completo)
    const filtradas_ord = [...filtradas].sort((a,b) => {
      const fa = (a.fecha||"") + (a.horaLlegada||"");
      const fb = (b.fecha||"") + (b.horaLlegada||"");
      return fa < fb ? -1 : 1;
    });
    filtradas_ord.forEach((v) => {
      const sup = v.supervisor || "Sin asignar";
      const dia = v.fecha || "";
      const key = sup + "|" + dia;
      // Tomar siempre el último (mayor índice en el array ordenado)
      porSupDia[key] = { sup, dia, kmNeto: v.kmRecorridos || 0, kmBruto: v.kmBruto || 0 };
    });
    Object.values(porSupDia).forEach(({ sup, kmNeto, kmBruto }) => {
      if (!map[sup]) map[sup] = { kmNeto: 0, kmBruto: 0, dias: 0 };
      map[sup].kmNeto += kmNeto;
      map[sup].kmBruto += kmBruto;
      map[sup].dias++;
    });
    const visitasPorSup = {};
    filtradas.forEach((v) => {
      const sup = v.supervisor || "Sin asignar";
      visitasPorSup[sup] = (visitasPorSup[sup] || 0) + 1;
    });
    // Detalle por día para el desglose
    const detallePorSup = {};
    Object.entries(porSupDia).forEach(([key, { sup, dia, kmNeto, kmBruto }]) => {
      if (!detallePorSup[sup]) detallePorSup[sup] = [];
      const visitasDelDia = filtradas.filter((v) => v.supervisor === sup && v.fecha === dia)
        .sort((a,b) => (a.horaLlegada||"") < (b.horaLlegada||"") ? -1 : 1);
      detallePorSup[sup].push({ dia, kmNeto, kmBruto, locales: visitasDelDia.map((v) => localName(v.localId)) });
    });
    Object.values(detallePorSup).forEach((arr) => arr.sort((a,b) => a.dia < b.dia ? 1 : -1));

    return Object.entries(map).map(([sup, d]) => ({
      sup,
      kmBruto: Math.round(d.kmBruto * 10) / 10,
      kmNeto: Math.round(d.kmNeto * 10) / 10,
      dias: d.dias,
      visitas: visitasPorSup[sup] || 0,
      monto: Math.round(d.kmNeto * calcCostoKm(precioCombustible)),
      detalle: detallePorSup[sup] || []
    }));
  }, [filtradas, precioCombustible]);

  return (
    <div className="form-page">
      <h2 className="page-title">Historial</h2>
      <div className="mes-selector" style={{ marginBottom:12 }}>
        <div className="mes-pills">
          <button className={"mes-pill"+(!mesFiltro?" active":"")} onClick={() => setMesFiltro("")}>Todos</button>
          {mesesDisponibles.map((m) => (
            <button key={m} className={"mes-pill"+(mesFiltro===m?" active":"")} onClick={() => setMesFiltro(m)}>{nombreMes(m)}</button>
          ))}
        </div>
      </div>

      {resumenKm.length > 0 && (
        <div className="dash-grid2" style={{ marginBottom:14 }}>
          {resumenKm.map(({ sup, kmBruto, kmNeto, dias, visitas, monto, detalle }) => (
            <div key={sup} className="dash-panel" style={{ borderTop:"3px solid var(--route)", marginBottom:0 }}>
              <button style={{ all:"unset", cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", width:"100%", marginBottom:6 }}
                onClick={() => setOpenKm(openKm===sup ? null : sup)}>
                <div style={{ fontWeight:700 }}>{sup.split(" ")[0]}</div>
                <span style={{ fontSize:11, color:"var(--route)" }}>{openKm===sup ? "▲ ocultar" : "▼ ver por día"}</span>
              </button>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8 }}>
                <div><div className="dash-card-label">KM TOTAL</div><div style={{ fontSize:13, fontWeight:700, fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{kmBruto}</div></div>

  );
}

/* ---- CambiarPass ---- */
function CambiarPass({ usuario, onClose, onSave }) {
  const [actual, setActual] = useState("");
  const [nueva, setNueva] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [error, setError] = useState("");

  const guardar = () => {
    if (actual !== USUARIOS[usuario].passHash) { setError("Contraseña actual incorrecta."); return; }
    if (nueva.length < 4) { setError("La nueva contraseña debe tener al menos 4 caracteres."); return; }
    if (nueva !== confirmar) { setError("Las contraseñas no coinciden."); return; }
    USUARIOS[usuario].passHash = nueva;
    localStorage.setItem("pass_" + usuario, nueva);
    onSave();
    onClose();
  };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.4)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:999 }}>
      <div className="panel" style={{ width:"100%", maxWidth:340, margin:20 }}>
        <div style={{ fontWeight:700, marginBottom:16 }}>Cambiar contraseña</div>
        <label className="field" style={{ marginBottom:8 }}><span>Contraseña actual</span><input className="input" type="password" value={actual} onChange={(e) => setActual(e.target.value)} /></label>
        <label className="field" style={{ marginBottom:8 }}><span>Nueva contraseña</span><input className="input" type="password" value={nueva} onChange={(e) => setNueva(e.target.value)} /></label>
        <label className="field" style={{ marginBottom:12 }}><span>Confirmar nueva</span><input className="input" type="password" value={confirmar} onChange={(e) => setConfirmar(e.target.value)} /></label>
        {error && <div style={{ color:"var(--alert)", fontSize:13, marginBottom:10 }}>{error}</div>}
        <div style={{ display:"flex", gap:8 }}>
          <button className="btn" onClick={onClose}>Cancelar</button>
          <button className="btn primary" onClick={guardar}>Guardar</button>
        </div>
      </div>
    </div>
  );
}

/* ---- App ---- */
function App() {
  const [sesion, setSesion] = useState(() => {
    try { return JSON.parse(sessionStorage.getItem("sesion") || "null"); } catch { return null; }
  });
  const [data, setData] = useState(EMPTY);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState(() => sesion?.rol === "supervisor" ? "ruta" : "dashboard");
  const [toast, setToast] = useState(null);
  const [isDark, setIsDark] = useState(() => localStorage.getItem("dark") === "1");
  const toggleDark = () => setIsDark((d) => { localStorage.setItem("dark", d ? "0" : "1"); return !d; });
  const [localPrecargado, setLocalPrecargado] = useState(null);
  const [showCambiarPass, setShowCambiarPass] = useState(false);
  const irARecorrido = (localId) => { setLocalPrecargado(localId); setTab("nuevo"); };

  const handleLogin = (u) => {
    // Cargar contraseñas guardadas
    Object.keys(USUARIOS).forEach((k) => {
      const saved = localStorage.getItem("pass_" + k);
      if (saved) USUARIOS[k].passHash = saved;
    });
    setSesion(u);
    sessionStorage.setItem("sesion", JSON.stringify(u));
    setTab(u.rol === "supervisor" ? "ruta" : "dashboard");
  };

  const handleLogout = () => {
    setSesion(null);
    sessionStorage.removeItem("sesion");
    setTab("dashboard");
  };

  useEffect(() => {
    // Cargar contraseñas personalizadas
    Object.keys(USUARIOS).forEach((k) => {
      const saved = localStorage.getItem("pass_" + k);
      if (saved) USUARIOS[k].passHash = saved;
    });
    if (sesion) loadData().then((d) => { setData(d); setReady(true); });
  }, [sesion]);

  if (!sesion) return <Login onLogin={handleLogin} />;

  const handleSave = async (next) => {
    const prev = data;
    setData(next);
    try {
      await saveData(prev, next);
    } catch (err) {
      console.warn("Firebase save error:", err);
      // Si falla Firebase (ej: archivo abierto localmente), igual muestra el resultado en pantalla
    }
  };

  const showToast = (msg, kind = "done") => {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 3500);
  };

  return (
    <div className="app">
      <Style />
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark"/>
          <div>
            <div className="brand-title">Recorridos</div>
            <div className="brand-sub">Supervisión comercial de locales</div>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <span style={{ fontSize:13, color:"#6B7268" }}>{sesion.nombre}</span>
          <button className="dark-toggle" onClick={() => setShowCambiarPass(true)} title="Cambiar contraseña" style={{ fontSize:13 }}>🔑</button>
          <button className="dark-toggle" onClick={handleLogout} title="Salir" style={{ fontSize:13 }}>⬡ Salir</button>
        </div>
        <nav className="tabs">
          {(sesion.rol === "supervisor"
              ? [["ruta","Mi ruta"],["historial","Panel"]]
              : [["dashboard","Panel"],["locales","Locales"],["historial","Historial"],["ruta","Ruta del mes"],["admin","Administración"]]
            ).map(([id,label]) => (
            <button key={id} className={"tab"+(tab===id?" active":"")} onClick={() => setTab(id)}>{label}</button>
          ))}
        </nav>
      </header>
      <main className="content">
        {!ready ? <div className="loading">Cargando…</div>
          : tab==="dashboard" ? <Dashboard data={data} onSave={handleSave} showToast={showToast} sesion={sesion} />
          : tab==="locales" ? <Locales data={data} onSave={handleSave} showToast={showToast} />
          : tab==="historial" ? (sesion.rol==="supervisor" ? <PanelSupervisor data={data} onSave={handleSave} showToast={showToast} supervisor={sesion.supervisor} /> : <Historial data={data} supervisorFijo={null} />)
          : tab==="ruta" ? (sesion.rol==="admin" ? <RutaMes data={data} onSave={handleSave} showToast={showToast} /> : <MiRuta data={data} irARecorrido={irARecorrido} onSave={handleSave} showToast={showToast} supervisorFijo={sesion.supervisor} sesion={sesion} />)
          : <Admin data={data} onSave={handleSave} showToast={showToast} sesion={sesion} />
        }
      </main>
      {toast && <div className={"toast "+toast.kind}>{toast.msg}</div>}
      {showCambiarPass && (
        <CambiarPass
          usuario={Object.keys(USUARIOS).find((k) => USUARIOS[k].nombre === sesion.nombre) || "admin"}
          onClose={() => setShowCambiarPass(false)}
          onSave={() => showToast("Contraseña actualizada.")}
        />
      )}
    </div>
  );
}
