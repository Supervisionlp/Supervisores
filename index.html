function ControlesTarea({ valor, onChange }) {
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");
  const cambiar = async cumplio => {
    if (guardando) return;

// Calcular completitud de una visita
function calcCompletitud(v, codigos, pruebasRealizadas) {
  const campos = [
    { key:"arqueoCaja", label:"Caja sin diferencias" },
    { key:"condicionesLocal", label:"Salón de atención al público ordenado y limpio" },
    { key:"depositoOrdenado", label:"Depósito de mercaderías ordenado" },
    { key:"bajaRotacionExhibidos", label:"Artículos baja rotación exhibidos" },
    { key:"promocionesVisibles", label:"Precios y promociones visibles" },
    { key:"comodidadEspacio", label:"Comodidad y espacio" },
    { key:"estadoLocal", label:"Infraestructura y seguridad" },
    ...(v.personal === "ayudante" ? [
      { key:"ayudante_atencion", label:"Ayudante — Atención al cliente" },
      { key:"ayudante_orden", label:"Ayudante — Orden y presentación" },
      { key:"ayudante_apoyo", label:"Ayudante — Apoyo al encargado" },
    ] : CHECK_FIELDS_ENCARGADO.map(([key, label]) => ({ key, label }))),
  ];
  const valor = key => key.startsWith("ayudante_")
    ? v.evalAyudante?.[key.replace("ayudante_", "")] || v.checks?.[key]
    : v[key] || v.checks?.[key];
  const completados = campos.filter(c => valor(c.key));
  const faltantes = campos.filter(c => !valor(c.key));
  let totalPruebas = 0;

  // Pruebas técnicas — solo si había artículos asignados
  if (codigos) {
    const codLocal = codigos.filter(c => c.localId === v.localId);
    if (codLocal.length > 0) {
      totalPruebas = 1;
      const asignados = new Set(codLocal.map(c => String(c.codigo)));
      const probados = new Set((pruebasRealizadas||[])
        .filter(p => p.localId === v.localId && v.fecha &&
          (p.fechaProbado||"").slice(0,10) === v.fecha.slice(0,10) && asignados.has(String(p.codigo)))
        .map(p => String(p.codigo))).size;
      if (probados < asignados.size) faltantes.push({ key:"pruebas", label:`Pruebas técnicas (${probados}/${asignados.size} probados)` });
      else completados.push({ key:"pruebas" });
    }
  }

  const totalReal = campos.length + totalPruebas;
  const completadosReal = completados.length;
  const pct = Math.round((completadosReal / totalReal) * 100);
  return { total: totalReal, completados: completadosReal, pct, faltantes };
}

const ESTADOS = {

};

function estadoVisita(v, codigos, pruebasRealizadas) {
  if (v.borrador) return "pendiente";
  const checks = CHECK_FIELDS.map(([k]) => v[k]).filter(Boolean);
  const evaluaciones = v.personal === "ayudante"
    ? [v.evalAyudante?.atencion, v.evalAyudante?.orden, v.evalAyudante?.apoyo]
    : CHECK_FIELDS_ENCARGADO.map(([key]) => v[key]);
  const infra = (v.infraResuelta || v.estadoResuelta) ? "sin_novedades" : estadoInfraestructura(v);
  if (checks.some((c) => c === "No") || evaluaciones.includes("deficiente") ||
      infra === "intervencion" || v.regularizacionDesvios === "no") return "incidencia";
  const cal = parseFloat(v.calificacion);
  if (!isNaN(cal) && cal <= 2) return "incidencia";
  if (!isNaN(cal) && cal === 3) return "pendiente";
  if (infra === "seguimiento" || evaluaciones.some(c => c === "regular" || c === "amejorar") ||
      v.regularizacionDesvios === "parcialmente" || calcCompletitud(v, codigos, pruebasRealizadas).pct < 100) return "pendiente";
  return "completado";
}

function estadoInfraestructura(v) {
  if (["sin_novedades", "seguimiento", "intervencion"].includes(v?.estadoLocal)) return v.estadoLocal;
  const tieneDetalle = !!String(v?.infraestructura || v?.motivoEstado || v?.descripcionProblema || "").trim();
  return tieneDetalle || v?.problemaSeguridad === "Si" ? "seguimiento" : "sin_novedades";
}

function compararVisitas(a, b) {
  const clave = v => [v.fecha || "", v.horaLlegada || "00:00", v.id || ""].join("|");
  return clave(a).localeCompare(clave(b));
}

function resumirInfraestructura(visitas) {
  const pendientes = new Map(), ultimas = new Map(), resueltos = new Map(), historial = [];
  for (const v of [...(visitas || [])].filter(v => !v.borrador && v.localId).sort(compararVisitas)) {
    ultimas.set(v.localId, v);
    if (estadoInfraestructura(v) === "sin_novedades") continue;
    historial.push(v);
    let caso = pendientes.get(v.localId);
    if (!caso) caso = { localId: v.localId, fechaDeteccion: v.fecha, visita: v, visitaIds: [] };
    caso = { ...caso, visita: v, visitaIds: [...caso.visitaIds, v.id] };
    if (v.infraResuelta || v.estadoResuelta) {
      const clave = v.localId + "|" + (v.resolucionInfraId || v.fechaResolucionInfra || v.id);
      const anterior = resueltos.get(clave);
      resueltos.set(clave, { ...caso,
        fechaDeteccion: anterior?.fechaDeteccion || caso.fechaDeteccion,
        visitaIds: [...(anterior?.visitaIds || []), ...caso.visitaIds],
        fechaResolucion: v.fechaResolucionInfra || null });
      pendientes.delete(v.localId);
    } else pendientes.set(v.localId, caso);
  }
  return {
    pendientes: [...pendientes.values()].sort((a,b) => compararVisitas(b.visita,a.visita)),
    resueltos: [...resueltos.values()].sort((a,b) => compararVisitas(b.visita,a.visita)),
    historial: historial.reverse(),
    sinPendientes: [...ultimas.values()].filter(v => !pendientes.has(v.localId)),
    totalLocales: ultimas.size,
  };
}

function SeguimientoInfraestructura({ resumen, data, onSave, showToast, soloGraves, onVolver, palabrasRanking = [], localesPorPalabra = {} }) {
  const [tab, setTab] = useState("pendientes");

  const resueltos = resumen.resueltos.filter(c => filtrar(c.visita));

    } catch (err) { setError("No se pudo guardar la resolución. Volvé a intentar."); }
    finally { setGuardando(null); }
  };
  const filas = tab === "historial" ? historial.map(v => ({ visita:v, localId:v.localId })) : tab === "resueltos" ? resueltos : pendientes;
  return (
    <div className="form-page admin-dashboard">
      <button className="btn ghost" onClick={onVolver}>← Volver al panel</button>
      <h2 className="page-title" style={{ marginTop:16 }}>{soloGraves ? "Infraestructura grave" : "Infraestructura y seguridad"}</h2>
      <p className="dim">Seguimiento actual de todos los meses. Los pendientes permanecen hasta registrar su resolución.</p>
      <div className="sup-pills" style={{ flexWrap:"wrap", marginBottom:16 }}>
        {[["pendientes", "Pendientes", pendientes.length], ["resueltos", "Resueltos", resueltos.length], ["historial", "Historial", historial.length]].map(([id,label,n]) => (
          <button key={id} className={"sup-pill" + (tab === id ? " active" : "")} aria-pressed={tab === id} onClick={() => setTab(id)}>{label} ({n})</button>
        ))}
      </div>
      <p className="dim small">{tab === "pendientes" ? "Un registro por local con inconvenientes pendientes." : tab === "historial" ? "Todas las visitas que registraron inconvenientes, ordenadas por fecha y hora." : "Registros de inconvenientes resueltos. Un local puede tener más de uno."}</p>
      {tab === "pendientes" && !soloGraves && palabrasRanking.length > 0 && <details className="panel">
        <summary style={{ cursor:"pointer", fontWeight:700 }}>Problemas más frecuentes entre los pendientes</summary>
        {palabrasRanking.map(p => <details key={p} style={{ marginTop:12 }}>
          <summary style={{ cursor:"pointer" }}>{p} · {(localesPorPalabra[p] || []).length} locales</summary>
          {(localesPorPalabra[p] || []).map(l => <p key={l.id}><b>{nombre(l.id)}</b>: {l.detalle}</p>)}
        </details>)}
      </details>}
      {error && <div role="alert" style={{ color:"var(--alert)", marginBottom:12 }}>{error}</div>}
      {filas.length === 0 && <div className="panel">No hay registros en esta vista.</div>}
      {filas.map(caso => {
        const v = caso.visita, resuelto = !!(v.infraResuelta || v.estadoResuelta);
        const color = resuelto ? "var(--done)" : estadoInfraestructura(v) === "intervencion" ? "var(--alert)" : "var(--pending)";
        return <div key={v.id} className="panel" style={{ borderLeft:`4px solid ${color}` }}>
          <div style={{ display:"flex", justifyContent:"space-between", gap:12, flexWrap:"wrap", marginBottom:10 }}>
            <strong>{nombre(caso.localId)}</strong>
            <span style={{ color, fontWeight:700 }}>{resuelto ? "Resuelto" : estadoInfraestructura(v) === "intervencion" ? "Grave · Pendiente" : "Requiere seguimiento"}</span>
          </div>
          <p style={{ overflowWrap:"anywhere" }}>{v.infraestructura || v.descripcionProblema || "Sin detalle registrado"}</p>
          <div className="dim" style={{ display:"flex", flexWrap:"wrap", gap:"6px 20px" }}>
            {caso.fechaDeteccion && <span>Detección: {fmt(caso.fechaDeteccion)}</span>}
            <span>{tab === "historial" ? "Visita" : "Última revisión del problema"}: {fmt(v.fecha)} {v.horaLlegada || ""}</span>
            <span>Supervisor: {v.supervisor || "Sin registrar"}</span>
            {resuelto && <span>Resolución: {v.fechaResolucionInfra ? fmt(v.fechaResolucionInfra) : "Fecha no registrada"}</span>}
          </div>
          {tab === "pendientes" && <button className="btn" style={{ marginTop:14 }} disabled={!!guardando} onClick={() => resolver(caso)}>{guardando === caso.localId ? "Guardando…" : "Marcar como resuelto"}</button>}
        </div>;
      })}
    </div>
  );
}

// Cálculo de costo por km basado en parámetros fijos
function calcCostoKm(precioCombustible) {
  const combustible = 0.12 * precioCombustible;
  const mantenimiento = 270000 / 5000; // 54 Gs/km
  const cubiertas = 300000 / 10000;    // 30 Gs/km
  const desgaste = combustible * 0.10; // 10% del combustible
  return Math.round(combustible + mantenimiento + cubiertas + desgaste);
}
// Obtener número de local desde nombre ("01 - Sajonia" → "1")
function getNumLocal(nombre) {
  if (!nombre) return null;
  const m = nombre.match(/^(\d+)/);
  return m ? String(parseInt(m[1])) : null;
}

// Obtener KM entre dos locales (o supervisor → local)
function getKmEntre(origenId, destinoId, locales, supervisor) {
  const getKey = (id) => {
    if (!id) return null;
    const local = locales.find((l) => l.id === id);
    if (local) return getNumLocal(local.nombre);
    if (id?.startsWith("local-fixed-")) return id.replace("local-fixed-","");
    return null;
  };
  const dest = getKey(destinoId);
  if (!dest) return 0;
  // Origen: si es null, usar casa del supervisor
  let orig;
  if (!origenId) {
    orig = supervisor?.includes("Ernesto") ? "Sup1" : "Sup2";
  } else {
    orig = getKey(origenId);
  }
  if (!orig) return 0;
  return MATRIZ_KM[orig]?.[dest] || MATRIZ_KM[dest]?.[orig] || 0;
}

function getOrCreateLocalId(numLocal, locales) {
  // Buscar en locales existentes
  const found = locales.find((l) => String(parseInt(l.nombre.split(" - ")[0].trim())) === numLocal);
  if (found) return found.id;

function procesarCodigos(items, locales) {
  const codigos = [];
  for (const item of items) {
    if (!item.codigo || item.numLocal === "NaN") continue;
    // Buscar local en Supabase
    let localObj = locales.find((l) => String(parseInt(l.nombre.split(" - ")[0].trim())) === item.numLocal);
    // Si no existe, buscar en LOCALES_FIJOS
    if (!localObj) {
      const nombre = LOCALES_FIJOS.find((n) => String(parseInt(n.split(" - ")[0].trim())) === item.numLocal);
      if (nombre) localObj = { id: "local-" + item.numLocal, nombre };
    }
    if (!localObj) continue;
    codigos.push({ id: uid(), localId: localObj.id, codigo: item.codigo, descripcion: item.descripcion, probado: false, fechaCarga: todayISO() });
  }
  return codigos;
}

/* ---- Supabase REST helpers ---- */
async function supaGetAll(tabla) {
  let rows = [], offset = 0, pageSize = 1000;
  while (true) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?select=*&limit=${pageSize}&offset=${offset}`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!res.ok) throw new Error(tabla + ': ' + await res.text());
    const data = await res.json();
    rows = rows.concat(data || []);
    if (!data || data.length < pageSize) break;
    offset += pageSize;
  }
  return rows;
}

      supaGetAll("codigos"),
      supaGetAll("rutas"),
      fetch(`${SUPABASE_URL}/rest/v1/config?id=eq.main&select=*`, { headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY } }).then(async r => {
        if (!r.ok) throw new Error("No se pudo cargar la configuración: " + await r.text());
        return r.json();
      }).then(d => d[0] || {}),
      supaGetAll("no_cumplidos"),
      supaGetAll("ayudantes"),
      supaGetAll("pruebas_realizadas"),
      supaGetAll("analisis_competencia"),
      supaGetAll("articulos_viejos"),
      cargarInventariosSheets().catch(() => []),
      supaGetAll("stock_snapshots").catch(() => []),
    ]);

    const cfg = cfgRaw || {};

    // Construir locales desde LOCALES_FIJOS (igual que antes)
    const localesMap = {};
    LOCALES_FIJOS.forEach((nombre) => {
      const num = String(parseInt(nombre.split(" - ")[0].trim()));
      localesMap[num] = { id: "local-fixed-" + num, nombre };
    });
    const localesCompletos = Object.values(localesMap);

    // Mapear codigos de Supabase al formato que espera la app
    const codSupabase = codRaw.map((c) => {
      const localId = c.local_id?.startsWith("local-fixed-") ? c.local_id : "local-fixed-" + (c.local_id || c.numLocal || "0");
      return {
        id: c.id, localId, codigo: c.codigo, descripcion: c.descripcion,
        prestamo: c.prestamo||0, numLocal: String(c.numLocal||c.local_id||"").replace("local-fixed-",""),
        nombreLocal: c.nombreLocal||"", probado: false, fechaCarga: todayISO()
      };
    });

    // Mapear visitas — convertir snake_case a camelCase
    const visitas = visRaw.map(v => ({
      ...(v.datos_formulario || {}),
      id: v.id, localId: v.local_id, supervisor: v.supervisor, fecha: v.fecha,
      horaLlegada: v.hora_llegada, arqueoCaja: v.arqueo_caja,
      condicionesLocal: v.condiciones_local, depositoOrdenado: v.deposito_ordenado,
      bajaRotacionExhibidos: v.baja_rotacion_exhibidos, promocionesVisibles: v.promociones_visibles,
      comodidadEspacio: v.comodidad_espacio, regularizacionDesvios: v.regularizacion_desvios,
      estadoLocal: v.estado_local, infraestructura: v.infraestructura,
      infraResuelta: v.infra_resuelta, capacitacion: v.capacitacion,
      detalleCapacitacion: v.detalle_capacitacion, compromiso: v.compromiso,
      observacionesGenerales: v.observaciones_generales,
      eval_atencion: v.eval_atencion, eval_impulso: v.eval_impulso,
      eval_actitud: v.eval_actitud, eval_apariencia: v.eval_apariencia,
      kmBruto: v.km_bruto, kmRecorridos: v.km_recorridos,
      cantidadArticulosAntiguos: v.cantidad_articulos_antiguos,
      gpsLat: v.gps_lat, gpsLng: v.gps_lng, borrador: v.borrador,
    }));

    // Mapear rutas
    const rutas = rutRaw.map(r => ({
      id: r.id, supervisor: r.supervisor, fecha: r.fecha,
      localIds: r.local_ids || [], precioCombustible: r.precio_combustible,
    }));

    // Mapear tareas
    const tareas = tarRaw.map(t => {
      const visitaOrigen = visitas.find(v => v.localId === t.local_id && v.fecha === t.fecha && v.compromiso);
      return {
        id: t.id, texto: t.descripcion||t.texto||visitaOrigen?.compromiso||null, localId: t.local_id,
        supervisor: t.supervisor||visitaOrigen?.supervisor||null, fecha: t.fecha, hecha: t.completada||false,
        fechaCompletada: t.fecha_completada,
        noCumplida: t.no_cumplida || false, fechaRevision: t.fecha_revision || null,
      };
    });

    // Mapear no cumplidos
    const noCumplidos = ncRaw.map(n => ({
      id: n.id, supervisor: n.supervisor, localId: n.local_id,
      fechaRuta: n.fecha_ruta, mes: n.mes,
    }));

    // Mapear ayudantes
    const ayudantes = ayRaw.map(a => ({
      id: a.id, nombre: a.nombre, localId: a.local_id,
      fechaIngreso: a.fecha_ingreso, evaluacionCompleta: a.evaluacion_completa,
      fechaCompletado: a.fecha_completado, completadoPor: a.completado_por,
      observacionCierre: a.observacion_cierre,
    }));

    // Mapear pruebas realizadas
    const pruebasRealizadas = prRaw.map(p => ({
      id: p.id, localId: p.local_id, codigo: p.codigo, descripcion: p.descripcion,
      resultado: p.resultado, detalleFalla: p.detalle_falla,
      supervisorPrueba: p.supervisor_prueba, fechaProbado: p.fecha_probado,
    }));

    // Mapear análisis competencia
    const analisisCompetencia = compRaw.map(c => ({
      id: c.id, supervisor: c.supervisor, fecha: c.fecha, nombre: c.nombre,
      tipoEmpeño: c.tipo_empeno||[], articuloConsultado: c.articulo_consultado,
      valorArticulo: c.valor_articulo, prestamoCom: c.prestamo_com,
      comparacionPrestamo: normComp(c.comparacion_prestamo), tasaInteres: c.tasa_interes,
      plazo: c.plazo, comparacionInteres: normComp(c.comparacion_interes),
      atencion: c.atencion, infraestructura: normComp(c.infraestructura),
      captacion: c.captacion||[], ventajaPrincipal: c.ventaja_principal,
      oportunidad: c.oportunidad, fotos: c.fotos||[],
      ubicacionReferencia: c.ubicacion_referencia, otrasCondiciones: c.otras_condiciones,
      nivelImpacto: c.nivel_impacto, accionRecomendada: c.accion_recomendada,
    }));

    // Mapear artículos viejos
    const articulosViejos = viejosRaw.map(a => ({
      id: a.id, codigo: a.codigo, descripcion: a.descripcion,
      localId: a.local_id?.startsWith("local-fixed-") ? a.local_id : "local-fixed-" + a.local_id,
      fechaRemate: a.fecha_remate, meses: a.meses,
      ubicacion: a.ubicacion, precio: a.precio,
    }));

    return {
      locales: localesCompletos,
      visitas, tareas, rutas, noCumplidos, ayudantes,
      pruebasRealizadas, analisisCompetencia, articulosViejos,
      codigos: codSupabase,
      inventarios: (cfg.inventarios && cfg.inventarios.length > 0) ? cfg.inventarios : inventariosSheets,
      precioCombustible: cfg.precio_combustible || 6860,
      stockSnapshots: Object.fromEntries((snapsRaw||[]).map(s => [s.mes, (s.articulos||[]).map(a => ({ ...a, fechaRemate: a.fechaRemate || a.fecha_remate }))])),
      observacionesLocales: cfg.observaciones_locales || {},
      observacionesLocalesVistas: cfg.observaciones_locales_vistas || {},
      localesInactivos: cfg.locales_inactivos || [],
    };
  } catch (err) { console.error("loadData:", err); throw err; }
}

async function supaWrite(tabla, rows) {
  if (!rows.length) return;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "resolution=merge-duplicates,return=minimal"
    },
    body: JSON.stringify(rows)
  });
  if (!res.ok) throw new Error("No se pudo guardar " + tabla + ": " + await res.text());
}

async function supaWriteOne(tabla, row) {
  return supaWrite(tabla, [row]);
}

async function supaPatch(tabla, id, fields) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=eq.${id}`, {
    method: "PATCH",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(fields)
  });
  if (!res.ok) throw new Error("No se pudo actualizar " + tabla + ": " + await res.text());
}

async function supaRemove(tabla, id) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=eq.${encodeURIComponent(id)}`, {
    method: "DELETE",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error("No se pudo eliminar " + tabla + ": " + await res.text());
}

async function supaRemoveVerificado(tabla, id) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=eq.${encodeURIComponent(id)}`, {
    method: "DELETE",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Prefer": "return=representation" }
  });
  if (!res.ok) throw new Error("No se pudo eliminar " + tabla + ": " + await res.text());
  const filas = await res.json();
  if (!Array.isArray(filas) || filas.length === 0) throw new Error("No se eliminó ningún registro (sin permiso o ya no existe).");
}

async function supaPatchVerificado(tabla, id, fields) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=eq.${encodeURIComponent(id)}`, {
    method: "PATCH",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=representation" },
    body: JSON.stringify(fields)
  });
  if (!res.ok) throw new Error("No se pudo actualizar " + tabla + ": " + await res.text());
  const filas = await res.json();
  if (!Array.isArray(filas) || filas.length === 0) throw new Error("No se modificó ningún registro (sin permiso o ya no existe).");
}

async function saveData(prev, next) {
  try {
    const promises = [];

    // VISITAS — nuevas o actualizadas
    const prevVisMap = {};
    (prev?.visitas||[]).forEach((v) => { prevVisMap[v.id] = v; });
    const visitasNuevas = [];
    for (const v of next.visitas) {
      if (!prevVisMap[v.id] || JSON.stringify(v) !== JSON.stringify(prevVisMap[v.id])) {
        visitasNuevas.push({
          datos_formulario: v,
          id: v.id, local_id: v.localId, supervisor: v.supervisor, fecha: v.fecha,
          hora_llegada: v.horaLlegada||null, arqueo_caja: v.arqueoCaja||null,
          condiciones_local: v.condicionesLocal||null, deposito_ordenado: v.depositoOrdenado||null,
          baja_rotacion_exhibidos: v.bajaRotacionExhibidos||null,
          promociones_visibles: v.promocionesVisibles||null,
          comodidad_espacio: v.comodidadEspacio||null,
          regularizacion_desvios: v.regularizacionDesvios||null,
          estado_local: v.estadoLocal||null, infraestructura: v.infraestructura||null,
          infra_resuelta: v.infraResuelta||false,
          capacitacion: v.capacitacion||null, detalle_capacitacion: v.detalleCapacitacion||null,
          compromiso: v.compromiso||null, observaciones_generales: v.observacionesGenerales||null,
          eval_atencion: v.eval_atencion||null, eval_impulso: v.eval_impulso||null,
          eval_actitud: v.eval_actitud||null, eval_apariencia: v.eval_apariencia||null,
          km_bruto: v.kmBruto||null, km_recorridos: v.kmRecorridos||null,
          cantidad_articulos_antiguos: v.cantidadArticulosAntiguos ?? null,
          gps_lat: v.gpsLat||null, gps_lng: v.gpsLng||null, borrador: v.borrador||false,
        });
      }
    }
    if (visitasNuevas.length) promises.push(supaWrite("visitas", visitasNuevas));

    // RUTAS
    const prevRutMap = {};
    (prev?.rutas||[]).forEach((r) => { prevRutMap[r.id] = r; });
    for (const r of (next.rutas||[])) {
      if (!prevRutMap[r.id]) {
        promises.push(supaWriteOne("rutas", {
          id: r.id, supervisor: r.supervisor, fecha: r.fecha,
          local_ids: r.localIds||[], precio_combustible: r.precioCombustible||null,
        }));
      } else {
        promises.push(supaPatch("rutas", r.id, { local_ids: r.localIds||[], fecha: r.fecha }));
      }
    }
    for (const r of (prev?.rutas||[])) {
      if (!(next.rutas||[]).find((x) => x.id === r.id)) promises.push(supaRemove("rutas", r.id));
    }

    // TAREAS
    const prevTarMap = {};
    (prev?.tareas||[]).forEach((t) => { prevTarMap[t.id] = t; });
    for (const t of next.tareas) {
      if (!prevTarMap[t.id]) {
        promises.push(supaWriteOne("tareas", {
          id: t.id, descripcion: t.texto||t.descripcion||null, local_id: t.localId||null,
          supervisor: t.supervisor||null, fecha: t.fecha||null,
          completada: t.hecha||t.completada||false, fecha_completada: t.fechaCompletada||null,
          no_cumplida: !!t.noCumplida, fecha_revision: t.fechaRevision || null,
        }));
      } else if (t.hecha !== prevTarMap[t.id].hecha || t.noCumplida !== prevTarMap[t.id].noCumplida || t.fechaRevision !== prevTarMap[t.id].fechaRevision) {
        promises.push(supaPatch("tareas", t.id, { completada: !!t.hecha, fecha_completada: t.fechaCompletada || null, no_cumplida: !!t.noCumplida, fecha_revision: t.fechaRevision || null }));
      }
    }

    // PRUEBAS REALIZADAS
    const prevPrMap = {};
    (prev?.pruebasRealizadas||[]).forEach((p) => { prevPrMap[p.localId + "|" + p.codigo + "|" + (p.fechaProbado||"").slice(0,10)] = p; });
    for (const c of next.codigos) {
      const clavePrueba = c.localId + "|" + c.codigo + "|" + (c.fechaProbado||"").slice(0,10);
      if (c.probado && !prevPrMap[clavePrueba]) {
        const prId = "pr-" + c.id + "-" + (c.fechaProbado||"").slice(0,10);
        promises.push(supaWriteOne("pruebas_realizadas", {
          id: prId, local_id: c.localId, codigo: c.codigo, descripcion: c.descripcion,
          resultado: c.resultado||null, detalle_falla: c.detalleFalla||null,
          fecha_probado: c.fechaProbado||null, supervisor_prueba: c.supervisorPrueba||null,
        }));
      }
    }

    // AYUDANTES
    const prevAyMap = {};
    (prev?.ayudantes||[]).forEach((a) => { prevAyMap[a.id] = a; });
    for (const a of (next.ayudantes||[])) {
      if (!prevAyMap[a.id]) {
        promises.push(supaWriteOne("ayudantes", {
          id: a.id, nombre: a.nombre||null, local_id: a.localId||null,
          fecha_ingreso: a.fechaIngreso||null, evaluacion_completa: a.evaluacionCompleta||false,
          fecha_completado: a.fechaCompletado||null, completado_por: a.completadoPor||null,
        }));
      } else if (a.evaluacionCompleta !== prevAyMap[a.id].evaluacionCompleta) {
        promises.push(supaPatch("ayudantes", a.id, {
          evaluacion_completa: a.evaluacionCompleta,
          fecha_completado: a.fechaCompletado||null,
          completado_por: a.completadoPor||null,
        }));
      }
    }

    // CONFIG
    const cfgChanged = next.precioCombustible !== prev?.precioCombustible ||
      JSON.stringify(next.localesInactivos) !== JSON.stringify(prev?.localesInactivos) ||
      JSON.stringify(next.observacionesLocales) !== JSON.stringify(prev?.observacionesLocales) ||
      JSON.stringify(next.observacionesLocalesVistas) !== JSON.stringify(prev?.observacionesLocalesVistas);
    if (cfgChanged) {
      promises.push(supaPatch("config", "main", {
        precio_combustible: next.precioCombustible||6860,
        locales_inactivos: next.localesInactivos||[],
        observaciones_locales: next.observacionesLocales||{},
        observaciones_locales_vistas: next.observacionesLocalesVistas||{},
      }));
    }

    const resultados = await Promise.allSettled(promises);
    const fallo = resultados.find(r => r.status === "rejected");
    if (fallo) throw fallo.reason;
    // Eliminar borradores reemplazados solo después de confirmar todas las escrituras.
    for (const v of (prev?.visitas || [])) {
      if (v.borrador && !next.visitas.some(n => n.id === v.id)) {
        await supaRemove("visitas", v.id);
      }
    }
  } catch (err) { console.error("saveData:", err); throw err; }
}

/* ---- YesNo pill ---- */
function YesNo({ label, value, onChange, opts }) {
  const options = opts || ["Si", "No"];
  return (
    <div className="yesno">
      <span className="yesno-label">{label}</span>
      <div className="yesno-pills">
        {options.map((opt) => (
          <button key={opt} type="button"
            className={"pill" + (value === opt ? (opt === "No" || opt === "Mala" ? " pill-no" : opt === "Regular" ? " pill-med" : " pill-si") : "")}
            onClick={() => onChange(value === opt ? "" : opt)}>
            {opt}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---- Ayudantes Capacitacion ---- */
function diasCorridos(desde, hasta) {
  const d1 = new Date(desde); const d2 = new Date(hasta);
  return Math.floor((d2 - d1) / 86400000);
}

function sumarDiasCorridos(desde, dias) {
  const d = new Date(desde);
  d.setDate(d.getDate() + dias);
  return d.toISOString().split("T")[0];
}

function FichaResumenAyudante({ ayudante, onClose, LABELS, emoji }) {
  const CRITERIOS = {
    generalidades:"Conoce sus funciones, las normas internas y brinda una atención adecuada al cliente.",
    registro:"Verifica los datos y documentos del cliente, prueba el artículo y registra correctamente el empeño.",
    gestion:"Maneja correctamente intereses, amortizaciones, anulaciones, recuperos y retiros.",
    ventas:"Realiza correctamente facturación, compras, notas de crédito y movimientos de artículos.",
    oro:"Reconoce tipos de oro, kilatajes y sellos; realiza pruebas e identifica posibles fraudes.",
    bizagi:"Realiza correctamente las principales gestiones en Bizagi y Pago Express.",
    internos:"Conoce reparaciones, remisiones, soporte y los demás procedimientos internos.",
    atencion:"Trato en mostrador y presencia/vestimenta adecuada.",
    "empeños":"Carga en LPSoft, toma de fotos y resguardo seguro.",
    sistemas:"Arqueo en cero y registro correcto en LPSoft, Bizagi y Pago Express.",
  };
  const KEYS_OLD = ["atencion","empeños","oro","ventas","sistemas","internos"];
  const KEYS_NEW = ["generalidades","registro","gestion","ventas","oro","bizagi","internos"];
  const getKEYS = (ev) => ayCriterios(ev).map(m => m.key);
  const labelEstado = (v) => v==="autonomo"||v==="cumple"?"Autónomo":v==="supervision"||v==="refuerzo"?"Bajo supervisión":v==="no_capacitado"||v==="no_cumple"?"No capacitado":"Sin evaluar";
  const [evals, setEvals] = React.useState([]);
  React.useEffect(() => {
    fetch(`${SUPABASE_URL}/rest/v1/evaluaciones_ayudantes?ayudante_id=eq.${ayudante.id}&select=*&order=fecha.desc`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    }).then(r => r.json()).then(data => {
      setEvals((data||[]).map(e => ({
        id: e.id, fecha: e.fecha, supervisor: e.supervisor,
        modulos: e.modulos, observacion: e.observacion, fechaRevaluacion: e.fecha_revaluacion,
      })).sort((a,b) => (b.fecha||"").localeCompare(a.fecha||"")));
    });
  }, [ayudante.id]);

  return (
    <div style={{ marginTop:12, background:"var(--paper)", border:"1px solid var(--line)", borderRadius:10, padding:"14px 16px" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <div style={{ fontWeight:700, fontSize:14 }}>📋 {ayudante.nombre}</div>
        <button className="btn ghost" style={{ fontSize:12 }} onClick={onClose}>✕ Cerrar</button>
      </div>
      {evals.length === 0 ? (
        <div className="dim small">Sin evaluaciones registradas.</div>
      ) : evals.map((ev, i) => {
        const alertas = [];
        if (ev.modulos?.oro === "no_cumple") alertas.push("🔴 Oro/Joyas: No debe recepcionar oro de forma independiente");
        if (ev.modulos?.oro === "refuerzo") alertas.push("🟡 Oro/Joyas: Supervisar recepciones de oro");
        if (ev.modulos?.["empeños"] === "no_cumple" || ev.modulos?.["empeños"] === "refuerzo") alertas.push("🟡 Empeños: Revisar 100% de contratos desde oficina");
        const refuerzoMods = getKEYS(ev).filter(k => ev.modulos?.[k] === "refuerzo" || ev.modulos?.[k] === "no_cumple" || ev.modulos?.[k] === "supervision" || ev.modulos?.[k] === "no_capacitado").map(k => LABELS[k]);
        return (
          <div key={ev.id} style={{ marginBottom:12, padding:"10px 12px", background:"#f5f7f5", borderRadius:8 }}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:6 }}>
              <span style={{ fontWeight:700 }}>Evaluación {evals.length - i} — {ev.fecha}</span>
              <span className="dim">{ev.supervisor}</span>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:5, marginBottom:6 }}>
              {getKEYS(ev).map(k => (
                <div key={k} style={{ display:"flex", alignItems:"center", gap:8, padding:"5px 8px", background:"#fff", borderRadius:6, border:"1px solid var(--line)" }}>
                  <span style={{ fontSize:16 }}>{emoji(ev.modulos?.[k])}</span>
                  <div>
                    <div style={{ fontSize:12, fontWeight:600 }}>{ayCriterios(ev).find(m => m.key === k)?.label || LABELS[k]}</div>
                    <div style={{ fontSize:10, color:"#888" }}>{ayCriterios(ev).find(m => m.key === k)?.criterio || CRITERIOS[k]}</div>
                  </div>
                  <span style={{ marginLeft:"auto", fontSize:10.5, fontWeight:700, whiteSpace:"nowrap" }}>{labelEstado(ev.modulos?.[k])}</span>
                </div>
              ))}
            </div>
            {refuerzoMods.length > 0 && (
              <div style={{ background:"#fff8e1", border:"1px solid #f59e0b", borderRadius:6, padding:"6px 10px", marginBottom:6 }}>
                <div style={{ fontSize:11, fontWeight:700, color:"#b37700", marginBottom:3 }}>⚠️ Necesita refuerzo/capacitación en:</div>
                {refuerzoMods.map((m,j) => <div key={j} style={{ fontSize:11, color:"#555" }}>• {m}</div>)}
              </div>
            )}
            {ev.observacion && (
              <div style={{ fontSize:11, marginBottom:3 }}>
                <span style={{ fontWeight:600, color:"#555" }}>💬 Comentario del supervisor: </span>
                <span style={{ color:"#555" }}>{ev.observacion}</span>
              </div>
            )}
            {ev.fechaRevaluacion && <div style={{ fontSize:11, color:"var(--route)" }}>📅 Re-evaluación: {ev.fechaRevaluacion}</div>}
          </div>
        );
      })}
    </div>
  );

// Mismo formato de siempre: "1. Texto" (numerado y sin punto final)
function ayNum(lista) {
 return lista.map((m,i) => ({ ...m, label: /^\d+\./.test(m.label) ? m.label : (i+1)+". "+m.label.replace(/\.$/,"") }));
}
function ayCriterios(ev) {
 const m=ev?.modulos||{};
 if ('mercaderias' in m || 'oro_resguardo' in m || 'resolucion' in m) return ayNum(AY_AVANZADA);
 if ('caja' in m) return ayNum(AY_PRIMERA);
 if ('generalidades' in m || 'registro' in m) return AY_LEGACY;
 const labels={atencion:'Atención','empeños':'Empeños',oro:'Oro/Joyas',ventas:'Ventas',sistemas:'Sistemas',internos:'Internos'};
 return Object.keys(labels).map(key=>({key,label:labels[key]}));
}

function CierreRecomendacion({ ayudante, supervisor, onClose, showToast, onSave, data }) {
  const [aptitud, setAptitud] = React.useState(null);
  const [obsF, setObsF] = React.useState("");
  const [guardando, setGuardando] = React.useState(false);
  return (
    <div style={{ marginTop:8, padding:"12px", background:"#f0f4f0", borderRadius:8, border:"1px solid var(--line)" }}>
      <div style={{ fontWeight:700, fontSize:13, marginBottom:8 }}>Cierre de capacitación: ¿el ayudante está apto para continuar?</div>
      <div style={{ display:"flex", gap:8, marginBottom: aptitud !== null ? 10 : 0 }}>
        <button onClick={() => setAptitud(true)}
          style={{ flex:1, padding:"8px 0", borderRadius:8, fontWeight:700, fontSize:13, border:"2px solid var(--done)", background: aptitud === true ? "var(--done)" : "#fff", color: aptitud === true ? "#fff" : "var(--done)", cursor:"pointer" }}>
          ✓ Apto
        </button>
        <button onClick={() => setAptitud(false)}
          style={{ flex:1, padding:"8px 0", borderRadius:8, fontWeight:700, fontSize:13, border:"2px solid var(--alert)", background: aptitud === false ? "var(--alert)" : "#fff", color: aptitud === false ? "#fff" : "var(--alert)", cursor:"pointer" }}>
          ✗ No apto
        </button>
      </div>
      {aptitud !== null && (
        <>
          <textarea className="input" rows={2} style={{ width:"100%", resize:"vertical", fontSize:12, marginBottom:8 }}
            placeholder="Observación final (opcional)..."
            value={obsF} onChange={e => setObsF(e.target.value)} />
          <button className="btn" style={{ width:"100%", background: aptitud ? "var(--done)" : "var(--alert)", color:"#fff" }}
            disabled={guardando}
            onClick={async () => {
              setGuardando(true);
              const fechaCierre = new Date().toISOString().slice(0,10);
              const textoCierre = (aptitud ? "APTO" : "NO APTO") + (obsF ? " — " + obsF : "");
              try {
                await supaPatch("ayudantes", ayudante.id, {
                  evaluacion_completa: true,
                  fecha_completado: fechaCierre,
                  completado_por: supervisor || "",
                  observacion_cierre: textoCierre,
                });
                if (onSave && data) {
                  onSave(data.ayudantes.map(a => a.id === ayudante.id ? { ...a, evaluacionCompleta: true, fechaCompletado: fechaCierre, completadoPor: supervisor || "", observacionCierre: textoCierre } : a), "ayudantes");
                }
                showToast(aptitud ? "✅ Ayudante aprobado" : "❌ Ayudante no aprobado");
                onClose();
              } catch (e) {
                showToast("No se pudo guardar. Volvé a intentar.");
                setGuardando(false);
              }
            }}>
            {guardando ? "Guardando..." : "Confirmar y cerrar"}
          </button>
        </>
      )}
    </div>
  );
}

function EvaluacionAyudante({ ayudante, supervisor, onClose, showToast, onSave, data }) {
  const [modulos, setModulos] = React.useState({ generalidades:null, registro:null, gestion:null, ventas:null, oro:null, bizagi:null, internos:null });
  const [observacion, setObservacion] = React.useState("");
  const [fechaRevaluacion, setFechaRevaluacion] = React.useState("");
  const [saving, setSaving] = React.useState(false);
  const [evaluaciones, setEvaluaciones] = React.useState([]);
  const [loadingEvals, setLoadingEvals] = React.useState(true);
  const [modoFormulario, setModoFormulario] = React.useState(false);
  const [decision, setDecision] = React.useState(null); // "apto" | "no_apto" | "otra"
  const nPrevias = evaluaciones.length;
  const finPlazo = ayudante.fechaIngreso ? sumarDiasCorridos(ayudante.fechaIngreso, 60) : null;
  const hoyEv = todayISO();
  const pideFecha = nPrevias === 0 || (nPrevias === 1 && decision === "otra");
  const finaliza = nPrevias >= 1 && (decision === "apto" || decision === "no_apto");
  // 1ª evaluación: 7 criterios · 2ª en adelante: 10 criterios
  const MODULOS = ayNum(evaluaciones.length === 0 ? AY_PRIMERA : AY_AVANZADA);

  React.useEffect(() => {
    fetch(`${SUPABASE_URL}/rest/v1/evaluaciones_ayudantes?ayudante_id=eq.${ayudante.id}&select=*&order=fecha.desc`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    }).then(r => r.json()).then(data => {
      setEvaluaciones((data||[]).map(e => ({
        id: e.id, fecha: e.fecha, supervisor: e.supervisor,
        modulos: e.modulos, observacion: e.observacion, fechaRevaluacion: e.fecha_revaluacion,
      })));
      setLoadingEvals(false);
    }).catch(() => setLoadingEvals(false));
  }, [ayudante.id]);

  const opcion = (key, val, label, clase) => (
    <button type="button" className={"ev-opt " + clase + (modulos[key]===val ? " sel" : "")} aria-pressed={modulos[key]===val}
      onClick={() => setModulos(m => ({...m,[key]:val}))}>
      <i />{label}
    </button>
  );

  const estadoColor = (v) => v==="autonomo"?"var(--done)":v==="supervision"?"#b37700":v==="no_capacitado"?"var(--alert)":"#aaa";
  const estadoEmoji = (v) => v==="autonomo"?"🟢":v==="supervision"?"🟡":v==="no_capacitado"?"🔴":"⚪";
  const estadoLabel = (v) => v==="autonomo"?"Autónomo":v==="supervision"?"Bajo supervisión":v==="no_capacitado"?"No capacitado":"Sin evaluar";

  const guardar = async () => {
    const modulosGuardar = Object.fromEntries(MODULOS.map(m => [m.key, modulos[m.key] ?? null]));
    const evaluados = Object.values(modulosGuardar).filter(v => v !== null).length;
    if (evaluados === 0) { showToast("Evaluá al menos un módulo"); return; }
    if (nPrevias >= 1 && !decision) { showToast("Elegí Apto, No apto" + (nPrevias === 1 ? " u Otra evaluación" : "")); return; }
    if (pideFecha && fechaRevaluacion && finPlazo && fechaRevaluacion > finPlazo) { showToast("La fecha no puede pasar el fin del plazo (" + finPlazo.split("-").reverse().join("/") + ")"); return; }
    setSaving(true);
    try {
      const nuevoId = uid();
      const hoyEval = new Date().toISOString().slice(0,10);
      await supaWriteOne("evaluaciones_ayudantes", {
        id: nuevoId,
        ayudante_id: ayudante.id,
        ayudante_nombre: ayudante.nombre,
        supervisor: supervisor || "",
        fecha: hoyEval,
        modulos: modulosGuardar,
        observacion: observacion||null,
        fecha_revaluacion: pideFecha ? (fechaRevaluacion||null) : null,
      });
      if (finaliza) {
        const apto = decision === "apto";
        const textoCierre = (apto ? "APTO" : "NO APTO") + (observacion ? " — " + observacion : "");
        await supaPatch("ayudantes", ayudante.id, {
          evaluacion_completa: true,
          fecha_completado: hoyEval,
          completado_por: supervisor || "",
          observacion_cierre: textoCierre,
        });
        if (onSave && data) {
          onSave(data.ayudantes.map(a => a.id === ayudante.id ? { ...a, evaluacionCompleta: true, fechaCompletado: hoyEval, completadoPor: supervisor || "", observacionCierre: textoCierre } : a), "ayudantes");
        }
        showToast(apto ? "✅ Evaluación finalizada: Apto" : "❌ Evaluación finalizada: No apto");
      } else {
        showToast("Evaluación guardada");
      }
      onClose();
    } catch(e) { showToast("Error al guardar"); }
    finally { setSaving(false); }
  };

  const todosCumple = MODULOS.every(m => modulos[m.key] === "autonomo");
  const alertas = [];
  if (modulos.oro === "no_capacitado") alertas.push("🔴 Oro/Joyas: No debe recepcionar oro de forma independiente");
  if (modulos.oro === "supervision") alertas.push("🟡 Oro/Joyas: Supervisar recepciones de oro");
  if (modulos.registro === "no_capacitado" || modulos.registro === "supervision") alertas.push("🟡 Empeños: Revisar 100% de sus contratos desde oficina");

  return (
    <div style={{ background:"var(--paper)", borderRadius:10, border:"1px solid var(--line)", padding:"14px 16px", marginBottom:12 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <div>
          <div style={{ fontWeight:700, fontSize:14 }}>📋 {ayudante.nombre}</div>
        </div>
        <button className="btn ghost" style={{ fontSize:12 }} onClick={onClose}>✕ Cerrar</button>
      </div>

      {/* Si ya tiene evaluaciones y no está en modo formulario → mostrar historial */}
      {loadingEvals ? (
        <div className="dim small">Cargando...</div>
      ) : false ? (
        <div>
          {evaluaciones.map((ev, i) => {
            const emoji = (v) => v==="autonomo"?"🟢":v==="supervision"?"🟡":v==="no_capacitado"?"🔴":"⚪";
            const labelEst = (v) => v==="autonomo"?"Autónomo":v==="supervision"?"Bajo supervisión":v==="no_capacitado"?"No capacitado":"Sin evaluar";
            return (
              <div key={ev.id} style={{ marginBottom:10, padding:"10px 12px", background:"#f5f7f5", borderRadius:8 }}>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:6 }}>
                  <span style={{ fontWeight:700 }}>Evaluación {evaluaciones.length - i} — {ev.fecha}</span>
                  <span className="dim">{ev.supervisor}</span>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                  {ayCriterios(ev).map(m => (
                    <div key={m.key} style={{ display:"flex", alignItems:"center", gap:8, padding:"4px 8px", background:"#fff", borderRadius:6, border:"1px solid var(--line)" }}>
                      <span style={{ fontSize:15 }}>{emoji(ev.modulos?.[m.key])}</span>
                      <span style={{ fontSize:11.5, fontWeight:600, flex:1 }}>{m.label}</span>
                      <span style={{ fontSize:10.5, fontWeight:700, color:estadoColor(ev.modulos?.[m.key]), whiteSpace:"nowrap" }}>{labelEst(ev.modulos?.[m.key])}</span>
                    </div>
                  ))}
                </div>
                {ev.observacion && <div style={{ fontSize:11, marginTop:6, color:"#555" }}>💬 {ev.observacion}</div>}
                {ev.fechaRevaluacion && <div style={{ fontSize:11, marginTop:3, color:"var(--route)" }}>📅 Re-evaluación: {ev.fechaRevaluacion}</div>}
              </div>
            );
          })}

          {/* Recomendación final */}
          <CierreRecomendacion ayudante={ayudante} supervisor={supervisor} onClose={onClose} showToast={showToast} onSave={onSave} data={data} />

          {evaluaciones.length < 2 && (
          <button className="btn ghost" style={{ fontSize:11, padding:"4px 10px", marginTop:8 }}
            onClick={() => setModoFormulario(true)}>
            + Volver a evaluar
          </button>
          )}
        </div>
      ) : (
        <div>
        {/* Resumen evaluación anterior si existe */}
        {evaluaciones.length > 0 && (() => {
          const anterior = evaluaciones[0];
          const emoji = (v) => v==="autonomo"?"🟢":v==="supervision"?"🟡":v==="no_capacitado"?"🔴":"⚪";
          const labelEst = (v) => v==="autonomo"?"Autónomo":v==="supervision"?"Bajo supervisión":v==="no_capacitado"?"No capacitado":"Sin evaluar";
          return (
            <details style={{ marginBottom:12, background:"#f5f7f5", borderRadius:8, padding:"10px 12px" }}>
              <summary style={{ fontWeight:700, fontSize:12, cursor:"pointer" }}>
                📋 Evaluación anterior — {anterior.fecha} <span className="dim" style={{ fontWeight:400 }}>{anterior.supervisor ? "· "+anterior.supervisor : ""}</span>
              </summary>
              <div style={{ marginTop:8, display:"flex", flexDirection:"column", gap:4 }}>
                {ayCriterios(anterior).map(m => (
                  <div key={m.key} style={{ display:"flex", alignItems:"center", gap:8, padding:"4px 8px", background:"#fff", borderRadius:6, border:"1px solid var(--line)" }}>
                    <span>{emoji(anterior.modulos?.[m.key])}</span>
                    <span style={{ fontSize:11.5, flex:1 }}>{m.label}</span>
                    <span style={{ fontSize:10.5, fontWeight:700, color:estadoColor(anterior.modulos?.[m.key]), whiteSpace:"nowrap" }}>{labelEst(anterior.modulos?.[m.key])}</span>
                  </div>
                ))}
              </div>
              {anterior.observacion && <div style={{ fontSize:11, marginTop:6, color:"#555" }}>💬 {anterior.observacion}</div>}
              {anterior.fechaRevaluacion && <div style={{ fontSize:11, marginTop:3, color:"var(--route)" }}>📅 Re-evaluación: {anterior.fechaRevaluacion}</div>}
            </details>
          );
        })()}
        <div style={{ fontWeight:800, fontSize:13, color:"var(--route)", borderBottom:"2px solid var(--route)", paddingBottom:6, marginBottom:12 }}>
          Nueva evaluación
        </div>

      {/* Módulos */}
      <style>{EV_CSS}</style>
      {MODULOS.map(m => (
        <div key={m.key} className={"ev-q" + (modulos[m.key] ? " respondida" : "")}>
          <div className="ev-q-head">
            <div className="ev-q-title">{m.label}</div>
            {m.critico && <span className="ev-critico">Pilar crítico</span>}
          </div>
          <div className="ev-q-crit">{m.criterio}</div>
          <div className="ev-opts">
            {opcion(m.key, "autonomo",      "Autónomo",         "verde")}
            {opcion(m.key, "supervision",   "Bajo supervisión", "amarillo")}
            {opcion(m.key, "no_capacitado", "No capacitado",    "rojo")}
          </div>
        </div>
      ))}

      {/* Alertas */}
      {alertas.length > 0 && (
        <div style={{ background:"#fff8e1", border:"1px solid #f59e0b", borderRadius:8, padding:"10px 12px", marginBottom:12 }}>
          <div style={{ fontWeight:700, fontSize:12, marginBottom:6 }}>⚠️ Alertas activas</div>
          {alertas.map((a,i) => <div key={i} style={{ fontSize:12, marginBottom:3 }}>{a}</div>)}
        </div>
      )}

      {/* Observación */}
      <div className="ev-campo">
        <div className="ev-label">Observación del supervisor</div>
        <textarea className="ev-input" rows={3}
          value={observacion} onChange={e => setObservacion(e.target.value)}
          placeholder="Describí los puntos a reforzar o aspectos destacados..." />
      </div>

      {/* Fecha re-evaluación */}
      {nPrevias >= 1 && (
        <div className="ev-campo">
          <div className="ev-label">Resultado de la evaluación</div>
          <div className="ev-opts">
            <button type="button" className={"ev-opt verde" + (decision === "apto" ? " sel" : "")} onClick={() => setDecision("apto")}><i />Apto</button>
            <button type="button" className={"ev-opt rojo" + (decision === "no_apto" ? " sel" : "")} onClick={() => setDecision("no_apto")}><i />No apto</button>
            {nPrevias === 1 && <button type="button" className={"ev-opt amarillo" + (decision === "otra" ? " sel" : "")} onClick={() => setDecision("otra")}><i />Otra evaluación</button>}
          </div>
          {nPrevias >= 2 && <div className="ev-nota">Esta es la evaluación final: corresponde definir Apto o No apto.</div>}
        </div>
      )}

      {pideFecha && (
        <div className="ev-campo">
          <div className="ev-label">{nPrevias === 0 ? "Fecha de re-evaluación sugerida" : "Fecha de la próxima evaluación (opcional)"}</div>
          <input type="date" className="input ev-input" value={fechaRevaluacion} min={hoyEv} max={finPlazo || undefined} onChange={e => setFechaRevaluacion(e.target.value)} />
          {finPlazo && <div className="ev-nota">Límite: {finPlazo.split("-").reverse().join("/")} (fin del plazo de 60 días)</div>}
        </div>
      )}

      <div style={{ display:"flex", gap:8 }}>
        {loadingEvals ? (
          <button className="btn" style={{ flex:1 }} disabled>Cargando...</button>
        ) : (
          <button className="btn ev-guardar" style={{ flex:1 }} onClick={guardar} disabled={saving}>
            {saving ? "Guardando..." : finaliza ? "Finalizar evaluación" : "Guardar evaluación"}
          </button>
        )}
      </div>

      </div>
      )}

    </div>
  );
}

function AyudantesCapacitacion({ data, onSave, showToast, soloLectura, sesion, modoRuta }) {

  const KEYS_NEW = ["generalidades","registro","gestion","ventas","oro","bizagi","internos"];

  const emoji = (v) => v==="autonomo"||v==="cumple"?"🟢":v==="supervision"||v==="refuerzo"?"🟡":v==="no_capacitado"||v==="no_cumple"?"🔴":"⚪";

  const completados = (data.ayudantes||[]).filter(a => a.evaluacionCompleta);
  const bajasRenuncia = completados.filter(a => String(a.completadoPor||"").startsWith("Baja por renuncia"));
  const evaluacionesCompletadas = completados.filter(a => !String(a.completadoPor||"").startsWith("Baja por renuncia"));
  const [nombre, setNombre] = useState("");
  const [fechaIngreso, setFechaIngreso] = useState(todayISO());
  const [saving, setSaving] = useState(false);
  const [abierto, setAbierto] = useState(false);
  const [ayudanteEval, setAyudanteEval] = React.useState(null);
  const [cierreModal, setCierreModal] = React.useState(null);
  const [cierreObs, setCierreObs] = React.useState({});
  const [ayudanteBaja, setAyudanteBaja] = React.useState(null);
  const [observacionBaja, setObservacionBaja] = React.useState("");

  const hoy = todayISO();

  // Solo mostrar en Mi Ruta los activos (completados no se muestran a supervisor)
  const ayudantes = soloLectura && !sesion?.admin ? activos : activos;

  const agregar = async () => {
    if (!nombre.trim()) return;
    setSaving(true);
    try {
      const nuevo = { id: uid(), nombre: nombre.trim(), fechaIngreso, evaluacionCompleta: false, creadoEn: hoy };
      await onSave({ ...data, ayudantes: [...(data.ayudantes||[]), nuevo] });
      showToast("Ayudante agregado.");
      setNombre(""); setFechaIngreso(todayISO());
    } finally { setSaving(false); }
  };

  const completar = async (ay) => {
    const completadoPor = sesion?.nombre || "Admin";
    const act = (data.ayudantes||[]).map(a => a.id === ay.id ? { ...a, evaluacionCompleta: true, fechaCompletado: hoy, completadoPor } : a);
    await onSave({ ...data, ayudantes: act });
    showToast("Evaluación completada.");
  };

  const darBajaRenuncia = async (ay) => {
    const registradoPor = sesion?.nombre || "Admin";
    const act = (data.ayudantes||[]).map(a => a.id === ay.id ? {
      ...a,
      evaluacionCompleta:true,
      fechaCompletado:hoy,
      completadoPor:`Baja por renuncia · ${registradoPor}${observacionBaja.trim() ? " || "+observacionBaja.trim() : ""}`,
    } : a);
    await onSave({ ...data, ayudantes:act });
    if (fichaAbierta?.id === ay.id) setFichaAbierta(null);
    setAyudanteBaja(null);
    setObservacionBaja("");
    showToast(`${ay.nombre} fue dado de baja por renuncia.`);
  };

  const revertir = async (ay) => {
    const act = (data.ayudantes||[]).map(a => a.id === ay.id ? { ...a, evaluacionCompleta: false, fechaCompletado: null, completadoPor: null } : a);
    await onSave({ ...data, ayudantes: act });
    showToast("Evaluación revertida.");
  };

  const colorEstado = (dias) => dias >= 55 ? "var(--alert)" : dias >= 45 ? "#b37700" : "var(--done)";
  const emojiEstado = (dias) => dias >= 55 ? "🔴" : dias >= 45 ? "🟡" : "🟢";

  // ---- MODO MI RUTA — cards individuales, sin completados ----
  if (modoRuta) {

    return (

        <div className="mr-ay-grid">
          {activos.map(ay => {
            const diasTransc = diasCorridos(ay.fechaIngreso, hoy);
            const fechaVence = sumarDiasCorridos(ay.fechaIngreso, 60);
            const diasRestantes = 60 - diasTransc;
            const cls = diasTransc >= 55 ? "int" : diasTransc >= 45 ? "seg" : "ok";
            return (
              <div key={ay.id} className={"mr-ay-card " + cls}>
                <h4>{ay.nombre}</h4>
                <span className="mr-pill">{diasRestantes > 0 ? "⏳ Quedan " + diasRestantes + "d" : "Vencido"}</span>

            </div>
            <textarea className="input" rows={2} style={{ width:"100%", resize:"vertical", fontSize:12 }}

                disabled={cierreObs.apto === undefined}
                onClick={async () => {
                  const supervisor = sesion?.supervisor || sesion?.nombre || "";
                  await supaPatch("ayudantes", cierreModal.id, {
                    evaluacion_completa: true,
                    fecha_completado: hoy,
                    completado_por: supervisor,
                    observacion_cierre: (cierreObs.apto ? "APTO" : "NO APTO") + (cierreObs.obs ? " — " + cierreObs.obs : ""),
                  });
                  onSave(data.ayudantes.map(a => a.id === cierreModal.id ? { ...a, evaluacionCompleta: true, fechaCompletado: hoy, completadoPor: supervisor } : a), "ayudantes");
                  setCierreModal(null);
                  setCierreObs("");
                  showToast(cierreObs.apto ? "✅ Ayudante aprobado" : "❌ Ayudante no aprobado");
                }}>
                Confirmar y cerrar
              </button>
            </div>
          </div>
        )}

        {ayudanteEval && (
          <EvaluacionAyudante
            ayudante={ayudanteEval}
            supervisor={sesion?.supervisor || sesion?.nombre || ""}
            onClose={() => setAyudanteEval(null)}
            showToast={showToast}
            onSave={onSave}
            data={data}
          />
        )}
      </div>
    );
  }

  // ---- MODO PANEL (soloLectura) — card KPI clickeable ----
  if (soloLectura) {
    const amarillo = activos.filter(a => { const d = diasCorridos(a.fechaIngreso, hoy); return d >= 45 && d < 55; });
    const rojo = activos.filter(a => diasCorridos(a.fechaIngreso, hoy) >= 55);

            <div style={{ display:"grid", gridTemplateColumns:"repeat(2, 1fr)", gap:8 }}>

                    <div style={{ display:"flex", alignItems:"center", gap:5, marginBottom:4 }}>
                      <span>{emojiEstado(diasTransc)}</span>
                      <span style={{ fontWeight:700, fontSize:12 }}>{ay.nombre}</span>
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, marginBottom:2 }}>
                      <span className="dim">Ingreso: <b>{ay.fechaIngreso.split("-").reverse().join("/")}</b></span>
                      <span className="dim">Cap.: <b style={{ color:colorEstado(diasTransc) }}>{diasTransc}d</b></span>
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:11 }}>
                      <span className="dim">Vence: <b>{fechaVence.split("-").reverse().join("/")}</b></span>
                      {diasRestantes > 0
                        ? <span className="dim">Rest.: <b style={{ color:colorEstado(diasTransc) }}>{diasRestantes}d</b></span>
                        : <span style={{ color:"var(--alert)", fontWeight:700, fontSize:11 }}>Vencido</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    );
  }

  // ---- MODO ADMINISTRACIÓN (soloLectura=false) ----
  const [mostrarAgregar, setMostrarAgregar] = React.useState(false);

  const [evalsPorAyudante, setEvalsPorAyudante] = React.useState({});

  React.useEffect(() => {
    fetch(`${SUPABASE_URL}/rest/v1/evaluaciones_ayudantes?select=*`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    }).then(r => r.json()).then(data => {
      const map = {};
      (data||[]).forEach(e => {
        const ev = { id: e.id, fecha: e.fecha, supervisor: e.supervisor, modulos: e.modulos, observacion: e.observacion, fechaRevaluacion: e.fecha_revaluacion };
        if (!map[e.ayudante_id]) map[e.ayudante_id] = [];
        map[e.ayudante_id].push(ev);

      setEvalsPorAyudante(map);

  return (

          <label className="field" style={{ flex:1, marginBottom:0 }}>

                    {(() => {

                      const ultima = evals.sort((a,b) => b.fecha.localeCompare(a.fecha))[0];

              const KEYS = getKEYS(ultima);
                      const emoji = (v) => v==="autonomo"||v==="cumple"?"🟢":v==="supervision"||v==="refuerzo"?"🟡":v==="no_capacitado"||v==="no_cumple"?"🔴":"⚪";

                  </div>
                  <button className="btn small" style={{ borderColor:"var(--alert)", color:"var(--alert)", flexShrink:0 }}
                    onClick={() => revertir(ay)}>

      )}

  );
}

/* ---- Dashboard ---- */
function calcScore(v, codigos, pruebasRealizadas) {
  // Desempeño del encargado 25%
  const desFields = v.personal === "ayudante"
    ? [v.evalAyudante?.atencion, v.evalAyudante?.orden, v.evalAyudante?.apoyo].map(x => x === "bueno" ? 1 : (x === "amejorar" || x === "regular") ? 0.5 : x === "deficiente" ? 0 : null).filter(x => x !== null)
    : [
    v.eval_atencion === "bueno" ? 1 : v.eval_atencion === "regular" ? 0.5 : v.eval_atencion === "deficiente" ? 0 : null,
    v.eval_impulso === "bueno" ? 1 : v.eval_impulso === "regular" ? 0.5 : v.eval_impulso === "deficiente" ? 0 : null,
    v.eval_actitud === "bueno" ? 1 : v.eval_actitud === "regular" ? 0.5 : v.eval_actitud === "deficiente" ? 0 : null,
    v.eval_apariencia === "bueno" ? 1 : v.eval_apariencia === "regular" ? 0.5 : v.eval_apariencia === "deficiente" ? 0 : null,
  ].filter(x => x !== null);
  const scoreDes = desFields.length > 0 ? desFields.reduce((a,b) => a+b,0) / desFields.length : null;

  // Riesgo y Operativa 25%
  const opFields = [
    v.arqueoCaja === "Si" ? 1 : v.arqueoCaja === "No" ? 0 : null,
    v.condicionesLocal === "Si" ? 1 : v.condicionesLocal === "No" ? 0 : null,
    v.depositoOrdenado === "Si" ? 1 : v.depositoOrdenado === "No" ? 0 : null,
  ].filter(x => x !== null);
  const scoreOp = opFields.length > 0 ? opFields.reduce((a,b) => a+b,0) / opFields.length : null;

  // Gestión del negocio 25%
  const gestionFields = [
    v.bajaRotacionExhibidos === "Si" ? 1 : v.bajaRotacionExhibidos === "No" ? 0 : null,
    v.promocionesVisibles === "Si" ? 1 : v.promocionesVisibles === "No" ? 0 : null,
    v.comodidadEspacio === "Si" ? 1 : v.comodidadEspacio === "No" ? 0 : null,
  ].filter(x => x !== null);
  const scoreGestion = gestionFields.length > 0 ? gestionFields.reduce((a,b) => a+b,0) / gestionFields.length : null;

  // Regularización de desvíos anteriores 10%. Solo cuenta si fue completado.
  const scoreRegularizacion = v.regularizacionDesvios === "todos" ? 1
    : v.regularizacionDesvios === "parcialmente" ? 0.5
    : v.regularizacionDesvios === "no" ? 0 : null;

  // Prueba técnica 15%: funcionan / efectivamente probados en esta visita.
  const pruebas = (pruebasRealizadas||[]).filter(p =>
    p.localId === v.localId && (p.fechaProbado||"").slice(0,10) === (v.fecha||"").slice(0,10)
  );
  const funcionan = pruebas.filter(p => p.resultado === "Funciona").length;
  const pruebaScore = pruebas.length > 0 ? funcionan / pruebas.length : null;

  // Ponderado
  let total = 0, weight = 0;
  if (scoreOp !== null) { total += scoreOp * 0.25; weight += 0.25; }
  if (scoreGestion !== null) { total += scoreGestion * 0.25; weight += 0.25; }
  if (scoreDes !== null) { total += scoreDes * 0.25; weight += 0.25; }
  if (scoreRegularizacion !== null) { total += scoreRegularizacion * 0.10; weight += 0.10; }
  if (pruebaScore !== null) { total += pruebaScore * 0.15; weight += 0.15; }
  return weight > 0 ? Math.round((total / weight) * 100) : null;
}

function getTendenciaVisita(visita, visitas, codigos, pruebasRealizadas) {
  if (!visita?.id || visita.borrador) return null;
  const ordenadas = (visitas||[])
    .filter(v => v.localId === visita.localId && !v.borrador)
    .sort((a,b) => {
      const fa = (a.fecha||"") + "|" + (a.horaLlegada||"") + "|" + (a.id||"");
      const fb = (b.fecha||"") + "|" + (b.horaLlegada||"") + "|" + (b.id||"");
      return fa.localeCompare(fb);
    });
  const indice = ordenadas.findIndex(v => v.id === visita.id);
  if (indice <= 0) return null;

  const actual = calcScore(visita, codigos, pruebasRealizadas);
  const anterior = calcScore(ordenadas[indice - 1], codigos, pruebasRealizadas);
  if (actual === null || anterior === null) return null;

  const diferencia = actual - anterior;
  if (diferencia >= 5) return { tipo:"mejoro", label:"🟢 Mejoró", diferencia, color:"var(--done)", fondo:"#f0faf5", detalle:"Aumentó claramente respecto a la visita anterior." };
  if (diferencia <= -5) return { tipo:"agravo", label:"🔴 Se agravó", diferencia, color:"var(--alert)", fondo:"#fdf2f2", detalle:"Aparecieron nuevos desvíos o se agravaron situaciones que ya estaban pendientes." };
  if (actual >= 90) return { tipo:"bien", label:"🟢 Se mantiene bien", diferencia, color:"var(--done)", fondo:"#f0faf5", detalle:"El local continúa en buen estado." };
  return { tipo:"desvios", label:"🟡 Se mantiene con desvíos", diferencia, color:"#8A6700", fondo:"#fffbea", detalle:"Continúa con problemas similares a la visita anterior." };
}

function TendenciaBadge({ visita, data, compacta=false }) {
  const tendencia = getTendenciaVisita(visita, data.visitas, data.codigos, data.pruebasRealizadas);
  if (!tendencia) return null;
  const signo = tendencia.diferencia > 0 ? "+" : "";
  return (
    <span title={`${tendencia.detalle} Variación: ${signo}${tendencia.diferencia} puntos.`}
      style={{ display:"inline-flex", alignItems:"center", whiteSpace:"nowrap", fontSize:compacta?9.5:11, fontWeight:700, color:tendencia.color, background:tendencia.fondo, border:`1px solid ${tendencia.color}`, borderRadius:10, padding:compacta?"1px 5px":"2px 8px" }}>
      {tendencia.label} {signo}{tendencia.diferencia}
    </span>
  );
}

function TendenciaRuta({ visita, data }) {
  const tendencia = getTendenciaVisita(visita, data.visitas, data.codigos, data.pruebasRealizadas);
  if (!tendencia) return null;
  const flecha = tendencia.tipo === "mejoro" ? "↑" : tendencia.tipo === "agravo" ? "↓" : "→";
  const color = tendencia.color;
  const estado = tendencia.label.replace(/^[^ ]+ /, "");
  const signo = tendencia.diferencia > 0 ? "+" : "";
  return (
    <div className="tendencia-ruta"
      title={`${estado}. ${tendencia.detalle} Variación: ${signo}${tendencia.diferencia} puntos.`}
      aria-label={`Tendencia: ${estado}`}
      style={{ color }}>
      <span>{estado}</span>
      <strong>{flecha}</strong>
    </div>
  );
}

function contarArticulosAntiguosLocal(articulos, localId) {
  const localNum = String(localId||"").replace("local-fixed-","").replace(/^0+/,"");
  if (!localNum) return 0;
  return (articulos||[]).filter(a => {
    const articuloNum = String(a.localId||a.local_id||a.origen||"").replace("local-fixed-","").replace(/^0+/,"");
    return articuloNum === localNum;
  }).length;
}

function ArticulosAntiguosBadge({ visita, visitas }) {
  if (visita?.cantidadArticulosAntiguos === null || visita?.cantidadArticulosAntiguos === undefined) return null;
  const anteriores = (visitas||[])
    .filter(v => v.localId === visita.localId && !v.borrador && v.id !== visita.id && v.cantidadArticulosAntiguos !== null && v.cantidadArticulosAntiguos !== undefined)
    .filter(v => ((v.fecha||"") + "|" + (v.horaLlegada||"")) < ((visita.fecha||"") + "|" + (visita.horaLlegada||"")))
    .sort((a,b) => ((b.fecha||"") + "|" + (b.horaLlegada||"")).localeCompare((a.fecha||"") + "|" + (a.horaLlegada||"")));
  const anterior = anteriores[0];
  const diferencia = anterior ? visita.cantidadArticulosAntiguos - anterior.cantidadArticulosAntiguos : null;
  const color = diferencia === null || diferencia === 0 ? "#8A6700" : diferencia < 0 ? "var(--done)" : "var(--alert)";
  const fondo = diferencia === null || diferencia === 0 ? "#fffbea" : diferencia < 0 ? "#f0faf5" : "#fdf2f2";
  const variacion = diferencia === null ? "Valor base" : diferencia < 0 ? `↓ ${Math.abs(diferencia)}` : diferencia > 0 ? `↑ ${diferencia}` : "Sin cambios";
  return (
    <span title={diferencia === null ? "Primer registro disponible para este local." : "Variación respecto a la visita anterior."}
      style={{ display:"inline-flex", alignItems:"center", fontSize:11, fontWeight:700, color, background:fondo, border:`1px solid ${color}`, borderRadius:10, padding:"2px 8px", marginBottom:8 }}>
      Artículos antiguos: {visita.cantidadArticulosAntiguos} · {variacion}
    </span>
  );
}

function Dashboard({ data, onSave, showToast, sesion, soloCompetencia }) {
  const { locales, visitas, tareas, ayudantes, analisisCompetencia } = data;
  const filtroSup = "todos";
  const [mesFiltro, setMesFiltro] = useState(() => todayISO().slice(0,7));
  const [seccionActiva, setSeccionActiva] = useState(soloCompetencia ? "competencia" : null);
  const [compExpandida, setCompExpandida] = useState(null);
  const [cargandoComp, setCargandoComp] = useState(false);
  const [verResumenAnio, setVerResumenAnio] = useState(false);
  const quitarInteres = async (c) => {
    if (!window.confirm(`¿Quitar solo la tasa de interés (${c.tasaInteres}%) del análisis de "${c.nombre}"?`)) return;
    try {
      await supaPatchVerificado("analisis_competencia", c.id, { tasa_interes: null });
      onSave({ ...data, analisisCompetencia: (data.analisisCompetencia||[]).map(x => x.id === c.id ? { ...x, tasaInteres: null } : x) });
      showToast("Tasa de interés quitada");
    } catch (e) { showToast("No se pudo quitar. Volvé a intentar."); }
  };
  const quitarCompetencia = async (c) => {
    if (!window.confirm(`¿Quitar el análisis de "${c.nombre}" (${c.fecha})? Esta acción no se puede deshacer.`)) return;
    try {
      await supaRemoveVerificado("analisis_competencia", c.id);
      onSave({ ...data, analisisCompetencia: (data.analisisCompetencia||[]).filter(x => x.id !== c.id) });
      setCompExpandida(null);
      showToast("Análisis quitado");
    } catch (e) { showToast("No se pudo quitar. Volvé a intentar."); }
  };
  const [detallePanel, setDetallePanel] = useState(null);
  const [filtroEstado, setFiltroEstado] = useState(null);
  const [openFranja, setOpenFranja] = useState(null);
  const [palabraAbierta, setPalabraAbierta] = useState(null);
  const [openAyFranja, setOpenAyFranja] = useState(null);
  const [historialRankingLocal, setHistorialRankingLocal] = useState(null);
  const [localPruebasAbierto, setLocalPruebasAbierto] = useState(null);

  const mesesDisponibles = useMemo(() => {
    const set = new Set(visitas.map((v) => v.fecha?.slice(0,7)).filter(Boolean));
    return [...set].sort().reverse();
  }, [visitas]);

  const nombreMes = (ym) => {
    if (!ym) return "Todos";
    const [y,m] = ym.split("-");
    return ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(m)-1]+" "+y;
  };

  const mesAnterior = useMemo(() => {
    if (!mesFiltro) return null;
    const [y,m] = mesFiltro.split("-").map(Number);
    const d = new Date(y, m-2, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }, [mesFiltro]);

  const visitasFiltradas = useMemo(() => visitas.filter(v => !v.borrador && (!mesFiltro || v.fecha?.startsWith(mesFiltro))), [visitas, mesFiltro]);
  const visitasAnt = useMemo(() => visitas.filter(v => !v.borrador && mesAnterior && v.fecha?.startsWith(mesAnterior)), [visitas, mesAnterior]);

  const localName = (id) => {
    const l = locales.find(l => l.id === id);
    if (!l) return id;
    const parts = l.nombre.split(" - ");
    return "Suc. " + parseInt(parts[0]) + (parts[1] ? " - " + parts.slice(1).join(" - ") : "");
  };

  // KPIs
  const totalVisitas = visitasFiltradas.length;
  const totalVisitasAnt = visitasAnt.length;
  const tareasPend = (tareas||[]).filter(t => !t.hecha && !t.noCumplida);
  const tareasNoCumplidas = (tareas||[]).filter(t => !t.hecha && t.noCumplida);
  const tareasHechas = (tareas||[]).filter(t => t.hecha);
  const tareasPendAnt = tareasPend.length; // no hay histórico de tareas por mes
  const desvios = visitasFiltradas.filter(v => v.desviosOperativos === "Si").length;
  const desviosAnt = visitasAnt.filter(v => v.desviosOperativos === "Si").length;
  const codigos = data.codigos||[];
  const pruebasRealizadas = data.pruebasRealizadas||[];
  const totalCod = codigos.length;
  const probados = pruebasRealizadas.filter(p => !mesFiltro || (p.fechaProbado||"").startsWith(mesFiltro)).length;
  const pctPrueba = totalCod > 0 ? Math.round((probados/totalCod)*100) : null;
  const probadosAnt = pruebasRealizadas.filter(p => mesAnterior && (p.fechaProbado||"").startsWith(mesAnterior)).length;
  const pctPruebaAnt = totalCod > 0 ? Math.round((probadosAnt/totalCod)*100) : null;
  const capacitaciones = visitasFiltradas.filter(v => v.capacitacion === "si").length;
  const capacitacionesAnt = visitasAnt.filter(v => v.capacitacion === "si").length;
  const resumenInfra = useMemo(() => resumirInfraestructura(visitas), [visitas]);
  const intervenciones = resumenInfra.pendientes.filter(c => estadoInfraestructura(c.visita) === "intervencion").length;
  const ayudantesActivos = (ayudantes||[]).filter(a => !a.evaluacionCompleta);

  const vsAnt = (act, ant) => {
    if (ant === 0 || ant === null) return null;
    const pct = Math.round(((act - ant) / ant) * 100);
    const color = pct > 0 ? "var(--done)" : pct < 0 ? "var(--alert)" : "#6B7268";
    const arrow = pct > 0 ? "▲" : pct < 0 ? "▼" : "—";
    return <span style={{ fontSize:10, color, fontWeight:700 }}>{arrow} {Math.abs(pct)}% vs. ant.</span>;
  };

  // Calcular % y casos para cada campo
  const calcPct = (campo, valOk, arr) => {
    const resp = arr.filter(v => v[campo]);
    const ok = resp.filter(v => v[campo] === valOk);
    return { pct: resp.length > 0 ? Math.round(ok.length/resp.length*100) : null, ok: ok.length, total: resp.length };
  };

  // Operativa
  const opArqueo = calcPct("arqueoCaja","Si",visitasFiltradas);
  const opCondiciones = calcPct("condicionesLocal","Si",visitasFiltradas);
  const opDeposito = calcPct("depositoOrdenado","Si",visitasFiltradas);

  // Comercial
  const comBajaRot = calcPct("bajaRotacionExhibidos","Si",visitasFiltradas);
  const comPrecios = calcPct("promocionesVisibles","Si",visitasFiltradas);
  const comComodidad = calcPct("comodidadEspacio","Si",visitasFiltradas);

  // Desempeño
  const calcDes = (campo) => {
    const resp = visitasFiltradas.filter(v => v[campo]);
    const b = resp.filter(v => v[campo]==="bueno").length;
    const r = resp.filter(v => v[campo]==="regular").length;
    const d = resp.filter(v => v[campo]==="deficiente").length;
    const label = b >= r && b >= d ? "Bueno" : r >= d ? "Regular" : "Deficiente";
    const color = label==="Bueno"?"var(--done)":label==="Regular"?"#b37700":"var(--alert)";

                          <td style={{ padding:"4px 8px", whiteSpace:"nowrap", fontWeight:600, fontFamily:"monospace" }}>{a.codigo}</td>
                          <td style={{ padding:"4px 8px", maxWidth:280 }}>
                            {desc}
                            {esNuevo && <span style={{ marginLeft:5, fontSize:8.5, fontWeight:700, background:"var(--alert)", color:"#fff", borderRadius:8, padding:"1px 5px" }}>NUEVO</span>}
                          </td>
                          <td style={{ padding:"4px 8px", whiteSpace:"nowrap" }} className="dim">{ubic}</td>
                          <td style={{ padding:"4px 8px", textAlign:"center", whiteSpace:"nowrap", color:"var(--alert)", fontWeight:600 }}>{a.fechaRemate||"-"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table></div></div>
              </div>
            </>
          );
        })()}
      </div>
    );

    if (seccionActiva === "ranking") return (
      <div className="form-page admin-dashboard">
        <button className="btn ghost" style={{ marginBottom:12 }} onClick={volver}>← Volver</button>
        <h2 className="page-title">Ranking de Performance</h2>
        <div className="dash-panel" style={{ marginBottom:12 }}>
          <details className="calculo-ranking">
            <summary>¿Cómo se calcula el puntaje?</summary>
            <div className="calculo-ranking-contenido">
              <div><b>Riesgo y Operativa · 25%</b><span>Caja sin diferencias, orden y limpieza del salón y orden del depósito.</span></div>
              <div><b>Gestión del negocio · 25%</b><span>Exhibición de artículos de baja rotación, precios y promociones visibles, y comodidad del espacio.</span></div>
              <div><b>Desempeño del encargado · 25%</b><span>Atención, impulso de ventas, actitud y apariencia. Bueno vale 100%, regular 50% y deficiente 0%.</span></div>
              <div><b>Regularización de desvíos · 10%</b><span>Todos regularizados: 100%; parcialmente: 50%; no regularizados: 0%.</span></div>
