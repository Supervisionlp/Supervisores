              <div className="calculo-ranking-nota"><b>Infraestructura y seguridad</b><span>No suma ni resta puntos; se muestra por separado como alerta de seguimiento.</span></div>
              <div className="calculo-ranking-rangos">🟢 90–100 Buen estado &nbsp;·&nbsp; 🟡 76–89 Requiere seguimiento &nbsp;·&nbsp; 🔴 Hasta 75 Requiere intervención</div>
            </div>
          </details>
        </div>
        {[
          { emoji:"🟢", label:"BUEN ESTADO (90–100)", list:ranking.filter(x => x.score >= 90), color:"var(--done)", bg:"#f0faf5" },
          { emoji:"🟡", label:"REQUIERE SEGUIMIENTO (76–89)", list:ranking.filter(x => x.score > 75 && x.score < 90), color:"#b37700", bg:"#fffbea" },
          { emoji:"🔴", label:"REQUIERE INTERVENCIÓN (HASTA 75)", list:[...ranking].filter(x => x.score <= 75).reverse().slice(0,4), color:"var(--alert)", bg:"#fdf2f2" },
        ].map(({ emoji, label, list, color, bg }) => (
          <div key={label} className="dash-panel" style={{ borderLeft:`4px solid ${color}`, marginBottom:12 }}>
            <div style={{ fontWeight:700, fontSize:13, color, marginBottom:8 }}>{emoji} {label} — {list.length} Locales</div>
            {list.length === 0 ? <div className="dim small">Sin locales.</div> : (
              <div className="admin-table-container"><div className="admin-table-hint">Deslizá la tabla para ver todas las columnas →</div><div className="admin-table-scroll" tabIndex={0} role="region" aria-label="Tabla de detalle"><table style={{ width:"100%", fontSize:12, borderCollapse:"collapse" }}>
                <thead><tr style={{ borderBottom:"1px solid var(--line)", background:"#e8ede8" }}>
                  <th style={{ padding:"5px 8px", textAlign:"left" }}>Local</th>
                  <th style={{ padding:"5px 8px", textAlign:"left" }}>Supervisor</th>
                  <th style={{ padding:"5px 8px", textAlign:"center" }}>Score</th>
                </tr></thead>
                <tbody>
                  {list.map((x,i) => {
                    const v = ultimaVisitaPorLocal[x.localId];
                    return (
                      <tr key={i} style={{ borderBottom:"1px solid var(--line)", background: i%2===0?"#fff":bg }}>
                        <td onClick={() => setHistorialRankingLocal(x.localId)} style={{ padding:"5px 8px", fontWeight:500, color:"var(--route)", cursor:"pointer", textDecoration:"underline" }}>{localName(x.localId)}</td>
                        <td style={{ padding:"5px 8px" }} className="dim">{v ? (v.supervisor||"").split(" ")[0] : "-"}</td>
                        <td style={{ padding:"5px 8px", textAlign:"center" }}>
                          <span style={{ fontWeight:800, color, background:bg, padding:"2px 8px", borderRadius:10 }}>{x.score} pts</span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table></div></div>
            )}
          </div>
        ))}
      </div>
    );

    if (seccionActiva === "tareas") return (
      <div className="form-page admin-dashboard">
        <button className="btn ghost" style={{ marginBottom:12 }} onClick={volver}>← Volver</button>
        <h2 className="page-title">Estado de tareas</h2>
        {[
          { titulo:"Tareas pendientes", filas:tareasPend, color:"#b37700", vacio:"No hay tareas pendientes." },
          { titulo:"✓ Tareas cumplidas", filas:tareasHechas, color:"var(--done)", vacio:"No hay tareas cumplidas." },
          { titulo:"✕ Tareas no cumplidas", filas:tareasNoCumplidas, color:"var(--alert)", vacio:"No hay tareas no cumplidas." },
        ].map(({titulo, filas, color, vacio}) => (
          <div key={titulo} className="dash-panel" style={{ marginBottom:14 }}>
            <div style={{ fontWeight:700, fontSize:14, color, marginBottom:12 }}>{titulo} ({filas.length})</div>
            {filas.length === 0 ? <div className="dim" style={{ fontSize:12 }}>{vacio}</div> : (
              <div className="admin-table-container"><div className="admin-table-hint">Deslizá la tabla para ver todas las columnas →</div><div className="admin-table-scroll" tabIndex={0} role="region" aria-label={titulo}>
                <table style={{ width:"100%", fontSize:12, borderCollapse:"collapse" }}>
                  <thead><tr style={{ borderBottom:"2px solid var(--line)", background:"#e8ede8" }}>
                    <th style={{ padding:"5px 8px", textAlign:"left" }}>Sucursal</th>
                    <th style={{ padding:"5px 8px", textAlign:"left" }}>Tarea</th>
                    <th style={{ padding:"5px 8px", textAlign:"left" }}>Fecha de registro</th>
                    <th style={{ padding:"5px 8px", textAlign:"left" }}>Fecha de revisión</th>
                  </tr></thead>
                  <tbody>{filas.map((t,i) => (
                    <tr key={t.id} style={{ borderBottom:"1px solid var(--line)", background:i%2===0?"#fff":"#f5f7f5" }}>
                      <td style={{ padding:"5px 8px", fontWeight:500 }}>{localName(t.localId)}</td>
                      <td style={{ padding:"5px 8px", overflowWrap:"anywhere" }}>{t.texto}</td>
                      <td style={{ padding:"5px 8px" }}>{t.fecha ? fmt(t.fecha) : "—"}</td>
                      <td style={{ padding:"5px 8px" }}>{t.fechaRevision || t.fechaCompletada ? fmt((t.fechaRevision || t.fechaCompletada).slice(0,10)) : "—"}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div></div>
            )}
          </div>
        ))}
      </div>
    );

  }
  // ---- DASHBOARD PRINCIPAL ----
  const metrica = (label, d) => {
    const color = d.pct === null ? "var(--dop-muted)" : pctColor(d.pct || 0);
    return (
      <div className="dop-result-metric" key={label} style={{ "--result-color": color }}>
        <div className="dop-result-metric-head">
          <span className="dop-result-metric-name">{label}</span>
          <span className="dop-result-percent">{d.pct !== null ? d.pct + "%" : "—"}</span>
        </div>
        <div className="dop-result-track" aria-hidden="true"><span style={{ width: (d.pct || 0) + "%" }} /></div>
        <div className="dop-result-counts">
          {d.total ? <><span><b>{d.ok}</b> de <b>{d.total}</b> cumplen</span><small>{d.total - d.ok === 0 ? "Todos cumplen" : (d.total - d.ok) + " no cumplen"}</small></> : <span>Sin respuestas registradas</span>}
        </div>
      </div>
    );
  };
  const accion = (texto, sec) => <button type="button" className="btn ghost dop-result-action" onClick={() => setSeccionActiva(sec)}>{texto} →</button>;
  return (
    <div className="form-page admin-dashboard dop dop-testuction">
      <style>{DOP_CSS}</style>
      <header className="dop-header dop-testuction-hero">
        <div>
          <div className="dop-eyebrow">Supervisión y control de locales</div>
          <h2>Resumen ejecutivo</h2>
          <p className="dop-subtitle">Personal, visitas, cumplimiento operativo e inventario</p>
        </div>
        <span className="dop-context">{new Date().toLocaleDateString("es-ES", { day:"2-digit", month:"2-digit", year:"numeric" })}</span>
      </header>

      {ayudantesActivos.length > 0 && (
        <section className="dop-ayudantes">
          <PanelCapacitacionDash ayudantesActivos={ayudantesActivos} />
        </section>
      )}

      <div className="dop-filters">
        <label>Mes
          <select value={mesFiltro} onChange={e => setMesFiltro(e.target.value)}>
            <option value="">Todos</option>
            {mesesDisponibles.map(m => <option key={m} value={m}>{nombreMes(m)}</option>)}
          </select>
        </label>
      </div>

      <div className="dop-testuction-kpis" aria-label="Indicadores del período">
        {[
          ["Visitas realizadas", totalVisitas, "visitas", vsAnt(totalVisitas, totalVisitasAnt)],
          ["Tareas pendientes", tareasPend.length, "tareas", tareasHechas.length + " cumplidas · " + tareasNoCumplidas.length + " no cumplidas"],
          ["Prueba técnica", pctPrueba !== null ? pctPrueba + "%" : "—", "pruebas", vsAnt(pctPrueba, pctPruebaAnt)],
          ["Capacitaciones", capacitaciones, "capacitaciones", vsAnt(capacitaciones, capacitacionesAnt)],
          ["Infraestructura grave", intervenciones, "intervenciones", "Pendientes de todos los meses"],
        ].map(([titulo, valor, sec, extra]) => (
          <button type="button" className="dop-testuction-kpi" key={sec} onClick={() => setSeccionActiva(sec)}>
            <span>{titulo}</span>
            <strong>{valor}</strong>
            {extra && <small>{extra}</small>}
            <small>Ver detalle →</small>
          </button>
        ))}
      </div>

      <section className="dop-section">
        <div className="dop-section-head"><div><h3>Seguimiento de la operación</h3><p>Resumen organizado por tema · {mesFiltro ? nombreMes(mesFiltro) : "Todos los meses"}</p></div></div>
        <div className="dop-complement dop-testuction-grid">
          <div className="dop-encuestas-grid">
            <article className="dop-encuesta-card" style={{ order:1 }}>
              <h4 className="dop-encuesta-head">Ranking de performance</h4>
              <div className="dop-encuesta-body">
                <div className="dop-ranking-compacto">
                  {[["Mejores", rankingMejores, false], ["Peores", rankingPeores, true]].map(([titulo, filas, critico]) => (
                    <div key={titulo}>
                      <div className="dop-result-label">{titulo}</div>
                      {filas.map((x, i) => (
                        <div className={"dop-result-ranking-row" + (critico ? " is-critical" : "")} key={i}>
                          <button type="button" onClick={() => setHistorialRankingLocal(x.localId)}>{localName(x.localId)}</button>
                          <span className="dop-result-score">{x.score}</span>
                        </div>
                      ))}
                      {!filas.length && <p className="dop-note">Sin locales en este rango.</p>}
                    </div>
                  ))}
                </div>
                <p className="dop-note">🟢 90–100 · 🟡 76–89 · 🔴 hasta 75</p>
                {accion("Ver ranking completo", "ranking")}
              </div>
            </article>
            <article className="dop-encuesta-card" style={{ order:2 }}>
              <h4 className="dop-encuesta-head">Riesgo y operativa</h4>
              <div className="dop-encuesta-body">
                <p className="dop-result-subtitle">Cumplimiento registrado en las visitas.</p>
                {metrica("Caja sin diferencias", opArqueo)}
                {metrica("Condiciones de operación (orden/limpieza)", opCondiciones)}
                {metrica("Depósito ordenado", opDeposito)}
                {accion("Ver detalle por local", "operativa")}
              </div>
            </article>
            <article className="dop-encuesta-card" style={{ order:3 }}>
              <h4 className="dop-encuesta-head">Gestión del negocio</h4>
              <div className="dop-encuesta-body">
                <p className="dop-result-subtitle">Cumplimiento registrado en las visitas.</p>
                {metrica("Baja rotación bien exhibidos", comBajaRot)}
                {metrica("Precios y promos actualizados", comPrecios)}
                {metrica("Comodidad y espacio de atención", comComodidad)}
                {accion("Ver detalle por local", "comercial")}
              </div>
            </article>
          </div>

          <article className="dop-encuesta-card" style={{ order:4 }}>
            <h4 className="dop-encuesta-head">Desempeño observado en visita</h4>
            <div className="dop-encuesta-body">
              <p className="dop-result-subtitle">Evaluación del personal durante las visitas.</p>
              {[["Atención al cliente", desAtencion], ["Impulso de empeños y ventas", desImpulso], ["Actitud y compromiso", desActitud], ["Apariencia y uniforme", desApariencia]].map(([label, d]) => (
                <div className="dop-testuction-row" key={label}>
                  <span>{label}</span>
                  <b>{d.pct !== null ? d.pct + "%" : "—"}</b>
                  {d.label && <small style={{ color: d.color }}>{d.label}</small>}
                </div>
              ))}
              {(() => { const si = visitasFiltradas.filter(v => v.capacitacion === "si").length; return si > 0 ? <p className="dop-note">Capacitación/refuerzo: {si} ({Math.round(si / visitasFiltradas.length * 100)}%)</p> : null; })()}
              {accion("Ver visitas por local", "desempeno")}
            </div>
          </article>

          <article className="dop-encuesta-card" style={{ order:5 }}>
            <h4 className="dop-encuesta-head">Infraestructura y seguridad</h4>
            <div className="dop-encuesta-body">
              <div className="dop-compact-summary"><strong>{intervencionList.length}</strong><span>locales con problemas graves</span></div>
              <div className="dop-compact-status">
                {[["Sin pendientes", sinNov, "var(--dop-good)"], ["En seguimiento", seguimiento, "var(--dop-warn)"], ["Problemas graves", intervencionList, "var(--dop-bad)"]].map(([t, list, c]) => (
                  <div key={t}><span>{t}</span><b style={{ color: c }}>{list.length}</b></div>
                ))}
              </div>
              <p className="dop-note">Estado actual · todos los meses · {totalLocalesInfra} locales con visitas.</p>
              {accion("Ver problemas y locales", "infraestructura")}
            </div>
          </article>

          <article className="dop-encuesta-card" style={{ order:6 }}>
            <h4 className="dop-encuesta-head">Plan de acción y hallazgos</h4>
            <div className="dop-encuesta-body">
              <div className="dop-testuction-row"><span>Tareas pendientes</span><b>{tareasPend.length}</b></div>
              <div className="dop-testuction-row"><span>Cumplidas</span><b>{tareasHechas.length}</b></div>
              <div className="dop-testuction-row"><span>No cumplidas</span><b>{tareasNoCumplidas.length}</b></div>
              {planes.length > 0 && <p className="dop-result-subtitle">Tareas acordadas con el encargado:</p>}
              {planes.map((v, i) => <p className="dop-note" key={"p" + i}>{v.compromiso}</p>)}
              {hallazgos.length > 0 && <p className="dop-result-subtitle">Hallazgos relevantes:</p>}
              {hallazgos.map((v, i) => <p className="dop-note" key={"h" + i}><b>{localName(v.localId)}</b> · {v.observacionesGenerales}</p>)}
              {accion("Ver tareas y compromisos", "tareas")}
            </div>
          </article>

          <article className="dop-encuesta-card" style={{ order:7 }}>
            <h4 className="dop-encuesta-head">Desvíos del último inventario</h4>
            <div className="dop-encuesta-body">
              {invData ? (
                <>
                  <div className="dop-compact-summary"><strong>{invData.totalDesv}</strong><span>artículos con desvío</span></div>
                  {Object.entries(invData.desv).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
                    <div className="dop-testuction-row" key={k}><span>{k}</span><b>{v} ({Math.round(v / invData.totalDesv * 100)}%)</b></div>
                  ))}
                </>
              ) : <p className="dop-note">Sin datos de inventario.</p>}
            </div>
          </article>

          <article className="dop-encuesta-card" style={{ order:8 }}>
            <h4 className="dop-encuesta-head">Regularización de desvíos</h4>
            <div className="dop-encuesta-body">
              {regTotal > 0 ? (
                <>
                  <div className="dop-compact-summary"><strong>{regPct}%</strong><span>{regPct >= 80 ? "Bien" : regPct >= 50 ? "Parcialmente" : "Bajo"}</span></div>
                  {[["Todos regularizados", regTodos], ["Parcialmente", regParc], ["Sin regularizar", regNo]].map(([l, n]) => (
                    <div className="dop-testuction-row" key={l}><span>{l}</span><b>{n} ({Math.round(n / regTotal * 100)}%)</b></div>
                  ))}
                </>
              ) : <p className="dop-note">Sin datos de regularización.</p>}
            </div>
          </article>

          {artViejos.length > 0 && (() => {
            const mesVer = mesFiltro || todayISO().slice(0,7);
            const mesHoy = todayISO().slice(0,7);
            const [anio, mes] = mesVer.split("-").map(Number);
            const mesAntKey = (mes === 1 ? (anio-1)+"-12" : anio+"-"+String(mes-1).padStart(2,"0"));
            const snapActual = data.stockSnapshots?.[mesVer];
            const snapAnt = data.stockSnapshots?.[mesAntKey];
            if (mesVer !== mesHoy && !snapActual) return null;
            const cantActual = snapActual ? snapActual.length : artViejos.length;
            const cantAnt = snapAnt ? snapAnt.length : null;
            const ordenados = [...(snapActual || artViejos)].sort((a,b) => (a.fechaRemate||"").localeCompare(b.fechaRemate||""));
            return (
              <article className="dop-encuesta-card" style={{ order:9 }}>
                <h4 className="dop-encuesta-head">Stock crítico +10 meses</h4>
                <div className="dop-encuesta-body">
                  <div className="dop-stock-months">
                    <div><span>Mes anterior</span><b>{cantAnt !== null ? cantAnt : "—"}</b></div>
                    <div><span>Actual</span><strong>{cantActual}</strong></div>
                    <div><span>Diferencia</span><b>{cantAnt !== null ? (cantActual > cantAnt ? "+" : "") + (cantActual - cantAnt) : "—"}</b></div>
                  </div>
                  <div className="dop-compact-stock">
                    {ordenados.slice(0, 2).map((a, i) => (
                      <div key={i}><span><b>{a.codigo || "Sin código"}</b><small>{a.descripcion}</small></span><span>{a.fechaRemate || "-"}</span></div>
                    ))}
                  </div>
                  {accion("Ver todos los artículos (" + artViejos.length + ")", "stock")}
                </div>
              </article>
            );
          })()}

        </div>
      </section>
    </div>
  );
}

function CheckItem({ fieldKey, label, conAccion, accionLabel, invertido, checks, acciones, setChecks, setAcciones }) {
  const val = checks[fieldKey] || "";
  const mostrarCampo = conAccion && val === "No";
  return (
    <div className="check-item">
      <div className="check-item-head">
        <span className="check-item-label">{label}</span>
        <div className="yesno-pills">
          {["Si","No"].map((opt) => (
            <button key={opt} type="button"
              className={"pill"+(val===opt?(opt==="No"?" pill-no":" pill-si"):"")}
              onClick={() => setChecks((prev) => ({ ...prev, [fieldKey]: prev[fieldKey]===opt?"":opt }))}>
              {opt === "Si" ? "✔" : "✖"}
            </button>
          ))}
        </div>
      </div>
      {mostrarCampo && (
        <textarea key={fieldKey+"-accion"} className="input" rows={2} style={{ marginTop:6, fontSize:12.5 }}
          placeholder={accionLabel || "Accion correctiva / Plazo"}
          defaultValue={acciones[fieldKey] || ""}
          onBlur={(e) => setAcciones((prev) => ({ ...prev, [fieldKey]: e.target.value }))} />
      )}
    </div>
  );
}

        const visitasDelLocal = data.visitas.filter((x) => x.localId === localId).sort((a,b) => a.fecha < b.fecha ? 1 : -1);
        const ultima = visitasDelLocal[0];
        // Marcar visita última
        if (ultima && v.id === ultima.id) {
          return { ...v, quejasResueltas: quejasResueltasCheck ? true : v.quejasResueltas, infraResuelta: infraResueltaCheck ? true : v.infraResuelta, estadoResuelta: estadoResueltaCheck ? true : v.estadoResuelta, desvioResuelta: desvioResueltaCheck ? true : v.desvioResuelta };

        if (quejasChecks[v.id]) return { ...v, quejasResueltas: true };
        return v;
      });

      }
      if (esBorrador) {

        const sinBorradorAnterior = data.visitas.filter((v) => v.id !== visita.id && !(v.localId === localId && v.supervisor === supervisor.trim() && v.borrador));
        await onSave({ ...data, visitas: [...sinBorradorAnterior, visita], rutas: rutasActualizadas });
        localStorage.removeItem("rec-draft-" + localId);
        onDone(`Borrador guardado para "${selectedLocal.nombre}".`);
      } else {

        await onSave({ ...data, visitas: [...visitasActualizadas.filter((v) => v.id !== visita.id && !(v.localId === localId && v.supervisor === supervisor.trim() && v.borrador)), visita], tareas: [...tareasActualizadas.filter(t => !tareasNuevas.some(n => n.id === t.id)), ...tareasNuevas], codigos: codigosActualizados, rutas: rutasActualizadas });

        localStorage.removeItem("rec-draft-" + localId);
        onDone(`Recorrido a "${selectedLocal.nombre}" guardado correctamente.`);
      }

                  ))}
                </tbody>
              </table>
            ) : (
              <table className="eval-table" style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                <thead>
                  <tr>
                    <th style={{ textAlign:"left", padding:"6px 8px", borderBottom:"2px solid var(--line)", color:"var(--text-sec)", fontWeight:600 }}>Aspecto</th>
                    <th style={{ textAlign:"center", padding:"6px 8px", borderBottom:"2px solid var(--line)", color:"var(--done)", fontWeight:600 }}>🟢 Bueno</th>
                    <th style={{ textAlign:"center", padding:"6px 8px", borderBottom:"2px solid var(--line)", color:"#b37700", fontWeight:600 }}>🟡 A Mejorar</th>
                    <th style={{ textAlign:"center", padding:"6px 8px", borderBottom:"2px solid var(--line)", color:"var(--alert)", fontWeight:600 }}>🔴 Deficiente</th>
                  </tr>
                </thead>
                <tbody>
                  {[
                    { key:"ayudante_atencion", label:"Atención al cliente" },
                    { key:"ayudante_orden", label:"Gestión Comercial del Local", desc:"Impulsa empeños, ventas y rotación de mercaderías." },
                    { key:"ayudante_apoyo", label:"Apoyo al encargado" },
                  ].map(({ key, label }) => (
                    <tr key={key} style={{ borderBottom:"1px solid var(--line)" }}>
                      <td style={{ padding:"8px 8px" }}>{label}</td>
                      {["bueno","amejorar","deficiente"].map((opt) => (
                        <td key={opt} style={{ textAlign:"center", padding:"8px 8px" }}>
                          <button type="button" className={"enc-ev "+opt+(checks[key]===opt?" on":"")}
                            onClick={() => setChecks((prev) => ({ ...prev, [key]: prev[key]===opt ? "" : opt }))}>
                            <i />{({bueno:"Bueno",regular:"Regular",amejorar:"A mejorar",deficiente:"Deficiente"})[opt]}
                          </button>
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
            {/* Capacitación */}
            <div style={{ marginTop:14, borderTop:"1px solid var(--line)", paddingTop:12 }}>
              <div style={{ fontSize:12.5, fontWeight:600, marginBottom:8 }}>¿Se realizó capacitación o refuerzo durante la visita?</div>
              <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                {[["si","✔ Sí","var(--done)"],["no","✖ No","var(--alert)"]].map(([val,label,color]) => (
                  <button key={val} type="button"
                    onClick={() => setChecks(prev => ({ ...prev, capacitacion: prev.capacitacion===val ? "" : val }))}
                    style={{ padding:"7px 18px", borderRadius:20, border:`2px solid ${color}`, background: checks.capacitacion===val ? color : "transparent", color: checks.capacitacion===val ? "#fff" : color, fontWeight:700, fontSize:12, cursor:"pointer", transition:"all .15s" }}>
                    {label}
                  </button>
                ))}
              </div>
              {checks.capacitacion === "si" && (
                <textarea className="input" rows={2} placeholder="Describí brevemente la capacitación realizada..."
                  defaultValue={acciones.detalleCapacitacion||""}
                  onBlur={(e) => setAcciones(prev => ({ ...prev, detalleCapacitacion: e.target.value }))}
                  style={{ marginBottom:0, resize:"vertical" }} />
              )}
            </div>
          </div>

          {/* 5. Infraestructura y seguridad */}
          <div className="panel">
            <div className="seccion-titulo">5. Infraestructura y seguridad</div>
            <div style={{ fontSize:12.5, color:"var(--text-sec)", marginBottom:10 }}>¿Cuál es el estado de la infraestructura y seguridad del local?</div>
            <div className="enc-infra">
              {[
                { val:"sin_novedades", label:"Sin inconvenientes", color:"var(--done)", emoji:"🟢" },
                { val:"seguimiento", label:"Inconveniente menor / requiere seguimiento", color:"var(--pending)", emoji:"🟡" },
                { val:"intervencion", label:"Problemas graves de infraestructura", color:"var(--alert)", emoji:"🔴" }
              ].map(({ val, label, color, emoji }) => (
                <button key={val} type="button"
                  onClick={() => setChecks((prev) => ({ ...prev, estadoLocal: prev.estadoLocal===val?"":val }))}
                  style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 12px", borderRadius:8, border:`2px solid ${checks.estadoLocal===val?color:"var(--line)"}`, background: checks.estadoLocal===val?color+"22":"transparent", cursor:"pointer", textAlign:"left", fontWeight: checks.estadoLocal===val?700:400, color: checks.estadoLocal===val?color:"var(--text)" }}>
                  {emoji} {label}
                </button>
              ))}
            </div>
            {(checks.estadoLocal === "seguimiento" || checks.estadoLocal === "intervencion") && (
              <textarea className="input" rows={2} style={{ marginTop:10, fontSize:12.5 }}
                placeholder="Motivo..."
                defaultValue={infraestructura}
                onBlur={(e) => setInfraestructura(e.target.value)} />
            )}
          </div>




          <div className="panel">
            <div className="seccion-titulo">6. Plan de acción</div>
            <label className="field">
              <span>Tarea acordada con el encargado</span>
              <textarea className="input" rows={3}
                placeholder="Describí la tarea acordada…"
                defaultValue={compromiso}
                onBlur={(e) => setCompromiso(e.target.value)} />
            </label>
          </div>

          <div className="panel">
            <div className="seccion-titulo">7. Observación (opcional)</div>
            <label className="field">
              <span style={{ fontSize:12, color:"var(--text-sec)" }}>Registre cualquier observación relevante que no haya quedado reflejada en las respuestas anteriores.</span>
              <textarea className="input" rows={3} style={{ marginTop:6 }}
                placeholder=""
                defaultValue={acciones.observacionesGenerales||""}
                onBlur={(e) => setAcciones((prev) => ({ ...prev, observacionesGenerales: e.target.value }))} />
            </label>
          </div>
          </div></div>



          {saveError && <div role="alert" style={{ color:"var(--alert)", marginTop:12 }}>{saveError}</div>}
          <div className="enc-footer"><div className="enc-footer-in">
                    <button className="btn primary big" style={{ width:"100%", padding:"14px", fontSize:15, marginTop:8 }} disabled={!supervisor.trim() || saving} onClick={() => submit(false)}>
            {saving ? "Guardando…" : "Guardar recorrido"}
          </button>
          </div></div>
        </>
      )}
    </div>
  );
}



/* ---- Locales ---- */
function Locales({ data, onSave, showToast }) {
  const { locales, visitas, tareas } = data;
  const [selLocal, setSelLocal] = useState(null);

  const local = locales.find((l) => l.id === selLocal);
  const vsLocal = visitas.filter((v) => v.localId === selLocal).sort((a,b) => a.fecha < b.fecha ? 1 : -1);
  const tareasLocal = tareas.filter((t) => t.localId === selLocal);
  const tareasPend = tareasLocal.filter((t) => !t.hecha);
  const tareasHechas = tareasLocal.filter((t) => t.hecha);

  // Quejas e infra de todas las visitas
  const quejas = vsLocal.filter((v) => v.quejasClientes === "Si");
  const infras = vsLocal.filter((v) => !v.borrador && estadoInfraestructura(v) !== "sin_novedades");
  const obsComerciales = vsLocal.filter((v) => v.observacionComercial);

  const numLocalStr = selLocal ? String(parseInt(selLocal.replace("local-fixed-",""))||0) : "";
  const viejosDelLocal = (data.articulosViejos || []).filter((a) => {
    const origen = String(a.origen||a.localId||"").replace("local-fixed-","").replace(/^0+/,"");
    return origen && numLocalStr && origen === numLocalStr;
  });

  if (selLocal && local) {
    return (
      <div className="form-page">
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
          <button className="btn ghost" onClick={() => setSelLocal(null)}>← Volver</button>
          <h2 className="page-title" style={{ margin:0 }}>{local.nombre}</h2>
        </div>

        {tareasPend.length > 0 && (
          <div className="panel" style={{ borderLeft:"4px solid var(--alert)" }}>
            <div className="panel-title" style={{ color:"var(--alert)" }}>Tareas pendientes ({tareasPend.length})</div>
            {tareasPend.map((t) => (
              <div key={t.id} className="det-item">
                <span className="det-dot alert"/>
                <div className="det-info">
                  <div>{t.texto}</div>
                  <div className="mono dim small">desde {fmt(t.fecha)}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Observación del admin para el supervisor */}
        <div className="panel">
          <div className="panel-title">📝 Observación para el supervisor</div>
          <textarea
            key={selLocal}
            defaultValue={data.observacionesLocales?.[selLocal]||""}
            placeholder="El supervisor verá esta nota al abrir una nueva visita de este local..."
            onBlur={async (e) => {
              const texto = e.target.value.trim();
              const actual = data.observacionesLocales?.[selLocal]||"";
              if (texto === actual) return;
              const nuevas = { ...(data.observacionesLocales||{}), [selLocal]: texto };
              const nuevasVistas = { ...(data.observacionesLocalesVistas||{}) };
              if (texto) delete nuevasVistas[selLocal]; // reset vista si se edita
              await onSave({ ...data, observacionesLocales: nuevas, observacionesLocalesVistas: nuevasVistas });
              showToast("Observación guardada");
            }}
            style={{ width:"100%", padding:"8px 10px", borderRadius:8, border:"1.5px solid var(--line)", fontSize:12, resize:"vertical", minHeight:60, boxSizing:"border-box", fontFamily:"inherit" }}
          />
          {data.observacionesLocalesVistas?.[selLocal] && (
            <div style={{ fontSize:11, color:"var(--done)", marginTop:4 }}>✓ Observado</div>
          )}
        </div>

        {tareasHechas.length > 0 && (
          <div className="panel">
            <div className="panel-title">Tareas resueltas ({tareasHechas.length})</div>
            {tareasHechas.map((t) => (
              <div key={t.id} className="det-item">
                <span className="det-dot done"/>
                <div className="det-info">
                  <div style={{ textDecoration:"line-through", color:"#9aa196" }}>{t.texto}</div>
                  <div className="mono dim small">desde {fmt(t.fecha)}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {quejas.length > 0 && (
          <div className="panel" style={{ borderLeft:"4px solid var(--pending)" }}>
            <div className="panel-title" style={{ color:"var(--pending)" }}>Quejas de clientes</div>
            {quejas.map((v) => (
              <div key={v.id} className="det-item">
                <span className={"det-dot " + (v.quejasResueltas ? "done" : "alert")}/>
                <div className="det-info">
                  <div>{v.descripcionQuejas}</div>
                  <div className="mono dim small">{fmt(v.fecha)} · {v.quejasResueltas ? "Resuelta" : "Pendiente"}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {infras.length > 0 && (
          <div className="panel" style={{ borderLeft:"4px solid var(--pending)" }}>
            <div className="panel-title" style={{ color:"var(--pending)" }}>Problemas de infraestructura</div>
            {infras.map((v) => (
              <div key={v.id} className="det-item">
                <span className={"det-dot " + ((v.infraResuelta || v.estadoResuelta) ? "done" : "alert")}/>
                <div className="det-info">
                  <div>{v.infraestructura || v.descripcionProblema}</div>
                  <div className="mono dim small">{fmt(v.fecha)} · {(v.infraResuelta || v.estadoResuelta) ? "Resuelto" : "Pendiente"}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {viejosDelLocal.length > 0 && (
        <div className="panel lp-stock-alerta" style={{ marginBottom:14 }}>
          <div className="panel-title lp-stock-titulo">Artículos con tiempo en stock ({viejosDelLocal.length})</div>
          <ListaArticulosViejos items={viejosDelLocal} />
        </div>
      )}

      {obsComerciales.length > 0 && (
          <div className="panel">
            <div className="panel-title">Observaciones comerciales</div>
            {obsComerciales.map((v) => (
              <div key={v.id} className="det-item">
                <span className="det-dot route"/>
                <div className="det-info">
                  <div>{v.observacionComercial}</div>
                  <div className="mono dim small">{fmt(v.fecha)} · {v.supervisor}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {tareasPend.length === 0 && quejas.length === 0 && infras.length === 0 && obsComerciales.length === 0 && (
          <div className="empty-hero small"><p>Sin pendientes ni observaciones registradas para este local.</p></div>
        )}

        {/* Info personal y evaluaciones del mes */}
        {(() => {
          const mesActual = todayISO().slice(0,7);
          const visitasMes = vsLocal.filter(v => v.fecha?.startsWith(mesActual) && !v.borrador);
          if (visitasMes.length === 0) return null;
          const ultimaV = visitasMes[0];
          const esAyudante = ultimaV.personal === "ayudante";
          const labelPersonal = (v) => v.personal === "ayudante" ? `Ayudante: ${v.ayudante || "Sin nombre"}` : "Encargado";
          const colorPersonal = (v) => v.personal === "ayudante" ? "#b37700" : "var(--done)";
          const labelEval = (val) => val === "bueno" ? "Bueno" : val === "amejorar" ? "A Mejorar" : val === "deficiente" ? "Deficiente" : val === "regular" ? "Regular" : "-";
          const colorEval = (val) => val === "bueno" ? "var(--done)" : val === "amejorar" || val === "regular" ? "#b37700" : val === "deficiente" ? "var(--alert)" : "var(--text-sec)";
          const visitasAyudantes = visitasMes.filter(v => v.personal === "ayudante" && v.evalAyudante);

          return (
            <>
              {/* Personal en última visita */}
              <div className="panel" style={{ borderLeft:`4px solid ${colorPersonal(ultimaV)}` }}>
                <div className="panel-title">Personal en última visita del mes</div>
                <div style={{ display:"flex", alignItems:"center", gap:10, fontSize:13 }}>
                  <span style={{ fontWeight:700, color:colorPersonal(ultimaV) }}>{esAyudante ? "👤 Ayudante" : "👔 Encargado"}</span>
                  <span>{labelPersonal(ultimaV)}</span>
                  <span className="dim small">· {fmt(ultimaV.fecha)}</span>
                </div>
                {/* Eval encargado */}
                {!esAyudante && (ultimaV.eval_atencion || ultimaV.eval_impulso || ultimaV.eval_actitud) && (
                  <div style={{ display:"flex", gap:12, marginTop:8, flexWrap:"wrap" }}>
                    {[["eval_atencion","Atención"],["eval_impulso","Impulso"],["eval_actitud","Actitud"]].map(([k,l]) => ultimaV[k] && (
                      <div key={k} style={{ fontSize:12 }}>
                        <span className="dim">{l}: </span>
                        <span style={{ fontWeight:700, color:colorEval(ultimaV[k]) }}>{labelEval(ultimaV[k])}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Evaluaciones de ayudantes del mes */}
              {visitasAyudantes.length > 0 && (
                <div className="panel">
                  <div className="panel-title">Evaluaciones de ayudantes — {["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(mesActual.split("-")[1])-1]}</div>
                  {visitasAyudantes.map((v,i) => {
                    const ea = v.evalAyudante;
                    const val = (x) => x==="bueno"?1:x==="amejorar"?0.5:x==="deficiente"?0:null;
                    const campos = [val(ea.atencion), val(ea.orden), val(ea.apoyo)].filter(x => x !== null);
                    const score = campos.length > 0 ? Math.round(campos.reduce((a,b)=>a+b,0)/campos.length*100) : null;
                    const colorS = score >= 85 ? "var(--done)" : score >= 70 ? "#b37700" : "var(--alert)";
                    const labelS = score >= 85 ? "Bueno" : score >= 70 ? "Regular" : "Crítico";
                    return (
                      <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 0", borderBottom:"1px solid var(--line)", fontSize:13 }}>
                        <div>
                          <span style={{ fontWeight:600 }}>{v.ayudante || "Sin nombre"}</span>
                          <span className="dim" style={{ marginLeft:8, fontSize:11 }}>{fmt(v.fecha)} · {(v.supervisor||"").split(" ")[0]}</span>
                        </div>
                        {score !== null && (
                          <span style={{ fontWeight:700, color:colorS, background:colorS==="var(--done)"?"#f0faf5":colorS==="#b37700"?"#fffbea":"#fdf2f2", padding:"2px 10px", borderRadius:10, fontSize:12 }}>
                            {labelS} ({score} pts)
                          </span>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          );
        })()}
      </div>
    );
  }

  return (
    <div className="form-page">
      <h2 className="page-title">Locales</h2>
      {locales.length === 0 ? (
        <div className="empty-hero small"><p>Los locales se crean automáticamente al hacer el primer recorrido.</p></div>
      ) : (
        <div className="table">
          <div className="table-head"><div>Local</div><div>Recorridos</div><div>Pendientes</div><div>Alertas</div></div>
          {[...locales].sort((a,b) => a.nombre.localeCompare(b.nombre)).map((l) => {
            const vs = visitas.filter((v) => v.localId === l.id);
            const p = tareas.filter((t) => t.localId === l.id && !t.hecha).length;
            const quejasPend = vs.filter((v) => v.quejasClientes === "Si" && !v.quejasResueltas).length;
            const infraPend = resumirInfraestructura(vs).pendientes.length;
            const alertas = quejasPend + infraPend;
            return (
              <div className="table-row clickable" key={l.id} onClick={() => setSelLocal(l.id)}>
                <div>{l.nombre}</div>
                <div className="mono">{vs.length}</div>
                <div className="mono" style={p>0?{ color:"var(--pending)" }:undefined}>{p || "—"}</div>
                <div className="mono" style={alertas>0?{ color:"var(--alert)" }:undefined}>{alertas || "—"}</div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

@media(max-width:700px){.sp .sp-rank{grid-template-columns:1fr 1fr;gap:10px}.sp .sp-chip{font-size:12px;padding:3px 8px}.sp-rank-t{font-size:13px}}
`;

function PanelSupervisor({ data, onSave, showToast, supervisor }) {
  const { locales, visitas, tareas } = data;
  const precioCombustible = data.precioCombustible || 6860;
  const [vistaHistorial, setVistaHistorial] = useState(false);
  const [mesFiltro, setMesFiltro] = useState("");
  const [checkedTareas, setCheckedTareas] = useState({});
  const [seccionAbierta, setSeccionAbierta] = useState(null);

  const toggle = (key) => setSeccionAbierta(prev => prev === key ? null : key);

  const localName = (id) => {
    const l = locales.find(l => l.id === id);
    if (!l) return id;
    const parts = l.nombre.split(" - ");
    return "Suc. " + parseInt(parts[0]) + (parts[1] ? " - " + parts.slice(1).join(" - ") : "");
  };

  const esDelSupervisor = (valor) => {
    const registrado = String(valor||"").trim().toLowerCase();
    const actual = String(supervisor||"").trim().toLowerCase();
    if (registrado === actual) return true;
    if (actual.includes("ernesto")) return registrado === "sup1" || registrado.includes("ernesto");
    if (actual.includes("alexis")) return registrado === "sup2" || registrado.includes("alexis");
    return false;
  };

  const mesesDisponibles = useMemo(() => {
    const set = new Set(visitas.filter(v => esDelSupervisor(v.supervisor)).map(v => v.fecha?.slice(0,7)).filter(Boolean));
    return [...set].sort().reverse();
  }, [visitas, supervisor]);

  const nombreMes = (ym) => {
    if (!ym) return "Todos";
    const [y,m] = ym.split("-");
    return ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(m)-1]+" "+y;
  };

  const visitasFiltradas = useMemo(() => {
    return visitas.filter(v => esDelSupervisor(v.supervisor) && !v.borrador && (!mesFiltro || v.fecha?.startsWith(mesFiltro)));
  }, [visitas, supervisor, mesFiltro]);

  const ultimaVisitaPorLocal = useMemo(() => {
    const map = {};
    [...visitasFiltradas].sort((a,b) => a.fecha < b.fecha ? -1 : 1).forEach(v => { map[v.localId] = v; });
    return map;
  }, [visitasFiltradas]);

  const estadoLocales = useMemo(() => {
    const sinNov = [], seguimiento = [], intervencion = [];
    Object.values(ultimaVisitaPorLocal).forEach(v => {
      const e = estadoInfraestructura(v);
      if (e === "intervencion") intervencion.push(v);
      else if (e === "seguimiento") seguimiento.push(v);
      else sinNov.push(v);
    });
    return { sinNov, seguimiento, intervencion };
  }, [ultimaVisitaPorLocal]);

  const ranking = useMemo(() => {
    return Object.entries(ultimaVisitaPorLocal)
      .map(([localId, v]) => ({ localId, score: calcScore(v, data.codigos, data.pruebasRealizadas) }))
      .filter(x => x.score !== null)
      .sort((a,b) => b.score - a.score);
  }, [ultimaVisitaPorLocal, data.codigos, data.pruebasRealizadas]);

  const calcDes = (campo) => {
    const resp = visitasFiltradas.filter(v => v[campo]);
    const b = resp.filter(v => v[campo]==="bueno").length;
    const r = resp.filter(v => v[campo]==="regular").length;
    const d = resp.filter(v => v[campo]==="deficiente").length;
    return resp.length > 0 ? { bueno:Math.round(b/resp.length*100), regular:Math.round(r/resp.length*100), deficiente:Math.round(d/resp.length*100) } : null;
  };

  const tareasSupPend = useMemo(() => {
    return (tareas||[]).filter(t => !t.hecha).filter(t => {
      const v = visitas.find(x => x.localId === t.localId && x.supervisor === supervisor);
      return !!v;
    });
  }, [tareas, visitas, supervisor]);

  const resolverTarea = async (t, cumplio) => {
    const act = (data.tareas||[]).map(x => x.id === t.id ? revisarTarea(x, cumplio) : x);
    await onSave({ ...data, tareas: act });
    showToast(cumplio ? "Tarea cumplida." : "Tarea no cumplida. Se mostrará en la próxima visita.");
  };

  const visitados = Object.keys(ultimaVisitaPorLocal).length;
  const asignados = useMemo(() => {
    const zona = supervisor.includes("Ernesto") ? ZONA_SUP1 : ZONA_SUP2;
    const inactivos = new Set((data.localesInactivos||[]).map(id => parseInt(String(id).replace("local-fixed-",""))));
    return zona.filter(num => !inactivos.has(num)).length;
  }, [supervisor, data.localesInactivos]);
  const competenciaSup = useMemo(() => (data.analisisCompetencia||[])
    .filter(c => !mesFiltro || (c.fecha||"").startsWith(mesFiltro)),
  [data.analisisCompetencia, mesFiltro]);
  const capacitacionesSup = useMemo(() => {
    const zona = supervisor.includes("Ernesto") ? ZONA_SUP1 : ZONA_SUP2;
    return visitasFiltradas.filter(v => {
      const numLocal = parseInt(String(v.localId||"").replace("local-fixed-",""));
      return zona.includes(numLocal) && v.capacitacion === "si";
    });
  }, [visitasFiltradas, supervisor]);

  // Pruebas técnicas — igual que admin, por localId de visitas del mes
  const pruebasSup = useMemo(() => {
    const visitasMes = visitas.filter(v => v.supervisor === supervisor && !v.borrador && (!mesFiltro || v.fecha?.startsWith(mesFiltro)));
    const localIds = new Set(visitasMes.map(v => v.localId));
    let total = 0, probados = 0;
    localIds.forEach(localId => {
      const cod = (data.codigos||[]).filter(c => c.localId === localId);
      const pr = (data.pruebasRealizadas||[]).filter(p => p.localId === localId && (!mesFiltro || (p.fechaProbado||"").startsWith(mesFiltro)));
      total += cod.length;
      probados += pr.length;
    });
    const pct = total > 0 ? Math.round((probados / total) * 100) : null;
    return { probados, total, pct, localIds };
  }, [data.codigos, data.pruebasRealizadas, visitas, supervisor, mesFiltro]);
  const scoreBg = (s) => s>=90?"#f0faf5":s>75?"#fffbea":"#fdf2f2";
  const scoreColor = (s) => s>=90?"var(--done)":s>75?"#b37700":"var(--alert)";

  // Stock crítico +10 meses — solo locales de la zona del supervisor
  const stockCriticoSup = useMemo(() => {
    const zona = supervisor.includes("Ernesto") ? ZONA_SUP1 : ZONA_SUP2;
    const zonaSet = new Set(zona.map(String));
    const artViejos = (data.articulosViejos||[]);
    const mesHoy = todayISO().slice(0,7);
    const [anio, mes] = mesHoy.split("-").map(Number);
    const mesAntKey = (mes === 1 ? (anio-1)+"-12" : anio+"-"+String(mes-1).padStart(2,"0"));
    const filtrarPorZona = (lista) => (lista||[]).filter(a => {
      const num = String(a.localId||a.local_id||a.origen||"").replace("local-fixed-","").replace(/^0+/,"");
      return zonaSet.has(num);
    });
    const snapActual = data.stockSnapshots?.[mesHoy];
    const snapAnt = data.stockSnapshots?.[mesAntKey];
    const actual = filtrarPorZona(snapActual || artViejos);
    const anterior = snapAnt ? filtrarPorZona(snapAnt) : null;
    const codigosAnt = new Set((anterior||[]).map(a => String(a.codigo)));
    const nuevos = new Set(actual.filter(a => !codigosAnt.has(String(a.codigo))).map(a => String(a.codigo)));
    return { actual, anterior, cantActual: actual.length, cantAnt: anterior ? anterior.length : null, nuevos };
  }, [data.articulosViejos, data.stockSnapshots, supervisor]);

  const kmResumen = useMemo(() => {
    const porDia = {};
    visitas.filter(v => v.supervisor === supervisor && !v.borrador && (!mesFiltro || v.fecha?.startsWith(mesFiltro))).forEach(v => {
      const key = v.fecha;
      if (!porDia[key] || (v.kmRecorridos||0) > (porDia[key].kmNeto||0)) {
        porDia[key] = { kmNeto: v.kmRecorridos||0, kmBruto: v.kmBruto||0 };
      }
    });
    let kmNeto = 0, kmBruto = 0, monto = 0;
    Object.entries(porDia).forEach(([dia, d]) => {
      kmNeto += d.kmNeto;
      kmBruto += d.kmBruto;
      // Buscar ruta del mismo día o la más reciente anterior
      const rutasSup = (data.rutas||[]).filter(r => r.supervisor === supervisor && r.fecha <= dia && r.precioCombustible);
      const rutaObj = rutasSup.sort((a,b) => b.fecha.localeCompare(a.fecha))[0];
      const precioRuta = rutaObj?.precioCombustible || precioCombustible;
      monto += Math.round(d.kmNeto * calcCostoKm(precioRuta));
    });
    return {
      kmNeto: Math.round(kmNeto * 10) / 10,
      kmBruto: Math.round(kmBruto * 10) / 10,
      monto,
    };
  }, [visitas, supervisor, mesFiltro, precioCombustible, data.rutas]);

  const [detalleDesempeno, setDetalleDesempeno] = useState(null);
  const [detallePanel, setDetallePanel] = useState(null);
  const [detalleKm, setDetalleKm] = useState(false);
  const [visitaAbierta, setVisitaAbierta] = useState(null);
  const [kpiActivo, setKpiActivo] = useState(null);
  const [historialLocalPanel, setHistorialLocalPanel] = useState(null);
  const [historialDesdeRanking, setHistorialDesdeRanking] = useState(false);
  const mesPorDefecto = mesesDisponibles.includes(todayISO().slice(0,7)) ? todayISO().slice(0,7) : (mesesDisponibles[0] || todayISO().slice(0,7));
  useEffect(() => { if (!vistaHistorial && !mesFiltro) setMesFiltro(mesPorDefecto); }, [vistaHistorial, mesFiltro, mesPorDefecto]);
  const abrirHistorialLocal = (localId) => {
    setHistorialLocalPanel(localId);
    setHistorialDesdeRanking(true);
    setDetallePanel("ranking");
    setVisitaAbierta(null);
    setMesFiltro("");
    setVistaHistorial(true);
  };

  // Desglose km por día
  const kmPorDia = useMemo(() => {
    const porDia = {};
    visitas.filter(v => v.supervisor === supervisor && !v.borrador && (!mesFiltro || v.fecha?.startsWith(mesFiltro))).forEach(v => {
      if (!porDia[v.fecha]) porDia[v.fecha] = { kmNeto:0, kmBruto:0, locales:[] };
      if ((v.kmRecorridos||0) > porDia[v.fecha].kmNeto) {
        porDia[v.fecha].kmNeto = v.kmRecorridos||0;
        porDia[v.fecha].kmBruto = v.kmBruto||0;
      }
      if (!porDia[v.fecha].locales.find(l => l.id === v.localId)) {
        porDia[v.fecha].locales.push({ id:v.localId, hora:v.horaLlegada||"" });
      }
    });
    return Object.entries(porDia).sort(([a],[b]) => b.localeCompare(a));
  }, [visitas, supervisor, mesFiltro]);
  const Seccion = ({ id, titulo, badge, resumen, children }) => (
    <div className="panel" style={{ marginBottom:10, padding:0, overflow:"hidden" }}>
      <button onClick={() => toggle(id)} style={{ all:"unset", display:"flex", justifyContent:"space-between", alignItems:"center", width:"100%", padding:"12px 14px", cursor:"pointer", borderBottom: seccionAbierta === id ? "1px solid var(--line)" : "none" }}>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontWeight:700, fontSize:13, display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
            {titulo}
            {badge && <span style={{ background:"var(--alert)", color:"#fff", borderRadius:10, fontSize:10, fontWeight:700, padding:"1px 6px" }}>{badge}</span>}
            {resumen && <span style={{ fontSize:11, color:"#6B7268", fontWeight:400 }}>{resumen}</span>}
          </div>
        </div>
        <span style={{ fontSize:12, color:"var(--route)", flexShrink:0, marginLeft:8 }}>{seccionAbierta === id?"▲":"▼"}</span>
      </button>
      {seccionAbierta === id && <div style={{ padding:"12px 14px" }}>{children}</div>}
    </div>
  );

  // Local card mobile
  const LocalCard = ({ v, color, bg, extra }) => (
    <div style={{ background:bg, borderRadius:8, padding:"8px 10px", marginBottom:6, borderLeft:`3px solid ${color}` }}>
      <div style={{ fontWeight:600, fontSize:13 }}>{localName(v.localId)}</div>
      <div style={{ fontSize:11, color:"#6B7268", marginTop:2 }}>{fmt(v.fecha)}{v.horaLlegada?" · "+v.horaLlegada:""}</div>
      {v.infraestructura && <div style={{ fontSize:11, marginTop:2 }}>{v.infraestructura}</div>}
      {extra}
    </div>
  );

  // ---- VISTA HISTORIAL ----
  if (vistaHistorial) {
    const visitasMes = [...visitasFiltradas]
      .filter(v => !historialLocalPanel || v.localId === historialLocalPanel)
      .sort((a,b) => b.fecha.localeCompare(a.fecha));
    return (
      <div className="form-page">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, gap:8, flexWrap:"wrap" }}>
          <button className="btn ghost" onClick={() => {
            if (historialLocalPanel && historialDesdeRanking) {
              setHistorialLocalPanel(null);
              setHistorialDesdeRanking(false);
              setVisitaAbierta(null);
              setVistaHistorial(false);
            } else if (historialLocalPanel) {
              setHistorialLocalPanel(null);
              setVisitaAbierta(null);
            } else {
              setVistaHistorial(false);
            }
          }}>{historialLocalPanel && historialDesdeRanking ? "← Volver a Performance" : historialLocalPanel ? "← Todos los locales" : "← Volver"}</button>
          <div className="mes-pills" style={{ flexWrap:"wrap" }}>
            <button className={"mes-pill"+(!mesFiltro?" active":"")} onClick={() => setMesFiltro("")}>Todos</button>
            {mesesDisponibles.map(m => (
              <button key={m} className={"mes-pill"+(mesFiltro===m?" active":"")} onClick={() => setMesFiltro(m)}>{nombreMes(m)}</button>
            ))}
          </div>
        </div>
        <h2 className="page-title">{historialLocalPanel ? "Historial del local" : "Historial — "+supervisor.split(" ")[0]}</h2>
        {historialLocalPanel && <div style={{ fontWeight:700, fontSize:13, marginBottom:4 }}>{localName(historialLocalPanel)}</div>}
        <div style={{ fontSize:12, color:"#6B7268", marginBottom:10 }}>{visitasMes.length} visitas</div>
        {visitasMes.length === 0
          ? <div className="empty-hero small"><p>Sin visitas en este período.</p></div>
          : visitasMes.map((v,i) => {
              const est = estadoInfraestructura(v);
              const estColor = est==="intervencion"?"var(--alert)":est==="seguimiento"?"#b37700":"var(--done)";
              const estLabel = est==="intervencion"?"🔴 Intervención":est==="seguimiento"?"🟡 Seguimiento":"🟢 Sin novedades";
              const abierto = visitaAbierta === v.id;
              return (
                <div key={i} className="panel" style={{ marginBottom:8, padding:0, overflow:"hidden", borderTop:`3px solid ${estColor}` }}>
                  <button onClick={() => {
                    if (!historialLocalPanel) {
                      setHistorialLocalPanel(v.localId);
                      setVisitaAbierta(null);
                      setMesFiltro("");
                    } else {
                      setVisitaAbierta(abierto ? null : v.id);
                    }
                  }}
                    style={{ all:"unset", display:"flex", justifyContent:"space-between", alignItems:"center", width:"100%", padding:"12px 14px", cursor:"pointer", borderBottom: abierto?"1px solid var(--line)":"none" }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontWeight:700, fontSize:13 }}>{localName(v.localId)}</div>
                      <div style={{ fontSize:11, color:"#6B7268" }}>{fmt(v.fecha)}{v.horaLlegada?" · "+v.horaLlegada:""}</div>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0, marginLeft:8 }}>
                      <TendenciaBadge visita={v} data={data} compacta />
                      <span style={{ fontSize:10, color:estColor, fontWeight:600 }}>{estLabel}</span>
                      <span style={{ fontSize:12, color:"var(--route)" }}>{historialLocalPanel ? (abierto?"▲":"▼") : "›"}</span>
                    </div>
                  </button>
                  {abierto && (() => {
                    const comp = calcCompletitud(v, data.codigos, data.pruebasRealizadas);
                    const scoreVisita = calcScore(v, data.codigos, data.pruebasRealizadas);
                    return (
                      <div style={{ padding:"12px 14px" }}>
                        {scoreVisita !== null && <span style={{ fontWeight:800, fontSize:13, color:scoreColor(scoreVisita), background:scoreBg(scoreVisita), padding:"2px 10px", borderRadius:10, display:"inline-block", marginBottom:8 }}>{scoreVisita} pts</span>}
                        <div><ArticulosAntiguosBadge visita={v} visitas={visitas} /></div>
                        <div style={{ padding:"6px 8px", borderRadius:8, marginBottom:8, background:comp.pct===100?"#f0faf5":comp.pct>=70?"#fffbea":"#fdf2f2", border:`1px solid ${comp.pct===100?"var(--done)":comp.pct>=70?"#b37700":"var(--alert)"}` }}>
                          <div style={{ fontWeight:700, fontSize:11, color:comp.pct===100?"var(--done)":comp.pct>=70?"#b37700":"var(--alert)" }}>Completitud: {comp.completados}/{comp.total} ({comp.pct}%)</div>
                          {comp.faltantes.map(f => <div key={f.key} style={{ fontSize:10, color:"var(--alert)" }}>❌ {f.label}</div>)}
                        </div>
                        <div className="hist-grid" style={{ marginBottom:8 }}>
                          {CHECK_FIELDS.filter(([key]) => key !== "compromiso").map(([key,label]) => v[key] && (
                            <div key={key} className="hist-check">
                              <span className={"mini-badge "+(v[key]==="No"?"mini-no":"mini-si")}>{v[key]}</span>
                              <span>{label}</span>
                            </div>
                          ))}
                        </div>
                        {v.desviosOperativos==="Si" && v.accionDesviosOperativos && <div className="hist-line" style={{ fontSize:12, marginBottom:4 }}><b>Desvío:</b> {v.accionDesviosOperativos}</div>}
                        {v.estadoLocal && v.estadoLocal!=="sin_novedades" && <div className="hist-line" style={{ fontSize:12, marginBottom:4 }}><b>Estado:</b> {v.infraestructura||v.motivoEstado||""}</div>}
                        {v.compromiso && <div style={{ fontSize:12, marginBottom:4, padding:"6px 8px", borderRadius:6, background:"#f5f7f5", border:"1px solid var(--line)" }}><b>Plan de acción:</b> {v.compromiso}</div>}
                        {v.observacionesGenerales && <div className="hist-line" style={{ fontSize:12, color:"#6B7268" }}><b>Hallazgo:</b> {v.observacionesGenerales}</div>}
                      </div>
                    );
                  })()}
                </div>
              );
            })
        }
      </div>
    );
  }

  // ---- VISTA PANEL ----
  return (
    <div className="form-page sp">
      <style>{SP_CSS}</style>
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, flexWrap:"wrap", gap:8 }}>
        <div>
          <div style={{ fontFamily:"Space Grotesk,sans-serif", fontWeight:700, fontSize:16 }}>Panel — {supervisor.split(" ")[0]}</div>
          <div style={{ fontSize:11, color:"#6B7268" }}>{visitasFiltradas.length} visitas · {nombreMes(mesFiltro)}</div>
        </div>
        <button className="btn primary" style={{ fontSize:12, padding:"8px 12px" }} onClick={() => { setHistorialLocalPanel(null); setHistorialDesdeRanking(false); setVisitaAbierta(null); setVistaHistorial(true); }}>📋 Historial</button>
      </div>

      {/* Selector de mes */}
      <div className="sp-meses">
        {mesesDisponibles.map(m => (
          <button key={m} className={"mes-pill"+(mesFiltro===m?" active":"")} onClick={() => setMesFiltro(m)}>{nombreMes(m)}</button>
        ))}
      </div>

      {/* KPIs rápidos */}
      <div className="supervisor-kpis">
        {/* Visitados */}
        <div className="supervisor-kpi supervisor-kpi-visitas" onClick={() => setKpiActivo(kpiActivo==="visitados" ? null : "visitados")}
          style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"10px 6px", textAlign:"center", cursor:"pointer" }}>
          <div style={{ fontSize:8, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#6B7268", marginBottom:4 }}>VISITAS REALIZADAS</div>
          <div style={{ fontSize:17, fontWeight:800, color:"var(--route)", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{visitados}/{asignados}</div>
        </div>
        {/* Tareas */}
        <div className="supervisor-kpi" onClick={() => setKpiActivo(kpiActivo==="tareas" ? null : "tareas")}
          style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"10px 6px", textAlign:"center", cursor:"pointer" }}>
          <div style={{ fontSize:8, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#6B7268", marginBottom:4 }}>TAREAS</div>
          <div style={{ fontSize:17, fontWeight:800, color: tareasSupPend.length>0?"#b37700":"var(--done)", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{tareasSupPend.length}</div>
        </div>
        {/* Pruebas */}
        <div className="supervisor-kpi" onClick={() => setKpiActivo(kpiActivo==="pruebas" ? null : "pruebas")}
          style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"10px 6px", textAlign:"center", cursor:"pointer" }}>
          <div style={{ fontSize:8, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#6B7268", marginBottom:4 }}>PRUEBAS</div>
          <div style={{ fontSize:17, fontWeight:800, color: pruebasSup.pct===100?"var(--done)":pruebasSup.pct>=70?"#b37700":"var(--alert)", fontFamily:"'Inter',sans-serif" }}>{pruebasSup.pct !== null ? pruebasSup.pct+"%" : "-"}</div>
        </div>
        {/* Capacitaciones */}
        <div className="supervisor-kpi" onClick={() => setKpiActivo(kpiActivo==="capacitaciones" ? null : "capacitaciones")}
          style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"10px 6px", textAlign:"center", cursor:"pointer" }}>
          <div style={{ fontSize:8, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#6B7268", marginBottom:4 }}>CAPACITACIONES</div>
          <div style={{ fontSize:17, fontWeight:800, color:capacitacionesSup.length>0?"var(--done)":"#6B7268", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{capacitacionesSup.length}</div>
        </div>
        {/* Análisis de competencia */}
        <div className="supervisor-kpi" onClick={() => setKpiActivo(kpiActivo==="competencia" ? null : "competencia")}
          style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"10px 6px", textAlign:"center", cursor:"pointer" }}>
          <div style={{ fontSize:8, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#6B7268", marginBottom:4 }}>ANÁLISIS COMPETENCIA</div>
          <div style={{ fontSize:17, fontWeight:800, color:"var(--accent)", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{competenciaSup.length}</div>
        </div>
        {/* Stock crítico +10 meses */}

function Historial({ data, supervisorFijo, localInicial, onVolver, textoVolver }) {
  const { locales, visitas, rutas } = data;
  const precioCombustible = data.precioCombustible || 6860;
  const [filtro, setFiltro] = useState("");
  const [mesFiltro, setMesFiltro] = useState(() => localInicial ? "" : todayISO().slice(0,7));
  const [open, setOpen] = useState(null);
  const [openKm, setOpenKm] = useState(null);

  const mesesDisponibles = useMemo(() => {
    const set = new Set(visitas.map((v) => v.fecha?.slice(0,7)).filter(Boolean));
    return [...set].sort().reverse();
  }, [visitas]);

  const nombreMes = (ym) => {
    if (!ym) return "Todos";
    const [y,m] = ym.split("-");
    return ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(m)-1]+" "+y;
  };

  const localName = (id) => locales.find((l) => l.id === id)?.nombre || id;

  const filtradas = useMemo(() => {
    let list = [...visitas].sort((a,b) => (a.fecha < b.fecha ? 1 : -1));
    if (supervisorFijo) list = list.filter((v) => v.supervisor === supervisorFijo);
    if (localInicial) list = list.filter((v) => v.localId === localInicial);
    if (mesFiltro) list = list.filter((v) => v.fecha?.startsWith(mesFiltro));
    if (!filtro.trim()) return list;
    const f = filtro.toLowerCase();
    return list.filter((v) => localName(v.localId).toLowerCase().includes(f) || (v.supervisor||"").toLowerCase().includes(f));
  }, [visitas, filtro, mesFiltro, locales, supervisorFijo, localInicial]);

  // Resumen de km y monto por supervisor del mes
  const resumenKm = useMemo(() => {
    const map = {};
    const porSupDia = {};
    // Ordenar por fecha+hora para tomar el ÚLTIMO recorrido del día (el más completo)
    const filtradas_ord = [...filtradas].sort((a,b) => {
      const fa = (a.fecha||"") + (a.horaLlegada||"");
      const fb = (b.fecha||"") + (b.horaLlegada||"");
      return fa < fb ? -1 : 1;
    });
    filtradas_ord.forEach((v) => {
      const sup = v.supervisor || "Sin asignar";
      const dia = v.fecha || "";
      const key = sup + "|" + dia;
      // Tomar siempre el último (mayor índice en el array ordenado)
      porSupDia[key] = { sup, dia, kmNeto: v.kmRecorridos || 0, kmBruto: v.kmBruto || 0 };
    });

    // Acumular km y monto por supervisor con precio histórico
    Object.entries(porSupDia).forEach(([key, { sup, dia, kmNeto, kmBruto }]) => {
      if (!map[sup]) map[sup] = { kmNeto: 0, kmBruto: 0, dias: 0, monto: 0 };
      map[sup].kmNeto += kmNeto;
      map[sup].kmBruto += kmBruto;
      map[sup].dias++;
      const rutasSup2 = (rutas||[]).filter(r => r.supervisor === sup && r.fecha <= dia && r.precioCombustible);
      const rutaObj = rutasSup2.sort((a,b) => b.fecha.localeCompare(a.fecha))[0];
      const precioRuta = rutaObj?.precioCombustible || precioCombustible;
      map[sup].monto += Math.round(kmNeto * calcCostoKm(precioRuta));
    });

    const visitasPorSup = {};
    filtradas.forEach((v) => {
      const sup = v.supervisor || "Sin asignar";
      visitasPorSup[sup] = (visitasPorSup[sup] || 0) + 1;
    });
    // Detalle por día para el desglose
    const detallePorSup = {};
    Object.entries(porSupDia).forEach(([key, { sup, dia, kmNeto, kmBruto }]) => {
      if (!detallePorSup[sup]) detallePorSup[sup] = [];
      const visitasDelDia = filtradas.filter((v) => v.supervisor === sup && v.fecha === dia)
        .sort((a,b) => (a.horaLlegada||"") < (b.horaLlegada||"") ? -1 : 1);
      detallePorSup[sup].push({ dia, kmNeto, kmBruto, locales: visitasDelDia.map((v) => localName(v.localId)) });
    });
    Object.values(detallePorSup).forEach((arr) => arr.sort((a,b) => a.dia < b.dia ? 1 : -1));

    return Object.entries(map).map(([sup, d]) => ({
      sup,
      kmBruto: Math.round(d.kmBruto * 10) / 10,
      kmNeto: Math.round(d.kmNeto * 10) / 10,
      dias: d.dias,
      visitas: visitasPorSup[sup] || 0,
      monto: d.monto || 0,
      detalle: detallePorSup[sup] || []
    }));
  }, [filtradas, precioCombustible, rutas]);

  return (
    <div className="form-page">
      {onVolver && <button className="btn ghost" style={{ marginBottom:12 }} onClick={onVolver}>← {textoVolver||"Volver al panel"}</button>}
      <h2 className="page-title">{localInicial ? "Historial — "+localName(localInicial) : "Historial"}</h2>
      <div className="mes-selector" style={{ marginBottom:12 }}>
        <div className="mes-pills">
          <button className={"mes-pill"+(!mesFiltro?" active":"")} onClick={() => setMesFiltro("")}>Todos</button>
          {mesesDisponibles.map((m) => (
            <button key={m} className={"mes-pill"+(mesFiltro===m?" active":"")} onClick={() => setMesFiltro(m)}>{nombreMes(m)}</button>
          ))}
        </div>
      </div>

      {resumenKm.length > 0 && (
        <div className="dash-grid2" style={{ marginBottom:14 }}>
          {resumenKm.map(({ sup, kmBruto, kmNeto, dias, visitas, monto, detalle }) => (
            <div key={sup} className="dash-panel" style={{ borderTop:"3px solid var(--route)", marginBottom:0 }}>
              <button style={{ all:"unset", cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", width:"100%", marginBottom:6 }}
                onClick={() => setOpenKm(openKm===sup ? null : sup)}>
                <div style={{ fontWeight:700 }}>{sup.split(" ")[0]}</div>
                <span style={{ fontSize:11, color:"var(--route)" }}>{openKm===sup ? "▲ ocultar" : "▼ ver por día"}</span>
              </button>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8 }}>
                <div><div className="dash-card-label">KM TOTAL</div><div style={{ fontSize:13, fontWeight:700, fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{kmBruto}</div></div>
                <div><div className="dash-card-label">KM NETO</div><div style={{ fontSize:13, fontWeight:700, color:"var(--route)", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{kmNeto}</div></div>
                <div><div className="dash-card-label">VISITAS</div><div style={{ fontSize:13, fontWeight:700, fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{visitas}</div></div>
                <div><div className="dash-card-label">COMBUSTIBLE</div><div style={{ fontSize:13, fontWeight:700, color:"#F5A623", whiteSpace:"nowrap", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{monto.toLocaleString()} Gs</div></div>
              </div>
              {openKm===sup && detalle.length > 0 && (
                <div style={{ marginTop:10, borderTop:"1px solid var(--line)", paddingTop:8 }}>
                  {detalle.map(({ dia, kmNeto: kn, kmBruto: kb, locales: locs }) => (
                    <div key={dia} style={{ display:"flex", gap:10, alignItems:"flex-start", padding:"5px 0", borderBottom:"1px solid var(--line)" }}>
                      <div style={{ minWidth:90, fontWeight:600, fontSize:12 }}>{fmt(dia)}</div>
                      <div style={{ flex:1, fontSize:12, color:"var(--text-sec)" }}>{locs.join(" → ")}</div>
                      <div style={{ fontSize:12, fontWeight:700, color:"var(--route)", whiteSpace:"nowrap", fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>{kn} km</div>
                    </div>
                  ))}
                  <div style={{ display:"flex", justifyContent:"flex-end", paddingTop:6 }}>
                    <span style={{ fontSize:12, fontWeight:700, fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums" }}>Total: {kmNeto} km</span>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {!localInicial && <input className="input" placeholder="Filtrar por local o supervisor…" value={filtro} onChange={(e) => setFiltro(e.target.value)} />}
      {filtradas.length === 0 ? (
        <div className="empty-hero small"><p>No hay recorridos que coincidan.</p></div>
      ) : (
        <div className="list history">
          {filtradas.map((v) => {
            const meta=ESTADOS[estadoVisita(v, data.codigos, data.pruebasRealizadas)]; const isOpen=open===v.id;
            return (
              <div className="hist-card" key={v.id}>
                <button className="hist-head" onClick={() => setOpen(isOpen?null:v.id)}>
                  <span className="dot" style={{ background:meta.color }}/>
                  <div className="list-main"><div>{localName(v.localId)}</div><div className="mono dim small">{v.supervisor} · {fmt(v.fecha)}</div></div>
                  {v.calificacion && <span className="mono dim small" style={{ marginRight:6 }}>★ {v.calificacion}</span>}
                  <TendenciaBadge visita={v} data={data} />
                  <span className="badge" style={{ color:meta.color, borderColor:meta.color }}>{meta.label}</span>
                </button>
                {isOpen && (
                  <div className="hist-body">
                    <div><ArticulosAntiguosBadge visita={v} visitas={visitas} /></div>
                    {(() => {
                      const comp = calcCompletitud(v, data.codigos, data.pruebasRealizadas);
                      return (
                        <div style={{ marginBottom:10, padding:"8px 10px", borderRadius:8, background: comp.pct===100?"#f0faf5":comp.pct>=70?"#fffbea":"#fdf2f2", border:`1px solid ${comp.pct===100?"var(--done)":comp.pct>=70?"#b37700":"var(--alert)"}` }}>
                          <div style={{ fontWeight:700, fontSize:12, marginBottom:4, color: comp.pct===100?"var(--done)":comp.pct>=70?"#b37700":"var(--alert)" }}>
                            Completitud: {comp.completados}/{comp.total} ({comp.pct}%)
                          </div>
                          {comp.faltantes.length > 0 && comp.faltantes.map(f => (
                            <div key={f.key} style={{ fontSize:11, color:"var(--alert)" }}>❌ {f.label}</div>
                          ))}
                        </div>
                      );
                    })()}
                    {v.horaLlegada && <div className="hist-line"><b>Hora de llegada:</b> {v.horaLlegada}</div>}
                    {v.gpsLat && <div className="hist-line"><b>Ubicación:</b> <a href={`https://maps.google.com/?q=${v.gpsLat},${v.gpsLng}`} target="_blank" rel="noreferrer" style={{ color:"var(--route)" }}>📍 Ver en Google Maps</a></div>}
                    <div className="hist-grid">
                      {CHECK_FIELDS.map(([key,label]) => v[key] && (<div key={key} className="hist-check"><span className={"mini-badge "+(v[key]==="No"?"mini-no":"mini-si")}>{v[key]}</span><span>{label}</span></div>))}
                    </div>
                    {v.motivoAlarma && <div className="hist-line"><b>Motivo alarma:</b> {v.motivoAlarma}</div>}
                    {v.verifInventario && <div className="hist-line"><b>Desviaciones inventario:</b> {v.verifInventario}{v.comentarioVerif?` — ${v.comentarioVerif}`:""}</div>}
                    {v.observacionComercial && <div className="hist-line"><b>Obs. comercial:</b> {v.observacionComercial}</div>}
                    {v.llamadoAtencion==="Si" && <div className="hist-line"><b>Llamado de atención:</b> {v.motivoLlamado||"Sin detalle"}</div>}
                    {v.capacitacionDada==="Si" && <div className="hist-line"><b>Capacitación:</b> {v.temaCapacitacion}</div>}
                    {v.competenciaCerca==="Si" && <div className="hist-line"><b>Competencia nueva:</b> {v.descripcionCompetencia}</div>}
                    {v.quejasClientes==="Si" && <div className="hist-line"><b>Quejas clientes:</b> {v.descripcionQuejas}</div>}
                    {v.problemaSeguridad==="Si" && <div className="hist-line"><b>Problema seguridad:</b> {v.descripcionProblema}</div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const USUARIOS = {
  "sup1":  { nombre: "Ernesto Aguero", rol: "supervisor", supervisor: "Ernesto Aguero", passHash: "123456" },
  "sup2":  { nombre: "Alexis Arzamendia", rol: "supervisor", supervisor: "Alexis Arzamendia", passHash: "123456" },

function Login({ onLogin }) {
  const [usuario, setUsuario] = useState("");
  const [pass, setPass] = useState("");
  const [error, setError] = useState("");

  const ingresar = () => {
    const key = usuario.toLowerCase().trim();
    const u = USUARIOS[key];
    if (!u) { setError("Usuario no encontrado."); return; }
    // Contraseña maestra para admin (no se puede cambiar)
    if (key === "admin" && pass === "lp2025") { onLogin(u); return; }
    // Cargar contraseñas guardadas
    const saved = localStorage.getItem("pass_" + key);
    const hash = saved || u.passHash;
    if (pass !== hash) { setError("Contraseña incorrecta."); return; }
    onLogin(u);
  };

  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--paper)" }}>
      <Style />

        </div>

            <span>Usuario</span>

          </label>
          <label className="field" style={{ marginBottom:16 }}>
            <span>Contraseña</span>
            <input className="input" type="password" placeholder="••••••"
              value={pass} onChange={(e) => { setPass(e.target.value); setError(""); }}
              onKeyDown={(e) => e.key === "Enter" && ingresar()} />
          </label>
          {error && <div style={{ color:"var(--alert)", fontSize:13, marginBottom:10 }}>{error}</div>}

/* ---- CambiarPass ---- */
function CambiarPass({ usuario, onClose, onSave }) {
  const [actual, setActual] = useState("");
  const [nueva, setNueva] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [error, setError] = useState("");

  const guardar = () => {
    if (actual !== USUARIOS[usuario].passHash) { setError("Contraseña actual incorrecta."); return; }
    if (nueva.length < 4) { setError("La nueva contraseña debe tener al menos 4 caracteres."); return; }
    if (nueva !== confirmar) { setError("Las contraseñas no coinciden."); return; }
    USUARIOS[usuario].passHash = nueva;
    localStorage.setItem("pass_" + usuario, nueva);
    onSave();
    onClose();
  };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.4)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:999 }}>
      <div className="panel" style={{ width:"100%", maxWidth:340, margin:20 }}>
        <div style={{ fontWeight:700, marginBottom:16 }}>Cambiar contraseña</div>
        <label className="field" style={{ marginBottom:8 }}><span>Contraseña actual</span><input className="input" type="password" value={actual} onChange={(e) => setActual(e.target.value)} /></label>
        <label className="field" style={{ marginBottom:8 }}><span>Nueva contraseña</span><input className="input" type="password" value={nueva} onChange={(e) => setNueva(e.target.value)} /></label>
        <label className="field" style={{ marginBottom:12 }}><span>Confirmar nueva</span><input className="input" type="password" value={confirmar} onChange={(e) => setConfirmar(e.target.value)} /></label>
        {error && <div style={{ color:"var(--alert)", fontSize:13, marginBottom:10 }}>{error}</div>}
        <div style={{ display:"flex", gap:8 }}>
          <button className="btn" onClick={onClose}>Cancelar</button>
          <button className="btn primary" onClick={guardar}>Guardar</button>
        </div>
      </div>
    </div>
  );
}
