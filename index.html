  const [showCambiarPass, setShowCambiarPass] = useState(false);
  const irARecorrido = (localId) => { setLocalPrecargado(localId); setTab("nuevo"); };

  const handleLogin = (u) => {
    // Cargar contraseñas guardadas
    Object.keys(USUARIOS).forEach((k) => {
      const saved = localStorage.getItem("pass_" + k);
      if (saved) USUARIOS[k].passHash = saved;
    });
    setSesion(u);
    sessionStorage.setItem("sesion", JSON.stringify(u));
    setTab(u.rol === "supervisor" ? "ruta" : "dashboard");
  };

  const handleLogout = () => {
    setSesion(null);
    sessionStorage.removeItem("sesion");
    setTab("dashboard");
  };

  useEffect(() => {
    // Cargar contraseñas personalizadas
    Object.keys(USUARIOS).forEach((k) => {
      const saved = localStorage.getItem("pass_" + k);
      if (saved) USUARIOS[k].passHash = saved;
    });
    let active = true;
    setReady(false);
    setLoadError("");
    if (sesion) loadData().then((d) => {
      if (active) { setData(d); setReady(true); }
    }).catch(err => {
      console.error("Carga de Supabase:", err);
      if (active) setLoadError("No se pudieron cargar los datos. Revisá la conexión y volvé a intentar.");
    });
    return () => { active = false; };
  }, [sesion, loadAttempt]);

  if (!sesion) return <Login onLogin={handleLogin} />;

  const handleSave = async (next) => {
    const prev = data;
    try {
      await saveData(prev, next);
      const pruebasRealizadas = [...(next.pruebasRealizadas || [])];
      for (const c of next.codigos || []) {
        if (c.probado && !pruebasRealizadas.some(p => p.localId === c.localId && p.codigo === c.codigo && p.fechaProbado === c.fechaProbado)) {
          pruebasRealizadas.push({ ...c, id: "pr-" + c.id + "-" + (c.fechaProbado||"").slice(0,10) });
        }
      }
      setData({ ...next, pruebasRealizadas });
    } catch (err) {
      console.error("Error de guardado en Supabase:", err);
      showToast("No se pudo completar el guardado. Volvé a intentar.", "alert");
      throw err;
    }
  };

  const showToast = (msg, kind = "done") => {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 3500);
  };

  return (
    <div className={"app" + (isDark ? " dark" : "") + (sesion.rol === "admin" ? " admin-app" : "")}>
      <Style />
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark"/>
          <div>
            <div className="brand-title">Gestión de Supervisión</div>
            <div className="brand-sub">Visitas, seguimiento y control de locales</div>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <span style={{ fontSize:13, color:"#6B7268" }}>{sesion.nombre}</span>
          <button className="dark-toggle" onClick={toggleDark} title={isDark ? "Modo claro" : "Modo oscuro"} style={{ fontSize:13 }}>{isDark ? "☀️" : "🌙"}</button>
          <button className="dark-toggle" onClick={() => setShowCambiarPass(true)} title="Cambiar contraseña" style={{ fontSize:13 }}>🔑</button>
          <button className="dark-toggle" onClick={handleLogout} title="Salir" style={{ fontSize:13 }}>⬡ Salir</button>
        </div>
        <nav className="tabs">
          {(sesion.rol === "supervisor"
              ? [["ruta","Mi ruta"],["historial","Panel"]]
              : [["dashboard","Panel"],["locales","Locales"],["historial","Historial"],["ruta","Ruta del mes"],["competencia","Análisis de Competencia"],["admin","Administración"]]
            ).map(([id,label]) => (
            <button key={id} className={"tab"+(tab===id?" active":"")} onClick={() => setTab(id)}>{label}</button>
          ))}
        </nav>
      </header>
      <main className="content">
        {loadError ? <div className="panel" role="alert">{loadError}<button className="btn" onClick={() => setLoadAttempt(n => n + 1)}>Reintentar</button></div> : !ready ? <div className="loading">Cargando…</div>
          : tab==="dashboard" ? <Dashboard key="panel" data={data} onSave={handleSave} showToast={showToast} sesion={sesion} />
          : tab==="competencia" ? <CompetenciaTab data={data} onSave={handleSave} showToast={showToast} sesion={sesion} />
          : tab==="locales" ? <Locales data={data} onSave={handleSave} showToast={showToast} />
          : tab==="historial" ? (sesion.rol==="supervisor" ? <PanelSupervisor data={data} onSave={handleSave} showToast={showToast} supervisor={sesion.supervisor} /> : <Historial data={data} supervisorFijo={null} />)
          : tab==="ruta" ? (sesion.rol==="admin" ? <RutaMes data={data} onSave={handleSave} showToast={showToast} /> : <MiRuta data={data} irARecorrido={irARecorrido} onSave={handleSave} showToast={showToast} supervisorFijo={sesion.supervisor} sesion={sesion} />)
          : <Admin data={data} onSave={handleSave} showToast={showToast} sesion={sesion} />
        }
      </main>
      {toast && <div className={"toast "+toast.kind}>{toast.msg}</div>}
      {showCambiarPass && (
        <CambiarPass
          usuario={Object.keys(USUARIOS).find((k) => USUARIOS[k].nombre === sesion.nombre) || "admin"}
          onClose={() => setShowCambiarPass(false)}
          onSave={() => showToast("Contraseña actualizada.")}
        />
      )}
    </div>
  );
}

/* ---- LocalesInactivos ---- */
function LocalesInactivos({ data, onSave, showToast }) {
  const inactivos = data.localesInactivos || [];
  const todosLocales = [...(data.locales||[])].sort((a,b) => a.nombre.localeCompare(b.nombre));
  const [saving, setSaving] = React.useState(false);

  const toggle = async (localId) => {
    setSaving(true);
    try {
      const nuevo = inactivos.includes(localId)
        ? inactivos.filter(id => id !== localId)
        : [...inactivos, localId];
      await onSave({ ...data, localesInactivos: nuevo });
      showToast(inactivos.includes(localId) ? "Local reactivado" : "Local marcado como inactivo");
    } catch(e) { showToast("Error al guardar"); }
    finally { setSaving(false); }
  };

  return (
    <div>
      <div className="dim" style={{ fontSize:11, marginBottom:8 }}>Los locales inactivos no aparecen en rutas ni reportes.</div>
      {todosLocales.map(l => (
        <div key={l.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"5px 0", borderBottom:"1px solid var(--line)", fontSize:12 }}>
          <span style={{ color: inactivos.includes(l.id) ? "var(--alert)" : "var(--text)" }}>
            {inactivos.includes(l.id) ? "⏸ " : ""}{l.nombre}
          </span>
          <button className="btn small" style={{ fontSize:10, padding:"2px 8px",
            borderColor: inactivos.includes(l.id) ? "var(--done)" : "var(--alert)",
            color: inactivos.includes(l.id) ? "var(--done)" : "var(--alert)" }}
            onClick={() => toggle(l.id)} disabled={saving}>
            {inactivos.includes(l.id) ? "Reactivar" : "Inactivar"}
          </button>
        </div>
      ))}
    </div>
  );
}

/* ---- BorrarRutas ---- */
function BorrarRutas({ data, onSave, showToast }) {
  const { rutas } = data;
  const [supervisor, setSupervisor] = useState("");
  const [mes, setMes] = useState("");

  const mesesDisp = useMemo(() => {
    const set = new Set((rutas||[]).map((r) => r.fecha?.slice(0,7)).filter(Boolean));
    return [...set].sort().reverse();
  }, [rutas]);

  const borrar = async () => {
    if (!mes) return;
    const filtradas = (rutas||[]).filter((r) => {
      const mismoMes = r.fecha?.startsWith(mes);
      const mismoSup = !supervisor || r.supervisor === supervisor;
      return !(mismoMes && mismoSup);
    });
    const borradas = (rutas||[]).length - filtradas.length;
    await onSave({ ...data, rutas: filtradas });
    showToast(`${borradas} asignación(es) eliminadas.`);
    setMes(""); setSupervisor("");
  };

  const nombreMes = (ym) => {
    if (!ym) return "";
    const [y,m] = ym.split("-");
    return ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][parseInt(m)-1]+" "+y;
  };

  return (
    <div>
      <div className="field-grid">
        <label className="field">
          <span>Mes a borrar</span>
          <select className="input" value={mes} onChange={(e) => setMes(e.target.value)}>
            <option value="">— Elegí el mes —</option>
            {mesesDisp.map((m) => <option key={m} value={m}>{nombreMes(m)}</option>)}
          </select>
        </label>
        <label className="field">
          <span>Supervisor (opcional)</span>
          <select className="input" value={supervisor} onChange={(e) => setSupervisor(e.target.value)}>
            <option value="">Todos</option>
            <option value="Ernesto Aguero">Ernesto Aguero</option>
            <option value="Alexis Arzamendia">Alexis Arzamendia</option>
          </select>
        </label>
      </div>
      <button className="btn" style={{ borderColor:"var(--alert)", color:"var(--alert)" }}
        disabled={!mes} onClick={borrar}>
        Borrar rutas del mes
      </button>
    </div>
  );
}

/* ---- GrupoRuta ---- */
function GrupoRuta({ ruta, locales, data, onSave, showToast, tieneRecorrido }) {
  const [fechaEdit, setFechaEdit] = useState(ruta.fecha);
  const localesDeRuta = (ruta.localIds||[]).map(id => locales.find(l => l.id === id)).filter(Boolean);
  if (localesDeRuta.length === 0) return null;

  const guardarFecha = async (nuevaFecha) => {
    if (!nuevaFecha || nuevaFecha === ruta.fecha) return;
    // Si ya existe otra ruta del mismo supervisor con esa fecha, fusionar
    const rutaDestino = (data.rutas||[]).find(r => r.id !== ruta.id && r.supervisor === ruta.supervisor && r.fecha === nuevaFecha);
    let rutasAct;
    if (rutaDestino) {
      const idsUnicos = [...new Set([...(rutaDestino.localIds||[]), ...(ruta.localIds||[])])];
      rutasAct = (data.rutas||[])
        .filter(r => r.id !== ruta.id)
        .map(r => r.id === rutaDestino.id ? { ...r, localIds: idsUnicos } : r);
    } else {
      rutasAct = (data.rutas||[]).map(r => r.id === ruta.id ? { ...r, fecha: nuevaFecha } : r);
    }
    await onSave({ ...data, rutas: rutasAct });
    showToast("Fecha actualizada.");
  };

  return (
    <div style={{ marginBottom:10, border:"1px solid var(--line)", borderRadius:8, overflow:"hidden" }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 10px", background:"var(--paper-alt)", borderBottom:"1px solid var(--line)" }}>
        <span style={{ fontWeight:700, fontSize:13 }}>📅</span>
        <input type="date" value={fechaEdit}
          style={{ border:"none", background:"transparent", fontWeight:600, fontSize:13, cursor:"pointer", color:"var(--ink)", flex:1 }}
          onChange={(e) => setFechaEdit(e.target.value)}
          onBlur={(e) => guardarFecha(e.target.value)} />
        <span className="dim small">{localesDeRuta.length} local{localesDeRuta.length!==1?"es":""}</span>
      </div>
      {localesDeRuta.map(local => {
        const visitado = tieneRecorrido(local.nombre);
        const noCumpl = !visitado && ruta.fecha < todayISO();
        const eliminar = async (e) => {
          e.stopPropagation();
          if (visitado) return;
          const nuevosIds = ruta.localIds.filter(id => id !== local.id);
          const rutasAct = (data.rutas||[]).map(r => r.id === ruta.id ? { ...r, localIds: nuevosIds } : r).filter(r => r.localIds.length > 0);
          await onSave({ ...data, rutas: rutasAct });
          showToast("Local eliminado.");
        };
        return (
          <div key={local.id} style={{ display:"flex", alignItems:"center", gap:4, padding:"5px 10px", borderBottom:"1px solid var(--line)", background: visitado?"#f0faf5":noCumpl?"#fdf2f2":"#fff" }}>
            <span style={{ flex:1, fontSize:12.5, textDecoration:noCumpl?"line-through":"none", opacity:noCumpl?0.7:1 }}>{local.nombre}</span>
            {visitado
              ? <span style={{ fontSize:10, fontWeight:700, color:"var(--done)" }}>✓</span>
              : noCumpl
                ? <span style={{ fontSize:10, fontWeight:700, color:"var(--alert)" }}>✗</span>
                : <button onClick={eliminar} style={{ background:"none", border:"none", cursor:"pointer", color:"var(--alert)", fontWeight:700, fontSize:13, padding:"0 2px" }}>✕</button>
            }
          </div>
        );
      })}
    </div>
  );
}

/* ---- RutaForm ---- */
function RutaForm({ data, onSave, showToast }) {
  const { locales } = data;
  const [supervisor, setSupervisor] = useState("");
  const [verTodosPrior, setVerTodosPrior] = useState(false);
  const [fecha, setFecha] = useState(todayISO());
  const [search, setSearch] = useState("");
  const [nombresSelec, setNombresSelec] = useState([]);
  const [saving, setSaving] = useState(false);

  const mesActual = fecha ? fecha.slice(0,7) : todayISO().slice(0,7);

  // Locales de la zona del supervisor seleccionado
  const localesZona = useMemo(() => {
    if (!supervisor) return [];
    const zona = supervisor.includes("Ernesto") ? ZONA_SUP1 : ZONA_SUP2;
    const inactivosSet = new Set((data.localesInactivos||[]).map(id => parseInt(id.replace('local-fixed-',''))));
    return LOCALES_FIJOS.filter((n) => {
      const num = parseInt(n.split(" - ")[0].trim());
      return zona.includes(num) && !inactivosSet.has(num);
    });
  }, [supervisor, data.localesInactivos]);

  // Locales filtrados por búsqueda
  const localesFiltrados = useMemo(() => {
    if (!search) return localesZona;
    return localesZona.filter((n) => n.toLowerCase().includes(search.toLowerCase()));
  }, [localesZona, search]);

  // Separar en disponibles y seleccionados
  const disponibles = localesFiltrados.filter((n) => !nombresSelec.includes(n));
  const seleccionados = localesFiltrados.filter((n) => nombresSelec.includes(n));

  const toggleLocal = (nombre) => {
    setNombresSelec((prev) =>
      prev.includes(nombre) ? prev.filter((n) => n !== nombre) : [...prev, nombre]
    );
  };

  // Verificar si ya tiene recorrido en el mes
  const tieneRecorrido = (nombre) => {
    const localObj = locales.find((l) => l.nombre.toLowerCase() === nombre.toLowerCase());
    return localObj && data.visitas.some((v) => v.localId === localObj.id && v.fecha?.startsWith(mesActual));
  };

  // Verificar si ya está en ruta del mes
  const estaEnRuta = (nombre) => {
    const localObj = locales.find((l) => l.nombre.toLowerCase() === nombre.toLowerCase());
    return localObj && (data.rutas||[]).some((r) =>
      r.fecha?.startsWith(mesActual) && r.localIds?.includes(localObj.id)
    );
  };

  const guardar = async () => {
    if (!supervisor || !fecha || nombresSelec.length === 0) return;
    setSaving(true);
    try {
      let localesAct = [...data.locales];
      const idsResueltos = nombresSelec.map((nombre) => {
        let local = localesAct.find((l) => l.nombre.toLowerCase() === nombre.toLowerCase());
        if (!local) { local = { id: uid(), nombre }; localesAct.push(local); }
        return local.id;
      });
      // Si ya existe una ruta para ese supervisor y fecha, fusionar
      const rutaExistente = (data.rutas||[]).find(r => r.supervisor === supervisor && r.fecha === fecha);
      let rutasAct;
      if (rutaExistente) {
        const idsUnicos = [...new Set([...(rutaExistente.localIds||rutaExistente.LocalIds||[]), ...idsResueltos])];
        rutasAct = (data.rutas||[]).map(r => r.id === rutaExistente.id ? { ...r, localIds: idsUnicos } : r);
      } else {
        const nueva = { id: uid(), supervisor, fecha, localIds: idsResueltos, creadaEn: todayISO(), precioCombustible: data.precioCombustible || 6860 };
        rutasAct = [...(data.rutas||[]), nueva];
      }
      await onSave({ ...data, locales: localesAct, rutas: rutasAct });
      showToast(`${nombresSelec.length} locales asignados a ${supervisor.split(" ")[0]} para el ${fmt(fecha)}.`);
      setNombresSelec([]); setSearch("");
    } finally { setSaving(false); }
  };

  return (
    <div>
      <div className="field-grid">
        <label className="field">
          <span>Supervisor</span>
          <select className="input" value={supervisor} onChange={(e) => { setSupervisor(e.target.value); setNombresSelec([]); }}>
            <option value="">— Seleccioná —</option>
            <option value="Ernesto Aguero">Ernesto Aguero — Sup1</option>
            <option value="Alexis Arzamendia">Alexis Arzamendia — Sup2</option>
          </select>
        </label>
        <label className="field">
          <span>Fecha del recorrido</span>
          <input type="date" className="input" value={fecha} onChange={(e) => setFecha(e.target.value)} />
        </label>
      </div>

      {supervisor && (
        <>
          <input className="input" placeholder="Buscar local…" value={search} onChange={(e) => setSearch(e.target.value)} />

          <div className="ruta-dos-col">
            {/* Columna izquierda: todos los locales de la zona para seleccionar */}
            <div className="ruta-col">
              <div className="ruta-col-titulo">Locales de la zona ({localesFiltrados.length})</div>
              <div className="ruta-col-lista">
                {localesFiltrados.map((nombre) => {
                  const selec = nombresSelec.includes(nombre);
                  const visitado = tieneRecorrido(nombre);
                  const enRuta = estaEnRuta(nombre);
                  return (
                    <div key={nombre}
                      className={"ruta-local-item" + (selec ? " ya-selec" : "") + (visitado ? " visitado" : "")}
                      onClick={() => toggleLocal(nombre)}>
                      <span className="ruta-local-nombre">{nombre}</span>
                      {selec && <span className="ruta-tag-mini en-ruta">✓</span>}
                      {visitado && !selec && <span className="ruta-tag-mini visited">visitado</span>}
                      {enRuta && !selec && !visitado && <span className="ruta-tag-mini en-ruta">en ruta</span>}
                      <span className="ruta-add">{selec ? "✕" : "+"}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Columna derecha: agrupado por fecha con edición */}
            <div className="ruta-col">
              <div className="ruta-col-titulo" style={{ color: supervisor.includes("Ernesto") ? "var(--route)" : "var(--pending)" }}>
                {supervisor.includes("Ernesto") ? "Zona Ernesto" : "Zona Alexis"} — Este mes
              </div>
              <div className="ruta-col-lista">
                {(() => {
                  // Agrupar por ruta (fecha)
                  const rutasMes = (data.rutas||[]).filter(r => r.supervisor === supervisor && r.fecha?.startsWith(mesActual));
                  if (rutasMes.length === 0) return <div className="dim small" style={{ padding:8 }}>Sin locales asignados este mes</div>;

                  return rutasMes.sort((a,b) => a.fecha.localeCompare(b.fecha)).map(ruta => (
                    <GrupoRuta key={ruta.id} ruta={ruta} locales={locales} data={data} onSave={onSave} showToast={showToast} tieneRecorrido={tieneRecorrido} />
                  ));
                })()}
              </div>
            </div>
          </div>

          <button className="btn primary" style={{ marginTop:10 }}
            disabled={nombresSelec.length === 0 || saving}
            onClick={guardar}>
            {saving ? "Guardando…" : `Asignar ${nombresSelec.length} locales para el ${fmt(fecha)}`}
          </button>

          {supervisor && (() => {
            const zona = supervisor.includes("Ernesto") ? ZONA_SUP1 : ZONA_SUP2;
            const mesFiltroActual = new Date().toISOString().slice(0,7);
            const prioridadesSup = zona.map(num => {
              const local = locales.find(l => String(parseInt(l.nombre.split(" - ")[0])) === String(num));
              if (!local) return null;
              const inv = (data.inventarios||[]).find(i => i.numLocal === String(num));
              const totalBruto = inv ? Object.values(inv.desviaciones||{}).reduce((a,b) => a+b, 0) : 0;
              const ultimaVisita = (data.visitas||[]).filter(v => v.localId === local.id && !v.borrador).sort((a,b) => (b.fecha||"").localeCompare(a.fecha||""))[0];
              // Si la última visita marcó desvíos resueltos Y es posterior al inventario → no contar desvíos
              const resueltoPosterior = ultimaVisita?.desvioResuelta && inv?.fecha && ultimaVisita.fecha > inv.fecha;
              const total = resueltoPosterior ? 0 : totalBruto;
              const tareasPend = (data.tareas||[]).filter(t => t.localId === local.id && !t.hecha).length;
              const visitasMes = (data.visitas||[]).filter(v => v.localId === local.id && !v.borrador && v.fecha?.startsWith(mesFiltroActual));
              const sinVisitaMes = visitasMes.length === 0;
              const score = total * 2 + (sinVisitaMes ? 5 : 0) + tareasPend * 3;
              if (score === 0) return null;
              return { local, total, tareasPend, sinVisitaMes, fecha: inv?.fecha, ultimaVisita: ultimaVisita?.fecha || "", score };
            }).filter(Boolean).sort((a,b) => b.score - a.score);

            const top5Prior = prioridadesSup.slice(0,5);
            if (prioridadesSup.length === 0) return null;
            return (
              <div style={{ marginTop:16, background:"var(--paper)", borderRadius:10, padding:"12px 14px", border:"1px solid var(--line)" }}>
                <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>📋 Locales con mayor desvío</div>
                <table style={{ width:"100%", fontSize:12, borderCollapse:"collapse" }}>
                  <thead>
                    <tr style={{ borderBottom:"2px solid var(--line)" }}>
                      <th style={{ padding:"3px 6px", textAlign:"left" }}>Local</th>
                      <th style={{ padding:"3px 6px", textAlign:"center" }}>Desvíos</th>
                      <th style={{ padding:"3px 6px", textAlign:"center" }}>Tareas</th>
                      <th style={{ padding:"3px 6px", textAlign:"left" }}>Últ. visita</th>
                    </tr>
                  </thead>
                  <tbody>
                    {(verTodosPrior ? prioridadesSup : top5Prior).map(({ local, total, tareasPend, sinVisitaMes, ultimaVisita }, i) => (
                      <tr key={i} style={{ borderBottom:"1px solid var(--line)" }}>
                        <td style={{ padding:"4px 6px", fontWeight:500 }}>{local.nombre}</td>
                        <td style={{ padding:"4px 6px", textAlign:"center" }}>
                          <span style={{ fontWeight:700, color: total>20?"var(--alert)":total>10?"var(--pending)":"var(--text)" }}>{total || "-"}</span>
                        </td>
                        <td style={{ padding:"4px 6px", textAlign:"center" }}>
                          {tareasPend > 0 ? <span style={{ color:"var(--alert)", fontWeight:700 }}>{tareasPend}</span> : <span className="dim">-</span>}
                        </td>
                        <td style={{ padding:"4px 6px" }} className="dim small">
                          {ultimaVisita ? fmt(ultimaVisita) : <span style={{color:"var(--alert)"}}>Sin visita</span>}
                          {sinVisitaMes && ultimaVisita ? <span style={{color:"var(--alert)", marginLeft:4, fontSize:10}}>· sin visita este mes</span> : null}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {prioridadesSup.length > 5 && (
                  <button className="btn ghost" style={{ marginTop:10, width:"100%", fontSize:12 }}
                    onClick={() => setVerTodosPrior(v => !v)}>
                    {verTodosPrior ? "Ver menos" : `Ver todos (${prioridadesSup.length})`}
                  </button>
                )}
              </div>
            );
          })()}
        </>
      )}
    </div>
  );
}

// Día de la ruta al que corresponde un borrador: el último día de ruta del local (hasta la fecha del borrador) que no tiene visita completa
function diaDeBorrador(fechasRuta, fechaBorrador, hayVisitaEn) {
  return [...(fechasRuta||[])].filter(f => f <= fechaBorrador && !hayVisitaEn(f)).sort().pop() || null;
}

// Lista de artículos con más de 10 meses en stock: entra en la pantalla del celular y muestra la descripción completa
function ListaArticulosViejos({ items }) {
  return (
    <div>
      {(items||[]).map((a, i) => {
        const p = (a.ubicacion||"").split(" - ");
        const ubic = p.length >= 2 ? p[0]+" - "+p[1].split(" ")[0] : (a.ubicacion||"");
        return (
          <div key={i} style={{ padding:"8px 2px", borderBottom:"1px solid rgba(176,42,42,.22)" }}>
            <div style={{ display:"flex", gap:8, alignItems:"baseline" }}>
              <span style={{ fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums", fontWeight:700, fontSize:12, flexShrink:0 }}>{a.codigo}</span>
              <span style={{ fontSize:12, minWidth:0, overflowWrap:"anywhere" }}>{a.descripcion}</span>
            </div>

// Contenido completo de un análisis de competencia (solo lectura)
function DetalleAnalisisCompetencia({ c, quien }) {
  const fila = (label, valor, color) => (valor === undefined || valor === null || valor === "" || (Array.isArray(valor) && valor.length === 0)) ? null : (
    <div style={{ padding:"4px 0", borderBottom:"1px solid var(--line)" }}>
      <b>{label}:</b> <span style={color ? { fontWeight:700, color } : undefined}>{Array.isArray(valor) ? valor.join(", ") : valor}</span>
    </div>
  );
  const colorComp = (v) => v === "Mejor" ? "var(--alert)" : v === "Peor" ? "var(--done)" : "#b37700";
  const bloque = (titulo, texto) => !texto ? null : (
    <div style={{ marginTop:6, fontSize:12, background:"var(--surface-2,#edf1f5)", borderRadius:6, padding:"6px 9px" }}><b>{titulo}:</b> {texto}</div>
  );
  return (
    <div style={{ marginTop:10, borderTop:"1px solid var(--line)", paddingTop:10 }}>
      <div style={{ display:"flex", flexDirection:"column", gap:5, fontSize:12 }}>
        {fila("Cargado por", quien(c.supervisor))}
        {fila("Ubicación / referencia", c.ubicacionReferencia)}
        {fila("Tipo de empeño", c.tipoEmpeño)}
        {fila("Artículo consultado", c.articuloConsultado)}
        {fila("Valor aprox.", c.valorArticulo != null && c.valorArticulo !== "" ? "Gs. " + fmtGs(c.valorArticulo) : "")}
        {fila("Préstamo ofrecido", c.prestamoCom != null && c.prestamoCom !== "" ? "Gs. " + fmtGs(c.prestamoCom) : "")}
        {fila("Comparación del préstamo", c.comparacionPrestamo, colorComp(c.comparacionPrestamo))}
        {fila("Tasa de interés", c.tasaInteres != null && c.tasaInteres !== "" ? String(c.tasaInteres).replace(".", ",") + "%" : "")}
        {fila("Plazo", c.plazo)}
        {fila("Otras condiciones", c.otrasCondiciones)}
        {fila("Comparación del interés", c.comparacionInteres, colorComp(c.comparacionInteres))}
        {fila("Atención al cliente", c.atencion)}
        {fila("Infraestructura", c.infraestructura, colorComp(c.infraestructura))}
        {fila("Captación de clientes", c.captacion)}
        {fila("Nivel de impacto", c.nivelImpacto, c.nivelImpacto === "Alto" ? "var(--alert)" : c.nivelImpacto === "Bajo" ? "var(--done)" : "#b37700")}
      </div>
      {bloque("Ventaja principal", c.ventajaPrincipal)}
      {bloque("Acción recomendada", c.accionRecomendada)}
      {bloque("Otras observaciones", c.oportunidad)}
      {c.fotos?.length > 0 && (
        <div style={{ display:"flex", gap:8, marginTop:8, flexWrap:"wrap" }}>
          {c.fotos.map((f64, fi) => (
            <a key={fi} href={f64} target="_blank" rel="noreferrer">
              <img src={f64} alt={"Foto " + (fi+1)} style={{ width:120, height:85, objectFit:"cover", borderRadius:6, border:"1px solid var(--line)", cursor:"pointer" }} />
            </a>
          ))}
        </div>
      )}
    </div>
  );
}

// Resumen anual de análisis de competencia (pantalla + descarga en Excel)
function ResumenCompetenciaAnual({ analisis, onVolver, showToast }) {
  const anios = React.useMemo(() => {
    const set = new Set((analisis||[]).map(c => (c.fecha||"").slice(0,4)).filter(Boolean));
    set.add(todayISO().slice(0,4));
    return [...set].sort().reverse();
  }, [analisis]);
  const [anio, setAnio] = React.useState(anios[0]);
  const [abierto, setAbierto] = React.useState(null);
  const lista = React.useMemo(() => (analisis||[]).filter(c => (c.fecha||"").startsWith(anio)).sort((a,b) => (a.fecha||"").localeCompare(b.fecha||"")), [analisis, anio]);
  const listaVista = [...lista].reverse();
  const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const porMes = MESES.map((m,i) => ({ mes:m, n: lista.filter(c => Number((c.fecha||"").slice(5,7)) === i+1).length }));
  const GRUPOS = [
    { t:"Préstamo", c:"comparacionPrestamo", v:["Mejor","Igual","Peor"] },
    { t:"Interés", c:"comparacionInteres", v:["Mejor","Igual","Peor"] },
    { t:"Infraestructura", c:"infraestructura", v:["Mejor","Igual","Peor"] },
    { t:"Atención", c:"atencion", v:["Muy buena","Buena","Mala"] },
    { t:"Nivel de impacto", c:"nivelImpacto", v:["Alto","Medio","Bajo"] },
  ];
  const contar = (campo, valor) => lista.filter(c => c[campo] === valor).length;
  const quien = (s) => s==="sup1" ? "Ernesto" : s==="sup2" ? "Alexis" : (s||"");
  const num = (v) => (v != null && v !== "" && isFinite(Number(v))) ? Number(v) : "";

  const descargar = () => {
    if (typeof XLSX === "undefined") { showToast("No se pudo generar el Excel."); return; }
    try {
      const filas = lista.map(c => ({
        "Fecha": c.fecha || "", "Competidor": c.nombre || "", "Ubicación / referencia": c.ubicacionReferencia || "",
        "Tipo de empeño": (c.tipoEmpeño||[]).join(", "), "Artículo consultado": c.articuloConsultado || "",
        "Préstamo (Gs.)": num(c.prestamoCom), "Interés (%)": num(c.tasaInteres), "Plazo": c.plazo || "",
        "Otras condiciones": c.otrasCondiciones || "", "Comparación préstamo": c.comparacionPrestamo || "",
        "Comparación interés": c.comparacionInteres || "", "Atención": c.atencion || "", "Infraestructura": c.infraestructura || "",
        "Captación": (c.captacion||[]).join(", "), "Ventaja principal": c.ventajaPrincipal || "",
        "Nivel de impacto": c.nivelImpacto || "", "Acción recomendada": c.accionRecomendada || "",
        "Otras observaciones": c.oportunidad || "", "Cargado por": quien(c.supervisor),
      }));
      const resumen = [["Año", anio], ["Total de análisis", lista.length], [],
        ...GRUPOS.flatMap(g => [[g.t], ...g.v.map(v => ["  " + v, contar(g.c, v)]), []]),
        ["Por mes"], ...porMes.map(m => ["  " + m.mes, m.n])];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filas), "Análisis " + anio);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumen), "Resumen");
      XLSX.writeFile(wb, "analisis_competencia_" + anio + ".xlsx");
    } catch (e) { showToast("No se pudo generar el Excel."); }
  };

  return (
    <div className="form-page admin-dashboard">
      <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14 }}>
        <button className="btn ghost" onClick={onVolver}>← Volver al resumen</button>
        <button className="btn" onClick={descargar} disabled={lista.length === 0}>⬇ Descargar Excel</button>
      </div>
      <h3 className="lp-titulo-suave" style={{ margin:"0 0 12px", padding:"10px 14px", borderRadius:8, fontSize:14, fontWeight:700 }}>📊 Resumen del año {anio} — {lista.length} análisis</h3>
      {anios.length > 1 && (
        <div className="mes-pills" style={{ marginBottom:12 }}>
          {anios.map(a => <button key={a} className={"mes-pill"+(anio===a?" active":"")} onClick={() => { setAnio(a); setAbierto(null); }}>{a}</button>)}
        </div>
      )}
      {lista.length === 0 ? <div className="dim small">Sin análisis registrados en {anio}.</div> : (
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {listaVista.map((c, i) => {
            const k = c.id || i, exp = abierto === k;
            return (
              <div key={k} className="panel" style={{ borderLeft:"4px solid var(--route)", padding:"12px 16px" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, cursor:"pointer" }} onClick={() => setAbierto(exp ? null : k)}>
                  <div>
                    <div style={{ fontWeight:700, fontSize:14 }}>{c.nombre || "Competidor sin nombre"}</div>
                    <div className="dim small">{c.fecha ? fmt(c.fecha) : ""} · {quien(c.supervisor)}</div>
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    {c.comparacionPrestamo && <span style={{ fontSize:11, fontWeight:700, color: c.comparacionPrestamo === "Mejor" ? "var(--alert)" : c.comparacionPrestamo === "Peor" ? "var(--done)" : "#b37700" }}>Préstamo {c.comparacionPrestamo}</span>}
                    <span style={{ fontSize:16, color:"#aaa" }}>{exp ? "▲" : "▼"}</span>
                  </div>
                </div>
                {exp && <DetalleAnalisisCompetencia c={c} quien={quien} />}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Montos con punto de mil (Gs.)
const fmtMiles = (v) => String(v ?? "").replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const fmtGs = (v) => { const n = Math.round(Number(v)); return isFinite(n) ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".") : String(v); };

// Tasa (%) = interés ÷ préstamo × 100, con 2 decimales. Si falta alguno, no pisa un % cargado a mano.
function calcularTasaForm(f, field, digits) {
  const n = { ...f, [field]: digits };
  if (field === "prestamoCom" || field === "interesMonto") {
    const p = Number(n.prestamoCom), i = Number(n.interesMonto);
    if (n.interesMonto !== "" && p > 0) return { ...n, tasaInteres: String(Math.round(i / p * 10000) / 100), tasaAuto: true };
    if (n.tasaAuto) return { ...n, tasaInteres: "", tasaAuto: false };
  }
  return n;
}

// Valores viejos -> Mejor / Igual / Peor (los registros ya guardados se leen con el nombre nuevo)
function normComp(v) {
  const m = { "Mayor":"Mejor", "Más favorable":"Mejor", "Menor":"Peor", "Menos favorable":"Peor", "Similar":"Igual" };
  return Object.prototype.hasOwnProperty.call(m, v) ? m[v] : (v ?? "");
}

function AnalisisCompetencia({ supervisor, locales, showToast, onDone }) {
  const [form, setForm] = React.useState({
    nombre: "", tipoEmpeño: [], articuloConsultado: "", valorArticulo: "", prestamoCom: "",
    comparacionPrestamo: "", interesMonto: "", tasaInteres: "", tasaAuto: false, plazo: "", comparacionInteres: "",
    atencion: "", infraestructura: "", captacion: [], ventajaPrincipal: "", oportunidad: "",
    ubicacionReferencia: "", otrasCondiciones: "", nivelImpacto: "", accionRecomendada: "",
    fotos: [],
  });
  const [saving, setSaving] = React.useState(false);

  const handleFotos = (e) => {
    const files = Array.from(e.target.files).slice(0, 2 - form.fotos.length);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        // Reducir calidad: redimensionar a max 800px
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const max = 800;
          let w = img.width, h = img.height;
          if (w > max) { h = Math.round(h * max / w); w = max; }
          if (h > max) { w = Math.round(w * max / h); h = max; }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const b64 = canvas.toDataURL("image/jpeg", 0.7);
          setForm(f => ({ ...f, fotos: [...f.fotos, b64].slice(0,2) }));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    e.target.value = "";
  };

  const toggle = (field, val) => setForm(f => ({
    ...f, [field]: f[field].includes(val) ? f[field].filter(x => x !== val) : [...f[field], val]
  }));
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const COMP_COLOR = { "Mejor":"verde", "Muy buena":"verde", "Bajo":"verde", "Igual":"amarillo", "Buena":"amarillo", "Medio":"amarillo", "Peor":"rojo", "Mala":"rojo", "Alto":"rojo" };
  const field = (key, label, ph) => (
    <label className="comp-field"><span>{label}</span>
      <input value={form[key]} placeholder={ph || ""} autoComplete="off" onChange={e => set(key, e.target.value)} />
    </label>
  );
  const monto = (key, label) => (
    <label className="comp-field"><span>{label}</span>
      <input inputMode="numeric" value={fmtMiles(form[key])} placeholder="0"
        onChange={e => setForm(f => calcularTasaForm(f, key, e.target.value.replace(/\D/g, "")))} />
    </label>
  );
  const area = (key, label, ph) => (
    <label className="comp-field"><span>{label}</span>
      <textarea value={form[key]} placeholder={ph || ""} onChange={e => set(key, e.target.value)} />
    </label>
  );
  const radios = (key, opts) => (
    <div className="comp-radios">
      {opts.map(([v, t]) => (
        <label key={v}>
          <input type="radio" name={"comp-" + key} checked={form[key] === v} onChange={() => set(key, v)} />
          <i className={"comp-dot " + (COMP_COLOR[v] || "neutral")} />{t}
        </label>
      ))}
    </div>
  );
  const checks = (key, opts) => (
    <div className="comp-rubros">
      {opts.map(v => (
        <label key={v}><input type="checkbox" checked={form[key].includes(v)} onChange={() => toggle(key, v)} />{v}</label>
      ))}
    </div>
  );
  const sub = (t) => <div className="comp-sub">{t}</div>;
  const semaforos = (key, title, items) => (
    <fieldset className="comp-semaforos">
      <legend>{title}</legend>
      <div className="comp-semaforo-grid">
        {items.map(([v, color, label, detalle]) => (
          <label key={v} className={"comp-opcion " + (form[key] === v ? "seleccionada" : "")}>
            <input type="radio" name={"sem-" + key} checked={form[key] === v} onChange={() => set(key, v)} />
            <i className={"comp-dot " + color} />
            <span><b>{label}</b>{detalle && <small>{detalle}</small>}</span>
          </label>
        ))}
      </div>
    </fieldset>
  );
  const COMPARA = [["Mejor","Mejor"],["Igual","Igual"],["Peor","Peor"],["No determinado","No se pudo determinar"]];
  const guardar = async () => {
    if (!form.nombre.trim()) { showToast("Ingresá el nombre del competidor"); return; }
    setSaving(true);
    try {
      const nuevoId = uid();
      const nuevaFecha = new Date().toISOString().slice(0,10);
      await supaWriteOne("analisis_competencia", {
        id: nuevoId,
        supervisor: supervisor||"", fecha: nuevaFecha,
        nombre: form.nombre||null, tipo_empeno: form.tipoEmpeño||[],
        articulo_consultado: form.articuloConsultado||null,
        valor_articulo: form.valorArticulo?parseFloat(form.valorArticulo):null,
        prestamo_com: form.prestamoCom?parseFloat(form.prestamoCom):null,
        comparacion_prestamo: form.comparacionPrestamo||null,
        tasa_interes: form.tasaInteres?parseFloat(form.tasaInteres):null,
        plazo: form.plazo||null, comparacion_interes: form.comparacionInteres||null,
        atencion: form.atencion||null, infraestructura: form.infraestructura||null,
        captacion: form.captacion||[], ventaja_principal: form.ventajaPrincipal||null,
        oportunidad: form.oportunidad||null, fotos: form.fotos||[],
        ubicacion_referencia: form.ubicacionReferencia||null, otras_condiciones: form.otrasCondiciones||null,
        nivel_impacto: form.nivelImpacto||null, accion_recomendada: form.accionRecomendada||null,
      });
      onDone({ id:nuevoId, supervisor:supervisor||"", fecha:nuevaFecha, ...form });
    } catch(e) { showToast("Error al guardar"); }
    finally { setSaving(false); }
  };
  return (
    <div className="competencia-v3">
      <style>{COMP_CSS}</style>
      <h1 className="comp-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="6" stroke="currentColor" strokeWidth="1.5" />
          <path d="m13.5 13.5 8 8-2 2-8-8" stroke="currentColor" strokeWidth="1.5" />
        </svg>
        Análisis de Competencia
      </h1>

      <section>
        <h2>1. IDENTIFICACIÓN Y ENTORNO</h2>
        {field("nombre", "Nombre del competidor", "Nombre del negocio competidor")}
        <div className="comp-grid2">
          {field("ubicacionReferencia", "Ubicación / Referencia", "Indicar ubicación o referencia")}
        </div>
        {sub("¿Qué tipo de empeño realiza?")}
        {checks("tipoEmpeño", ["Oro / Joyas", "Mercaderías", "Oro y mercaderías", "No realiza empeños"])}
      </section>

      <section>
        <h2>2. TASACIÓN Y PRÉSTAMO</h2>
        {field("articuloConsultado", "Artículo consultado")}
        <div className="comp-calculo">
          <div className="comp-grid3">
            {monto("prestamoCom", "Préstamo ofrecido (Gs.)")}
            {monto("interesMonto", "Interés a pagar (Gs.)")}
            <label className="comp-field"><span>Tasa de interés (%)</span>
              <input inputMode="decimal" readOnly={form.tasaAuto} value={String(form.tasaInteres).replace(".", ",")} placeholder="0"
                onChange={e => setForm(f => ({ ...f, tasaInteres: e.target.value.replace(",", ".").replace(/[^0-9.]/g, ""), tasaAuto: false }))} />
            </label>
          </div>
          <div className="comp-grid2">
            {field("plazo", "Plazo")}
            {field("otrasCondiciones", "Otras condiciones (opcional)")}
          </div>
          <div className="comp-resultado" aria-live="polite">
            <span>Tasa de interés: {form.tasaInteres === "" || form.tasaInteres == null ? "—" : String(form.tasaInteres).replace(".", ",") + "%"}</span>
            <span className="comp-badge neutral"><i />{form.tasaAuto ? "Calculada: interés ÷ préstamo × 100" : "Ingresada manualmente"}</span>
          </div>
        </div>
      </section>

      <section>
        <h2>3. COMPARATIVA Y EXPERIENCIA</h2>

        {semaforos("comparacionPrestamo", "Comparación del monto de préstamo", [["Mejor","rojo","Amenaza","El competidor presta más dinero."],["Igual","amarillo","Empate","Presta un monto similar."],["Peor","verde","Nos favorece","El competidor presta menos dinero."]])}
        {semaforos("comparacionInteres", "Comparación del interés", [["Mejor","rojo","Amenaza","El competidor cobra menos interés."],["Igual","amarillo","Empate","El competidor cobra un interés similar."],["Peor","verde","Nos favorece","El competidor cobra más interés."]])}
        {semaforos("atencion", "Atención al cliente", [["Muy buena","verde","Muy buena","Atención rápida, clara y cordial."],["Buena","amarillo","Buena","Atención normal."],["Mala","rojo","Mala","Demoras o atención deficiente."]])}
        {semaforos("infraestructura", "Infraestructura del local", [["Mejor","verde","Buena","Local limpio, ordenado y bien presentado."],["Igual","amarillo","Regular","Condiciones aceptables, con aspectos por mejorar."],["Peor","rojo","Mala","Instalaciones deterioradas, desorden o problemas visibles."]])}
      </section>

      <section>
        <h2>4. CAPTACIÓN E IMPACTO</h2>
        {sub("¿Cómo busca captar clientes?")}
        {checks("captacion", ["Mayor tasación / préstamo", "Menor interés", "Promociones", "Publicidad", "Referidos", "Otro", "No se observaron acciones"])}
        {semaforos("nivelImpacto", "Nivel de impacto", [["Bajo","verde","Bajo","Poca influencia sobre nuestro local."],["Medio","amarillo","Medio","Influencia moderada."],["Alto","rojo","Alto","Puede quitarnos clientes."]])}
      </section>

      <section>
        <h2>5. DIAGNÓSTICO Y PLAN DE ACCIÓN</h2>
        <div className="comp-grid2 comp-diagnostico">
          {area("ventajaPrincipal", "Principal ventaja del competidor", "Describir brevemente")}
          {area("oportunidad", "Otras observaciones", "Escribir otras observaciones (opcional)")}
        </div>
        {area("accionRecomendada", "Acción recomendada", "Indicar qué acción podría realizarse a partir de lo observado")}
        <label className="comp-field">
          <span>Evidencia fotográfica (Máximo 2 fotos)</span>
          <span className="comp-file">
            <span>{form.fotos.length >= 2 ? "Máximo alcanzado" : "📷 Agregar foto"}</span>
            <input type="file" accept="image/*" capture="environment" multiple disabled={form.fotos.length >= 2} onChange={handleFotos} />
          </span>
        </label>
        {form.fotos.length > 0 && (
          <div className="comp-fotos">
            {form.fotos.map((f64, i) => (
              <figure key={i}>
                <img src={f64} alt={"Evidencia " + (i + 1)} />
                <button type="button" onClick={() => setForm(f => ({ ...f, fotos: f.fotos.filter((_, j) => j !== i) }))}>Quitar foto {i + 1}</button>
              </figure>
            ))}
          </div>
        )}
      </section>

      <button type="button" className="comp-guardar" onClick={guardar} disabled={saving}>{saving ? "Guardando…" : "Guardar Análisis de Competencia"}</button>
    </div>
  );
}

function FichaCompetenciaCompacta({ c, onVolver }) {
  const COLOR = { "Mejor":"verde", "Muy buena":"verde", "Bajo":"verde", "Igual":"amarillo", "Buena":"amarillo", "Medio":"amarillo", "Peor":"rojo", "Mala":"rojo", "Alto":"rojo" };
  const quien = c.supervisor === "sup1" ? "Ernesto Aguero" : c.supervisor === "sup2" ? "Alexis Arzamendia" : (c.supervisor || "—");
  const ETQ = {
    prestamo: { Mejor:["Amenaza","rojo"], Igual:["Empate","amarillo"], Peor:["Nos favorece","verde"] },
    interes: { Mejor:["Amenaza","rojo"], Igual:["Empate","amarillo"], Peor:["Nos favorece","verde"] },
    infra: { Mejor:["Buena","verde"], Igual:["Regular","amarillo"], Peor:["Mala","rojo"] },
  };
  const chip = (v, tipo) => {
    if (!v) return "—";
    const [txt, col] = (tipo && ETQ[tipo][v]) || [v, COLOR[v] || "neutral"];
    return <span className="ct-chip"><i className={col} />{txt}</span>;
  };
  const gs = (v) => v || v === 0 ? "Gs. " + fmtGs(v) : "—";
  const dato = (label, valor) => <div className="ct-dato"><span>{label}</span><b>{valor || "—"}</b></div>;
  const tasa = c.tasaInteres !== null && c.tasaInteres !== undefined && c.tasaInteres !== "" ? Number(c.tasaInteres).toFixed(2).replace(".", ",") + "%" : "—";
  return (
    <div className="ct-ficha">
      <button className="btn ghost" style={{ marginBottom:10 }} onClick={onVolver}>← Volver al listado</button>
      <div className="ct-ficha-head">

        <span className="ct-tasa">Tasa: {tasa}</span>
      </div>
      <div className="ct-grid">
        <div className="ct-bloque">
          <h4>Préstamo / tasación</h4>
          {dato("Tipo de empeño", (c.tipoEmpeño || []).join(", "))}
          {dato("Artículo", c.articuloConsultado)}
          {c.valorArticulo ? dato("Valor aprox.", gs(c.valorArticulo)) : null}
          {dato("Préstamo ofrecido", gs(c.prestamoCom))}
          {dato("Comparación", chip(c.comparacionPrestamo, "prestamo"))}
        </div>
        <div className="ct-bloque">
          <h4>Interés y condiciones</h4>
          {dato("Tasa", tasa)}
          {dato("Plazo", c.plazo)}
          {dato("Comparación", chip(c.comparacionInteres, "interes"))}
          {c.otrasCondiciones ? dato("Otras condiciones", c.otrasCondiciones) : null}
        </div>
        <div className="ct-bloque">
          <h4>Experiencia e impacto</h4>
          {dato("Atención", chip(c.atencion))}
          {dato("Infraestructura", chip(c.infraestructura, "infra"))}
          {dato("Nivel de impacto", chip(c.nivelImpacto))}
          {dato("Captación", (c.captacion || []).join(", "))}
        </div>
      </div>
      <div className="ct-textos">
        <div className="ct-texto"><b>Ventaja del competidor</b>{c.ventajaPrincipal || "—"}</div>
        <div className="ct-texto"><b>Acción recomendada</b>{c.accionRecomendada || "—"}</div>
        <div className="ct-texto"><b>Otras observaciones</b>{c.oportunidad || "—"}</div>
      </div>
      {c.fotos?.length > 0 && (
        <div className="ct-fotos">
          {c.fotos.map((f, i) => <a key={i} href={f} target="_blank" rel="noreferrer"><img src={f} alt={"Foto " + (i + 1)} /></a>)}
        </div>
      )}
    </div>
  );
}

function CompetenciaTab({ data, onSave, showToast, sesion }) {
  const [vista, setVista] = React.useState("lista");
  const [sel, setSel] = React.useState(null);
  const lista = [...(data.analisisCompetencia || [])].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  const quien = (s) => s === "sup1" ? "Ernesto Aguero" : s === "sup2" ? "Alexis Arzamendia" : (s || "—");
  const quitar = async (c) => {
    if (!window.confirm(`¿Quitar el análisis de "${c.nombre}" (${c.fecha})? Esta acción no se puede deshacer.`)) return;
    try {
      await supaRemoveVerificado("analisis_competencia", c.id);
      onSave({ ...data, analisisCompetencia: (data.analisisCompetencia || []).filter(x => x.id !== c.id) });
      showToast("Análisis quitado");
    } catch (e) { showToast("No se pudo quitar. Volvé a intentar."); }
  };
  let contenido;
  if (vista === "nuevo") contenido = (
    <div>
      <button className="btn ghost" style={{ marginBottom:14 }} onClick={() => setVista("lista")}>← Volver al listado</button>
      <AnalisisCompetencia supervisor={sesion?.nombre || "Administrador"} locales={data.locales} showToast={showToast}
        onDone={(nuevo) => {
          if (nuevo) onSave({ ...data, analisisCompetencia: [...(data.analisisCompetencia || []), nuevo] });
          setVista("lista");
          showToast("Análisis guardado");
        }} />
    </div>
  );
  else if (vista === "resumen") contenido = <ResumenCompetenciaAnual analisis={data.analisisCompetencia || []} onVolver={() => setVista("lista")} showToast={showToast} />;
  else if (vista === "ficha" && sel) contenido = <FichaCompetenciaCompacta c={sel} onVolver={() => { setSel(null); setVista("lista"); }} />;
  else contenido = (
    <div className="ct-card">
      <h2>Análisis de Competencia</h2>
      <div className="ct-acciones-top">
        <button className="btn" onClick={() => setVista("nuevo")}>Nuevo análisis</button>
        <button className="btn ghost" onClick={() => setVista("resumen")}>📊 Resumen del año</button>
      </div>
      {lista.length === 0 ? <div className="dim small">Sin análisis registrados.</div> : (
        <div className="admin-table-scroll">
          <table className="ct-tabla">
            <thead><tr><th>Fecha</th><th>Competidor</th><th>Registrado por</th><th>Tasa mensual</th><th>Acciones</th></tr></thead>
            <tbody>
              {lista.map(c => (
                <tr key={c.id}>
                  <td>{c.fecha}</td>
                  <td>{c.nombre}</td>
                  <td>{quien(c.supervisor)}</td>
                  <td>{c.tasaInteres !== null && c.tasaInteres !== undefined && c.tasaInteres !== "" ? Number(c.tasaInteres).toFixed(2) + "%" : "—"}</td>
                  <td className="ct-btns">
                    <button className="btn ghost" onClick={() => { setSel(c); setVista("ficha"); }}>Consultar</button>
                    <button className="btn ghost" style={{ color:"var(--alert)" }} onClick={() => quitar(c)}>Quitar</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
  return <div className="form-page"><style>{COMP_TAB_CSS}</style>{contenido}</div>;
}

function MiRuta({ data, irARecorrido, onSave, showToast, supervisorFijo, sesion }) {
  const { locales, visitas, rutas } = data;
  const [supervisor, setSupervisor] = useState(supervisorFijo || "");
  const [localActivo, setLocalActivo] = useState(null);
  const [mostrarAdicional, setMostrarAdicional] = useState(false);
  const [mostrarCompetencia, setMostrarCompetencia] = useState(false);
  const [mostrarPendientes, setMostrarPendientes] = useState(false);
  const [historialLocal, setHistorialLocal] = useState(null);
  const [visitaHistorial, setVisitaHistorial] = useState(null);
  const [filtroDias, setFiltroDias] = useState("todas");
  const [diasAbiertos, setDiasAbiertos] = useState({});
  // Botón "atrás" del celular: con la encuesta abierta vuelve a Mi ruta (no sale de la app ni reabre una encuesta vieja)
  const encuestaAbierta = !!(localActivo || mostrarAdicional || mostrarCompetencia);
  useEffect(() => {
    if (!encuestaAbierta) return;
    try { window.history.pushState({ lpEnc: 1 }, ""); } catch (e) {}
    const alVolver = () => { setLocalActivo(null); setMostrarAdicional(false); setMostrarCompetencia(false); };
    window.addEventListener("popstate", alVolver);
    return () => {
      window.removeEventListener("popstate", alVolver);
      try { if (window.history.state && window.history.state.lpEnc) window.history.back(); } catch (e) {}
    };
  }, [encuestaAbierta]);

  const localName = (id) => locales.find((l) => l.id === id)?.nombre || id;

  const rutasDelSup = useMemo(() => {
    if (!supervisor) return [];
    const mesActual = todayISO().slice(0,7);
    return [...(rutas||[]).filter((r) => r.supervisor === supervisor && r.fecha?.startsWith(mesActual))]
      .sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
  }, [rutas, supervisor]);

  const diasAgrupados = useMemo(() => {
    const map = {};
    rutasDelSup.forEach((r) => {
      if (!map[r.fecha]) map[r.fecha] = [];
      map[r.fecha].push(...r.localIds);
    });
    const hoy = todayISO();
    return Object.entries(map).sort(([a],[b]) => {
      if (a === hoy) return -1; if (b === hoy) return 1;
      return a < b ? -1 : 1;
    });
  }, [rutasDelSup]);

  const visitasPorLocal = useMemo(() => {
    if (!supervisor) return {};
    const mesActual = new Date().toISOString().slice(0,7);
    const map = {};
    visitas.filter((v) => v.supervisor === supervisor && !v.borrador && v.fecha?.startsWith(mesActual)).forEach((v) => {
      if (!map[v.localId]) map[v.localId] = [];
      map[v.localId].push(v);
    });
    return map;
  }, [visitas, supervisor]);

  // Borradores de este supervisor guardados en la base: fecha del último borrador por local
  const borradoresDB = useMemo(() => {
    const m = {};
    (visitas||[]).filter((v) => v.borrador && v.supervisor === supervisor && v.localId).forEach((v) => {
      if (!m[v.localId] || (v.fecha||"") > m[v.localId]) m[v.localId] = v.fecha || "";
    });
    return m;
  }, [visitas, supervisor]);
  // Fecha del borrador de un local: el de la base o el guardado en este teléfono (el más reciente)
  const fechaBorradorDeLocal = (id) => {
    const db = borradoresDB[id] || "";
    let dev = "";
    const raw = localStorage.getItem("rec-draft-" + id);
    if (raw) { try { dev = JSON.parse(raw)?.fecha || todayISO(); } catch (e) { dev = todayISO(); } }
    return (db > dev ? db : dev) || null;
  };

  const totalLocales = diasAgrupados.reduce((acc, [, ids]) => acc + ids.length, 0);
  const inactivos = new Set((data.localesInactivos||[]).map(id => parseInt(id.replace('local-fixed-',''))));
  const zonaTotal = (supervisor?.includes("Ernesto") ? ZONA_SUP1 : ZONA_SUP2).filter(n => !inactivos.has(n));
  const visitados = zonaTotal.filter(num => visitasPorLocal["local-fixed-"+num]?.length > 0).length;
  const idsEnRuta = new Set(diasAgrupados.flatMap(([, ids]) => ids));
  const pendientesZona = zonaTotal
    .filter(num => !idsEnRuta.has("local-fixed-"+num) && !visitasPorLocal["local-fixed-"+num]?.length)
    .map(num => locales.find(l => l.id === "local-fixed-"+num) || { id:"local-fixed-"+num, nombre: LOCALES_FIJOS.find(n=>String(parseInt(n.split(" - ")[0]))===String(num))||String(num) });

  if (visitaHistorial) {
    return <VistaRecorrido v={visitaHistorial} locales={locales} onVolver={() => setVisitaHistorial(null)} />;
  }

  if (historialLocal) {
    const historial = (visitas||[])
      .filter(v => v.localId === historialLocal && v.supervisor === supervisor && !v.borrador)
      .sort((a,b) => ((b.fecha||"") + (b.horaLlegada||"")).localeCompare((a.fecha||"") + (a.horaLlegada||"")));
    return (
      <div className="form-page">
        <button className="btn ghost" style={{ marginBottom:12 }} onClick={() => setHistorialLocal(null)}>← Volver a mi ruta</button>
        <h2 className="page-title" style={{ marginBottom:4 }}>Historial del local</h2>
        <div className="dim small" style={{ marginBottom:14 }}>{localName(historialLocal)} · {historial.length} visita{historial.length === 1 ? "" : "s"}</div>
        {historial.length === 0 ? (
          <div className="empty-hero small"><p>Este local todavía no tiene visitas registradas por el supervisor.</p></div>
        ) : (
          <div className="list history">
            {historial.map(v => {
              const meta = ESTADOS[estadoVisita(v, data.codigos, data.pruebasRealizadas)];
              const score = calcScore(v, data.codigos, data.pruebasRealizadas);
              return (
                <button key={v.id} className="hist-head hist-card" onClick={() => setVisitaHistorial(v)}>
                  <span className="dot" style={{ background:meta.color }}/>
                  <div className="list-main">
                    <div style={{ fontWeight:700 }}>{fmt(v.fecha)}{v.horaLlegada ? " · "+v.horaLlegada : ""}</div>
                    <div className="mono dim small">{score === null ? "Sin puntuación" : score+" puntos"}</div>
                  </div>
                  <TendenciaBadge visita={v} data={data} />
                  <span className="badge" style={{ color:meta.color, borderColor:meta.color }}>{meta.label}</span>
                  <span style={{ color:"var(--route)", fontSize:16 }}>›</span>
                </button>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // Cuando hay encuesta abierta, mostrar solo la encuesta
  const enEncuesta = localActivo || mostrarAdicional || mostrarCompetencia;

  if (enEncuesta) return (
    <div className="form-page">
        <div>
          <button className="btn ghost" style={{ marginBottom:12 }} onClick={() => { setLocalActivo(null); setMostrarAdicional(false); setMostrarCompetencia(false); }}>
            ← Volver a mi ruta
          </button>
          {mostrarCompetencia ? (
            <AnalisisCompetencia
              supervisor={supervisorFijo}
              locales={locales}
              showToast={showToast}
              onDone={(nuevo) => {
                if (nuevo) onSave({ ...data, analisisCompetencia:[...(data.analisisCompetencia||[]), nuevo] });
                setMostrarCompetencia(false);
                showToast("Análisis guardado");
              }}
            />
          ) : (
          <NuevoRecorrido
            showToast={showToast}
            data={data}
            onSave={onSave}
            localPrecargado={localActivo}
            esAdicional={mostrarAdicional}
            supervisorFijo={supervisorFijo}
            onDone={(m) => {
              showToast(m);
              setLocalActivo(null);
              setMostrarAdicional(false);
            }}
          />
          )}
        </div>

    </div>
  );

  // ---- Datos de la vista ----
  const hoyISO = todayISO();
  const infoDias = diasAgrupados.map(([fecha, localIds]) => {
    const locs = localIds.map((id) => {
      const visitaDelDia = (visitasPorLocal[id]||[]).find(v => v.fecha === fecha);
      const visitado = !!visitaDelDia;
      const fechaBorr = visitado ? null : fechaBorradorDeLocal(id);
      const diaBorr = fechaBorr ? diaDeBorrador(diasAgrupados.filter(([, ids]) => ids.includes(id)).map(([f]) => f), fechaBorr, (f) => (visitasPorLocal[id]||[]).some(v => v.fecha === f)) : null;
      const tieneBorrador = !visitado && diaBorr === fecha;
      const noCumplido = !visitado && !tieneBorrador && fecha < hoyISO;
      const estado = visitado ? "ok" : tieneBorrador ? "draft" : noCumplido ? "nocumplido" : "pendiente";
      const tend = visitado ? getTendenciaVisita(visitaDelDia, data.visitas, data.codigos, data.pruebasRealizadas) : null;
      return { id, estado, visitaDelDia, tend: tend?.tipo || null };
    });
    const completados = locs.filter(l => l.estado === "ok").length;
    return {
      fecha, locs, completados, total: locs.length, listo: completados === locs.length,
      pendientes: locs.filter(l => l.estado === "pendiente" || l.estado === "draft").length,
      noCumplidos: locs.filter(l => l.estado === "nocumplido").length,
      mejoro: locs.filter(l => l.tend === "mejoro").length,
      agravo: locs.filter(l => l.tend === "agravo").length,
      mantiene: locs.filter(l => l.tend === "bien" || l.tend === "desvios").length,
    };
  });
  const diaFoco = infoDias.some(d => d.fecha === hoyISO) ? hoyISO : (infoDias.map(d => d.fecha).filter(f => f > hoyISO).sort()[0] || null);
  const abierto = (d) => diasAbiertos[d.fecha] ?? (d.fecha === diaFoco && !d.listo);
  const filtros = [
    ["todas", "Todos los días (" + infoDias.length + ")", () => true, null],
    ["mejoro", "🟢 Mejoró", d => d.mejoro > 0, "mejoro"],
    ["mantiene", "🟡 Se mantiene", d => d.mantiene > 0, "mantiene"],
    ["agravo", "🔴 Se agravó", d => d.agravo > 0, "agravo"],
  ];
  const filtroFn = (filtros.find(f => f[0] === filtroDias) || filtros[0])[2];
  const pct = zonaTotal.length > 0 ? Math.round(visitados / zonaTotal.length * 100) : 0;
  const fechaLarga = (f) => { try { return new Date(f + "T12:00:00").toLocaleDateString("es-ES", { weekday:"short", day:"2-digit", month:"short" }); } catch (e) { return fmt(f); } };

  return (
    <div className="form-page mr">
      <style>{MR_CSS}</style>
      <div className="mr-layout">
        <aside className="mr-col-ay">
          <AyudantesCapacitacion data={data} onSave={onSave} showToast={showToast} soloLectura={true} sesion={sesion} modoRuta={true} />
        </aside>

        <div className="mr-col-ruta">
          <div className="mr-head">
            <h2>Mi ruta</h2>
            {supervisor && (
              <div className="mr-head-btns">
                <button className="btn" onClick={() => setMostrarAdicional(true)}>+ Local adicional</button>
                <button className="btn ghost" onClick={() => setMostrarCompetencia(true)}>🔍 Competencia</button>
              </div>
            )}
          </div>

          {!supervisorFijo && (
            <div className="panel">
              <div className="panel-title">Supervisor</div>
              <select className="input" value={supervisor} onChange={(e) => setSupervisor(e.target.value)}>
                <option value="">— Seleccioná tu nombre —</option>
                <option value="Ernesto Aguero">Ernesto Aguero — Sup1</option>
                <option value="Alexis Arzamendia">Alexis Arzamendia — Sup2</option>
              </select>
            </div>
          )}

          {supervisor && diasAgrupados.length === 0 && (
            <div className="empty-hero small"><p>No tenés locales asignados todavía.</p></div>
          )}

          {diasAgrupados.length > 0 && (
            <>
              <div className="mr-card mr-resumen">
                <div className="mr-prog-top"><span><b>{visitados}</b> de {zonaTotal.length} locales visitados</span><b>{pct}%</b></div>
                <div className="mr-bar"><span style={{ width: pct + "%" }} /></div>
                <div className="mr-zona">
                  <div className="mr-zona-head">
                    <span><b>Locales de mi zona</b></span>
                    <span className="mr-leyenda"><i className="ok" />Visitado <i className="no" />Pendiente</span>
                  </div>
                  <div className="mr-zona-grid">
                    {zonaTotal.map(num => {
                      const ok = visitasPorLocal["local-fixed-" + num]?.length > 0;
                      return <span key={num} className={"mr-num " + (ok ? "ok" : "no")} title={localName("local-fixed-" + num)}>{num}</span>;
                    })}
                  </div>
                </div>
              </div>

              <div className="mr-filtros">
                {filtros.map(([id, label, fn, campo]) => (
                  <button key={id} type="button" className={"mr-filtro" + (filtroDias === id ? " activo" : "")} onClick={() => setFiltroDias(id)}>
                    {label}{campo ? " (" + infoDias.reduce((n, d) => n + d[campo], 0) + ")" : ""}
                  </button>
                ))}
              </div>

              {infoDias.filter(filtroFn).map(d => {
                const open = abierto(d);
                return (
                  <div key={d.fecha} className={"mr-dia" + (open ? " abierto" : "") + (d.fecha === hoyISO ? " hoy" : "")}>
                    <button type="button" className="mr-dia-head" onClick={() => setDiasAbiertos(m => ({ ...m, [d.fecha]: !open }))}>
                      <span className="mr-dia-fecha">📅 <b>{fechaLarga(d.fecha)}</b>{d.fecha === hoyISO && <em>Hoy</em>}</span>
                      <span className="mr-dia-info">{d.completados}/{d.total} completados{d.listo ? <span className="mr-dc"> · Día completo</span> : null}</span>
                      <span className="mr-dia-badges">
                        {d.mejoro > 0 && <span className="mr-pill verde">{d.mejoro} Mejoró ↑</span>}
                        {d.mantiene > 0 && <span className="mr-pill ambar">{d.mantiene} Se mantiene →</span>}
                        {d.agravo > 0 && <span className="mr-pill rojo">{d.agravo} Se agravó ↓</span>}
                        {d.noCumplidos > 0 && <span className="mr-pill rojo">{d.noCumplidos} No cumplido</span>}
                        {!d.listo && d.pendientes > 0 && <span className="mr-pill ambar">{d.pendientes} Pendiente{d.pendientes === 1 ? "" : "s"}</span>}
                      </span>
                      <span className="mr-chev">{open ? "▲" : "▼"}</span>
                    </button>
                    {open && (
                      <div className="mr-locales">
                        {d.locs.map(l => {
                          const click = l.estado === "ok" ? () => setHistorialLocal(l.id) : l.estado !== "nocumplido" ? () => setLocalActivo(l.id) : undefined;
                          return (
                            <div key={l.id} className={"mr-local " + l.estado + (l.tend === "agravo" ? " agravo" : "") + (click ? " clic" : "")} onClick={click}>
                              <span className="mr-local-ico">{l.estado === "ok" ? "✓" : l.estado === "draft" ? "●" : l.estado === "nocumplido" ? "✗" : "+"}</span>
                              <div className="mr-local-info">
                                <div className="mr-local-nombre">{localName(l.id)}</div>
                                {l.estado === "ok" && <TendenciaRuta visita={l.visitaDelDia} data={data} />}
                                {l.estado === "pendiente" && <span className="mr-pill ambar">⏳ Pendiente</span>}
                                {l.estado === "draft" && <span className="mr-pill ambar">● Borrador</span>}
                                {l.estado === "nocumplido" && <span className="mr-pill rojo">No cumplido</span>}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </>
          )}
        </div>
      </div>
    </div>
  );
}
