/* ---- VistaRecorrido (solo lectura, igual que encuesta supervisor) ---- */
function VistaRecorrido({ v, locales, onVolver }) {
  const localName = (id) => locales.find(l => l.id === id)?.nombre || id;
  const fld = (label, val) => val ? (
    <div style={{ padding:"8px 0", borderBottom:"1px solid var(--line)", fontSize:13 }}>
      <span style={{ fontWeight:600, color:"#555", marginRight:6 }}>{label}:</span>
      <span>{val}</span>
    </div>
  ) : null;

  const check = (label, val) => (
    <div style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 0", borderBottom:"1px solid var(--line)", fontSize:13 }}>
      <span style={{ fontWeight:700, fontSize:15, color: val==="Si"?"var(--done)":"var(--alert)" }}>{val==="Si"?"✔":"✖"}</span>
      <span style={{ color: val==="Si"?"inherit":"#aaa" }}>{label}</span>
    </div>
  );

  const semaforo = (val) => val==="Bueno"||val==="Si"?"🟢":val==="Regular"||val==="Refuerzo"?"🟡":"🔴";

  return (
    <div className="form-page">
      <button className="btn ghost" style={{ marginBottom:14 }} onClick={onVolver}>← Volver</button>

      <div className="panel" style={{ borderTop:"3px solid var(--route)", marginBottom:12 }}>
        <div style={{ fontWeight:700, fontSize:16 }}>{localName(v.localId)}</div>
        <div className="dim small">{v.supervisor === "sup1" ? "Ernesto Aguero" : v.supervisor === "sup2" ? "Alexis Arzamendia" : v.supervisor} · {v.fecha}{v.horaLlegada ? " · " + v.horaLlegada : ""}</div>
        {v.kmRecorridos > 0 && <div className="dim small" style={{ marginTop:4 }}>📍 {v.kmRecorridos} km recorridos</div>}
      </div>

      {/* Sección 1 - Operativa */}
      <div className="panel" style={{ marginBottom:12 }}>
        <div style={{ fontWeight:700, fontSize:13, marginBottom:8, color:"#1a5276" }}>1. Operativa de Caja</div>
        {CHECK_FIELDS_OPERATIVA.map(([key, label]) => v[key] && check(label, v[key]))}
        {v.depositoOrdenado && check("Depósito ordenado", v.depositoOrdenado)}
        {v.accionDesviosOperativos && fld("Detalle desvío", v.accionDesviosOperativos)}
      </div>

      {/* Sección 2 - Comercial */}
      <div className="panel" style={{ marginBottom:12 }}>
        <div style={{ fontWeight:700, fontSize:13, marginBottom:8, color:"#1a5276" }}>2. Gestión Comercial</div>
        {CHECK_FIELDS_COMERCIAL.map(([key, label]) => v[key] && check(label, v[key]))}
      </div>

      {/* Sección 3 - Regularización */}
      {v.regularizacionDesvios && (
        <div className="panel" style={{ marginBottom:12 }}>
          <div style={{ fontWeight:700, fontSize:13, marginBottom:8, color:"#1a5276" }}>3. Regularización de Desvíos</div>
          <div style={{ fontSize:13 }}>
            {v.regularizacionDesvios==="todos" ? "🟢 Todos regularizados" : v.regularizacionDesvios==="parcialmente" ? "🟡 Parcialmente regularizados" : "🔴 No regularizados"}
          </div>
        </div>
      )}

      {/* Sección 4 - Desempeño encargado */}
      <div className="panel" style={{ marginBottom:12 }}>
        <div style={{ fontWeight:700, fontSize:13, marginBottom:8, color:"#1a5276" }}>4. Desempeño del Encargado</div>
        {CHECK_FIELDS_ENCARGADO.map(([key, label]) => v[key] && (
          <div key={key} style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 0", borderBottom:"1px solid var(--line)", fontSize:13 }}>
            <span style={{ fontSize:15 }}>{semaforo(v[key])}</span>
            <span>{label}</span>
            <span className="dim small" style={{ marginLeft:"auto" }}>{v[key]}</span>
          </div>
        ))}
      </div>

      {/* Sección 5 - Infraestructura */}
      {v.estadoLocal && (
        <div className="panel" style={{ marginBottom:12 }}>
          <div style={{ fontWeight:700, fontSize:13, marginBottom:8, color:"#1a5276" }}>5. Infraestructura y Seguridad</div>
          {fld("Estado del local", v.estadoLocal === "sin_novedades" ? "🟢 Sin novedades" : v.estadoLocal === "seguimiento" ? "🟡 En seguimiento" : "🔴 Intervención requerida")}
          {v.infraestructura && fld("Detalle", v.infraestructura)}
        </div>
      )}

      {/* Sección 6 - Capacitación */}
      {v.capacitacion && (
        <div className="panel" style={{ marginBottom:12 }}>
          <div style={{ fontWeight:700, fontSize:13, marginBottom:8, color:"#1a5276" }}>6. Capacitación</div>
          {fld("¿Se realizó capacitación?", v.capacitacion === "si" ? "✔ Sí" : "✖ No")}
          {v.detalleCapacitacion && fld("Tema", v.detalleCapacitacion)}
        </div>
      )}

      {/* Sección 7 - Observación */}
      {(v.compromiso || v.observacionesGenerales) && (
        <div className="panel" style={{ marginBottom:12 }}>
          <div style={{ fontWeight:700, fontSize:13, marginBottom:8, color:"#1a5276" }}>7. Observación</div>
          {v.compromiso && fld("Compromiso acordado", v.compromiso)}
          {v.observacionesGenerales && fld("Hallazgo", v.observacionesGenerales)}
        </div>
      )}
    </div>
  );
}

/* ---- RutaMes (vista admin) ---- */
function RutaSugerida({ data, onSave, showToast }) {
  const { locales, visitas, tareas } = data;
  const MATRIZ = window.MATRIZ_KM || {};
  const hoy = todayISO();

  const [supSel, setSupSel] = useState("Ernesto Aguero");
  const [generada, setGenerada] = useState(false);
  const [dias, setDias] = useState([]);
  const [calcPtsRef, setCalcPtsRef] = useState(null);

  const supKey = supSel.toLowerCase().includes("ernesto") ? "Sup1" : "Sup2";

  const localName = (id) => {
    const l = locales.find(l => l.id === id);
    if (!l) return id;
    const p = l.nombre.split(" - ");
    return "Suc. " + parseInt(p[0]) + (p[1] ? " - " + p.slice(1).join(" - ") : "");
  };

  const km = (a, b) => {
    const ka = String(a).replace("local-fixed-","");
    const kb = String(b).replace("local-fixed-","");
    return MATRIZ[ka]?.[kb] || MATRIZ[kb]?.[ka] || 0;
  };

  const generar = () => {
    const misSup = supSel.toLowerCase().includes("ernesto") ? ["ernesto","sup1"] : ["alexis","sup2"];
    const esDelSup = (v) => misSup.some(s => String(v.supervisor||"").toLowerCase().includes(s));
    const mesActual = hoy.slice(0,7);
    const [anio, mes] = mesActual.split("-").map(Number);
    const mesAntStr = (mes === 1 ? (anio-1)+"-12" : anio+"-"+String(mes-1).padStart(2,"0"));

    // Ya visitados este mes (excluir)
    const visitadosEsteMes = new Set(
      (visitas||[]).filter(v => esDelSup(v) && (v.fecha||"").startsWith(mesActual)).map(v => v.localId)
    );

    // Ya agendados en ruta del mes actual (excluir)
    const agendadosEsteMes = new Set();
    (data.rutas||[]).filter(r => (r.fecha||"").startsWith(mesActual) && misSup.some(s => String(r.supervisor||"").toLowerCase().includes(s)))
      .forEach(r => (r.localIds||[]).forEach(id => agendadosEsteMes.add(id)));

    // Ultima visita por local
    const ultimaVisita = {};
    (visitas||[]).filter(esDelSup).forEach(v => {
      if (!ultimaVisita[v.localId] || v.fecha > ultimaVisita[v.localId]) ultimaVisita[v.localId] = v.fecha;
    });

    // Estado de ultima visita
    const ultimoEstado = {};
    (visitas||[]).filter(esDelSup).sort((a,b) => b.fecha?.localeCompare(a.fecha)).forEach(v => {
      if (!ultimoEstado[v.localId]) ultimoEstado[v.localId] = v.estadoLocal || "sin_novedades";
    });

    // Tareas vencidas por local
    const tareasVencidas = {};
    (tareas||[]).filter(t => !t.hecha && t.fecha < hoy).forEach(t => {
      tareasVencidas[t.localId] = (tareasVencidas[t.localId]||0) + 1;
    });

    // Inventario con desviaciones
    const conDesvios = new Set((data.inventarios||[]).filter(i => Object.keys(i.desviaciones||{}).length > 0).map(i => "local-fixed-"+i.numLocal));

    // Locales inactivos a excluir
    const inactivos = new Set(data.localesInactivos || []);

    // Locales del supervisor: reconstruir desde visitas del mes anterior
    const visitasAnt = (visitas||[]).filter(v => esDelSup(v) && (v.fecha||"").startsWith(mesAntStr));
    const todosLocalesSup = new Set(visitasAnt.map(v => v.localId).filter(id => id && !inactivos.has(id)));

    // Si no hay visitas del mes anterior, usar rutas
    if (todosLocalesSup.size === 0) {
      const rutasSup = (data.rutas||[]).filter(r => misSup.some(s => String(r.supervisor||"").toLowerCase().includes(s)));
      rutasSup.forEach(r => (r.localIds||[]).forEach(id => todosLocalesSup.add(id)));
    }

    const misLocales = (locales||[]).filter(l => todosLocalesSup.has(l.id));
    if (misLocales.length === 0) { alert("No hay visitas del mes anterior para generar la ruta."); return; }

    // Grupos del mes anterior desde visitas (mismo día = mismo grupo)
    // Usar solo primera aparición de cada local para evitar duplicados entre días
    const yaEnGrupo = new Set();
    const gruposAntVisitas = {};
    Object.entries(
      visitasAnt.reduce((acc, v) => {
        if (!acc[v.fecha]) acc[v.fecha] = [];
        if (!acc[v.fecha].includes(v.localId) && !inactivos.has(v.localId)) acc[v.fecha].push(v.localId);
        return acc;
      }, {})
    ).sort(([a],[b]) => a.localeCompare(b)).forEach(([fecha, ids]) => {
      const sinDup = ids.filter(id => !yaEnGrupo.has(id));
      if (sinDup.length > 0) {
        gruposAntVisitas[fecha] = sinDup;
        sinDup.forEach(id => yaEnGrupo.add(id));
      }
    });

    // Articulos viejos por local
    const artViejosPorLocal = {};
    (data.articulosViejos||[]).forEach(a => {
      const lid = a.localId ? "local-fixed-" + String(a.localId).replace("local-fixed-","") : null;
      if (lid) artViejosPorLocal[lid] = (artViejosPorLocal[lid]||0) + 1;
    });

    // Ultima visita completa por local para score
    const ultimaVisitaObj = {};
    (visitas||[]).filter(esDelSup).sort((a,b) => b.fecha?.localeCompare(a.fecha)).forEach(v => {
      if (!ultimaVisitaObj[v.localId]) ultimaVisitaObj[v.localId] = v;
    });

    // Calcular puntaje
    const calcPts = (id) => {
      let pts = 0; const motivos = [];
      const estado = ultimoEstado[id];
      if (estado === "seguimiento" || estado === "intervencion") { pts += 30; motivos.push("🔴 Seguimiento"); }
      const tv = tareasVencidas[id] || 0;
      if (tv > 0) { pts += 30; motivos.push("📋 Tarea vencida"); }
      const diasSin = ultimaVisita[id] ? Math.floor((new Date(hoy)-new Date(ultimaVisita[id]))/(1000*60*60*24)) : 999;
      const unidades30 = Math.floor(diasSin/30);
      if (unidades30 > 0) { pts += unidades30 * 20; motivos.push("🕐 Sin visita "+diasSin+"d"); }
      if (conDesvios.has(id)) { pts += 20; motivos.push("📦 Inventario"); }
      // Artículos viejos +5 por cada uno
      const cantViejos = artViejosPorLocal[id] || 0;
      if (cantViejos > 0) { pts += cantViejos * 5; motivos.push("🕰️ "+cantViejos+" art. viejos"); }
      // Score de última visita: < 75 → +20, < 50 → +40
      const vAnterior = ultimaVisitaObj[id];
      if (vAnterior) {
        const score = calcScore(vAnterior, data.codigos, data.pruebasRealizadas);
        if (score < 50) { pts += 40; motivos.push("📊 Score crítico ("+score+"%)"); }
        else if (score < 75) { pts += 20; motivos.push("📊 Score bajo ("+score+"%)"); }
      }
      return { pts, motivos };
    };

    // gruposAnt ya construido desde visitasAnt arriba
    const gruposAnt = gruposAntVisitas;

    // Pendientes este mes (no visitados ni agendados)
    const pendientes = new Set(misLocales.map(l => l.id).filter(id => !visitadosEsteMes.has(id) && !agendadosEsteMes.has(id)));

    // Nearest neighbor
    const ordenarGrupo = (grupo, desde) => {
      if (grupo.length <= 1) return grupo;
      const result = []; let pool = [...grupo]; let actual = desde;
      while (pool.length > 0) {
        let mejor = null, mejorKm = Infinity;
        pool.forEach(p => { const d = km(actual, p.id); if (d < mejorKm) { mejorKm = d; mejor = p; } });
        result.push(mejor); actual = mejor.id; pool = pool.filter(p => p.id !== mejor.id);
      }
      return result;
    };

    const grupos = [];
    const asignados = new Set();

    // Especiales 57+58
    const esp57 = ["local-fixed-57","local-fixed-58"].filter(id => pendientes.has(id));
    if (esp57.length > 0) {
      const g = esp57.map(id => ({ id, ...calcPts(id) }));
      grupos.push(ordenarGrupo(g, "of"));
      esp57.forEach(id => asignados.add(id));
    }

    // Armar grupos basados en mes anterior
    const fechasAnt = Object.keys(gruposAnt).sort();
    fechasAnt.forEach(fecha => {
      const idsAnt = gruposAnt[fecha].filter(id => !["local-fixed-57","local-fixed-58"].includes(id));
      const candidatos = idsAnt.filter(id => pendientes.has(id) && !asignados.has(id))
        .map(id => ({ id, ...calcPts(id) }))
        .sort((a,b) => b.pts - a.pts);
      if (candidatos.length === 0) return;

      // Si hay 4+ candidatos del mismo día, partir en subgrupos de 2-3
      if (candidatos.length >= 4) {
        const mitad = Math.ceil(candidatos.length / 2);
        const g1 = candidatos.slice(0, mitad);
        const g2 = candidatos.slice(mitad);
        [g1, g2].forEach(g => {
          if (g.length === 0) return;
          g.forEach(x => asignados.add(x.id));
          grupos.push(ordenarGrupo(g, "of"));
        });
        return;
      }

      const grupo = candidatos.slice(0,3);
      // Completar hasta mínimo 2
      if (grupo.length < 2) {
        const extra = [...pendientes]
          .filter(id => !asignados.has(id) && !grupo.find(g => g.id === id) && !["local-fixed-57","local-fixed-58"].includes(id))
          .map(id => ({ id, ...calcPts(id) }))
          .sort((a,b) => b.pts - a.pts)
          .slice(0, 2 - grupo.length);
        grupo.push(...extra);
        extra.forEach(g => asignados.add(g.id));
      }
      grupo.forEach(g => asignados.add(g.id));
      grupos.push(ordenarGrupo(grupo, "of"));
    });

    // Pendientes sin grupo del mes anterior
    const sinGrupo = [...pendientes]
      .filter(id => !asignados.has(id) && !["local-fixed-57","local-fixed-58"].includes(id))
      .map(id => ({ id, ...calcPts(id) }))
      .sort((a,b) => b.pts - a.pts);
    for (let i = 0; i < sinGrupo.length; i += 3) {
      grupos.push(ordenarGrupo(sinGrupo.slice(i, i+3), "of"));
    }

    // Ordenar grupos por puntaje máximo del local más urgente (mayor primero)
    grupos.sort((a, b) => {
      const maxA = Math.max(...a.map(x => x.pts));
      const maxB = Math.max(...b.map(x => x.pts));
      return maxB - maxA;
    });

    // Calcular km por día
    const diasCalc = grupos.map((grupo, idx) => {
      let kmTotal = 0; let prev = "of";
      grupo.forEach(p => { kmTotal += km(prev, p.id); prev = p.id; });
      kmTotal += km(prev, supKey);
      return { dia: idx+1, locales: grupo, kmTotal: Math.round(kmTotal*10)/10 };
    });

    setDias(diasCalc);
    setCalcPtsRef(() => calcPts);
    setGenerada(true);
  };

  return (
    <div>
      <div style={{ display:"flex", gap:12, alignItems:"center", marginBottom:16, flexWrap:"wrap" }}>
        <select value={supSel} onChange={e => { setSupSel(e.target.value); setGenerada(false); }} style={{ padding:"7px 12px", borderRadius:8, border:"1.5px solid var(--line)", fontSize:13 }}>
          <option value="Ernesto Aguero">Ernesto Aguero</option>
          <option value="Alexis Arzamendia">Alexis Arzamendia</option>
        </select>
        <button className="btn primary" onClick={generar} style={{ fontSize:13, padding:"8px 16px" }}>⚡ Generar ruta sugerida</button>
      </div>
      <div style={{ fontSize:11.5, color:"var(--text-sec, #6B7268)", background:"var(--paper-alt)", borderRadius:8, padding:"10px 14px", marginBottom:16, lineHeight:1.7 }}>
        <b>¿Cómo se calcula?</b><br/>
        Toma los grupos del mes anterior y los replica, priorizando los locales con más problemas.<br/>
        <b>Puntaje por local:</b> 🔴 +30 Seguimiento/Infraestructura grave · 📋 +30 Tarea vencida · 🕐 +20 por cada 30 días sin visita · 📦 +20 Desviaciones de inventario · 🕰️ +5 por cada artículo viejo · 📊 +20 Score bajo (&lt;75%) / +40 Score crítico (&lt;50%)<br/>
        Excluye locales ya visitados o agendados este mes. Los locales 57 y 58 siempre van juntos.</div>

      {generada && dias.length === 0 && <div className="dim" style={{ fontSize:13 }}>No hay locales para generar la ruta.</div>}

      {generada && dias.map(({ dia, locales: locs, kmTotal }, diaIdx) => (
        <DiaSugerido key={dia} dia={dia} diaIdx={diaIdx} locs={locs} kmTotal={kmTotal}
          locales={locales} supSel={supSel} data={data} onSave={onSave} showToast={showToast}
          localName={localName} setDias={setDias} calcPtsExt={calcPtsRef || (() => ({ pts:0, motivos:[] }))} />
      ))}
    </div>
  );
}

function DiaSugerido({ dia, diaIdx, locs, kmTotal, locales, supSel, data, onSave, showToast, localName, setDias, calcPtsExt }) {
  const [fecha, setFecha] = useState("");
  const [editandoLocales, setEditandoLocales] = useState(false);
  const [locsState, setLocsState] = useState(locs); // [{id, pts, motivos}]
  const [guardado, setGuardado] = useState(false);
  const [numInput, setNumInput] = useState("");
  const [localPreview, setLocalPreview] = useState(null);

  const localIds = locsState.map(l => l.id);

  const quitar = (id) => setLocsState(prev => prev.filter(l => l.id !== id));

  const buscarLocal = (num) => {
    const id = "local-fixed-" + num.trim();
    const found = (locales||[]).find(l => l.id === id);
    setLocalPreview(found ? { id, nombre: found.nombre } : null);
  };

  const agregar = () => {
    if (!localPreview || localIds.includes(localPreview.id)) return;
    const { pts, motivos } = calcPtsExt(localPreview.id);
    setLocsState(prev => [...prev, { id: localPreview.id, pts, motivos }]);
    setNumInput("");
    setLocalPreview(null);
  };

  const guardar = async () => {
    if (!fecha) { showToast("Seleccioná una fecha"); return; }
    if (localIds.length === 0) { showToast("Agregá al menos un local"); return; }
    const id = "ruta-" + uid();
    const nuevaRuta = { id, supervisor: supSel, fecha, localIds, precioCombustible: data.precioCombustible||6860 };
    await onSave({ ...data, rutas: [...(data.rutas||[]), nuevaRuta] });
    setGuardado(true);
    showToast("Día " + dia + " guardado en la ruta");
  };

  return (
    <div className="dash-panel" style={{ marginBottom:12, opacity: guardado ? 0.6 : 1 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
        <div style={{ fontWeight:700, fontSize:14 }}>Día {dia} {guardado && <span style={{ fontSize:11, color:"var(--done)" }}>✓ Guardado</span>}</div>
        <div style={{ fontSize:12, color:"var(--text-sec)" }}>{kmTotal} km estimados</div>
      </div>

      {locsState.map(({ id, pts, motivos }) => (
        <div key={id} style={{ padding:"8px 0", borderBottom:"1px solid var(--line)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <div style={{ fontWeight:600, fontSize:13 }}>{localName(id)}</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:4 }}>
              <span style={{ fontSize:11, background:"var(--line)", borderRadius:8, padding:"2px 8px" }}>{pts} pts</span>
              {(motivos||[]).map(m => <span key={m} style={{ fontSize:11, background:"#f0f4ff", borderRadius:8, padding:"2px 8px" }}>{m}</span>)}
            </div>
          </div>
          {editandoLocales && <button onClick={() => quitar(id)} style={{ background:"none", border:"none", color:"var(--alert)", fontSize:18, cursor:"pointer", flexShrink:0 }}>✕</button>}
        </div>
      ))}

      {editandoLocales && (
        <div style={{ marginTop:10, display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
          <input type="number" placeholder="Nº local" value={numInput}
            onChange={e => { setNumInput(e.target.value); buscarLocal(e.target.value); }}
            style={{ width:100, padding:"6px 10px", borderRadius:8, border:"1.5px solid var(--line)", fontSize:13 }} />
          {localPreview && <span style={{ fontSize:13, color:"var(--done)" }}>{localPreview.nombre}</span>}
          {localPreview && !localIds.includes(localPreview.id) &&
            <button className="btn primary" style={{ fontSize:12 }} onClick={agregar}>+ Agregar</button>}
        </div>
      )}

      <div style={{ display:"flex", gap:8, alignItems:"center", marginTop:12, flexWrap:"wrap" }}>
        <input type="date" value={fecha} onChange={e => setFecha(e.target.value)}
          style={{ padding:"6px 10px", borderRadius:8, border:"1.5px solid var(--line)", fontSize:13 }} />
        <button className="btn ghost" style={{ fontSize:12 }} onClick={() => setEditandoLocales(p => !p)}>
          {editandoLocales ? "✓ Listo" : "✏️ Editar locales"}
        </button>
        {!guardado && <button className="btn primary" style={{ fontSize:12 }} onClick={guardar}>💾 Guardar día</button>}
      </div>
    </div>
  );
}

// Cuadritos con el número de cada local, por zona: verde = visitado en el mes elegido, rojo = pendiente
function PanelLocalesMes({ data, visitasMes, onSelect }) {
  const inactivos = new Set((data.localesInactivos||[]).map(id => parseInt(String(id).replace("local-fixed-",""))));
  const nombreDe = (n) => (data.locales||[]).find(l => l.id === "local-fixed-" + n)?.nombre || ("Local " + n);
  const zonas = [
    { titulo:"Zona Ernesto", nums:ZONA_SUP1 },
    { titulo:"Zona Alexis", nums:ZONA_SUP2 },
  ].map(z => {
    const items = [...z.nums].filter(n => !inactivos.has(n)).sort((a,b) => a-b)
      .map(n => ({ n, visitado: (visitasMes["local-fixed-" + n]||[]).length > 0 }));
    return { ...z, items, visitados: items.filter(i => i.visitado).length };
  });
  const cuadro = (color) => <span style={{ display:"inline-block", width:11, height:11, borderRadius:3, background:color, marginRight:5, verticalAlign:"middle" }} />;
  return (
    <div className="panel" style={{ marginBottom:14, padding:"12px 14px" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8, marginBottom:10 }}>
        <div style={{ fontWeight:700, fontSize:13 }}>Locales del mes</div>
        <div style={{ fontSize:11.5 }}>{cuadro("var(--done)")}Visitado <span style={{ marginLeft:10 }}>{cuadro("var(--alert)")}Pendiente</span></div>
      </div>
      {zonas.map(z => (
        <div key={z.titulo} style={{ marginBottom:10 }}>
          <div style={{ fontSize:12, fontWeight:600, marginBottom:5 }}>{z.titulo} <span className="dim" style={{ fontWeight:400 }}>· {z.visitados} de {z.items.length} visitados</span></div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>
            {z.items.map(i => (
              <div key={i.n} role="button" title={nombreDe(i.n) + (i.visitado ? " — visitado" : " — pendiente")}
                onClick={() => onSelect && onSelect(String(i.n), nombreDe(i.n))}
                style={{ width:32, height:26, display:"flex", alignItems:"center", justifyContent:"center", borderRadius:5, fontSize:11.5, fontWeight:700, cursor:"pointer",
                  background: i.visitado ? "var(--done)" : "var(--alert)", color:"#fff", fontVariantNumeric:"tabular-nums" }}>
                {i.n}
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function RutaMes({ data, onSave, showToast }) {
  const { locales, visitas, rutas } = data;
  const [tabRuta, setTabRuta] = useState("ruta");
  const [mesFiltro, setMesFiltro] = useState(() => todayISO().slice(0,7));
  const [visitaDetalle, setVisitaDetalle] = useState(null);
  const [editando, setEditando] = useState(false);
  const [vistaRecorrido, setVistaRecorrido] = useState(null);
  const [busquedaLocal, setBusquedaLocal] = useState("");
  const [localBuscado, setLocalBuscado] = useState(null); // { num, nombre } cuando está abierta la vista
  const [visitaExpandida, setVisitaExpandida] = useState(null);

  // Visitas del local buscado (todos los meses, ordenadas por fecha desc)
  const visitasLocalBuscado = useMemo(() => {
    if (!localBuscado) return [];
    const localId = "local-fixed-" + localBuscado.num;
    return (visitas||[])
      .filter(v => v.localId === localId)
      .sort((a,b) => b.fecha?.localeCompare(a.fecha));
  }, [visitas, localBuscado]);

  const localName = (id) => locales.find((l) => l.id === id)?.nombre || id;

  const nombreMes = (ym) => {
    if (!ym) return "";
    const [y,m] = ym.split("-");
    return ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(m)-1]+" "+y;
  };

  const mesesDisponibles = useMemo(() => {
    const set = new Set([
      ...(rutas||[]).map((r) => r.fecha?.slice(0,7)),
      ...(visitas||[]).map((v) => v.fecha?.slice(0,7))
    ].filter(Boolean));
    return [...set].sort().reverse();
  }, [rutas, visitas]);

  // Agrupar rutas del mes por fecha; si no hay rutas, usar visitas como fallback
  const diasAgrupados = useMemo(() => {
    const rutasMes = (rutas||[]).filter((r) => r.fecha?.startsWith(mesFiltro));
    if (rutasMes.length > 0) {
      const map = {};
      rutasMes.forEach((r) => {
        if (!map[r.fecha]) map[r.fecha] = [];
        r.localIds.forEach((id) => map[r.fecha].push({ id, supervisor: r.supervisor }));
      });
      const hoy = todayISO();
      return Object.entries(map).sort(([a],[b]) => {
        if (a === hoy) return -1; if (b === hoy) return 1;
        return a < b ? 1 : -1;
      });
    }
    // Fallback: construir desde visitas del mes
    const visitasMes = (visitas||[]).filter((v) => !v.borrador && v.fecha?.startsWith(mesFiltro));
    const map = {};
    visitasMes.forEach((v) => {
      if (!map[v.fecha]) map[v.fecha] = [];
      if (!map[v.fecha].find((i) => i.id === v.localId)) {
        map[v.fecha].push({ id: v.localId, supervisor: v.supervisor });
      }
    });
    const hoy = todayISO();
    return Object.entries(map).sort(([a],[b]) => {
      if (a === hoy) return -1; if (b === hoy) return 1;
      return a < b ? 1 : -1;
    });
  }, [rutas, visitas, mesFiltro]);

  // Visitas indexadas por localId+fecha para cruce exacto por día
  const visitasMes = useMemo(() => {
    const map = {};
    (visitas||[]).filter((v) => !v.borrador && v.fecha?.startsWith(mesFiltro)).forEach((v) => {
      if (!map[v.localId]) map[v.localId] = [];
      map[v.localId].push(v);
    });
    return map;
  }, [visitas, mesFiltro]);

  // Borradores guardados en la base: fecha del último borrador por local y supervisor
  const borradoresMes = useMemo(() => {
    const m = {};
    (visitas||[]).filter((v) => v.borrador && v.localId && v.supervisor).forEach((v) => {
      const k = v.localId + "|" + v.supervisor;
      if (!m[k] || (v.fecha||"") > m[k]) m[k] = v.fecha || "";
    });
    return m;
  }, [visitas]);

  const totalLocales = diasAgrupados.reduce((acc, [, items]) => acc + items.length, 0);
  const visitados = diasAgrupados.reduce((acc, [, items]) =>
    acc + items.filter(({ id }) => visitasMes[id]?.length > 0).length, 0);

  if (editando && visitaDetalle) {
    return (
      <div className="form-page">
        <button className="btn ghost" style={{ marginBottom:12 }} onClick={() => { setEditando(false); }}>
          ← Volver al detalle
        </button>
        <NuevoRecorrido
          data={data}
          onSave={onSave}
          localPrecargado={visitaDetalle.localId}
          supervisorFijo={visitaDetalle.supervisor}
          visitaEditar={visitaDetalle}
          onDone={(m) => { showToast(m); setEditando(false); setVisitaDetalle(null); }}
        />
      </div>
    );
  }

  if (vistaRecorrido) {
    return <VistaRecorrido v={vistaRecorrido} locales={locales} onVolver={() => setVistaRecorrido(null)} />;
  }

  if (visitaDetalle) {
    const v = visitaDetalle;
    const meta = ESTADOS[estadoVisita(v, data.codigos, data.pruebasRealizadas)] || { color:"#888", label:"Completada" };
    const comp = calcCompletitud(v, data.codigos, data.pruebasRealizadas);
    const scoreVisita = calcScore(v, data.codigos, data.pruebasRealizadas);
    const scoreVisitaColor = scoreVisita >= 90 ? "var(--done)" : scoreVisita > 75 ? "#b37700" : "var(--alert)";
    const scoreVisitaLabel = scoreVisita >= 90 ? "Buen estado" : scoreVisita > 75 ? "Requiere seguimiento" : "Requiere intervención";
    return (
      <div className="form-page">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, flexWrap:"wrap", gap:8 }}>
          <button className="btn ghost" onClick={() => setVisitaDetalle(null)}>← Volver</button>
          <button className="btn primary" onClick={() => setEditando(true)}>✏️ Editar visita</button>
        </div>
        <div className="panel" style={{ borderTop:`3px solid ${meta.color}` }}>
          <div style={{ fontWeight:700, fontSize:16, marginBottom:4 }}>{localName(v.localId)}</div>
          <div className="dim small">{v.supervisor} · {fmt(v.fecha)}{v.horaLlegada ? " · "+v.horaLlegada : ""}</div>
          <div style={{ marginTop:8 }}>
            <span className="badge" style={{ color:meta.color, borderColor:meta.color }}>{meta.label}</span>
          </div>
        </div>
        <div className="panel">
          <div><ArticulosAntiguosBadge visita={v} visitas={visitas} /></div>
          {scoreVisita !== null && <div style={{ marginBottom:10, padding:"8px 10px", borderRadius:8, background:scoreVisita>=90?"#f0faf5":scoreVisita>75?"#fffbea":"#fdf2f2", border:`1px solid ${scoreVisitaColor}` }}>
            <div style={{ fontWeight:800, fontSize:13, color:scoreVisitaColor }}>Puntaje de performance: {scoreVisita}/100 — {scoreVisitaLabel}</div>
          </div>}
          <div style={{ marginBottom:10, padding:"8px 10px", borderRadius:8, background: comp.pct===100?"#f0faf5":comp.pct>=70?"#fffbea":"#fdf2f2", border:`1px solid ${comp.pct===100?"var(--done)":comp.pct>=70?"#b37700":"var(--alert)"}` }}>
            <div style={{ fontWeight:700, fontSize:12, marginBottom:4, color: comp.pct===100?"var(--done)":comp.pct>=70?"#b37700":"var(--alert)" }}>
              Formulario completado: {comp.completados}/{comp.total} campos ({comp.pct}%)
            </div>
            {comp.faltantes.length > 0 && comp.faltantes.map(f => (
              <div key={f.key} style={{ fontSize:11, color:"var(--alert)" }}>❌ {f.label}</div>
            ))}
          </div>
          {v.gpsLat && <div className="hist-line"><b>Ubicación:</b> <a href={`https://maps.google.com/?q=${v.gpsLat},${v.gpsLng}`} target="_blank" rel="noreferrer" style={{ color:"var(--route)" }}>📍 Ver en Google Maps</a></div>}

          <div className="hist-grid" style={{ marginTop:8 }}>
            {CHECK_FIELDS.map(([key,label]) => v[key] && (
              <div key={key} className="hist-check">
                <span className={"mini-badge "+(v[key]==="No"?"mini-no":"mini-si")}>{v[key]}</span>
                <span>{label}</span>
              </div>
            ))}
          </div>
          {v.regularizacionDesvios && <div className="hist-line"><b>Regularización desvíos:</b> {v.regularizacionDesvios==="todos"?"🟢 Todos regularizados":v.regularizacionDesvios==="parcialmente"?"🟡 Parcialmente":"🔴 No regularizados"}</div>}
          {v.capacitacion === "si" && <div className="hist-line"><b>Capacitación:</b> ✔ Sí{v.detalleCapacitacion ? ` — ${v.detalleCapacitacion}` : ""}</div>}
          {v.capacitacion === "no" && <div className="hist-line"><b>Capacitación:</b> ✖ No se realizó</div>}
          {v.desviosOperativos==="Si" && v.accionDesviosOperativos && <div className="hist-line"><b>Desvío operativo:</b> {v.accionDesviosOperativos}</div>}
          {v.estadoLocal && v.estadoLocal!=="sin_novedades" && <div className="hist-line"><b>Estado local:</b> {v.infraestructura||v.motivoEstado||""}</div>}
          {v.compromiso && <div className="hist-line"><b>Compromiso:</b> {v.compromiso}</div>}
          {v.observacionesGenerales && <div className="hist-line"><b>Hallazgo:</b> {v.observacionesGenerales}</div>}
          {v.evalAyudante && (
            <div className="hist-line">
              <b>Ayudante {v.ayudante}:</b> Atención {v.evalAyudante.atencion}, Orden {v.evalAyudante.orden}, Apoyo {v.evalAyudante.apoyo}
              {v.evalAyudante.comentario && ` — ${v.evalAyudante.comentario}`}
            </div>
          )}
        </div>
      </div>
    );
  }

  // Vista historial de local buscado
  if (localBuscado) {
    return (
      <div className="form-page">
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:16 }}>
          <button className="btn ghost" onClick={() => { setLocalBuscado(null); setVisitaExpandida(null); }}>← Volver</button>
          <div>
            <div style={{ fontWeight:700, fontSize:15 }}>{localBuscado.nombre}</div>
            <div className="dim small">{visitasLocalBuscado.length} visita{visitasLocalBuscado.length !== 1 ? "s" : ""} registradas</div>
          </div>
        </div>
        {visitasLocalBuscado.length === 0 ? (
          <div className="empty-hero small"><p>Sin visitas registradas para este local.</p></div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {visitasLocalBuscado.map((v, i) => {
              const meta = ESTADOS[estadoVisita(v, data.codigos, data.pruebasRealizadas)];
              const comp = calcCompletitud(v, data.codigos, data.pruebasRealizadas);
              const score = calcScore(v, data.codigos, data.pruebasRealizadas);
              const colorScore = score >= 90 ? "var(--done)" : score > 75 ? "#b37700" : "var(--alert)";
              const expandida = visitaExpandida === i;
              return (
                <div key={i} className="panel" style={{ borderLeft:`4px solid ${meta.color}`, padding:"12px 16px" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", cursor:"pointer" }} onClick={() => setVisitaExpandida(expandida ? null : i)}>
                    <div>
                      <div style={{ fontWeight:700, fontSize:14 }}>{fmt(v.fecha)}</div>
                      <div className="dim small">{v.supervisor === "sup1" ? "Ernesto Aguero" : v.supervisor === "sup2" ? "Alexis Arzamendia" : v.supervisor}{v.horaLlegada ? " · " + v.horaLlegada : ""}</div>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <span className="badge" style={{ color:meta.color, borderColor:meta.color, fontSize:11 }}>{meta.label}</span>
                      {score !== null && <span title="Puntaje de performance" style={{ fontSize:12, fontWeight:800, color:colorScore }}>{score}/100</span>}
                      <span style={{ fontSize:16, color:"#aaa" }}>{expandida ? "▲" : "▼"}</span>
                    </div>
                  </div>
                  {expandida && (
                    <div style={{ marginTop:12, borderTop:"1px solid var(--line)", paddingTop:10 }}>
                      <div><ArticulosAntiguosBadge visita={v} visitas={visitas} /></div>
                      <div style={{ fontSize:11, color:"var(--text-sec)", marginBottom:8 }}>Formulario completado: {comp.pct}%</div>
                      <div className="hist-grid" style={{ marginBottom:8 }}>
                        {CHECK_FIELDS.map(([key,label]) => v[key] && (
                          <div key={key} className="hist-check">
                            <span className={"mini-badge "+(v[key]==="No"?"mini-no":"mini-si")}>{v[key]}</span>
                            <span>{label}</span>
                          </div>
                        ))}
                      </div>
                      {v.regularizacionDesvios && <div className="hist-line"><b>Regularización:</b> {v.regularizacionDesvios==="todos"?"🟢 Todos":v.regularizacionDesvios==="parcialmente"?"🟡 Parcialmente":"🔴 No regularizados"}</div>}
                      {v.capacitacion === "si" && <div className="hist-line"><b>Capacitación:</b> ✔{v.detalleCapacitacion ? " — "+v.detalleCapacitacion : ""}</div>}
                      {v.capacitacion === "no" && <div className="hist-line"><b>Capacitación:</b> ✖ No se realizó</div>}
                      {v.estadoLocal && v.estadoLocal !== "sin_novedades" && <div className="hist-line"><b>Estado local:</b> {v.infraestructura||v.motivoEstado||""}</div>}
                      {v.compromiso && <div className="hist-line"><b>Compromiso:</b> {v.compromiso}</div>}
                      {v.observacionesGenerales && <div className="hist-line"><b>Hallazgo:</b> {v.observacionesGenerales}</div>}
                      {v.evalAyudante && <div className="hist-line"><b>Ayudante {v.ayudante}:</b> Atención {v.evalAyudante.atencion}, Orden {v.evalAyudante.orden}, Apoyo {v.evalAyudante.apoyo}{v.evalAyudante.comentario ? " — "+v.evalAyudante.comentario : ""}</div>}
                      {v.gpsLat && <div className="hist-line"><a href={"https://maps.google.com/?q="+v.gpsLat+","+v.gpsLng} target="_blank" rel="noreferrer" style={{ color:"var(--route)" }}>📍 Ver en Google Maps</a></div>}
                      <div style={{ marginTop:8 }}>
                        <button className="btn-sm" onClick={() => { setVisitaDetalle(v); setLocalBuscado(null); }}>✏️ Ver / Editar detalle</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }



  return (
    <div className="form-page">
      {/* Pestañas (izquierda) y buscador de local (derecha) en la misma fila */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10, marginBottom:16 }}>
        <div style={{ display:"flex", gap:8 }}>
          <button className={"tab"+(tabRuta==="ruta"?" active":"")} onClick={() => setTabRuta("ruta")}>📅 Ruta del mes</button>
          <button className={"tab"+(tabRuta==="sugerida"?" active":"")} onClick={() => setTabRuta("sugerida")}>⚡ Ruta sugerida</button>
        </div>
        {tabRuta !== "sugerida" && (
          <div style={{ display:"flex", gap:8, alignItems:"center", flex:"1 1 260px", justifyContent:"flex-end" }}>
            <div style={{ position:"relative", flex:1, maxWidth:320 }}>
              <input
                type="number"
                placeholder="Buscar local… (ej: 39)"
                value={busquedaLocal}
                onChange={e => setBusquedaLocal(e.target.value)}
                onKeyDown={e => {
                  if (e.key === "Enter" && busquedaLocal.trim()) {
                    const num = busquedaLocal.trim();
                    const nombre = locales.find(l => l.id === "local-fixed-" + num)?.nombre || "Local " + num;
                    setLocalBuscado({ num, nombre });
                  }
                }}
                style={{ width:"100%", padding:"8px 12px 8px 36px", borderRadius:8, border:"1.5px solid var(--line)", fontSize:13, boxSizing:"border-box" }}
              />
              <span style={{ position:"absolute", left:10, top:"50%", transform:"translateY(-50%)", fontSize:15, pointerEvents:"none" }}>🔍</span>
            </div>
            <button
              className="btn primary"
              style={{ fontSize:12, padding:"7px 14px" }}
              onClick={() => {
                if (busquedaLocal.trim()) {
                  const num = busquedaLocal.trim();
                  const nombre = locales.find(l => l.id === "local-fixed-" + num)?.nombre || "Local " + num;
                  setLocalBuscado({ num, nombre });
                }
              }}>
              Buscar
            </button>
            {busquedaLocal && <button onClick={() => { setBusquedaLocal(""); setLocalBuscado(null); }} style={{ background:"none", border:"none", fontSize:18, cursor:"pointer", color:"#888" }}>✕</button>}
          </div>
        )}
      </div>

      {tabRuta === "sugerida" && <RutaSugerida data={data} onSave={onSave} showToast={showToast} />}
      {tabRuta !== "sugerida" && <>

      <div className="mes-selector" style={{ marginBottom:16 }}>
        <div className="mes-pills">
          {mesesDisponibles.map((m) => (
            <button key={m} className={"mes-pill"+(mesFiltro===m?" active":"")} onClick={() => setMesFiltro(m)}>{nombreMes(m)}</button>
          ))}
        </div>
      </div>

      <PanelLocalesMes data={data} visitasMes={visitasMes} onSelect={(num, nombre) => setLocalBuscado({ num, nombre })} />

      {diasAgrupados.length === 0 ? (
        <div className="empty-hero small"><p>No hay rutas asignadas en {nombreMes(mesFiltro)}.</p></div>
      ) : (
        <>
          <div className="panel" style={{ borderTop:"3px solid var(--route)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
              <div>
                <div style={{ fontWeight:600 }}>{visitados} de {totalLocales} locales visitados</div>
                <div className="dim small">{diasAgrupados.length} días asignados</div>
              </div>
              <div className="ruta-progress">
                <div className="ruta-progress-bar" style={{ width:`${totalLocales > 0 ? (visitados/totalLocales)*100 : 0}%` }} />
              </div>
            </div>
          </div>

          {diasAgrupados.map(([fecha, items]) => {
            const completadosHoy = items.filter(({ id }) => (visitasMes[id]||[]).some(v => v.fecha === fecha)).length;
            const todoListo = completadosHoy === items.length;
            const sups = [...new Set(items.map(i => i.supervisor))];
            const supLabel = sups.map(s => s.split(" ")[0]).join(" / ");
            const eliminarDia = async () => {
              const nuevasRutas = (rutas||[]).filter(r => r.fecha !== fecha);
              await onSave({ ...data, rutas: nuevasRutas });
            };
            const cambiarFechaInline = async (nuevaFecha) => {
              if (!nuevaFecha || nuevaFecha === fecha) return;
              const nuevasRutas = (rutas||[]).map(r => r.fecha === fecha ? { ...r, fecha: nuevaFecha } : r);
              await onSave({ ...data, rutas: nuevasRutas });
            };
            return (
              <div key={fecha} className="dia-panel">
                <div className="dia-header">
                  <div>
                    <div className="dia-fecha" style={{ display:"flex", alignItems:"center", gap:8 }}>
                      {fmt(fecha)}
                      <span className="dim small" style={{ fontWeight:500, fontSize:12 }}>· {supLabel}</span>
                    </div>
                    <div className="dim small">{completadosHoy}/{items.length} completados</div>
                  </div>
                  <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                    {todoListo && <span className="badge" style={{ color:"var(--done)", borderColor:"var(--done)" }}>✓ Día completo</span>}
                    {completadosHoy === 0 && <input type="date" defaultValue={fecha} onChange={e => cambiarFechaInline(e.target.value)}
                      style={{ padding:"3px 6px", borderRadius:6, border:"1px solid var(--line)", fontSize:11, cursor:"pointer", color:"var(--ink)", background:"var(--paper)" }} />}
                    {completadosHoy === 0 && <button onClick={eliminarDia} title="Eliminar día" style={{ background:"none", border:"1px solid var(--alert)", borderRadius:6, padding:"3px 8px", fontSize:11, cursor:"pointer", color:"var(--alert)" }}>🗑</button>}
                  </div>
                </div>
                <div>
                  {sups.map(sup => {
                    const itemsSup = items.filter(i => i.supervisor === sup);
                    return (
                      <div key={sup} style={{ marginBottom:8 }}>
                        {sups.length > 1 && (
                          <div style={{ fontSize:11, fontWeight:700, color:"var(--route)", padding:"4px 8px", background:"var(--paper-alt)", borderRadius:6, marginBottom:4 }}>
                            {sup.split(" ")[0]} ({itemsSup.length} locales)
                          </div>
                        )}
                        <div className="ruta-grid">
                          {itemsSup.map(({ id }) => {
                            const visitasLocal = visitasMes[id] || [];
                            const visita = visitasLocal.find(v => v.fecha === fecha) || null;
                            const visitado = !!visita;
                            const fechaPasada = fecha < todayISO();
                            const fechaBorr = visitado ? null : borradoresMes[id + "|" + sup];
                            const diaBorr = fechaBorr ? diaDeBorrador(diasAgrupados.filter(([, its]) => its.some(x => x.id === id && x.supervisor === sup)).map(([f]) => f), fechaBorr, (f) => (visitasMes[id]||[]).some(v => v.fecha === f)) : null;
                            const tieneBorrador = !visitado && diaBorr === fecha;
                            const noCumplido = !visitado && !tieneBorrador && fechaPasada;
                            const estado = visitado ? "ok" : tieneBorrador ? "draft" : noCumplido ? "nocumplido" : "pendiente";
                            return (
                              <div key={id+sup}
                                className={"ruta-card ruta-"+estado+(visitado?" ruta-clickable":"")}
                                onClick={visitado ? () => {
                                  setVisitaExpandida(null);
                                  setLocalBuscado({ num:id.replace("local-fixed-",""), nombre:localName(id) });
                                } : undefined}>
                                <div className="ruta-estado">{visitado ? "✓" : tieneBorrador ? "●" : noCumplido ? "✗" : "+"}</div>
                                <div className="ruta-info">
                                  <div className="ruta-nombre" style={{ textDecoration:noCumplido?"line-through":"none", opacity:noCumplido?0.6:1 }}>
                                    {localName(id)}
                                  </div>
                                  {visitado && <TendenciaRuta visita={visita} data={data} />}
                                  {noCumplido && <div style={{ fontSize:10, color:"var(--alert)", fontWeight:600, marginTop:2 }}>No cumplido</div>}
                                  {tieneBorrador && <div style={{ fontSize:10, color:"#F5A623", fontWeight:600, marginTop:2 }}>Borrador</div>}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </>
      )}
      </>}
    </div>
  );
}
