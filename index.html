// Calcular completitud de una visita
function calcCompletitud(v, codigos, pruebasRealizadas) {
  const campos = [
    { key:"arqueoCaja", label:"Caja sin diferencias" },
    { key:"condicionesLocal", label:"Local en condiciones para operar" },
    { key:"desviosOperativos", label:"Desvíos operativos" },
    { key:"bajaRotacionExhibidos", label:"Artículos baja rotación exhibidos" },
    { key:"promocionesVisibles", label:"Precios y promociones visibles" },
    { key:"eval_atencion", label:"Evaluación — Atención al cliente" },
    { key:"eval_impulso", label:"Evaluación — Impulso ventas" },
    { key:"eval_actitud", label:"Evaluación — Actitud y compromiso" },
    { key:"estadoLocal", label:"Estado del local" },
    { key:"compromiso", label:"Plan de acción" },
  ];
  const completados = campos.filter(c => v[c.key] || (v.checks && v.checks[c.key]));
  const faltantes = campos.filter(c => !v[c.key] && !(v.checks && v.checks[c.key]));

  // Pruebas técnicas — solo si había artículos asignados
  if (codigos) {
    const codLocal = codigos.filter(c => c.localId === v.localId);
    if (codLocal.length > 0) {
      const pr = (pruebasRealizadas||[]).filter(p => p.localId === v.localId && (p.fechaProbado||"").startsWith(v.fecha?.slice(0,7)||""));
      const probados = pr.length;
      if (probados < codLocal.length) {
        faltantes.push({ key:"pruebas", label:`Pruebas técnicas (${probados}/${codLocal.length} probados)` });
      }
    }
  }

  const totalReal = campos.length + (faltantes.some(f=>f.key==="pruebas") ? 1 : 0);
  const completadosReal = completados.length;
  const pct = Math.round((completadosReal / totalReal) * 100);
  return { total: totalReal, completados: completadosReal, pct, faltantes };
}

}

// Cálculo de costo por km basado en parámetros fijos
function calcCostoKm(precioCombustible) {
  const combustible = 0.14 * precioCombustible;
  const mantenimiento = 300000 / 5000; // 60 Gs/km
  const cubiertas = 400000 / 40000;    // 10 Gs/km
  const desgaste = combustible * 0.10; // 10% del combustible
  return Math.round(combustible + mantenimiento + cubiertas + desgaste);
}
// Obtener número de local desde nombre ("01 - Sajonia" → "1")
function getNumLocal(nombre) {
  if (!nombre) return null;
  const m = nombre.match(/^(\d+)/);
  return m ? String(parseInt(m[1])) : null;
}

// Obtener KM entre dos locales (o supervisor → local)
function getKmEntre(origenId, destinoId, locales, supervisor) {
  const getKey = (id) => {
    if (!id) return null;
    const local = locales.find((l) => l.id === id);
    if (local) return getNumLocal(local.nombre);
    if (id?.startsWith("local-fixed-")) return id.replace("local-fixed-","");
    return null;
  };
  const dest = getKey(destinoId);
  if (!dest) return 0;
  // Origen: si es null, usar casa del supervisor
  let orig;
  if (!origenId) {
    orig = supervisor?.includes("Ernesto") ? "Sup1" : "Sup2";
  } else {
    orig = getKey(origenId);
  }
  if (!orig) return 0;
  return MATRIZ_KM[orig]?.[dest] || MATRIZ_KM[dest]?.[orig] || 0;
}

async function cargarCodigosSheets(locales) {

function procesarCodigos(items, locales) {
  const codigos = [];
  for (const item of items) {
    if (!item.codigo || item.numLocal === "NaN") continue;
    // Buscar local en Firestore
    let localObj = locales.find((l) => String(parseInt(l.nombre.split(" - ")[0].trim())) === item.numLocal);
    // Si no existe, buscar en LOCALES_FIJOS
    if (!localObj) {
      const nombre = LOCALES_FIJOS.find((n) => String(parseInt(n.split(" - ")[0].trim())) === item.numLocal);
      if (nombre) localObj = { id: "local-" + item.numLocal, nombre };
    }
    if (!localObj) continue;
    codigos.push({ id: uid(), localId: localObj.id, codigo: item.codigo, descripcion: item.descripcion, probado: false, fechaCarga: todayISO() });
  }
  return codigos;
}

/* ---- Firestore helpers ---- */
async function loadData() {
  try {
    const [locSnap, visSnap, tarSnap, codSnap, rutSnap, cfgSnap, ncSnap, aySnap, prSnap] = await Promise.all([
      db.collection("locales").get(),
      db.collection("visitas").get(),
      db.collection("tareas").get(),
      db.collection("codigos").get(),
      db.collection("rutas").get(),
      db.collection("config").doc("main").get(),
      db.collection("noCumplidos").get(),
      db.collection("ayudantes").get(),
      db.collection("pruebasRealizadas").get(),
    ]);
    const cfg = cfgSnap.exists ? cfgSnap.data() : {};
    const localesData = locSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
    // Cargar inventarios y códigos desde Google Sheets (sin bloquear si falla)
    const [inventariosSheets, codigosSheets] = await Promise.all([
      cargarInventariosSheets().catch(() => []),
      cargarCodigosSheets(localesData).catch(() => []),
    ]);
    // Mergear códigos: los de Firestore (con estado probado) + los nuevos de Sheets
    // Crear locales faltantes en Firestore para que los códigos tengan IDs reales
    const localesMap = {};
    localesData.forEach((l) => {
      const num = String(parseInt(l.nombre.split(" - ")[0].trim()));
      localesMap[num] = l;
    });
    // Para locales que no existen en Firestore, crearlos
    const localesBatch = [];
    LOCALES_FIJOS.forEach((nombre) => {
      const num = String(parseInt(nombre.split(" - ")[0].trim()));
      if (!localesMap[num]) {
        const newLocal = { id: "local-fixed-" + num, nombre };
        localesMap[num] = newLocal;
        localesBatch.push(newLocal);
      }
    });
    const localesCompletos = [...localesData, ...localesBatch];

    // Procesar códigos con IDs reales
    const codigosSheetsFinal = procesarCodigos(CODIGOS_DATA, localesCompletos);
    // Mapear códigos de Firestore al formato que espera la app
    const codFirestoreRaw = codSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
    const codFirestore = codFirestoreRaw.map((c) => {
      if (c.localId) return c; // ya tiene formato correcto
      // Viene del script — tiene numLocal, convertir a localId
      const localObj = localesCompletos.find((l) => String(parseInt(l.nombre.split(" - ")[0].trim())) === String(c.numLocal));
      const localId = localObj ? localObj.id : "local-fixed-" + c.numLocal;
      return { id: c.id, localId, codigo: c.codigo, descripcion: c.descripcion, prestamo: c.prestamo||0, numLocal: String(c.numLocal||""), nombreLocal: c.nombreLocal||"", probado: false, fechaCarga: todayISO() };
    });
    const codFirestoreKeys = new Set(codFirestore.map((c) => c.localId + "|" + c.codigo));
    const codNuevos = codFirestore.length > 0 ? [] : codigosSheetsFinal.filter((c) => !codFirestoreKeys.has(c.localId + "|" + c.codigo));
    const viejosSnap = await db.collection("articulosViejos").get();
    return {
      locales: localesCompletos,
      articulosViejos: viejosSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      visitas: visSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      tareas: tarSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      codigos: [...codFirestore, ...codNuevos],
      pruebasRealizadas: prSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      rutas: rutSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      noCumplidos: ncSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      ayudantes: aySnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      inventarios: (cfg.inventarios && cfg.inventarios.length > 0) ? cfg.inventarios : inventariosSheets,
      precioCombustible: cfg.precioCombustible || 6860,
    };
  } catch (err) { console.error("loadData:", err); return EMPTY; }
}

async function saveData(prev, next) {
  try {
    const batch = db.batch();
    const prevLocalIds = new Set((prev?.locales||[]).map((l) => l.id));
    for (const l of next.locales) {
      if (!prevLocalIds.has(l.id)) batch.set(db.collection("locales").doc(l.id), { nombre: l.nombre });
    }
    const prevVisMap = {};
    (prev?.visitas||[]).forEach((v) => { prevVisMap[v.id] = v; });
    for (const v of next.visitas) {
      const { id, ...rest } = v;
      if (!prevVisMap[id]) batch.set(db.collection("visitas").doc(id), rest);
      else if (v.quejasResueltas !== prevVisMap[id].quejasResueltas || v.infraResuelta !== prevVisMap[id].infraResuelta) {
        batch.update(db.collection("visitas").doc(id), { quejasResueltas: v.quejasResueltas, infraResuelta: v.infraResuelta, estadoResuelta: v.estadoResuelta, desvioResuelta: v.desvioResuelta });
      }
    }
    const prevTarMap = {};
    (prev?.tareas||[]).forEach((t) => { prevTarMap[t.id] = t; });
    for (const t of next.tareas) {
      const { id, ...rest } = t;
      if (!prevTarMap[id]) batch.set(db.collection("tareas").doc(id), rest);
      else if (t.hecha && !prevTarMap[id].hecha) batch.update(db.collection("tareas").doc(id), { hecha: true });
    }
    const prevCodMap = {};
    (prev?.codigos||[]).forEach((c) => { prevCodMap[c.id] = c; });
    const nextCodIds = new Set(next.codigos.map((c) => c.id));
    for (const c of (prev?.codigos||[])) {
      if (!nextCodIds.has(c.id)) batch.delete(db.collection("codigos").doc(c.id));
    }
    for (const c of next.codigos) {
      const { id, ...rest } = c;
      if (!prevCodMap[id]) batch.set(db.collection("codigos").doc(id), rest);
    }
    // Guardar pruebas realizadas en coleccion separada
    const prevPrMap = {};
    (prev?.pruebasRealizadas||[]).forEach((p) => { prevPrMap[p.localId + "|" + p.codigo] = p; });
    for (const c of next.codigos) {
      if (c.probado && !prevPrMap[c.localId + "|" + c.codigo]) {
        const prId = uid();
        batch.set(db.collection("pruebasRealizadas").doc(prId), {
          localId: c.localId, codigo: c.codigo, descripcion: c.descripcion,
          resultado: c.resultado, detalleFalla: c.detalleFalla||"",
          fechaProbado: c.fechaProbado, supervisor: c.supervisorPrueba||""
        });
      }
    }
    const prevRutMap = {};
    (prev?.rutas||[]).forEach((r) => { prevRutMap[r.id] = r; });
    for (const r of (next.rutas||[])) {
      const { id, ...rest } = r;
      if (!prevRutMap[id]) batch.set(db.collection("rutas").doc(id), rest);
    }
    for (const r of (prev?.rutas||[])) {
      if (!(next.rutas||[]).find((x) => x.id === r.id)) batch.delete(db.collection("rutas").doc(r.id));
    }
    // Ayudantes
    const prevAyMap = {};
    (prev?.ayudantes||[]).forEach((a) => { prevAyMap[a.id] = a; });
    for (const a of (next.ayudantes||[])) {
      const { id, ...rest } = a;
      if (!prevAyMap[id]) batch.set(db.collection("ayudantes").doc(id), rest);
      else if (a.evaluacionCompleta && !prevAyMap[id].evaluacionCompleta) {
        batch.update(db.collection("ayudantes").doc(id), { evaluacionCompleta: true, fechaCompletado: a.fechaCompletado, completadoPor: a.completadoPor||"" });
      } else if (!a.evaluacionCompleta && prevAyMap[id].evaluacionCompleta) {
        batch.update(db.collection("ayudantes").doc(id), { evaluacionCompleta: false, fechaCompletado: null, completadoPor: null });
      }
    }
    await batch.commit();
    const cfgChanged = JSON.stringify(next.inventarios) !== JSON.stringify(prev?.inventarios) || next.precioCombustible !== prev?.precioCombustible;
    if (cfgChanged) await db.collection("config").doc("main").set({ inventarios: next.inventarios||[], precioCombustible: next.precioCombustible||6860 }, { merge: true });
  } catch (err) { console.error("saveData:", err); }
}

/* ---- YesNo pill ---- */
function YesNo({ label, value, onChange, opts }) {
  const options = opts || ["Si", "No"];
  return (
    <div className="yesno">
      <span className="yesno-label">{label}</span>
      <div className="yesno-pills">
        {options.map((opt) => (
          <button key={opt} type="button"
            className={"pill" + (value === opt ? (opt === "No" || opt === "Mala" ? " pill-no" : opt === "Regular" ? " pill-med" : " pill-si") : "")}
            onClick={() => onChange(value === opt ? "" : opt)}>
            {opt}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---- Ayudantes Capacitacion ---- */
function diasCorridos(desde, hasta) {
  const d1 = new Date(desde); const d2 = new Date(hasta);
  return Math.floor((d2 - d1) / 86400000);
}

function sumarDiasCorridos(desde, dias) {
  const d = new Date(desde);
  d.setDate(d.getDate() + dias);
  return d.toISOString().split("T")[0];
}

function AyudantesCapacitacion({ data, onSave, showToast, soloLectura, sesion, modoRuta }) {
  const activos = (data.ayudantes||[]).filter(a => !a.evaluacionCompleta).sort((a,b) => a.fechaIngreso.localeCompare(b.fechaIngreso));
  const completados = (data.ayudantes||[]).filter(a => a.evaluacionCompleta);
  const [nombre, setNombre] = useState("");
  const [fechaIngreso, setFechaIngreso] = useState(todayISO());
  const [saving, setSaving] = useState(false);
  const [abierto, setAbierto] = useState(false); // para panel: expandir al hacer clic

  const hoy = todayISO();

  // Solo mostrar en Mi Ruta los activos (completados no se muestran a supervisor)
  const ayudantes = soloLectura && !sesion?.admin ? activos : activos;

  const agregar = async () => {
    if (!nombre.trim()) return;
    setSaving(true);
    try {
      const nuevo = { id: uid(), nombre: nombre.trim(), fechaIngreso, evaluacionCompleta: false, creadoEn: hoy };
      await onSave({ ...data, ayudantes: [...(data.ayudantes||[]), nuevo] });
      showToast("Ayudante agregado.");
      setNombre(""); setFechaIngreso(todayISO());
    } finally { setSaving(false); }
  };

  const completar = async (ay) => {
    const completadoPor = sesion?.nombre || "Admin";
    const act = (data.ayudantes||[]).map(a => a.id === ay.id ? { ...a, evaluacionCompleta: true, fechaCompletado: hoy, completadoPor } : a);
    await onSave({ ...data, ayudantes: act });
    showToast("Evaluación completada.");
  };

  const revertir = async (ay) => {
    const act = (data.ayudantes||[]).map(a => a.id === ay.id ? { ...a, evaluacionCompleta: false, fechaCompletado: null, completadoPor: null } : a);
    await onSave({ ...data, ayudantes: act });
    showToast("Evaluación revertida.");
  };

  const colorEstado = (dias) => dias >= 55 ? "var(--alert)" : dias >= 40 ? "#b37700" : "var(--done)";
  const emojiEstado = (dias) => dias >= 55 ? "🔴" : dias >= 40 ? "🟡" : "🟢";

  // ---- MODO MI RUTA — cards individuales, sin completados ----
  if (modoRuta) {
    if (activos.length === 0) return null;
    return (
      <div style={{ marginBottom:16 }}>

    </div>
  );

/* ---- Dashboard ---- */
function calcScore(v, codigos, pruebasRealizadas) {
  // Gestión Humana y Atención 40%
  const desFields = [
    v.eval_atencion === "bueno" ? 1 : v.eval_atencion === "regular" ? 0.5 : v.eval_atencion === "deficiente" ? 0 : null,
    v.eval_impulso === "bueno" ? 1 : v.eval_impulso === "regular" ? 0.5 : v.eval_impulso === "deficiente" ? 0 : null,
    v.eval_actitud === "bueno" ? 1 : v.eval_actitud === "regular" ? 0.5 : v.eval_actitud === "deficiente" ? 0 : null,
  ].filter(x => x !== null);
  const scoreDes = desFields.length > 0 ? desFields.reduce((a,b) => a+b,0) / desFields.length : null;

  // Control Operativo Diario 30%
  const opFields = [
    v.arqueoCaja === "Si" ? 1 : v.arqueoCaja === "No" ? 0 : null,
    v.condicionesLocal === "Si" ? 1 : v.condicionesLocal === "No" ? 0 : null,
    v.desviosOperativos === "No" ? 1 : v.desviosOperativos === "Si" ? 0 : null,
    v.promocionesVisibles === "Si" ? 1 : v.promocionesVisibles === "No" ? 0 : null,
  ].filter(x => x !== null);
  const scoreOp = opFields.length > 0 ? opFields.reduce((a,b) => a+b,0) / opFields.length : null;

  // Pruebas Técnicas y Comerciales 20%
  const codLocal = (codigos||[]).filter(c => c.localId === v.localId);
  const pruebas = (pruebasRealizadas||[]).filter(p => p.localId === v.localId);
  const pruebaScore = codLocal.length > 0 ? Math.min(pruebas.length / codLocal.length, 1) : null;
  const comFields = [
    v.bajaRotacionExhibidos === "Si" ? 1 : v.bajaRotacionExhibidos === "No" ? 0 : null,
    ...(pruebaScore !== null ? [pruebaScore] : []),
  ].filter(x => x !== null);
  const scoreCom = comFields.length > 0 ? comFields.reduce((a,b) => a+b,0) / comFields.length : null;

  // Mantenimiento y Cuidado de Sede 10%
  const scoreMant = v.estadoLocal === "sin_novedades" ? 1 : v.estadoLocal === "seguimiento" ? 0.5 : v.estadoLocal === "intervencion" ? 0 : null;

  // Ponderado
  let total = 0, weight = 0;
  if (scoreDes !== null) { total += scoreDes * 0.40; weight += 0.40; }
  if (scoreOp !== null) { total += scoreOp * 0.30; weight += 0.30; }
  if (scoreCom !== null) { total += scoreCom * 0.20; weight += 0.20; }
  if (scoreMant !== null) { total += scoreMant * 0.10; weight += 0.10; }
  return weight > 0 ? Math.round((total / weight) * 100) : null;
}

function Dashboard({ data, onSave, showToast, sesion }) {
  const { locales, visitas, tareas, ayudantes } = data;
  const filtroSup = "todos";

  const [seccionActiva, setSeccionActiva] = useState(null);
  const [filtroEstado, setFiltroEstado] = useState(null);
  const [openFranja, setOpenFranja] = useState(null);
  const [openAyFranja, setOpenAyFranja] = useState(null);

  const mesesDisponibles = useMemo(() => {
    const set = new Set(visitas.map((v) => v.fecha?.slice(0,7)).filter(Boolean));
    return [...set].sort().reverse();
  }, [visitas]);

  const nombreMes = (ym) => {
    if (!ym) return "Todos";
    const [y,m] = ym.split("-");
    return ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][parseInt(m)-1]+" "+y;
  };

  const mesAnterior = useMemo(() => {
    if (!mesFiltro) return null;
    const [y,m] = mesFiltro.split("-").map(Number);
    const d = new Date(y, m-2, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }, [mesFiltro]);

  const visitasFiltradas = useMemo(() => visitas.filter(v => !v.borrador && (!mesFiltro || v.fecha?.startsWith(mesFiltro))), [visitas, mesFiltro]);
  const visitasAnt = useMemo(() => visitas.filter(v => !v.borrador && mesAnterior && v.fecha?.startsWith(mesAnterior)), [visitas, mesAnterior]);

  const localName = (id) => {
    const l = locales.find(l => l.id === id);
    if (!l) return id;
    const parts = l.nombre.split(" - ");
    return "Suc. " + parseInt(parts[0]) + (parts[1] ? " - " + parts.slice(1).join(" - ") : "");
  };

  // KPIs
  const totalVisitas = visitasFiltradas.length;
  const totalVisitasAnt = visitasAnt.length;
  const tareasPend = (tareas||[]).filter(t => !t.hecha);
  const tareasPendAnt = tareasPend.length; // no hay histórico de tareas por mes
  const desvios = visitasFiltradas.filter(v => v.desviosOperativos === "Si").length;
  const desviosAnt = visitasAnt.filter(v => v.desviosOperativos === "Si").length;
  const codigos = data.codigos||[];
  const pruebasRealizadas = data.pruebasRealizadas||[];
  const totalCod = codigos.length;
  const probados = pruebasRealizadas.filter(p => !mesFiltro || (p.fechaProbado||"").startsWith(mesFiltro)).length;
  const pctPrueba = totalCod > 0 ? Math.round((probados/totalCod)*100) : null;
  const probadosAnt = pruebasRealizadas.filter(p => mesAnterior && (p.fechaProbado||"").startsWith(mesAnterior)).length;
  const pctPruebaAnt = totalCod > 0 ? Math.round((probadosAnt/totalCod)*100) : null;
  const capacitaciones = visitasFiltradas.filter(v => v.capacitacion === "si").length;
  const capacitacionesAnt = visitasAnt.filter(v => v.capacitacion === "si").length;
  const intervenciones = visitasFiltradas.filter(v => v.estadoLocal === "intervencion").length;
  const intervencionesAnt = visitasAnt.filter(v => v.estadoLocal === "intervencion").length;
  const ayudantesActivos = (ayudantes||[]).filter(a => !a.evaluacionCompleta);

  const vsAnt = (act, ant) => {
    if (ant === 0 || ant === null) return null;
    const pct = Math.round(((act - ant) / ant) * 100);
    const color = pct > 0 ? "var(--done)" : pct < 0 ? "var(--alert)" : "#6B7268";
    const arrow = pct > 0 ? "▲" : pct < 0 ? "▼" : "—";
    return <span style={{ fontSize:10, color, fontWeight:700 }}>{arrow} {Math.abs(pct)}% vs. ant.</span>;
  };

  // Calcular % y casos para cada campo
  const calcPct = (campo, valOk, arr) => {
    const resp = arr.filter(v => v[campo]);
    const ok = resp.filter(v => v[campo] === valOk);
    return { pct: resp.length > 0 ? Math.round(ok.length/resp.length*100) : null, ok: ok.length, total: resp.length };
  };

  // Operativa
  const opArqueo = calcPct("arqueoCaja","Si",visitasFiltradas);
  const opCondiciones = calcPct("condicionesLocal","Si",visitasFiltradas);
  const opDesvios = calcPct("desviosOperativos","No",visitasFiltradas);
  const opPromos = calcPct("promocionesVisibles","Si",visitasFiltradas);

  // Comercial
  const comBajaRot = calcPct("bajaRotacionExhibidos","Si",visitasFiltradas);
  const comPrecios = calcPct("promocionesVisibles","Si",visitasFiltradas);
  const comMonitoreo = calcPct("monitoreoCompetencia","No",visitasFiltradas);

    .map(([localId, v]) => ({ localId, score: calcScore(v, codigos, pruebasRealizadas) }))

          <h2 className="page-title">Estado General e Infraestructura</h2>
          <div style={{ display:"flex", gap:8, marginBottom:14, flexWrap:"wrap" }}>
            {categorias.map(({ key, label, list, color }) => (
              <button key={key} onClick={() => setFiltroEstado(filtroEstado===key?null:key)}
                style={{ padding:"8px 14px", borderRadius:8, border:`2px solid ${color}`, background: filtroEstado===key?color+"22":"transparent", color, fontWeight:700, fontSize:12, cursor:"pointer" }}>
                {label} ({list.length})
              </button>
            ))}
          </div>
          {(listaActiva ? [listaActiva] : categorias).map(({ label, list, color, bg }) => (
            <div key={label} className="dash-panel" style={{ borderLeft:`4px solid ${color}`, marginBottom:12 }}>
              <div style={{ fontWeight:700, fontSize:13, color, marginBottom:8 }}>{label} ({list.length})</div>
              {list.length === 0 ? <div className="dim small">Sin locales.</div> : (
                <table style={{ width:"100%", fontSize:12, borderCollapse:"collapse" }}>
                  <thead><tr style={{ borderBottom:"1px solid var(--line)", background:"#e8ede8" }}>
                    <th style={{ padding:"5px 8px", textAlign:"left" }}>Local</th>
                    <th style={{ padding:"5px 8px", textAlign:"left" }}>Supervisor</th>
                    <th style={{ padding:"5px 8px", textAlign:"left" }}>Fecha</th>
                    <th style={{ padding:"5px 8px", textAlign:"left" }}>Detalle</th>
                  </tr></thead>
                  <tbody>
                    {list.map((v,i) => (
                      <tr key={i} style={{ borderBottom:"1px solid var(--line)", background: i%2===0?"#fff":bg }}>
                        <td style={{ padding:"5px 8px", fontWeight:500 }}>{localName(v.localId)}</td>
                        <td style={{ padding:"5px 8px" }} className="dim">{(v.supervisor||"").split(" ")[0]}</td>
                        <td style={{ padding:"5px 8px" }} className="dim">{fmt(v.fecha)}</td>
                        <td style={{ padding:"5px 8px", fontSize:11 }}>{v.infraestructura||"-"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          ))}
        </div>
      );
    }
  }

  // ---- DASHBOARD PRINCIPAL ----
  return (
    <div className="form-page">

      {/* Header */}
      <div style={{ background:"#1a5276", borderRadius:12, padding:"14px 18px", marginBottom:16, color:"#fff" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:8 }}>
          <div>
            <div style={{ fontFamily:"Space Grotesk,sans-serif", fontSize:17, fontWeight:700, color:"#c8dff0" }}>SUPERVISIÓN Y CONTROL DE LOCALES</div>
            <div style={{ fontSize:11.5, color:"#8aaad4", marginTop:2 }}>Resumen ejecutivo de visitas, cumplimiento operativo e inventario</div>
            <div style={{ fontSize:10, color:"#a8c8e8", marginTop:6, padding:"5px 10px", background:"rgba(255,255,255,0.08)", borderRadius:6, display:"inline-block" }}>📊 Ponderación del Score: Gestión Humana 40% · Operativa 30% · Pruebas/Comercial 20% · Mantenimiento 10%</div>
          </div>
          <div style={{ fontSize:11, color:"#8aaad4" }}>{new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"})}</div>
        </div>
        <div style={{ marginTop:10, display:"flex", flexWrap:"wrap", gap:8 }}>
          <button className={"mes-pill"+(!mesFiltro?" active":"")} onClick={() => setMesFiltro("")} style={{ color:"#fff", borderColor:"rgba(255,255,255,0.4)", background:"rgba(255,255,255,0.15)" }}>Todos</button>
          {mesesDisponibles.map(m => (
            <button key={m} className={"mes-pill"+(mesFiltro===m?" active":"")} onClick={() => setMesFiltro(m)} style={{ color:"#fff", borderColor:"rgba(255,255,255,0.4)", background: mesFiltro===m?"rgba(255,255,255,0.35)":"rgba(255,255,255,0.15)" }}>{nombreMes(m)}</button>
          ))}
        </div>
      </div>

      {/* KPIs — fila */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr) repeat(4,1fr)", gap:8, marginBottom:16 }}>
        {[
          { label:"VISITAS REALIZADAS", value: totalVisitas, vs: vsAnt(totalVisitas, totalVisitasAnt), sec:"visitas" },
          { label:"TAREAS PENDIENTES", value: tareasPend.length, vs: null, sec:"tareas", color: tareasPend.length>0?"#b37700":null },
          { label:"DESVÍOS DETECTADOS", value: desvios, vs: vsAnt(desvios, desviosAnt), sec:"desvios", color: desvios>0?"var(--alert)":null },
          { label:"PRUEBA TÉCNICA", value: pctPrueba !== null ? pctPrueba+"%" : "-", vs: vsAnt(pctPrueba, pctPruebaAnt), sec:"pruebas" },
          { label:"CAPACITACIONES", value: capacitaciones, vs: vsAnt(capacitaciones, capacitacionesAnt), sec:"capacitaciones" },
          { label:"INTERVENCIONES", value: intervenciones, vs: vsAnt(intervenciones, intervencionesAnt), sec:"intervenciones", color: intervenciones>0?"var(--alert)":null },
          { label:"AYUDANTES EN CAP.", value: ayudantesActivos.length, vs: null, sec:null, color: ayudantesActivos.length>0?"#b37700":null },
        ].map(({ label, value, vs, sec, color }) => (
          <div key={label} onClick={() => sec && setSeccionActiva(sec)}
            style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, padding:"12px 10px", cursor: sec?"pointer":"default", textAlign:"center" }}
            onMouseEnter={e => { if(sec) e.currentTarget.style.boxShadow="0 2px 12px rgba(0,0,0,.1)"; }}
            onMouseLeave={e => { e.currentTarget.style.boxShadow="none"; }}>
            <div style={{ fontSize:9, fontWeight:700, textTransform:"uppercase", letterSpacing:".06em", color:"#6B7268", marginBottom:4 }}>{label}</div>
            <div style={{ fontSize:22, fontWeight:800, fontFamily:"'Inter',sans-serif", fontVariantNumeric:"tabular-nums", color: color||"var(--ink)", lineHeight:1.1 }}>{value}</div>
            {vs && <div style={{ marginTop:4 }}>{vs}</div>}
            {sec && <div style={{ fontSize:9, color:"var(--route)", marginTop:2 }}>Ver detalle →</div>}
          </div>
        ))}
      </div>

      {/* Ayudantes en capacitación */}
      {ayudantesActivos.length > 0 && (
        <div className="dash-panel" style={{ marginBottom:14 }}>
          <div className="dash-panel-title" style={{ background:"#1a5276", color:"#fff", margin:"-18px -20px 12px", padding:"8px 14px", borderRadius:"14px 14px 0 0", marginBottom:14 }}>3. SEGUIMIENTO DE PERSONAL (CAPACITACIÓN)</div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(180px, 1fr))", gap:10 }}>
            {ayudantesActivos.map(ay => {
              const hoy = todayISO();
              const diasTransc = diasCorridos(ay.fechaIngreso, hoy);
              const fechaVence = sumarDiasCorridos(ay.fechaIngreso, 60);
              const diasRest = 60 - diasTransc;
              const color = diasTransc>=55?"var(--alert)":diasTransc>=40?"#b37700":"var(--done)";
              const bg = diasTransc>=55?"#fdf2f2":diasTransc>=40?"#fffbea":"#f0faf5";
              return (
                <div key={ay.id} style={{ border:`2px solid ${color}`, borderRadius:10, padding:"10px 12px", background:bg }}>
                  <div style={{ fontWeight:700, fontSize:12, marginBottom:6, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                    {diasTransc>=55?"🔴":diasTransc>=40?"🟡":"🟢"} {ay.nombre}
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:2, fontSize:10 }}>
                    <span className="dim">Ing.: <b>{ay.fechaIngreso.split("-").reverse().join("/")}</b></span>
                    <span className="dim">Cap.: <b style={{ color }}>{diasTransc}d</b></span>
                    <span className="dim">Venc.: <b>{fechaVence.split("-").reverse().join("/")}</b></span>
                    <span className="dim">Rest.: <b style={{ color }}>{diasRest > 0 ? diasRest+"d" : "Vencido"}</b></span>

                </div>

        </div>
      )}

      {/* Fila principal */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:14 }}>

        {/* Desvíos inventario + Regularización */}
        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
          <div className="dash-panel" style={{ marginBottom:0 }}>
            <div className="dash-panel-title" style={{ background:"#1a5276", color:"#fff", margin:"-18px -20px 12px", padding:"8px 14px", borderRadius:"14px 14px 0 0" }}>DESVÍOS DEL ÚLTIMO INVENTARIO</div>
            {invData ? (
              <>
                <div style={{ color:"var(--alert)", fontWeight:700, fontSize:13, marginBottom:8 }}>Total Desvíos: {invData.totalDesv} artículos</div>
                {Object.entries(invData.desv).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k,v]) => (

                ))}

          <div className="dash-panel" style={{ marginBottom:0 }}>
            <div className="dash-panel-title" style={{ background:"#1a5276", color:"#fff", margin:"-18px -20px 12px", padding:"8px 14px", borderRadius:"14px 14px 0 0" }}>REGULARIZACIÓN DE DESVÍOS ANTERIORES</div>
            {regTotal > 0 ? (
              <>
                <div style={{ fontWeight:700, fontSize:14, color: regPct>=60?"var(--done)":"#b37700", marginBottom:8 }}>{regPct}% {regPct>=80?"BIEN":regPct>=50?"PARCIALMENTE":"BAJO"}</div>
                <div style={{ background:"var(--line)", borderRadius:4, height:8, marginBottom:10 }}>
                  <div style={{ width:regPct+"%", height:8, background: regPct>=80?"var(--done)":regPct>=50?"#b37700":"var(--alert)", borderRadius:4 }} />
                </div>
                {[["Regularizados Todos", regTodos,"var(--done)"],["Regularizados Parcialmente",regParc,"#b37700"],["No Regularizados",regNo,"var(--alert)"]].map(([l,n,c]) => (
                  <div key={l} style={{ display:"flex", justifyContent:"space-between", fontSize:12, padding:"3px 0" }}>
                    <span>{l}</span><span style={{ fontWeight:700, color:c }}>{n} ({regTotal>0?Math.round(n/regTotal*100):0}%)</span>

                ))}
              </>

          </div>

          {artViejos.length > 0 && (
            <div className="dash-panel" style={{ marginBottom:0 }}>
              <div className="dash-panel-title" style={{ background:"#1a5276", color:"#fff", margin:"-18px -20px 12px", padding:"8px 14px", borderRadius:"14px 14px 0 0" }}>STOCK CRÍTICO (&gt;10 MESES EN STOCK)</div>
              <table style={{ width:"100%", fontSize:11, borderCollapse:"collapse" }}>
                <thead><tr style={{ borderBottom:"1px solid var(--line)" }}>
                  <th style={{ padding:"4px 6px", textAlign:"left" }}>Cód.</th>
                  <th style={{ padding:"4px 6px", textAlign:"left" }}>Descripción</th>
                  <th style={{ padding:"4px 6px", textAlign:"center" }}>F. Remate</th>
                </tr></thead>
                <tbody>
                  {artViejos.map((a,i) => (
                    <tr key={i} style={{ borderBottom:"1px solid var(--line)" }}>
                      <td style={{ padding:"4px 6px" }} className="mono">{a.codigo}</td>

                      <td style={{ padding:"4px 6px", textAlign:"center", color:"var(--alert)", fontWeight:600, fontSize:10 }}>{a.fechaRemate||"-"}</td>
                    </tr>

                </tbody>
              </table>
            </div>
          )}
        </div>

        {/* Columna central — Operativa + Comercial + Desempeño */}

          <div className="dash-panel" style={{ marginBottom:0, cursor:"pointer" }} onClick={() => setSeccionActiva("operativa")}>
            <div className="dash-panel-title" style={{ background:"#1a5276", color:"#fff", margin:"-18px -20px 12px", padding:"8px 14px", borderRadius:"14px 14px 0 0" }}>1. RIESGO Y OPERATIVA</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr auto auto", gap:4, fontSize:11, fontWeight:600, color:"#6B7268", marginBottom:6, borderBottom:"1px solid var(--line)", paddingBottom:4 }}>
              <span>CONCEPTO EVALUADO</span><span style={{ textAlign:"center" }}>% CUMPL.</span><span style={{ textAlign:"center" }}>CASOS</span>
            </div>
            {[
              { label:"Caja sin diferencias", d: opArqueo },
              { label:"Condiciones de Operación (Orden/Limp.)", d: opCondiciones },
              { label:"Sin desvíos críticos detectados", d: opDesvios },
            ].map(({ label, d }) => (
              <div key={label} style={{ display:"grid", gridTemplateColumns:"1fr auto auto", gap:4, padding:"5px 0", borderBottom:"1px solid var(--line)", alignItems:"center" }}>
                <span style={{ fontSize:12 }}>{label}</span>
                <span style={{ fontWeight:800, fontSize:13, color:pctColor(d.pct||0), textAlign:"center", minWidth:40 }}>{d.pct !== null ? d.pct+"%" : "-"}</span>
                <span className="dim small" style={{ textAlign:"center", minWidth:40 }}>{d.ok}/{d.total}</span>
              </div>
            ))}
            <div style={{ fontSize:10, color:"var(--route)", marginTop:6 }}>Ver detalle →</div>
          </div>

          <div className="dash-panel" style={{ marginBottom:0, cursor:"pointer" }} onClick={() => setSeccionActiva("comercial")}>
            <div className="dash-panel-title" style={{ background:"#1a5276", color:"#fff", margin:"-18px -20px 12px", padding:"8px 14px", borderRadius:"14px 14px 0 0" }}>2. GESTIÓN DEL NEGOCIO</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr auto auto", gap:4, fontSize:11, fontWeight:600, color:"#6B7268", marginBottom:6, borderBottom:"1px solid var(--line)", paddingBottom:4 }}>
              <span>CONCEPTO EVALUADO</span><span style={{ textAlign:"center" }}>% CUMPL.</span><span style={{ textAlign:"center" }}>CASOS</span>
            </div>
            {[
              { label:"Baja rotación bien exhibidos", d: comBajaRot },

              { label:"Monitoreo de competencia realizado", d: comMonitoreo },

              <div key={label} style={{ display:"grid", gridTemplateColumns:"1fr auto auto", gap:4, padding:"5px 0", borderBottom:"1px solid var(--line)", alignItems:"center" }}>

                <span style={{ fontWeight:800, fontSize:13, color:pctColor(d.pct||0), textAlign:"center", minWidth:40 }}>{d.pct !== null ? d.pct+"%" : "-"}</span>

            <div style={{ fontSize:10, color:"var(--route)", marginTop:6 }}>Ver detalle →</div>
          </div>

          <div className="dash-panel" style={{ marginBottom:0, cursor:"pointer" }} onClick={() => setSeccionActiva("desempeno")}>
            <div className="dash-panel-title" style={{ background:"#1a5276", color:"#fff", margin:"-18px -20px 12px", padding:"8px 14px", borderRadius:"14px 14px 0 0" }}>4. DESEMPEÑO OBSERVADO EN VISITA</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr auto auto", gap:4, fontSize:11, fontWeight:600, color:"#6B7268", marginBottom:6, borderBottom:"1px solid var(--line)", paddingBottom:4 }}>
              <span>ASPECTO EVALUADO</span><span style={{ textAlign:"center" }}>% BUENO</span><span style={{ textAlign:"center" }}>CALIF.</span>
            </div>
            {[
              { label:"Atención al cliente", d: desAtencion },
              { label:"Impulso de empeños y ventas", d: desImpulso },
              { label:"Actitud y compromiso", d: desActitud },
            ].map(({ label, d }) => (
              <div key={label} style={{ display:"grid", gridTemplateColumns:"1fr auto auto", gap:4, padding:"5px 0", borderBottom:"1px solid var(--line)", alignItems:"center" }}>
                <span style={{ fontSize:12 }}>{label}</span>
                <span style={{ fontWeight:800, fontSize:13, color:pctColor(d.pct||0), textAlign:"center", minWidth:40 }}>{d.pct !== null ? d.pct+"%" : "-"}</span>
                <span style={{ textAlign:"center", minWidth:55 }}>
                  {d.label && <span style={{ fontSize:10, fontWeight:700, color:d.color, background:d.color==="var(--done)"?"#f0faf5":d.color==="#b37700"?"#fffbea":"#fdf2f2", padding:"1px 6px", borderRadius:8 }}>{d.label}</span>}
                </span>
              </div>
            ))}
            {(() => {
              const si = visitasFiltradas.filter(v => v.capacitacion === "si").length;
              return si > 0 ? <div style={{ marginTop:8, fontSize:11, color:"var(--done)", fontWeight:600 }}>✔ Capacitación/refuerzo: {si} ({Math.round(si/visitasFiltradas.length*100)}%)</div> : null;
            })()}
            <div style={{ fontSize:10, color:"var(--route)", marginTop:6 }}>Ver detalle →</div>
          </div>
        </div>

        {/* Columna derecha — Infraestructura + Plan + Ayudantes */}
        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
          <div className="dash-panel" style={{ marginBottom:0, cursor:"pointer" }} onClick={() => setSeccionActiva("infraestructura")}>
            <div className="dash-panel-title" style={{ background:"#1a5276", color:"#fff", margin:"-18px -20px 12px", padding:"8px 14px", borderRadius:"14px 14px 0 0" }}>5. INFRAESTRUCTURA Y SEGURIDAD</div>
            <div style={{ fontSize:11, fontWeight:600, color:"#6B7268", marginBottom:8 }}>Distribución Total del Estado de Locales:</div>
            {totalLocalesInfra > 0 && (
              <div style={{ display:"flex", height:12, borderRadius:6, overflow:"hidden", marginBottom:10 }}>
                {sinNov.length > 0 && <div style={{ flex:sinNov.length, background:"var(--done)" }}/>}
                {seguimiento.length > 0 && <div style={{ flex:seguimiento.length, background:"#b37700" }}/>}
                {intervencionList.length > 0 && <div style={{ flex:intervencionList.length, background:"var(--alert)" }}/>}
              </div>
            )}
            {[
              { emoji:"🟢", label:"Normal (Sin novedades)", list:sinNov, color:"var(--done)" },
              { emoji:"🟡", label:"En Seguimiento / Mantenimiento", list:seguimiento, color:"#b37700" },
              { emoji:"🔴", label:"Intervención Requerida", list:intervencionList, color:"var(--alert)" },
            ].map(({ emoji, label, list, color }) => (
              <div key={label} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"4px 0", borderBottom:"1px solid var(--line)", fontSize:12 }}>
                <span>{emoji} {label}</span>
                <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                  <span style={{ fontWeight:700, color }}>{totalLocalesInfra>0?Math.round(list.length/totalLocalesInfra*100):0}%</span>
                  <span className="dim small">({list.length} locales)</span>
                </div>
              </div>
            ))}
            <div style={{ fontSize:10, color:"var(--route)", marginTop:6 }}>Ver detalle →</div>
          </div>

          <div className="dash-panel" style={{ marginBottom:0 }}>
            <div className="dash-panel-title" style={{ background:"#1a5276", color:"#fff", margin:"-18px -20px 12px", padding:"8px 14px", borderRadius:"14px 14px 0 0" }}>6. PLAN DE ACCIÓN Y 7. HALLAZGOS</div>
            {planes.length > 0 && (
              <>
                <div style={{ fontSize:11, fontWeight:700, color:"#6B7268", marginBottom:4 }}>Tarea acordada con el encargado:</div>
                {planes.map((v,i) => (
                  <div key={i} style={{ fontSize:11.5, background:"#f5f7f5", borderRadius:6, padding:"6px 8px", marginBottom:8, borderLeft:"3px solid var(--route)" }}>
                    {v.compromiso}
                  </div>
                ))}
              </>
            )}
            {hallazgos.length > 0 && (
              <>
                <div style={{ fontSize:11, fontWeight:700, color:"#6B7268", marginBottom:4 }}>Hallazgos relevantes:</div>
                {hallazgos.map((v,i) => (
                  <div key={i} style={{ fontSize:11.5, background:"#f5f7f5", borderRadius:6, padding:"6px 8px", marginBottom:6, borderLeft:"3px solid #b37700" }}>
                    <span className="dim" style={{ fontSize:10 }}>{localName(v.localId)} · </span>{v.observacionesGenerales}
                  </div>
                ))}
              </>
            )}
            {planes.length === 0 && hallazgos.length === 0 && <div className="dim small">Sin planes ni hallazgos recientes.</div>}
          </div>

          {/* Ranking compacto */}
          <div className="dash-panel" style={{ marginBottom:0, cursor:"pointer" }} onClick={() => setSeccionActiva("ranking")}>
            <div className="dash-panel-title" style={{ background:"#1a5276", color:"#fff", margin:"-18px -20px 12px", padding:"8px 14px", borderRadius:"14px 14px 0 0" }}>RANKING DE PERFORMANCE</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginTop:4 }}>
              <div>
                <div style={{ fontSize:10, fontWeight:700, color:"var(--done)", marginBottom:6 }}>TOP MEJORES</div>
                {ranking.slice(0,3).map((x,i) => (
                  <div key={i} style={{ display:"flex", justifyContent:"space-between", padding:"3px 0", borderBottom:"1px solid var(--line)", fontSize:11 }}>
                    <span style={{ fontWeight:500 }}>{localName(x.localId)}</span>
                    <span style={{ fontWeight:700, color:"var(--done)" }}>{x.score} pts</span>
                  </div>
                ))}
              </div>
              <div>
                <div style={{ fontSize:10, fontWeight:700, color:"var(--alert)", marginBottom:6 }}>TOP CRÍTICOS</div>
                {[...ranking].reverse().slice(0,3).map((x,i) => (
                  <div key={i} style={{ display:"flex", justifyContent:"space-between", padding:"3px 0", borderBottom:"1px solid var(--line)", fontSize:11 }}>
                    <span style={{ fontWeight:500 }}>{localName(x.localId)}</span>
                    <span style={{ fontWeight:700, color:"var(--alert)" }}>{x.score} pts</span>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ fontSize:10, color:"var(--route)", marginTop:6 }}>Ver ranking completo →</div>
          </div>
        </div>
      </div>


    </div>
  );
}

function CheckItem({ fieldKey, label, conAccion, accionLabel, invertido, checks, acciones, setChecks, setAcciones }) {
  const val = checks[fieldKey] || "";
  const mostrarCampo = conAccion && (invertido ? val === "Si" : val === "No");
  return (
    <div className="check-item">
      <div className="check-item-head">
        <span className="check-item-label">{label}</span>
        <div className="yesno-pills">
          {["Si","No"].map((opt) => (
            <button key={opt} type="button"
              className={"pill"+(val===opt?(opt==="No"?" pill-no":" pill-si"):"")}
              onClick={() => setChecks((prev) => ({ ...prev, [fieldKey]: prev[fieldKey]===opt?"":opt }))}>
              {opt === "Si" ? "✔" : "✖"}
            </button>
          ))}
        </div>
      </div>
      {mostrarCampo && (
        <textarea key={fieldKey+"-accion"} className="input" rows={2} style={{ marginTop:6, fontSize:12.5 }}
          placeholder={accionLabel || "Accion correctiva / Plazo"}
          defaultValue={acciones[fieldKey] || ""}
          onBlur={(e) => setAcciones((prev) => ({ ...prev, [fieldKey]: e.target.value }))} />
      )}
    </div>
  );
}

function NuevoRecorrido({ data, onSave, onDone, localPrecargado, esAdicional, supervisorFijo }) {

  const DRAFT_KEY = "rec-draft-global"; // Solo para el useEffect inicial

  // Cargar borrador al montar
  // El borrador se carga cuando se selecciona un local (ver useEffect de localPrecargado)

  // Cargar local precargado
  useEffect(() => {
    if (localPrecargado && !localId && !cambiando) {

        // Limpiar estados del formulario para el nuevo local
        setChecks({}); setAcciones({}); setObservacionComercial("");

        setResultadosCodigos({}); setCheckedDone({});
        setQuejasResueltasCheck(false); setInfraResueltaCheck(false); setEstadoResueltaCheck(false); setDesvioResueltaCheck(false); setEstadoResueltaCheck(false); setDesvioResueltaCheck(false);
        setInfraChecks({}); setQuejasChecks({});
        // Cargar borrador específico de este local si existe
        try {
          const draft = JSON.parse(localStorage.getItem("rec-draft-" + local.id) || "null");
          if (draft) {
            if (draft.supervisor) setSupervisor(draft.supervisor);
            if (draft.checks) setChecks(draft.checks);
            if (draft.acciones) setAcciones(draft.acciones);
            if (draft.observacionComercial) setObservacionComercial(draft.observacionComercial);
            if (draft.capacitacionDada) setCapacitacionDada(draft.capacitacionDada);
            if (draft.temaCapacitacion) setTemaCapacitacion(draft.temaCapacitacion);
            if (draft.oportunidadMejora) setOportunidadMejora(draft.oportunidadMejora);
            if (draft.aspectoPositivo) setAspectoPositivo(draft.aspectoPositivo);
            if (draft.compromiso) setCompromiso(draft.compromiso);
          }
        } catch {}
        setLocalId(local.id);
        const ahora = new Date();
        setHoraLlegada(ahora.toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" }));
      }
    }
  }, [localPrecargado, cambiando]);

  // Guardar borrador automáticamente
  useEffect(() => {
    if (!localId) return;
    const tieneContenido = (
      Object.values(checks||{}).some(v => v) ||
      Object.values(acciones||{}).some(v => v && v.trim()) ||
      (observacionComercial||"").trim() ||
      capacitacionDada ||
      (temaCapacitacion||"").trim() ||
      (competencia||"").trim() ||
      (typeof incidencias === "string" ? incidencias.trim() : Object.keys(incidencias||{}).length > 0) ||
      (infraestructura||"").trim() ||
      (nuevasTareas||[]).some(t => t && t.trim()) ||
      (compromiso||"").trim()
    );
    if (tieneContenido) {
      const draft = { supervisor, checks, acciones, observacionComercial, capacitacionDada, temaCapacitacion, competencia, incidencias, infraestructura, nuevasTareas, localId };
      localStorage.setItem("rec-draft-" + localId, JSON.stringify(draft));
    } else {
      localStorage.removeItem("rec-draft-" + localId);
    }
  }, [supervisor, checks, acciones, observacionComercial, capacitacionDada, temaCapacitacion, competencia, incidencias, infraestructura, nuevasTareas, localId]);

  const selectedLocal = locales.find((l) => l.id === localId);

  // Todas las tareas pendientes del local (no solo la última)
  const tareasPendientes = useMemo(
    () => tareas.filter((t) => t.localId === localId && !t.hecha),
    [tareas, localId]
  );

  const codigosDelLocal = useMemo(() => {
    const prSet = new Set((data.pruebasRealizadas||[]).filter((p) => p.localId === localId).map((p) => p.codigo));
    return (codigos || []).filter((c) => c.localId === localId && !prSet.has(c.codigo));
  }, [codigos, data.pruebasRealizadas, localId]);

  // Última visita al local
  const ultimaVisita = useMemo(() => {
    return visitas.filter((v) => v.localId === localId).sort((a,b) => a.fecha < b.fecha ? 1 : -1)[0] || null;
  }, [visitas, localId]);

  const resetForm = () => {

  };

  const submit = async () => {
    if (!localId || !supervisor.trim() || saving) return;
    if (!checks.personal) { showToast("Debe seleccionar Encargado o Ayudante antes de guardar."); return; }
    setSaving(true);
    try {
      // Recalcular km total del día incluyendo esta visita nueva
      const visitasHoyOrdenadas = [...data.visitas
        .filter((v) => v.supervisor === supervisor.trim() && v.fecha === todayISO())
        .sort((a,b) => (a.horaLlegada||"00:00") < (b.horaLlegada||"00:00") ? -1 : 1),
        { localId } // agregar la visita actual al final

      const getNumLocalSeguro = (localId, localesArr) => {
        // Primero buscar en localesArr
        const local = localesArr.find((l) => l.id === localId);
        if (local) return getNumLocal(local.nombre);

        if (localId?.startsWith("local-fixed-")) return localId.replace("local-fixed-","");
        // Fallback: buscar en LOCALES_FIJOS por ID parcial
        return null;
      };

      // Calcular tramos: Casa → L1 → L2 → ... → Ln → Oficina
      const calcKmDia = (visitasOrdenadas, localesArr, sup) => {
        if (visitasOrdenadas.length === 0) return 0;
        // Determinar origen/destino según hora de la primera visita
        const horaFirst = visitasOrdenadas[0].horaLlegada || "00:00";
        const [hh, mm] = horaFirst.split(":").map(Number);
        const minutos = hh * 60 + (mm || 0);
        const saleDesaCasa = minutos <= 9 * 60 + 30; // ≤ 9:30 → desde casa
        const supKey = sup.includes("Ernesto") ? "Sup1" : "Sup2";
        let total = 0;
        // Primer tramo: casa→primer local  ó  oficina→primer local
        const primerNum = getNumLocalSeguro(visitasOrdenadas[0].localId, localesArr);
        if (primerNum) {
          if (saleDesaCasa) {
            total += MATRIZ_KM[supKey]?.[primerNum] || MATRIZ_KM[primerNum]?.[supKey] || 0;
          } else {
            total += MATRIZ_KM["of"]?.[primerNum] || MATRIZ_KM[primerNum]?.["of"] || 0;
          }
        }
        // Tramos intermedios
        for (let i = 1; i < visitasOrdenadas.length; i++) {
          total += getKmEntre(visitasOrdenadas[i-1].localId, visitasOrdenadas[i].localId, localesArr, sup);
        }
        // Último tramo: último local→oficina  ó  último local→casa
        const ultimoId = visitasOrdenadas[visitasOrdenadas.length - 1].localId;
        const ultimoNum = getNumLocalSeguro(ultimoId, localesArr);
        if (ultimoNum) {
          if (saleDesaCasa) {
            total += MATRIZ_KM[ultimoNum]?.["of"] || MATRIZ_KM["of"]?.[ultimoNum] || 0;
          } else {
            total += MATRIZ_KM[ultimoNum]?.[supKey] || MATRIZ_KM[supKey]?.[ultimoNum] || 0;
          }
        }
        return Math.round(total * 10) / 10;
      };

      // Incluir el local actual en la lista de locales para el cálculo
      // Asegurar que el local actual esté en la lista con su nombre correcto
      const localActualNombre = data.locales.find((l) => l.id === localId)?.nombre || 
        LOCALES_FIJOS.find((n) => { const l = data.locales.find((x) => x.id === localId); return l && l.nombre === n; }) || "";
      const localesParaCalc = data.locales.find((l) => l.id === localId)
        ? data.locales
        : [...data.locales, { id: localId, nombre: localActualNombre }];
      // Usar el nombre del local actual directamente para el cálculo
      const nombreParaCalc = selectedLocal?.nombre || localesParaCalc.find((l) => l.id === localId)?.nombre || "";
      const localesCompletos = localesParaCalc.some((l) => l.id === localId)
        ? localesParaCalc
        : [...localesParaCalc, { id: localId, nombre: nombreParaCalc }];
      const kmDiaTotal = calcKmDia(visitasHoyOrdenadas, localesCompletos, supervisor.trim());
      console.log("KM Debug2:", { kmDiaTotal, nombreParaCalc, ids: visitasHoyOrdenadas.map(v=>v.localId), nombres: localesCompletos.map(l=>l.nombre) });
      const supKeyNeto = supervisor.trim().includes("Ernesto") ? "Sup1" : "Sup2";
      const kmCasaOficina = MATRIZ_KM["of"]?.[supKeyNeto] || MATRIZ_KM[supKeyNeto]?.["of"] || 0;
      const kmNeto = Math.max(0, Math.round((kmDiaTotal - kmCasaOficina) * 10) / 10);
      const kmVisita = kmNeto;
      const kmBruto = kmDiaTotal;

      const esBorrador = arguments[0] === true;
      const visita = {
        id: uid(), fecha: todayISO(), horaLlegada, supervisor: supervisor.trim(), localId, kmRecorridos: kmNeto, kmBruto: kmBruto,
        borrador: esBorrador,

        depositoOrdenado: checks.depositoOrdenado || "",
        preciosVisibles: checks.preciosVisibles || "", carteleria: checks.carteleria || "",
        encargadoUniformado: checks.encargadoUniformado || "",
        proactividadComercial: checks.proactividadComercial || "",
        accionArqueoCaja: acciones.arqueoCaja || "",
        accionLocalLimpio: acciones.localLimpio || "",
        accionDepositoOrdenado: acciones.depositoOrdenado || "",
        accionPreciosVisibles: acciones.preciosVisibles || "",
        accionCarteleria: acciones.carteleria || "",
        accionEncargadoUniformado: acciones.encargadoUniformado || "",
        accionProactividadComercial: acciones.proactividadComercial || "",
        observacionComercial: observacionComercial.trim(),
        oportunidadMejora, aspectoPositivo, compromiso: compromiso.trim(), fechaLimiteTarea: acciones.fechaLimite||"" , observacionesGenerales: acciones.observacionesGenerales||"", estadoLocal: checks.estadoLocal||"", personal: checks.personal||"encargado", ayudante: checks.personal==="ayudante" ? (acciones.nombreAyudante||"Sin nombre") : "", bajaRotacionExhibidos: checks.bajaRotacionExhibidos||"", eval_atencion: checks.eval_atencion||"", eval_impulso: checks.eval_impulso||"", eval_actitud: checks.eval_actitud||"", evalAyudante: checks.personal==="ayudante" ? { atencion: checks.ayudante_atencion||"", orden: checks.ayudante_orden||"", apoyo: checks.ayudante_apoyo||"", comentario: acciones.comentarioAyudante||"" } : null, regularizacionDesvios: checks.regularizacionDesvios||"", capacitacion: checks.capacitacion||"", detalleCapacitacion: checks.capacitacion==="si" ? (acciones.detalleCapacitacion||"") : "",
        capacitacionDada, temaCapacitacion: capacitacionDada === "Si" ? temaCapacitacion.trim() : "",
        competencia: competencia.trim(),
        incidencias: incidencias.trim(),
        infraestructura: infraestructura.trim(),
        quejasClientes: incidencias.trim() ? "Si" : "No",
        descripcionQuejas: incidencias.trim(),
        problemaSeguridad: infraestructura.trim() ? "Si" : "No",
        descripcionProblema: infraestructura.trim(),
        quejasResueltas: false, infraResuelta: false, estadoResuelta: false, desvioResuelta: false,
      };
      const tareasActualizadas = data.tareas.map((t) => {
        if (checkedDone[t.id]) return { ...t, hecha: true };
        return t;
      });
      // Marcar quejas/infra resueltas en visita anterior
      const visitasActualizadas = data.visitas.map((v) => {
        const visitasDelLocal = data.visitas.filter((x) => x.localId === localId).sort((a,b) => a.fecha < b.fecha ? 1 : -1);
        const ultima = visitasDelLocal[0];
        // Marcar visita última
        if (ultima && v.id === ultima.id) {
          return { ...v, quejasResueltas: quejasResueltasCheck ? true : v.quejasResueltas, infraResuelta: infraResueltaCheck ? true : v.infraResuelta, estadoResuelta: estadoResueltaCheck ? true : v.estadoResuelta, desvioResuelta: desvioResueltaCheck ? true : v.desvioResuelta };
        }
        // Marcar visitas históricas tildadas
        if (infraChecks[v.id]) return { ...v, infraResuelta: true };
        if (quejasChecks[v.id]) return { ...v, quejasResueltas: true };
        return v;
      });
      const tareasNuevas = compromiso.trim() ? [{ id: uid(), localId, texto: compromiso.trim(), hecha: false, fecha: todayISO() }] : [];
      const codigosActualizados = (data.codigos || []).map((c) => {
        const r = resultadosCodigos[c.id];
        if (!r?.estado) return c;
        return { ...c, probado: true, resultado: r.estado === "Si" ? "Funciona" : "No funciona", detalleFalla: r.detalle || "", fechaProbado: todayISO(), supervisorPrueba: supervisor.trim() };
      });
      // Si es local adicional (no precargado desde ruta), crear entrada de ruta adicional
      let rutasActualizadas = data.rutas || [];
      if (esAdicional) {
        const rutaAdicional = { id: uid(), supervisor: supervisor.trim(), fecha: todayISO(), localIds: [localId], creadaEn: todayISO(), esAdicional: true };
        rutasActualizadas = [...rutasActualizadas, rutaAdicional];
      }
      if (esBorrador) {
        // Borrador: reemplazar borrador anterior si existe, no crear tareas ni actualizar codigos
        const sinBorradorAnterior = data.visitas.filter((v) => !(v.localId === localId && v.borrador));

        resetForm();
        setGuardado(true);
        localStorage.removeItem("rec-draft-" + localId);
        onDone(`Recorrido a "${selectedLocal.nombre}" guardado correctamente.`);
      }
    } finally { setSaving(false); }
  };

  // YesNo con acción correctiva

  return (
    <div className="form-page">

        <div className="panel" style={{ borderColor:"var(--done)", background:"#f0faf5", marginBottom:16 }}>

            <span style={{ fontSize:20 }}>✓</span>
            <div>
              <div style={{ fontWeight:600, color:"var(--done)" }}>Recorrido guardado correctamente</div>
              <div style={{ fontSize:13, color:"#4b6858", marginTop:2 }}>Podés cargar otro recorrido seleccionando un nuevo local.</div>

                        await onSave({ ...data, locales: newLocales });

                      setLocalId(local.id);
                      setSearchAdicional("");
                      setCambiando(false);
                      const ahora = new Date();
                      setHoraLlegada(ahora.toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" }));
                    }}>{nombre}</button>
                  ))}
                </div>
              )}
            </>
          ) : (
            <div style={{ textAlign:"center", padding:"20px 0" }}>
              <div style={{ fontSize:32, marginBottom:8 }}>📍</div>
              <div className="dim" style={{ fontSize:13 }}>Seleccioná un local desde "Mi ruta" para iniciar el recorrido.</div>

              <textarea className="input" rows={3} style={{ marginTop:6 }}

                defaultValue={acciones.observacionesGenerales||""}

                    <button className="btn primary big" style={{ width:"100%", padding:"14px", fontSize:15, marginTop:8 }} disabled={!supervisor.trim() || saving} onClick={submit}>

      )}

}



/* ---- Locales ---- */
function Locales({ data, onSave, showToast }) {
  const { locales, visitas, tareas } = data;
  const [selLocal, setSelLocal] = useState(null);

  const local = locales.find((l) => l.id === selLocal);
  const vsLocal = visitas.filter((v) => v.localId === selLocal).sort((a,b) => a.fecha < b.fecha ? 1 : -1);
  const tareasLocal = tareas.filter((t) => t.localId === selLocal);
  const tareasPend = tareasLocal.filter((t) => !t.hecha);
  const tareasHechas = tareasLocal.filter((t) => t.hecha);

  // Quejas e infra de todas las visitas
  const quejas = vsLocal.filter((v) => v.quejasClientes === "Si");
  const infras = vsLocal.filter((v) => v.problemaSeguridad === "Si");
  const obsComerciales = vsLocal.filter((v) => v.observacionComercial);

  const numLocalStr = selLocal ? String(parseInt(selLocal.replace("local-fixed-",""))||0) : "";
  const viejosDelLocal = (data.articulosViejos || []).filter((a) => {
    const origen = String(a.origen||"").replace(/^0+/,"");
    return origen && numLocalStr && origen === numLocalStr;
  });

  if (selLocal && local) {
    return (
      <div className="form-page">
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
          <button className="btn ghost" onClick={() => setSelLocal(null)}>← Volver</button>
          <h2 className="page-title" style={{ margin:0 }}>{local.nombre}</h2>
        </div>

        {tareasPend.length > 0 && (
          <div className="panel" style={{ borderLeft:"4px solid var(--alert)" }}>
            <div className="panel-title" style={{ color:"var(--alert)" }}>Tareas pendientes ({tareasPend.length})</div>
            {tareasPend.map((t) => (
              <div key={t.id} className="det-item">
                <span className="det-dot alert"/>
                <div className="det-info">
                  <div>{t.texto}</div>
                  <div className="mono dim small">desde {fmt(t.fecha)}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {tareasHechas.length > 0 && (
          <div className="panel">
            <div className="panel-title">Tareas resueltas ({tareasHechas.length})</div>
            {tareasHechas.map((t) => (
              <div key={t.id} className="det-item">
                <span className="det-dot done"/>
                <div className="det-info">
                  <div style={{ textDecoration:"line-through", color:"#9aa196" }}>{t.texto}</div>
                  <div className="mono dim small">desde {fmt(t.fecha)}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {quejas.length > 0 && (
          <div className="panel" style={{ borderLeft:"4px solid var(--pending)" }}>
            <div className="panel-title" style={{ color:"var(--pending)" }}>Quejas de clientes</div>

              <div key={v.id} className="det-item">
                <span className={"det-dot " + (v.quejasResueltas ? "done" : "alert")}/>
                <div className="det-info">
                  <div>{v.descripcionQuejas}</div>
                  <div className="mono dim small">{fmt(v.fecha)} · {v.quejasResueltas ? "Resuelta" : "Pendiente"}</div>

          </div>
        )}

        {infras.length > 0 && (
          <div className="panel" style={{ borderLeft:"4px solid var(--pending)" }}>
            <div className="panel-title" style={{ color:"var(--pending)" }}>Problemas de infraestructura</div>
            {infras.map((v) => (
              <div key={v.id} className="det-item">
                <span className={"det-dot " + (v.infraResuelta ? "done" : "alert")}/>
